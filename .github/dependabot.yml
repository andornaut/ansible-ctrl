version: 2
updates:
  # requirements-dev.txt holds the lint gate's tooling. Nothing here is
  # installed on a host: the playbooks reach Python through the roles.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # package.json holds markdownlint-cli2, the markdown gate's only tool.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
