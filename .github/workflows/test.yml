name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The markdown check calls markdownlint-cli2, and the commit hook calls
      # prettier. package.json pins both, and Dependabot bumps them through the
      # npm ecosystem.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # requirements.yml pins nothing and the install does not --upgrade, so a
      # cache hit freezes whatever versions it holds. The month in the key caps
      # that at a month, and there is no restore-keys fallback, which would carry
      # a stale tree forward indefinitely.
      - name: Compute collections cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >>"${GITHUB_OUTPUT}"

      # ansible.cfg's collections_path, relative to the checkout.
      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: .ansible/collections
          key: collections-${{ steps.month.outputs.month }}-${{ hashFiles('requirements.yml') }}

      # ansible-lint depends on ansible-core, which the config check's
      # ansible-config comes from.
      # From the pinned file rather than the name, so the version this gate
      # rejects against is the one a commit named, and the same one a local
      # `make lint` installs.
      - name: Install ansible-lint
        run: pip install -r requirements-dev.txt

      # Without them, ansible-lint's own syntax check reports every collection
      # module as unknown.
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # markdownlint-cli2 and prettier, which the markdown check and the commit
      # hook run out of node_modules/ rather than through npx: a bare npx fetches
      # whatever is current when nothing is installed, which is a version no
      # commit here names.
      - name: Install Node packages
        run: npm ci

      # Every check in one step. The script runs them all and names each result,
      # so a failure still says which check failed. markdownlint has no step of
      # its own here: check_markdown runs markdownlint-cli2 at the version
      # package-lock.json pins, so this gate and `make lint` cannot gate on
      # different versions, where the shared action would bundle a second copy.
      - name: Run every check
        run: tests/lint.sh

  # A job of its own rather than a step of lint's, so a red run names which gate failed, and
  # one matrix entry per playbook so it names which playbook. The runner stands in for the
  # host: tests/check/inventory.yml puts it in every Ubuntu group, carrying role defaults and
  # the few values no role defaults.
  check:
    name: Check (${{ matrix.name }})
    # Named rather than ubuntu-latest: the runner is the host under test, so its release is
    # the one the roles are checked against, and it moves only with a commit here.
    runs-on: ubuntu-24.04
    # Each entry applies its playbook for real, source builds and flatpaks included, before
    # the check-mode pass.
    timeout-minutes: 90
    strategy:
      # Every playbook reports, not just the first to fail.
      fail-fast: false
      matrix:
        include:
          - name: base
            playbook: base
          # One entry per desktop_environment: each selects different tasks in desktop and
          # a different window manager role.
          - name: desktop gnome
            playbook: desktop
          - name: desktop niri
            playbook: desktop
            # A tiling host needs exactly one display manager; the two entries cover both.
            args: --extra-vars desktop_environment=niri --extra-vars desktop_install_lemurs=true
            # The toolchains the tiling builds require, which a host has from the dev role.
            prepare: >-
              ansible-playbook --inventory tests/check/inventory.yml
              --extra-vars secrets_required=false dev.yml --tags go,rust
          - name: desktop bspwm
            playbook: desktop
            # A tiling host needs exactly one display manager; the two entries cover both.
            args: --extra-vars desktop_environment=bspwm --extra-vars desktop_install_ly=true
            # The toolchains the tiling builds require, which a host has from the dev role.
            prepare: >-
              ansible-playbook --inventory tests/check/inventory.yml
              --extra-vars secrets_required=false dev.yml --tags go,rust
          - name: dev
            playbook: dev
          - name: docker
            playbook: docker
          - name: games
            playbook: games
            # The ROM library the role asserts is mounted, at the path the stub host_vars
            # name. The role reads it and never creates it.
            prepare: >-
              mkdir -p /tmp/ansible-check/library/_BIOS/retroarch-system-folder
              /tmp/ansible-check/library/_Thumbnails
          - name: hobbies
            playbook: hobbies
          - name: homeautomation
            playbook: homeautomation
            # The Docker SDK the role requires: the runner ships Docker without it, and a
            # host's first run applies the docker role ahead of this playbook. Then the
            # configuration.yaml an operator writes after Home Assistant's first start,
            # carrying the frontend include the role asserts.
            prepare: >-
              sudo apt-get update && sudo apt-get install --yes --no-install-recommends python3-docker &&
              sudo mkdir -p /var/docker-volumes/homeautomation/homeassistant/config &&
              printf 'default_config:\nfrontend: !include frontend.yaml\n' |
              sudo tee /var/docker-volumes/homeautomation/homeassistant/config/configuration.yaml >/dev/null
          - name: msmtp
            playbook: msmtp
          - name: webservers
            playbook: webservers
            # The Docker SDK the role requires. The runner ships Docker without it, and a
            # host's first run applies the docker role ahead of this playbook.
            prepare: sudo apt-get update && sudo apt-get install --yes --no-install-recommends python3-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # See the lint job.
      - name: Compute collections cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >>"${GITHUB_OUTPUT}"

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: .ansible/collections
          key: collections-${{ steps.month.outputs.month }}-${{ hashFiles('requirements.yml') }}

      # The ansible-core pinned there, so this job runs the playbooks under the version the
      # lint gate checks them against.
      - name: Install Ansible
        run: pip install -r requirements-dev.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # The vars plugin stops every run in a checkout without faramir.env, which is
      # gitignored. This one declares only github_token, which the step below fills with the
      # job's own token: the matrix entries share one runner address, and the GitHub API
      # allows 60 unauthenticated requests an hour per address. tests/check.sh passes
      # secrets_required=false for the credentials a stub host does not have.
      - name: Declare the GitHub token as the only credential
        run: echo github_token >faramir.env

      # What a real host would already have from another playbook or a mount.
      - name: Prepare the runner
        if: matrix.prepare
        env:
          PREPARE: ${{ matrix.prepare }}
        run: bash -euo pipefail -c "${PREPARE}"

      # The playbook runs as the runner account over the local connection, and become uses
      # the runner's passwordless sudo. Applied, then run again under --check --diff.
      - name: Apply the playbook, then check it
        env:
          PLAYBOOK: ${{ matrix.playbook }}
          ARGS: ${{ matrix.args }}
          github_token: ${{ github.token }}
        # ARGS unquoted on purpose: it holds whole ansible-playbook arguments, split on
        # whitespace.
        run: tests/check.sh "${PLAYBOOK}" ${ARGS}
