[defaults]
collections_path = .ansible/collections
display_failed_stderr = yes
# No fact_caching: the cache is shared by every invocation, and the cert-renewal cron runs
# ansible as root, so it cached facts describing root (user_id, user_dir, env.HOME) and
# every later run reused them for the rest of the day. Facts are cheap to gather and are
# now always the ones belonging to the run that gathered them.
gathering = smart
interpreter_python = auto_silent
inventory = ./hosts
nocows = True
result_format = yaml
roles_path = .ansible/roles
# No vault_password_file: the secrets are sops-encrypted now, and the values reach a play
# through the environment. `make <playbook>` re-enters under `sops exec-env` to put them
# there, so an unattended run needs the age key rather than a vault passphrase.
#
# vars_plugins/secret_env.py turns each secret_* environment variable into a variable of
# the same name, which is what host_vars references. host_group_vars is listed because
# naming this setting replaces the default list rather than adding to it, and dropping it
# would stop group_vars/ and host_vars/ loading at all.
vars_plugins = ./vars_plugins
vars_plugins_enabled = host_group_vars, secret_env

[ssh_connection]
# Pipelining requires that sudoers does not set requiretty, which Ubuntu does not.
pipelining = True
# Compression (-C) is omitted from the default ssh_args: it costs CPU on a LAN.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
