[defaults]
# The callback option is named result_format, but its ini key is not: a key ansible does not
# recognize is ignored rather than reported, so the plain name reads as set and is not.
callback_result_format = yaml
collections_path = .ansible/collections
display_failed_stderr = yes
# No fact_caching: the cache is shared by every invocation, and the cert-renewal cron
# runs as root, so its facts (user_id, user_dir, env.HOME) served every later run for
# the rest of the day. Facts are cheap to gather.
gathering = smart
interpreter_python = auto_silent
inventory = ./hosts
nocows = True
roles_path = .ansible/roles
# No vault_password_file: the store is sops-encrypted and the values reach a play through
# the environment, so an unattended run needs the age key rather than a passphrase.
#
# secret_env turns each environment variable faramir.env names into a variable of the same
# name. It is listed last on purpose: a vars plugin outranks host_vars, so an injected
# credential replaces a host_vars entry of that name. host_group_vars is listed because
# naming this setting replaces the default list rather than adding to it.
vars_plugins = ./vars_plugins
vars_plugins_enabled = host_group_vars, secret_env

[ssh_connection]
# Pipelining requires that sudoers does not set requiretty, which Ubuntu does not.
pipelining = True
# No -C: compression costs CPU on a LAN.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
