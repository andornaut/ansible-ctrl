---
- name: Apply desktop role
  hosts: desktop
  roles:
    - desktop
    # WM selected by desktop_environment; --tags niri/bspwm runs just the WM.
    - role: bspwm
      when: desktop_environment == "bspwm"
      tags: bspwm
    - role: niri
      when: desktop_environment == "niri"
      tags: niri
