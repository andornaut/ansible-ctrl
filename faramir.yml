---
# Own playbook so a brokered run does not reach the controller through it: this rewrites the
# agent's own confinement and restarts the broker, and the controller is the one host where
# the agent has no root of its own. `--limit '!faramir_controller'`, which every brokered run
# carries, is what excludes it.
#
# The other faramir hosts are not excluded, and excluding them would buy nothing: the second
# play grants the ansible account passwordless sudo on every managed host, so a brokered
# command is already root there and reaches faramir's config with or without this playbook.
- name: Install the broker on every faramir host
  hosts: faramir
  tasks:
    # tasks_from, not roles:, which would apply the fleet half here too, where its
    # brokered ping runs before any host has authorized the key.
    - name: Install the broker
      ansible.builtin.import_role:
        name: faramir
        tasks_from: broker

# The fleet half of the same install: the play above generates a key on every faramir host,
# this one distributes the controller's, and a broker whose key no host authorizes reaches
# nothing. The other faramir hosts run no playbook, so their keys stay where they were
# minted. A brokered run cannot publish a key here: its --limit '!faramir_controller' leaves the
# controller out of the play above, so nothing is published and ssh.yml's assert stops this
# one rather than authorizing whatever key it found.
- name: Authorize the broker's key across the fleet
  # The routers included, unlike the Ubuntu-only plays: this one distributes a key rather
  # than installing anything, and both connect as root, which is what the agent gets there.
  # ssh.yml handles what pfSense does differently.
  hosts: all
  gather_facts: false
  tasks:
    # tasks_from, not roles:, which would apply both halves to every host. The
    # import also brings in the role defaults ssh.yml reads.
    - name: Authorize the broker's key
      ansible.builtin.import_role:
        name: faramir
        tasks_from: ssh
