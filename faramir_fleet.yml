---
# Authorize the faramir broker's key on the hosts brokered playbooks reach.
#
# Separate from faramir.yml because it writes to production hosts, and because it
# is useful only once the controller has a broker with a key to distribute.
# Reached from a brokered run it would grant the agent its own reach, so it is a
# playbook of its own rather than tasks folded into a play every run applies.
#
# hosts: all, where this was three plays: roles/faramir/tasks/ssh.yml holds them
# and says which block runs where.
- name: Authorize the broker's key across the fleet
  hosts: all
  gather_facts: false
  tasks:
    # tasks_from rather than the roles: keyword, which would apply main.yml to
    # every host. Importing the role is also what defines faramir_broker_ssh_key
    # here, from the same defaults faramir.yml installs the key under.
    - name: Authorize the broker's key
      ansible.builtin.import_role:
        name: faramir
        tasks_from: ssh
