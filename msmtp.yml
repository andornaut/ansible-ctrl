---
- name: Apply msmtp role
  # Every Ubuntu host. The routers have no apt, and pfSense sends its own mail.
  hosts: all:!routers
  # The msmtpd restart is a handler, and a handler is dropped when the play fails. A run that
  # writes /etc/msmtprc-relay and then fails before the flush would leave the daemon on the
  # superseded config for good: the next run finds the file unchanged, notifies nothing, and
  # nothing reports the drift.
  force_handlers: true
  # See homeautomation.yml.
  pre_tasks:
    - name: Require the credentials this play reads
      ansible.builtin.assert:
        that: secrets_injected | int > 0
        fail_msg: >-
          No credential was injected, so every one this play reads
          is undefined. Run it through `make`, which re-enters under sops, or
          through the broker with `faramir run --env-file faramir.env`, which
          both read the same list of names. For a run that reaches no credential,
          pass secrets_required=false.
        quiet: true
      when: secrets_required | default(true) | bool
      tags: always
  roles:
    - role: msmtp
      tags: msmtp
