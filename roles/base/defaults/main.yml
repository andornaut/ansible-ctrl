---
base_timezone: America/Toronto

# /etc/login.defs UMASK. USERGROUPS_ENAB drops the group bits to match the owner's, so
# this is the effective value either way.
base_lockdown_umask: "007"

# For homes created after this runs; the existing ones are converged to o-rwx.
base_lockdown_home_mode: "0750"

# Ubuntu's UID_MIN, and so the floor for a home this role closes.
base_lockdown_min_uid: 1000

# Read by both the socket unit and the fail2ban jail, so the two cannot disagree.
base_lockdown_ssh_port: 22

# Where a moved port's host key is recorded. System-wide, so it covers every uid on the
# controller. roles/faramir pins the same path; roles here read no other role's variables.
base_lockdown_known_hosts_path: /etc/ssh/ssh_known_hosts

# Add addresses in host_vars rather than widening this.
base_fail2ban_ignore_ips:
  - 127.0.0.1/8
  - ::1
base_fail2ban_bantime: 1h
base_fail2ban_findtime: 10m
base_fail2ban_maxretry: 5

# passwd entries that name no home. By path, not uid: a service account created without
# --system takes a uid from the login range. Add a path here to leave a home alone.
base_lockdown_exclude_homes:
  - /nonexistent
  - /dev/null
  - /
