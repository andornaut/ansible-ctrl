---
base_timezone: America/Toronto

# /etc/login.defs UMASK. USERGROUPS_ENAB drops the group bits to match the owner's, so
# this is the effective value either way. What closes an account off is its home's mode
# below, not this; see the task for why the value is 002.
base_lockdown_umask: "002"

# For homes created after this runs; the existing ones are converged toward it.
#
# 0710 rather than 0750: USERGROUPS_ENAB gives each account a private group, so until a home's
# group is deliberately shared the group bits reach nobody but the owner and this is 0700 in
# all but name. Once one is shared, a path through the home is what that group needs and a
# listing of it is not. One value, so useradd's HOME_MODE and adduser's DIR_MODE cannot
# disagree; adduser ships 0700, which this widens by the traversal bit alone.
base_lockdown_home_mode: "0710"

# Ubuntu's UID_MIN, and so the floor for a login account this role closes or sweeps.
base_account_min_uid: 1000

# Read by both the socket unit and the fail2ban jail, so the two cannot disagree.
base_lockdown_ssh_port: 22

# Where a moved port's host key is recorded. System-wide, so it covers every uid on the
# controller. Another role pins the same path; roles here read no other role's variables.
base_lockdown_known_hosts_path: /etc/ssh/ssh_known_hosts

# Add addresses in host_vars rather than widening this.
base_fail2ban_ignore_ips:
  - 127.0.0.1/8
  - ::1
base_fail2ban_bantime: 1h
base_fail2ban_findtime: 10m
base_fail2ban_maxretry: 5

# passwd entries that name no home. By path, not uid: a service account created without
# --system takes a uid from the login range. Add a path here to leave a home alone.
base_account_exclude_homes:
  - /nonexistent
  - /dev/null
  - /

# Records machine-check exceptions past the journal's vacuum. Off by default: the memory-error
# half needs an EDAC memory controller, which non-ECC hardware does not register, and the daemon
# logs a failure for each trace class the hardware lacks. Enable per host in host_vars.
base_install_rasdaemon: false

# A ceiling, not an allocation, but each watch costs about 1 KB of kernel memory and the limit is
# per user, so the worst case is this many KB per uid. Enough for an editor or a file-syncing
# daemon over a large tree. A headless host wants less and a host that exhausts it wants more;
# both say so in host_vars.
base_inotify_max_user_watches: 65536

# How long an untouched file survives in /tmp. Ubuntu ships 30d, which lets a desktop accumulate
# several GB before the daily systemd-tmpfiles run collects any of it. Not lower than this: a tmux
# server's socket and a forwarded ssh-agent socket live in /tmp and are not otherwise protected,
# so a shorter age collects them out from under an idle session.
base_tmp_max_age: 14d

# How long the ssh client waits to connect, in seconds. Bounds the ssh no ansible run invokes,
# ansible passing a timeout of its own: a host that is off otherwise costs the full TCP retry,
# about 135 seconds per connection. Covers the connect and banner exchange only, not
# authentication and not an sshd that accepts and then stalls.
base_ssh_client_connect_timeout: 10
