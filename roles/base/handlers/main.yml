---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Update font cache
  ansible.builtin.command: fc-cache
  changed_when: false
  become: true

# In this order, which handlers run in: the reload is what makes udevd read the rules and
# the hardware database afresh, so the database is rebuilt first, and the trigger comes
# after both, its keyboard builtin reading what udevd then holds.
- name: Rebuild the hardware database
  ansible.builtin.command: systemd-hwdb update
  changed_when: false
  become: true

- name: Reload the udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: false
  become: true

- name: Apply keyboard changes
  ansible.builtin.command: udevadm trigger --subsystem-match=input --action=change
  changed_when: false
  become: true

# CLEANUP (added 2026-09-05): goes with the hardware database removal in tasks/main.yml. A
# property a withdrawn entry set stays in udev's database through change events; a remove
# and an add rebuild each device's entry from the rules as they are.
- name: Re-add the input devices
  ansible.builtin.shell:
    cmd: >-
      udevadm trigger --subsystem-match=input --action=remove &&
      udevadm trigger --subsystem-match=input --action=add
  changed_when: false
  become: true

- name: Update dconf database
  ansible.builtin.command: dconf update
  changed_when: false
  become: true

# Reload, not restart: established connections survive, leaving a way back in. Gated on
# ssh.service running, because state=reloaded starts a unit that is not, and under socket
# activation it is inactive by design. Nothing is lost skipping it there: a socket-
# activated sshd re-reads the config per connection.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  become: true
  when: ansible_facts['services']['ssh.service'].state | default('stopped') == 'running'

# Skipped under --check: the install was simulated, so the missing unit reads as a failure.
- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  become: true
  when: not ansible_check_mode

- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  become: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false
  become: true
