---
# Drops repeat scanners before they fill the journal. Modest with key-only sshd: a bot
# with no password to try produces no failure to count. The routers are out of scope,
# base.yml being all:!routers, and pfSense ships sshguard.

- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      # How the systemd backend reads the journal. Only recommended by fail2ban, so an
      # install without recommends leaves every jail failing to start.
      - python3-systemd
    state: present
    update_cache: true
  become: true

# jail.local, not jail.conf, which the package replaces on upgrade.
- name: Configure the sshd jail
  ansible.builtin.template:
    dest: /etc/fail2ban/jail.local
    src: jail.local.j2
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart fail2ban

# The package starts it on install; this catches a host where it was turned off. Skipped
# under --check, where the install was simulated and the missing unit reads as a failure.
- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode
