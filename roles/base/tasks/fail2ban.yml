---
# Ban the hosts that keep knocking. Worth less than it looks now that sshd takes keys only:
# a bot with no password to try never reaches a failure fail2ban counts. What it still does
# is drop repeat scanners before they fill the journal, and catch the invalid-user and
# malformed-auth probes that key-only sshd still logs.
#
# The routers are not here: base.yml is all:!routers, and pfSense ships sshguard.

- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      # The systemd backend below reads the journal through this. fail2ban only recommends
      # it, so an install that skips recommends leaves every jail failing to start.
      - python3-systemd
    state: present
    update_cache: true
  become: true

# jail.local, not jail.conf, which the package replaces on upgrade. Only the sshd jail:
# nothing else here listens for a password.
- name: Configure the sshd jail
  ansible.builtin.template:
    dest: /etc/fail2ban/jail.local
    src: jail.local.j2
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart fail2ban

# The package enables and starts it on install; this is for a host where somebody turned
# it off. Skipped under --check, where the install above was only simulated and there is
# no unit to enable, which the module reports as a failure rather than a would-be change.
- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode
