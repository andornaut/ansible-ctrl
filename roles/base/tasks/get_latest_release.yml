---
# Fetch owner/repo's latest release into a fact, from GitHub or a Forgejo forge (Codeberg)
# serving the same JSON shape.
# Shared by every role: a caller includes it by path, ../../base/tasks/get_latest_release.yml,
# so the include inherits the caller's tags, become and when like any include_tasks.
#
# /releases/latest follows the project's "latest" pointer rather than sorting tags, so it
# never picks up a rolling build but does lag a stable release published without moving the
# pointer. release_stable lists /releases instead and takes the newest entry that is neither
# a draft nor a prerelease, for a project that ships stable releases without moving it.
#
# Required vars:
#   release_repo (str): "owner/repo"
#   release_fact (str): variable name to set with the release object
#
# Optional vars:
#   release_api_base (str): default "https://api.github.com/repos"; Codeberg is
#     "https://codeberg.org/api/v1/repos"
#   release_stable (bool): default false; true picks the newest non-draft, non-prerelease
#     entry of /releases (its first page, newest first) rather than following /releases/latest
- name: Get the latest release of {{ release_repo }}
  ansible.builtin.uri:
    url: >-
      {{ release_api_base | default('https://api.github.com/repos') }}/{{ release_repo
      }}/releases{{ '' if release_stable | default(false) | bool else '/latest' }}
    return_content: true
  register: base_release_response
  # uri supports no check mode, so a --check run would skip this and leave release_fact
  # undefined for every task that templates it. The request only reads.
  check_mode: false
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx (rate limit, missing repo) is deterministic.
  until: >-
    base_release_response.status == 200 or
    (base_release_response.status >= 400 and base_release_response.status < 500)

- name: Check for a stable release of {{ release_repo }}
  ansible.builtin.assert:
    that:
      - >-
        base_release_response.json
        | selectattr('draft', 'equalto', false)
        | selectattr('prerelease', 'equalto', false)
        | list | length > 0
    fail_msg: >-
      {{ release_repo }} lists no release that is neither a draft nor a prerelease among
      its newest {{ base_release_response.json | length }}, so there is nothing to install.
    quiet: true
  when: release_stable | default(false) | bool

- name: Set fact to the latest release for {{ release_fact }}
  ansible.builtin.set_fact:
    "{{ release_fact }}": >-
      {{ base_release_response.json
      | selectattr('draft', 'equalto', false)
      | selectattr('prerelease', 'equalto', false)
      | list | first
      if release_stable | default(false) | bool else base_release_response.json }}
