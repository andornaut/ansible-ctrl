---
# Install an andornaut/{name} tool into /usr/local/bin from its latest GitHub
# release, which must ship a {name}_{system}_{arch}.tar.gz holding the binary.
#
# Required vars:
#   base_tool_name (str): repository and binary name under github.com/andornaut/
- name: Get the latest version of {{ base_tool_name }}
  ansible.builtin.uri:
    url: "https://api.github.com/repos/andornaut/{{ base_tool_name }}/releases/latest"
    return_content: true
  register: base_tool_release
  # uri supports no check mode, so a --check run would skip this and leave the
  # register undefined for every task that templates it. The request only reads.
  check_mode: false
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx (rate limit, missing repo) is deterministic.
  until: >-
    base_tool_release.status == 200 or
    (base_tool_release.status >= 400 and base_tool_release.status < 500)

- name: Install {{ base_tool_name }}
  ansible.builtin.unarchive:
    src: "https://github.com/andornaut/{{ base_tool_name }}/releases/download/\
      {{ base_tool_release.json.tag_name }}/\
      {{ base_tool_name }}_{{ ansible_facts['system'] | lower }}_{{ base_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: ["{{ base_tool_name }}"]
    mode: "0755"
    # Named, not left to the archive: extraction preserves the uid and gid the
    # archive records, which is the release builder's account and lands on
    # whichever local account happens to hold that id.
    owner: root
    group: root
  become: true
