---
# Resolved here because the tasks that read them are delegated to the controller, where
# the connection variables are the delegate's and ansible_host is localhost.
- name: Note how ansible reached this host
  ansible.builtin.set_fact:
    base_lockdown_over_ssh: "{{ ansible_connection | default('ssh') != 'local' }}"
    base_lockdown_ssh_target: "{{ ansible_host | default(inventory_hostname) }}"
    base_lockdown_ssh_user: "{{ ansible_user | default(primary_user) }}"
    # ssh files a host key under the bare name on 22 and under [name]:port otherwise.
    base_lockdown_known_hosts_name: >-
      {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ (base_lockdown_ssh_port | int))
         if (base_lockdown_ssh_port | int) != 22
         else (ansible_host | default(inventory_hostname)) }}

# 007 rather than 027: dirs 0770, files 0660, so other loses traversal as well as read.
# Group bits are left alone because USERGROUPS_ENAB makes each account's group its own, and
# what is shared across accounts is shared by group (faramir's tree, the nas share).
# pam_umask reads this, so it governs login shells and SSH sessions; units take UMask=.
- name: Set the login umask
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*#?\s*UMASK\b'
    line: "UMASK\t\t{{ base_lockdown_umask }}"
    mode: "0644"
  become: true

- name: Set the mode of home directories created later
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    mode: "0644"
  loop:
    - path: /etc/login.defs
      regexp: '^\s*#?\s*HOME_MODE\b'
      line: "HOME_MODE\t{{ base_lockdown_home_mode }}"
    - path: /etc/adduser.conf
      regexp: '^\s*#?\s*DIR_MODE\s*='
      line: "DIR_MODE={{ base_lockdown_home_mode }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

# o-rwx rather than a fixed mode: the controller's home is 0710 andornaut:dev, faramir
# having granted the client group traversal, and 0750 would hand that group a listing.
- name: Close the existing home directories to other
  become: true
  block:
    - name: Read the passwd database
      ansible.builtin.getent:
        database: passwd

    # A when: rather than a selectattr filter, which would compare passwd's uids as the
    # strings they are and order 999 above 1000. Stat first: the file module fails on a
    # home that passwd names and the host does not have.
    - name: Check which login accounts have a home
      ansible.builtin.stat:
        path: "{{ item.value[4] }}"
      register: base_lockdown_home_stat
      loop: "{{ ansible_facts['getent_passwd'] | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        # The uid range is not enough on its own: an installer that omits --system takes
        # one from the login range, so the placeholder home excludes those.
        - item.value[1] | int >= base_lockdown_min_uid
        - item.value[1] | int != 65534
        - item.value[4] not in base_lockdown_exclude_homes

    - name: Close each one to other
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        mode: o-rwx
        follow: false
      loop: "{{ base_lockdown_home_stat.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
      loop_control:
        label: "{{ item.stat.path }}"
      # A home is owned by its account. A passwd entry pointing at a directory owned by
      # somebody else names a shared area: the printer account's home is a NAS share.
      when: item.stat.pw_name == item.item.key

# Every managed host grants the account ansible connects as NOPASSWD sudo, so a password
# is a second way to root that no key rotation reaches. No opt-out flag: the proof below
# decides.
- name: Refuse password authentication over SSH
  become: true
  block:
    # --tags lockdown skips the task that installs the ssh package.
    - name: Check for sshd
      ansible.builtin.stat:
        path: /usr/sbin/sshd
      register: base_lockdown_sshd_binary

    - name: Take the password away
      when: base_lockdown_sshd_binary.stat.exists
      block:
        # sshd is socket-activated, so the port is ssh.socket's ListenStream and the daemon
        # never reads Port. Setting it here still works: sshd-socket-generator parses Port
        # at daemon-reload and writes the socket drop-in. A replacement unit shadows the
        # vendor one that drop-in applies to.
        - name: Drop a replacement ssh.socket unit
          ansible.builtin.file:
            path: /etc/systemd/system/ssh.socket
            state: absent
          register: base_lockdown_socket_override

        # sshd accumulates Port directives rather than taking the first, so one left
        # anywhere Include reaches adds a listener beside this role's.
        - name: Drop any port set outside the drop-in
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^\s*Port\s+[0-9]+\s*$'
            state: absent
            validate: /usr/sbin/sshd -t -f %s
          register: base_lockdown_sshd_port_main

        - name: Find another drop-in setting a port
          ansible.builtin.find:
            paths: /etc/ssh/sshd_config.d
            patterns: "*.conf"
            excludes: 00-ansible-role-base-port.conf
            contains: '^\s*Port\s+[0-9]+\s*$'
          register: base_lockdown_sshd_other_dropins

        - name: Drop the port it sets
          ansible.builtin.lineinfile:
            path: "{{ item.path }}"
            regexp: '^\s*Port\s+[0-9]+\s*$'
            state: absent
            validate: /usr/sbin/sshd -t -f %s
          loop: "{{ base_lockdown_sshd_other_dropins.files }}"
          loop_control:
            label: "{{ item.path }}"
          register: base_lockdown_sshd_port_dropins

        - name: Set the SSH port
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/00-ansible-role-base-port.conf
            content: "Port {{ base_lockdown_ssh_port }}\n"
            owner: root
            group: root
            mode: "0644"
            validate: /usr/sbin/sshd -t -f %s
          register: base_lockdown_sshd_port_file

        # Inline rather than a handler, which fires after the proof below would run.
        - name: Rebind the SSH listener
          when:
            - base_lockdown_socket_override.changed or base_lockdown_sshd_port_file.changed
              or base_lockdown_sshd_port_main.changed or base_lockdown_sshd_port_dropins.changed
            # Nothing is bound to the new port under --check, so the proof would refuse a
            # change that was never made.
            - not ansible_check_mode
          block:
            # Before the port moves, so the proof has an entry to match: known_hosts files
            # a key by host and port. Read over this run's verified connection rather than
            # scanned, so the key is carried across authenticated.
            - name: Find this host's public SSH host keys
              ansible.builtin.find:
                paths: /etc/ssh
                patterns: ssh_host_*_key.pub
              register: base_lockdown_host_key_files
              when: base_lockdown_over_ssh

            - name: Read them
              ansible.builtin.slurp:
                src: "{{ item.path }}"
              loop: "{{ base_lockdown_host_key_files.files | default([]) }}"
              loop_control:
                label: "{{ item.path }}"
              register: base_lockdown_host_keys
              when: base_lockdown_over_ssh

            # One call per key type, the module replacing the line of a matching type, so
            # the host stays pinned for whichever algorithm ssh negotiates. The old port's
            # entry is left: it matches nothing once the port has moved.
            - name: Pin them on the controller under the new port
              ansible.builtin.known_hosts:
                path: "{{ base_lockdown_known_hosts_path }}"
                name: "{{ base_lockdown_known_hosts_name }}"
                key: >-
                  {{ base_lockdown_known_hosts_name }}
                  {{ base_lockdown_host_key_fields[0] }}
                  {{ base_lockdown_host_key_fields[1] }}
                state: present
              vars:
                base_lockdown_host_key_fields: "{{ (item.content | b64decode).split() }}"
              loop: "{{ base_lockdown_host_keys.results | default([]) }}"
              loop_control:
                label: "{{ item.item.path }}"
              delegate_to: localhost
              become: true
              when: base_lockdown_over_ssh

            - name: Reload systemd so the generator re-reads the port
              ansible.builtin.systemd_service:
                daemon_reload: true

            # Drops the listener, not the established sessions: each is its own
            # ssh@N.service, which is the way back in if the new port is wrong.
            - name: Restart the SSH socket
              ansible.builtin.systemd_service:
                name: ssh.socket
                state: restarted

            - name: Prove the new port answers
              ansible.builtin.command:
                argv: >-
                  {{
                    ['ssh', '-o', 'BatchMode=yes',
                     '-o', 'PreferredAuthentications=publickey',
                     '-o', 'ConnectTimeout=10',
                     '-p', base_lockdown_ssh_port | string]
                    + (['-i', ansible_ssh_private_key_file]
                       if ansible_ssh_private_key_file is defined else [])
                    + (ansible_ssh_common_args | default('') | trim | split)
                    + ['-l', base_lockdown_ssh_user, base_lockdown_ssh_target, 'true']
                  }}
              delegate_to: localhost
              become: false
              register: base_lockdown_port_proof
              changed_when: false
              failed_when: false
              when: base_lockdown_over_ssh

            # A refused connection means nothing bound. A host key complaint means sshd
            # answered and only the controller's record is stale. Same exit code, so the
            # two are told apart here and asserted separately below.
            - name: Note whether the host answered but went unrecognised
              ansible.builtin.set_fact:
                base_lockdown_port_untrusted: >-
                  {{ 'Host key verification failed'
                     in (base_lockdown_port_proof.stderr | default('')) }}
              when: base_lockdown_over_ssh

            - name: Require the new port to be listening
              ansible.builtin.assert:
                that: base_lockdown_port_proof.rc | default(1) == 0 or base_lockdown_port_untrusted | bool
                fail_msg: >-
                  Nothing answers on {{ inventory_hostname }} port
                  {{ base_lockdown_ssh_port }}. The session running this play is still
                  open: remove /etc/ssh/sshd_config.d/00-ansible-role-base-port.conf there,
                  then systemctl daemon-reload && systemctl restart ssh.socket.
                  {{ base_lockdown_port_proof.stderr | default('') | trim }}
                quiet: true
              when: base_lockdown_over_ssh

            - name: Require the controller to recognise it there
              ansible.builtin.assert:
                that: not base_lockdown_port_untrusted | bool
                fail_msg: >-
                  {{ inventory_hostname }} answers on port {{ base_lockdown_ssh_port }},
                  so the move worked; what is missing is an entry under
                  {{ base_lockdown_known_hosts_name }}. The key itself is unchanged, so
                  carry the old entry across rather than accept a new one. It is filed
                  under {{ base_lockdown_ssh_target }} if the previous port was 22 and
                  under [{{ base_lockdown_ssh_target }}]:PORT otherwise, in
                  {{ base_lockdown_known_hosts_path }}, which ssh-keygen reads only when
                  -f names it:
                  ssh-keygen -f {{ base_lockdown_known_hosts_path }} -F OLDNAME to print
                  it, add that key under {{ base_lockdown_known_hosts_name }}, then the
                  same command with -R to drop it.
                quiet: true
              when: base_lockdown_over_ssh

        # From the controller, as the account and address ansible uses, that being the
        # access which has to survive. Proven before the change, not reverted after:
        # withdrawing a password cannot break a key that already works.
        #
        # Each connection setting is passed only when the inventory sets it, as ansible
        # does; a -p defaulted to 22 would dial the wrong port on a host whose port comes
        # from ssh_config. ansible_ssh_common_args splits on whitespace, so a ProxyCommand
        # containing spaces would need quoting.
        - name: Prove key-only authentication already works
          ansible.builtin.command:
            argv: >-
              {{
                ['ssh', '-o', 'BatchMode=yes',
                 '-o', 'PreferredAuthentications=publickey',
                 '-o', 'ConnectTimeout=10']
                + (['-p', ansible_port | string] if ansible_port is defined else [])
                + (['-i', ansible_ssh_private_key_file]
                   if ansible_ssh_private_key_file is defined else [])
                + (ansible_ssh_common_args | default('') | trim | split)
                + ['-l', base_lockdown_ssh_user, base_lockdown_ssh_target, 'true']
              }}
          delegate_to: localhost
          become: false
          register: base_lockdown_key_auth
          changed_when: false
          failed_when: false
          # Only opens a connection, so it runs under --check too, where the command
          # module would otherwise skip and leave the assert nothing to read.
          check_mode: false
          when: base_lockdown_over_ssh

        # default(1): a proof that did not run refuses the change rather than passing it.
        - name: Require it before taking the password away
          ansible.builtin.assert:
            that: base_lockdown_key_auth.rc | default(1) == 0
            fail_msg: >-
              Key-only SSH to {{ inventory_hostname }} as {{ base_lockdown_ssh_user }}
              failed, so this would leave no way in. Run
              ssh-copy-id {{ base_lockdown_ssh_user }}@{{ base_lockdown_ssh_target }}
              first. Refused rather than skipped, a skip leaving a host that looks
              hardened and is not.
              {{ base_lockdown_key_auth.stderr | default('') | trim }}
            quiet: true
          when: base_lockdown_over_ssh

        # sshd_config Includes this directory near the top and takes the first setting of
        # a keyword, so 00- wins over the shipped file. Absolute validate path, /usr/sbin
        # not being on every PATH.
        - name: Install the sshd drop-in
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/00-ansible-role-base.conf
            content: |
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PubkeyAuthentication yes
              PermitRootLogin no
            owner: root
            group: root
            mode: "0644"
            validate: /usr/sbin/sshd -t -f %s
          notify: Reload sshd

        # The handler needs this every run, not only when it fires: state=reloaded starts
        # a unit that is not running, and ssh.service is inactive under socket activation.
        - name: Read the service states
          ansible.builtin.service_facts:
