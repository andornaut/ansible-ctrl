---
- name: Configure apt network timeouts and retries
  # Bound apt fetches so a stalled mirror cannot hang and hold the lists lock.
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99network-timeouts
    content: |
      Acquire::http::Timeout "60";
      Acquire::https::Timeout "60";
      Acquire::Retries "1";
    mode: "0644"
  become: true

# Pin snapd and cloud-init out before any apt install below can pull them back in as a
# Recommends.
- name: Import snap tasks
  ansible.builtin.import_tasks: snap.yml
  tags: snap

- name: Import cloud-init tasks
  ansible.builtin.import_tasks: cloud-init.yml
  tags: cloud-init

- name: Install system packages
  ansible.builtin.apt:
    name:
      - acpi
      # Installs `setfacl` for:
      # https://github.com/georchestra/ansible/issues/55#issuecomment-588313638
      - acl
      - atool
      - atop
      - autoconf
      - autoconf-archive
      - autotools-dev
      - bash
      - build-essential
      - ca-certificates
      - cifs-utils
      - cmake
      - coreutils
      - curl
      # `dconf update` compiles /etc/dconf/db/local.d into the system database.
      - dconf-cli
      - dnsutils
      - elinks
      - exfat-fuse
      - exuberant-ctags
      - fakeroot
      - fonts-font-awesome
      - fonts-inconsolata
      - fonts-roboto
      - gcc
      - git
      - highlight
      - htop
      - i2c-tools
      - iftop
      - iotop
      - iperf
      - irssi
      - libfontconfig
      - libfreetype6
      - libfreetype6-dev
      - linux-firmware
      - lm-sensors
      - make
      - mercurial
      - nethogs
      - net-tools
      - nmap
      - openconnect
      - openvpn
      - perl
      - powertop
      - rsync
      - screen
      - smartmontools
      - smbclient
      - software-properties-common
      - sox
      - ssh
      - sshfs
      - sysstat
      - tmux
      - tree
      - unrar
      - unzip
      - update-manager-core
      - vim
      - wget
      - whois
      - zip
    state: present
    update_cache: true
  become: true

- name: Install system packages (Ubuntu 24.x only)
  ansible.builtin.apt:
    name:
      - ntpdate
    state: present
  become: true
  when: ansible_facts["distribution_version"] is version('25', '<')

- name: Install exfat packages
  ansible.builtin.apt:
    name:
      - exfatprogs
    install_recommends: false
    state: present
  become: true

- name: Install fuse2 library
  ansible.builtin.apt:
    # Renamed to libfuse2t64 by the 64-bit time_t transition on Ubuntu 24.04+.
    name: "{{ 'libfuse2t64' if ansible_facts['distribution_version'] is version('24.04', '>=') else 'libfuse2' }}"
    state: present
  become: true

- name: Enable universe and multiverse repositories
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
  loop:
    - universe
    - multiverse
  # Pre-24.04 only: the deb822 format enables these by default and rejects the shorthand.
  when: ansible_facts["distribution_version"] is version('24.04', '<')
  become: true

# https://askubuntu.com/a/1254303
- name: Disable ssh motd news/advertisement
  ansible.builtin.lineinfile:
    create: true
    line: "ENABLED=0"
    path: /etc/default/motd-news
    regexp: '^ENABLED\s*='
    mode: "0644"
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  become: true

- name: Re-map capslock key to escape key
  ansible.builtin.lineinfile:
    line: 'XKBOPTIONS="caps:escape"'
    path: /etc/default/keyboard
    regexp: '^XKBOPTIONS\s*='
    mode: "0644"
  become: true
  notify: Apply keyboard changes

# GNOME reads XKB from dconf, not /etc/default/keyboard, so repeat the remap as a
# system-wide dconf default. The profile is what puts db/local.d in the lookup path.
- name: Re-map capslock key to escape key in GNOME sessions
  become: true
  notify: Update dconf database
  block:
    - name: Create the dconf profile and database directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/dconf/profile
        - /etc/dconf/db/local.d

    - name: Add the local database to the default dconf profile
      ansible.builtin.copy:
        dest: /etc/dconf/profile/user
        content: |
          user-db:user
          system-db:local
        mode: "0644"

    - name: Set the GNOME xkb options
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/00-keyboard
        content: |
          [org/gnome/desktop/input-sources]
          xkb-options=['caps:escape']
        mode: "0644"

- name: Install cache-command
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/andornaut/cache-command/main/cache-command
    dest: /usr/local/bin/
    mode: "0755"
  become: true

- name: Make Vim the default editor
  community.general.alternatives:
    name: editor
    path: /etc/alternatives/vim
  become: true

- name: Install filectrl
  ansible.builtin.import_tasks: install_from_github.yml
  vars:
    base_tool_name: filectrl
  tags: filectrl

- name: Install gog
  ansible.builtin.import_tasks: install_from_github.yml
  vars:
    base_tool_name: gog

- name: Install mrs
  ansible.builtin.import_tasks: install_from_github.yml
  vars:
    base_tool_name: mrs

- name: Import lockdown tasks
  ansible.builtin.import_tasks: lockdown.yml
  tags: lockdown

- name: Import fail2ban tasks
  ansible.builtin.import_tasks: fail2ban.yml
  tags: fail2ban

- name: Import disk-cleanup tasks
  ansible.builtin.import_tasks: disk-cleanup.yml
  tags: disk-cleanup

- name: Import rasdaemon tasks
  ansible.builtin.import_tasks: rasdaemon.yml
  tags: rasdaemon

- name: Import unwanted-package tasks
  ansible.builtin.import_tasks: unwanted.yml
  tags: unwanted

- name: Import storage-space-alert tasks
  ansible.builtin.import_tasks: storage-space-alert.yml
  tags: storage-space-alert

- name: Import sysctl tasks
  ansible.builtin.import_tasks: sysctl.yml
  tags: sysctl

- name: Import systemd tasks
  ansible.builtin.import_tasks: systemd.yml
  tags: systemd

- name: Import Ubuntu Pro tasks
  ansible.builtin.import_tasks: ubuntu-pro.yml
  tags: ubuntu-pro

- name: Import telemetry tasks
  ansible.builtin.import_tasks: telemetry.yml
  tags: telemetry
