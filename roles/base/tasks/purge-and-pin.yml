---
# Purge apt packages and negatively pin them so apt cannot reinstall them.
# See README for what the pin buys over a dpkg hold. Include under `become: true`.
#
# Required vars:
#   purge_pin_name (str): /etc/apt/preferences.d/no-<name>, and the label
#   purge_pin_packages (list): packages to purge and pin
- name: "Purge apt packages: {{ purge_pin_name }}"
  ansible.builtin.apt:
    name: "{{ purge_pin_packages }}"
    purge: true
    state: absent

# apt_preferences(5) takes several names on one Package: line, so one record.
- name: "Pin apt packages: {{ purge_pin_name }}"
  ansible.builtin.copy:
    content: |
      Package: {{ purge_pin_packages | join(' ') }}
      Pin: release a=*
      Pin-Priority: -1
    dest: "/etc/apt/preferences.d/no-{{ purge_pin_name }}"
    mode: "0644"
