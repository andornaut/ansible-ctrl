---
# Persists machine-check exceptions to /var/lib/rasdaemon, where `ras-mc-ctl --errors` reads them
# back, outliving the journal's vacuum. Off unless a host asks for it: the memory-error half needs
# an EDAC memory controller, which non-ECC hardware does not register, and the daemon logs a
# failure for every trace class the hardware lacks. The CPU's machine-check records work regardless.
- name: Install and enable rasdaemon
  when: base_install_rasdaemon | bool
  block:
    - name: Install rasdaemon
      ansible.builtin.apt:
        name: rasdaemon
        state: present
        update_cache: true
      become: true

    # Skipped under --check, where the install was simulated and the missing unit reads as a failure.
    - name: Enable rasdaemon
      ansible.builtin.systemd_service:
        name: rasdaemon
        enabled: true
        state: started
      become: true
      when: not ansible_check_mode
