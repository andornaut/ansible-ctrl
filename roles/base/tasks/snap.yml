---
- name: Remove snap
  become: true
  block:
    # Also removes ubuntu-server-minimal, which hard-depends on snapd. See README.
    - name: Purge and pin snap packages
      ansible.builtin.include_tasks: purge-and-pin.yml
      vars:
        purge_pin_name: snap
        purge_pin_packages:
          - gnome-software-plugin-snap
          - snapd

    - name: Resolve the account home directories
      ansible.builtin.include_tasks: account_homes.yml

    - name: Find user snap directories
      ansible.builtin.find:
        paths: "{{ base_account_homes }}"
        patterns: snap
        file_type: directory
      register: base_snap_directories_result

    - name: Remove the discovered snap directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ (base_snap_directories_result.files | map(attribute='path') | list) + ['/var/cache/snapd'] }}"

    # Purging snapd leaves dangling .wants symlinks in ~/.config/systemd/user,
    # which systemd reports as not-found at login.
    - name: Check which accounts have a user unit directory
      ansible.builtin.stat:
        path: "{{ item }}/.config/systemd/user"
        # A dotfiles symlink here is still a unit directory. Without follow, stat
        # reports isdir false and the dangling symlinks below are left in place.
        follow: true
      register: base_snap_unit_dir_stat
      loop: "{{ base_account_homes }}"

    # snap.* misses snapd's own session-agent units: it needs a literal dot.
    - name: Find leftover snap enable symlinks
      ansible.builtin.find:
        paths: >-
          {{ base_snap_unit_dir_stat.results | selectattr('stat.isdir', 'defined')
             | selectattr('stat.isdir') | map(attribute='stat.path') | list }}
        patterns:
          - snap.*
          - snapd.*
        depth: 2
        file_type: link
        recurse: true
      register: base_snap_links_result

    - name: Remove the discovered snap enable symlinks
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ base_snap_links_result.files }}"
      loop_control:
        label: "{{ item.path }}"
