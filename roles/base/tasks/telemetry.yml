---
- name: Disable telemetry and crash reporting
  become: true
  block:
    # ubuntu-server* depend on apport, so the pin makes dist-upgrade drop them;
    # desktop metapackages only recommend the reporters.
    - name: Purge and pin telemetry packages
      ansible.builtin.include_tasks: purge-and-pin.yml
      vars:
        purge_pin_name: telemetry
        purge_pin_packages:
          - apport
          - kerneloops
          - popularity-contest
          - ubuntu-insights
          - ubuntu-report
          - whoopsie

    - name: Resolve the account home directories
      ansible.builtin.include_tasks: account_homes.yml

    # Purge leaves per-user state behind; depth 3 reaches both <home>/.cache/ubuntu-insights
    # and <home>/.local/share/ubuntu-insights.
    - name: Find leftover ubuntu-insights user state
      ansible.builtin.find:
        depth: 3
        file_type: directory
        paths: "{{ base_account_homes }}"
        patterns: ubuntu-insights
        recurse: true
      register: base_telemetry_insights_state

    - name: Remove leftover ubuntu-insights user state
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ base_telemetry_insights_state.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Static unit, so mask rather than disable; it fails once whoopsie is purged.
    # /etc/systemd/user covers every user, and per-user managers reload on their own.
    - name: Mask update-notifier-crash units for all users
      ansible.builtin.file:
        dest: "/etc/systemd/user/{{ item }}"
        force: true
        src: /dev/null
        state: link
      loop:
        - update-notifier-crash.path
        - update-notifier-crash.service
