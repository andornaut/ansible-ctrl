---
# Role-internal, and in vars/ so a host can neither desync base_arch from its fact nor
# override the set of packages tasks/unwanted.yml purges and pins.

# GoReleaser's names for the gog/mrs assets: x86_64 kept, aarch64 to arm64.
base_arch: >-
  {{ {'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# Purged and negatively pinned by tasks/unwanted.yml. Ubuntu installs these by default and no
# host here has the hardware or the role for them: no modems, no crash dumps anyone reads, no
# VMware guest, no directory service.
#
# Nothing a desktop metapackage depends on belongs here, a Depends and a Recommends answering
# differently. language-selector-gnome is a hard Depends of ubuntu-desktop-minimal, so pinning
# it takes gdm3, gnome-shell and ubuntu-session with it. power-profiles-daemon and
# switcheroo-control are only recommended, by gnome-shell and gnome-control-center, and a
# negative pin drops the recommendation rather than the recommender, which is why they stay
# here. speech-dispatcher is recommended too and is left out for a reason of its own:
# roles/desktop installs it for Firefox text-to-speech. Check
# `apt-get -s install ubuntu-desktop-minimal` before adding to this list.
base_unwanted_packages:
  - kdump-tools
  - modemmanager
  - open-vm-tools
  - pollinate
  - power-profiles-daemon
  - sssd
  - sssd-common
  - switcheroo-control

# The btrfs lines of /etc/fstab, from the findmnt read in tasks/btrfs.yml, less
# base_btrfs_excluded_mountpoints. findmnt unescapes the fields; a trailing slash is dropped
# so /media/nas/ and /media/nas name one mountpoint.
base_btrfs_fstab_entries: >-
  {%- set excluded = base_btrfs_excluded_mountpoints | map('regex_replace', '(.)/+$', '\\1') | list -%}
  {%- set entries = [] -%}
  {%- for line in (((base_btrfs_fstab.stdout | default('', true)) or '{"filesystems": []}')
                   | from_json).filesystems -%}
  {%- set target = line.target | regex_replace('(.)/+$', '\\1') -%}
  {%- if target not in excluded -%}
  {%- set _ = entries.append({'target': target, 'fs': line.uuid or line.source}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ entries }}

# Every btrfs mountpoint, each a subvolume snapper snapshots on its own: a snapshot stops at
# a subvolume boundary, so / does not cover a sibling @home mounted at /home.
base_btrfs_mountpoints: "{{ base_btrfs_fstab_entries | map(attribute='target') | unique | list }}"

# One mountpoint per filesystem, for the scrub and balance, which act on the whole
# filesystem through any of its mountpoints. Keyed by filesystem UUID where the device is
# present, so a filesystem spelled UUID= on one line and /dev/mapper/... on another counts once.
base_btrfs_filesystems: >-
  {%- set seen = [] -%}
  {%- set mountpoints = [] -%}
  {%- for entry in base_btrfs_fstab_entries -%}
  {%- set fs = entry.fs | regex_replace('^UUID=', '') -%}
  {%- if fs not in seen -%}
  {%- set _ = seen.append(fs) -%}
  {%- set _ = mountpoints.append(entry.target) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ mountpoints }}

# Snapper config name per btrfs mountpoint: root for /, otherwise the path with its slashes
# as dashes (/media/nas is media-nas).
base_btrfs_snapper_configs: >-
  {{ dict(base_btrfs_mountpoints | zip(base_btrfs_mountpoints | map('regex_replace', '^/$', 'root')
  | map('regex_replace', '^/+', '') | map('replace', '/', '-'))) }}
