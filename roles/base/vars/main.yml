---
# Role-internal, and in vars/ so a host can neither desync base_arch from its fact nor
# override the set of packages tasks/unwanted.yml purges and pins.

# GoReleaser's names for the gog/mrs assets: x86_64 kept, aarch64 to arm64.
base_arch: >-
  {{ {'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# Purged and negatively pinned by tasks/unwanted.yml. Ubuntu installs these by default and no
# host here has the hardware or the role for them: no modems, no crash dumps anyone reads, no
# VMware guest, no directory service.
#
# Nothing a desktop metapackage depends on belongs here, a Depends and a Recommends answering
# differently. language-selector-gnome is a hard Depends of ubuntu-desktop-minimal, so pinning
# it takes gdm3, gnome-shell and ubuntu-session with it. power-profiles-daemon and
# switcheroo-control are only recommended, by gnome-shell and gnome-control-center, and a
# negative pin drops the recommendation rather than the recommender, which is why they stay
# here. speech-dispatcher is recommended too and is left out for a reason of its own:
# roles/desktop installs it for Firefox text-to-speech. Check
# `apt-get -s install ubuntu-desktop-minimal` before adding to this list.
base_unwanted_packages:
  - kdump-tools
  - modemmanager
  - open-vm-tools
  - pollinate
  - power-profiles-daemon
  - sssd
  - sssd-common
  - switcheroo-control
