---
# X11 session tools and build dependencies for bspwm_projects (built by bspwm.yml).
# X11 tools both sessions share live in the desktop role.
- name: Install X11 system packages and build dependencies
  ansible.builtin.apt:
    name:
      # Xsession.d hook that imports XDG_SESSION_TYPE into systemd --user.
      # Without it eww hides the bspwm workspace switcher until the next login.
      - dbus-x11
      - dex
      - scrot
      - xbacklight
      - xorg
      - xsecurelock
      - xss-lock
      # Build dependencies for bspwm_projects.
      - libasound2-dev
      - libcairo2-dev
      - libx11-xcb-dev
      - libxcb1-dev
      - libxcb-ewmh-dev
      - libxcb-icccm4-dev
      - libxcb-keysyms1-dev
      - libxcb-xkb-dev
      - libxcb-randr0-dev
      - libxcb-render-util0-dev
      - libxcb-shape0-dev
      - libxcb-util0-dev
      - libxcb-xinerama0-dev
      - libxcb-xtest0-dev
      - libxft-dev
      - libxinerama-dev
      - libxpm-dev
    state: latest
    install_recommends: false
    update_cache: true
  become: true
