---
- name: Build and install BSPWM projects
  become: true
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: bspwm_tmp

    - name: Clone BSPWM git repositories
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ bspwm_tmp.path }}/{{ item.name }}"
        depth: 1
        version: "{{ item.version | default('HEAD') }}"
      loop: "{{ bspwm_projects }}"

    # `cp -p` carries the checkout's own mode across, so the man pages, completions and
    # example files land under /usr/local at whatever mode the clone above wrote. The
    # compiled binaries are not covered by this, being created by the build below.
    - name: Set the mode of the BSPWM sources
      ansible.builtin.file:
        path: "{{ bspwm_tmp.path }}/{{ item.name }}"
        state: directory
        recurse: true
        mode: u=rwX,go=rX
      loop: "{{ bspwm_projects }}"

    # Every install line in these Makefiles is `cp -p`, so the mode reaching /usr/local
    # is the one the link step gave the binary, which is the run's umask. Named here
    # rather than left to it: a umask that closes `other` installs a window manager only
    # root can run. 022 rather than the login default of 002, a root-owned binary under
    # /usr/local having no reason to be group-writable. The build needs it as much as the
    # install, the artifact mode being what `cp -p` carries across.
    - name: Build BSPWM projects
      ansible.builtin.shell:
        cmd: umask 022 && make
        chdir: "{{ bspwm_tmp.path }}/{{ item.name }}"
      loop: "{{ bspwm_projects }}"
      changed_when: true

    - name: Install BSPWM projects
      ansible.builtin.shell:
        cmd: umask 022 && make install
        chdir: "{{ bspwm_tmp.path }}/{{ item.name }}"
      loop: "{{ bspwm_projects }}"
      changed_when: true
      register: bspwm_make_install
      failed_when:
        - bspwm_make_install.rc != 0
        # Reinstalling a running binary yields "cp: cannot create regular file ... Text file busy"
        - "'Text file busy' not in (bspwm_make_install.stderr | default(''))"
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ bspwm_tmp.path }}"
        state: absent
      when: bspwm_tmp.path is defined

- name: Install bspwm.desktop file
  ansible.builtin.copy:
    src: bspwm.desktop
    dest: /usr/local/share/xsessions/
    owner: root
    group: root
    mode: "0644"
  become: true
