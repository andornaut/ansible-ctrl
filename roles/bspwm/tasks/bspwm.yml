---
- name: Build and install BSPWM projects
  become: true
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: bspwm_tmp

    - name: Clone BSPWM git repositories
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ bspwm_tmp.path }}/{{ item.name }}"
        depth: 1
        version: "{{ item.version | default('HEAD') }}"
      loop: "{{ bspwm_projects }}"

    - name: Build BSPWM projects
      community.general.make:
        chdir: "{{ bspwm_tmp.path }}/{{ item.name }}"
      loop: "{{ bspwm_projects }}"

    # Staged rather than written straight into /usr/local. Every install line in these
    # Makefiles is `cp -p`, and only bspwm and sxhkd pass -f, so any other binary that
    # happens to be running blocks its own replacement. Staging also collects every file
    # into one tree to name the modes on: `cp -p` otherwise carries the checkout's mode
    # to the man pages and completions, and the build umask to the binaries.
    - name: Install BSPWM projects into a staging tree
      community.general.make:
        chdir: "{{ bspwm_tmp.path }}/{{ item.name }}"
        target: install
        params:
          DESTDIR: "{{ bspwm_tmp.path }}/stage"
      loop: "{{ bspwm_projects }}"

    # Capital X grants execute only where the build or the checkout already had it, so
    # the binaries stay binaries and the man pages stay data.
    - name: Set the mode of the staged tree
      ansible.builtin.file:
        path: "{{ bspwm_tmp.path }}/stage"
        state: directory
        recurse: true
        mode: u=rwX,go=rX

    # tar rather than `cp -a`, which rewrites the mode and ownership of destination
    # directories that already exist: --no-overwrite-dir leaves those alone and writes only
    # the files, so a /usr/local/bin that is setgid stays setgid. tar unlinks each target
    # before extracting, which is what the -f the other five Makefiles lack would do: a
    # process keeps executing the inode it opened and the replacement lands beside it. -p
    # keeps the modes named above, tar putting them through the umask otherwise, and the
    # doc/bspc.1 symlink arrives as a symlink.
    - name: Install the staged tree into /usr/local
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          tar -C {{ bspwm_tmp.path }}/stage/usr/local -cf - .
          | tar -C /usr/local -xpf - --no-overwrite-dir
        executable: /bin/bash
      changed_when: true
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ bspwm_tmp.path }}"
        state: absent
      when: bspwm_tmp.path is defined

- name: Install bspwm.desktop file
  ansible.builtin.copy:
    src: bspwm.desktop
    dest: /usr/local/share/xsessions/
    owner: root
    group: root
    mode: "0644"
  become: true
