---
- name: Build and install BSPWM projects
  become: true
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: bspwm_tmp
      check_mode: false

    - name: Clone BSPWM git repositories
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ bspwm_tmp.path }}/{{ item.name }}"
        depth: 1
        version: "{{ item.version | default('HEAD') }}"
      loop: "{{ bspwm_projects }}"

    - name: Build BSPWM projects
      community.general.make:
        chdir: "{{ bspwm_tmp.path }}/{{ item.name }}"
      loop: "{{ bspwm_projects }}"

    # Staged rather than written straight into /usr/local. Every install line in these
    # Makefiles is `cp -p`, and only bspwm and sxhkd pass -f, so any other binary that
    # happens to be running blocks its own replacement. Staging also collects every file
    # into one tree to name the modes on: `cp -p` otherwise carries the checkout's mode
    # to the man pages and completions, and the build umask to the binaries.
    - name: Install BSPWM projects into a staging tree
      community.general.make:
        chdir: "{{ bspwm_tmp.path }}/{{ item.name }}"
        target: install
        params:
          DESTDIR: "{{ bspwm_tmp.path }}/stage"
      loop: "{{ bspwm_projects }}"

    # Capital X grants execute only where the build or the checkout already had it, so
    # the binaries stay binaries and the man pages stay data.
    - name: Set the mode of the staged tree
      ansible.builtin.file:
        path: "{{ bspwm_tmp.path }}/stage"
        state: directory
        recurse: true
        mode: u=rwX,go=rX

    # tar rather than `cp -a`, which rewrites the mode and ownership of destination
    # directories that already exist: --no-overwrite-dir leaves those alone and writes only
    # the files, so a /usr/local/bin that is setgid stays setgid. tar unlinks each target
    # before extracting, which is what the -f the other five Makefiles lack would do: a
    # process keeps executing the inode it opened and the replacement lands beside it. -p
    # keeps the modes named above, tar putting them through the umask otherwise, and the
    # doc/bspc.1 symlink arrives as a symlink.
    - name: Install the staged tree into /usr/local
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          tar -C {{ bspwm_tmp.path }}/stage/usr/local -cf - .
          | tar -C /usr/local -xpf - --no-overwrite-dir
        executable: /bin/bash
      changed_when: true
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ bspwm_tmp.path }}"
        state: absent
      when: bspwm_tmp.path is defined
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false

- name: Install bspwm.desktop file
  ansible.builtin.copy:
    src: bspwm.desktop
    dest: /usr/local/share/xsessions/
    owner: root
    group: root
    mode: "0644"
  become: true

# The session target and the wrapper that holds it: README.md's Notes. graphical-session.target
# ships StopWhenUnneeded=yes, so it stays up only while an active unit requires it, and the
# wrapper's bspwm-session.target is that unit for the length of the session. Nothing else may
# stand in for it: a bar that Requires= the target takes every unit wanted by the session
# down with it when it crashes.
- name: Create the local systemd user unit directory
  ansible.builtin.file:
    path: /usr/local/lib/systemd/user
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the bspwm session target
  ansible.builtin.copy:
    src: bspwm-session.target
    dest: /usr/local/lib/systemd/user/bspwm-session.target
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the bspwm session wrapper
  ansible.builtin.copy:
    src: bspwm-session
    dest: /usr/local/bin/bspwm-session
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Validate bspwm_user
  ansible.builtin.assert:
    that:
      - bspwm_user != "root"
    fail_msg: >-
      bspwm_user resolved to "root", whose user manager is not the session's. Set
      primary_user in the inventory (or bspwm_user in host_vars) to the session's account.
    success_msg: 'bspwm_user "{{ bspwm_user }}" is valid'
  become: false

- name: Resolve the uid of {{ bspwm_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ bspwm_user }}"
  become: false

# A running manager reads /usr/local/lib/systemd/user only on reload, so without this a
# session logged in before the target existed could not start it until the next login.
- name: Reload the systemd user manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ bspwm_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ bspwm_user_uid }}"

- name: Check for a running bspwm session
  ansible.builtin.command:
    argv: [pgrep, -u, "{{ bspwm_user }}", -x, bspwm]
  register: bspwm_session_running
  changed_when: false
  failed_when: bspwm_session_running.rc not in [0, 1]
  # A --check run needs the register below, and pgrep changes nothing.
  check_mode: false
  become: false

# A session logged in before the target existed gets it now, as a fresh login would. One
# that is not running gets nothing: the target has no session to hold for, and raising it
# would start every unit wanted by a session that does not exist.
- name: Hold the session target for the running session
  when: bspwm_session_running.rc == 0
  ansible.builtin.systemd_service:
    name: bspwm-session.target
    scope: user
    state: started
  become: true
  become_user: "{{ bspwm_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ bspwm_user_uid }}"
