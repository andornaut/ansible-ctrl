---
- name: Validate bspwm_user
  ansible.builtin.assert:
    that:
      - bspwm_user != "root"
    fail_msg: >-
      bspwm_user resolved to "root", whose user manager is not the session's. Set
      primary_user in the inventory (or bspwm_user in host_vars) to the session's account.
    success_msg: 'bspwm_user "{{ bspwm_user }}" is valid'
  become: false
  tags: always

# Every task file reads the home and uid of bspwm_user off this lookup, so it runs on every
# tag: a --tags app-entries run would otherwise find the fact missing.
- name: Resolve home directory for {{ bspwm_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ bspwm_user }}"
  become: false
  tags: always

# ecryptfs keeps its configuration beside the home rather than inside it, so this answers whether
# the home is encrypted whether or not it is mounted now. Derived from the resolved home, never a
# fixed /home: ecryptfs-setup-private writes to $(dirname $HOME)/.ecryptfs/$USER.
- name: Check for an encrypted home for {{ bspwm_user }}
  ansible.builtin.stat:
    path: "{{ bspwm_user_home | dirname }}/.ecryptfs/{{ bspwm_user }}"
  register: bspwm_user_home_ecryptfs
  changed_when: false
  become: true
  tags: always

# getent answers with the home's path whether or not anything is mounted there, so without this a
# run against a locked home writes onto the mountpoint and the next login mounts over it. Fails
# closed without the mounts fact, an encrypted home then counting as unmounted.
- name: Record whether the home is mounted for {{ bspwm_user }}
  ansible.builtin.set_fact:
    bspwm_user_home_mounted: >-
      {{ (not bspwm_user_home_ecryptfs.stat.exists)
         or (bspwm_user_home in (ansible_facts['mounts'] | default([]) | map(attribute='mount') | list)) }}
  tags: always

- name: Report a locked home for {{ bspwm_user }}
  ansible.builtin.debug:
    msg: >-
      {{ bspwm_user }}'s home is encrypted and {{ bspwm_user_home }} is not mounted, so the
      desktop entry overrides this role writes into the home will be skipped. Log in as
      {{ bspwm_user }}, or run ecryptfs-mount-private there, and re-run.
  when: not bspwm_user_home_mounted | bool
  tags: always

- name: Install X11 system packages and build dependencies
  ansible.builtin.import_tasks: apt.yml
  tags:
    - bspwm
    - x11

- name: Build and install BSPWM
  ansible.builtin.import_tasks: bspwm.yml
  tags: bspwm

# Last: the overrides cover entries the packages above install.
- name: Configure the desktop entry overrides
  ansible.builtin.import_tasks: app_entries.yml
  tags:
    - bspwm
    - app-entries
