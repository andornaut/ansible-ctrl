---
# desktop_environment has no default: set it per host to "niri", "bspwm" or "gnome".
# desktop.yml applies the matching WM role, and this role asserts it is set.

desktop_eww_bar: bar
# Extra kernel parameters for GRUB_CMDLINE_LINUX_DEFAULT. Empty leaves the line unset.
desktop_grub_cmdline_linux_default: ""
# False removes any existing install and holds the apt pin at -1.
# desktop_install_firefox_apt chooses apt or flatpak, and applies only when true.
desktop_install_firefox: false
desktop_install_firefox_apt: false
desktop_install_insync: false
# Out-of-tree DKMS Super I/O drivers exposing the pwm/fan hwmon CoolerControl manages.
# Enable the one matching the board's chip.
# it87: ITE IT8696E/IT8883 on Gigabyte AM5 boards.
desktop_install_it87: false
desktop_it87_repo: https://github.com/frankcrawford/it87.git
desktop_it87_version: master
# nct6687d: Nuvoton NCT6687D on MSI boards.
desktop_install_nct6687d: false
desktop_nct6687d_repo: https://github.com/Fred78290/nct6687d.git
desktop_nct6687d_version: main
# USB vendor IDs whose hubs reset their downstream tree on autosuspend, dropping input
# and audio for seconds. Each gets power/control pinned on. Empty removes the rule.
desktop_usb_no_autosuspend_vendor_ids: []
# Web browser set as the xdg-settings default: "firefox" or "google-chrome".
desktop_default_browser: firefox
# Display manager settings
desktop_install_ly: false
desktop_install_lemurs: false
# Must be one of https://ziglang.org/download/community-mirrors.txt
desktop_zig_mirror: https://ziglang.freetls.fastly.net

# Blank, then lock, then monitor off, in minutes; idle.yml asserts that order. Which
# each desktop honours differs; see README.md.
desktop_screen_blank_minutes: 10
desktop_screen_lock_minutes: 20
desktop_screen_off_minutes: 60
# What the xsecurelock password field echoes: "asterisks" (length visible), "cursor",
# "time" or "disco".
desktop_xsecurelock_password_prompt: asterisks
# X11 colour name or "#RRGGBB"; empty keeps xsecurelock's black. Only the dialog box
# is tinted, and only while the prompt is up, so a tint means keystrokes reach it.
desktop_xsecurelock_auth_background_color: ""

# Unset leaves the host's policy alone, 0 disables idle suspend, N suspends after N
# minutes, on mains and battery alike. Locking is separate. Under bspwm it must be 0 or
# above desktop_screen_blank_minutes, asserted in idle.yml. See README.md.
desktop_suspend_inactive_minutes: ~

# Minutes of real input idle before the panel is powered down whatever is inhibiting, or
# 0 to disable. Every mechanism above honours an idle inhibitor for as long as an
# application holds one, and none of them caps that, so a game running unattended keeps a
# static image lit indefinitely. This is the floor under all three. It must clear
# desktop_screen_blank_minutes and, where idle suspend is on, fall below
# desktop_suspend_inactive_minutes; idle_backstop.yml asserts both. See README.md.
desktop_idle_backstop_minutes: 120

# Directory names under /usr/share/themes. theme.yml also copies each into ~/.themes,
# the only place a flatpak sandbox finds them.
desktop_gtk_themes:
  - Adwaita
  - Adwaita-dark
  - Yaru-purple
  - Yaru-purple-dark
# One of desktop_gtk_themes. Dark is not separate: theme.yml derives it, and GNOME's
# colour scheme, from the name.
desktop_gtk_theme: Adwaita-dark
# For flatpak applications, which cannot see the host's and draw the pointer at the
# wrong size. The session's own cursor is in the dotfiles.
desktop_cursor_theme: Adwaita

# Genuine archive formats only: deb, rpm, iso, apk and jar keep their own handlers.
desktop_file_roller_mime_types:
  - application/zip
  - application/x-7z-compressed
  - application/vnd.rar
  - application/x-rar
  - application/x-tar
  - application/gzip
  - application/x-compressed-tar
  - application/x-bzip-compressed-tar
  - application/x-xz-compressed-tar
  - application/x-xz
  - application/x-lzma-compressed-tar
  - application/zstd
  - application/x-zstd-compressed-tar

# malcontent OARS filter and Chrome SafeSearch. False lifts whatever an earlier run
# enforced; the host's desktop_parental_controls_* settings must go with it, the role
# asserting none is left describing a policy nothing enforces. README.md.
desktop_install_parental_controls: false
# Ceilings above which apps are hidden in gnome-software: none < mild < moderate <
# intense. Any entry also disallows flatpak installs from the system repository, restored
# by emptying the dict.
desktop_parental_controls_oars: {}
# Written to family.json when the controls are on. Beyond SafeSearch and YouTube these
# close the in-browser bypass paths. A non-sudo user can still install a flatpak browser,
# so an egress lockdown is what makes them hold.
desktop_chrome_family_policies:
  ForceGoogleSafeSearch: true
  ForceYouTubeRestrict: 1
  DnsOverHttpsMode: "off"
  SafeSitesFilterBehavior: 1
  SafeBrowsingProtectionLevel: 2
  IncognitoModeAvailability: 1
  BrowserGuestModeEnabled: false
  DeveloperToolsAvailability: 2
  ProxySettings:
    ProxyMode: "direct"
  ExtensionInstallBlocklist:
    - "*"
  ExtensionInstallAllowlist:
    - cjpalhdlnbpafiamejdnhcphjbkeiagm  # uBlock Origin
    - ddkjiahejlhfcafbddmgiahcphecmpfh  # uBlock Origin Lite

# Enforced by the nss-malcontent module, not the browser (README.md). "none" disables it,
# "block-list" allows all but the listed, "allow-list" blocks all but the listed and breaks
# a site over one missing CDN. Either list must have entries, asserted by the role, or
# malcontent sinkholes every hostname. Enabling edits /etc/nsswitch.conf system-wide.
# DnsOverHttpsMode "off" keeps Chrome resolving through it; Firefox is held off DoH by
# malcontent's own canary block.
desktop_parental_controls_web_filter_type: none
# {id: HTTPS URI}, id being a free-form label. Each list must be newline-separated bare
# hostnames, not hosts-file lines; one malformed line aborts the whole update, leaving the
# previous list and an error in /var/lib/malcontent-webd/update-error.
desktop_parental_controls_web_block_lists: {}
desktop_parental_controls_web_allow_lists: {}
# Added alongside the fetched lists. Matching is exact, subdomains included, so name
# every host to be covered.
desktop_parental_controls_web_blocked_hosts: []
desktop_parental_controls_web_allowed_hosts: []
# Force safe search in the search engines malcontent knows how to rewrite.
desktop_parental_controls_web_force_safe_search: true

# The account the user-scoped tasks act on, not a blanket become_user.
desktop_user: "{{ primary_user }}"

# Apt packages to replace with flatpak equivalents
desktop_flatpak_replacements:
  audacity: org.audacityteam.Audacity
  blender: org.blender.Blender
  filezilla: org.filezillaproject.Filezilla
  gimp: org.gimp.GIMP
  inkscape: org.inkscape.Inkscape
  libreoffice: org.libreoffice.LibreOffice
  vlc: org.videolan.VLC

# Additional flatpak applications
desktop_flatpak_extras:
  - com.obsproject.Studio
  - fr.handbrake.ghb
  - io.missioncenter.MissionCenter
