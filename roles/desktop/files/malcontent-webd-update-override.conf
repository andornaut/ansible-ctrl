# Installed as /etc/systemd/system/malcontent-webd-update.service.d/override.conf.
#
# The packaged unit is WantedBy=multi-user.target with no network ordering, so at
# boot it reaches malcontent-webd seconds before a resolver answers and the fetch
# fails 69/UNAVAILABLE, leaving the unit failed until the timer's OnBootSec run
# 15 minutes later. The service itself is PrivateNetwork=yes: what this orders is
# the D-Bus call that makes malcontent-webd download the lists.

[Unit]
Wants=network-online.target
After=network-online.target
