---
# Deferred so it runs after eww.service is installed in a later block.
- name: Restart eww
  ansible.builtin.systemd_service:
    name: eww.service
    daemon_reload: true
    scope: user
    state: restarted
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"

- name: Restart flameshot
  ansible.builtin.systemd_service:
    name: flameshot.service
    daemon_reload: true
    scope: user
    state: restarted
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"

# Built by the niri role, applied after this one, so the unit may not exist yet
# on a --tags idle run; failed_when below tolerates that.
- name: Restart hypridle
  ansible.builtin.systemd_service:
    name: hypridle.service
    daemon_reload: true
    scope: user
    state: restarted
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
  register: desktop_hypridle_restart
  failed_when:
    - desktop_hypridle_restart is failed
    - "'Could not find the requested service' not in desktop_hypridle_restart.msg | default('')"

# Above the backstop, handlers running in definition order: the backstop reads the stamp
# this publishes, and exits when it is missing.
- name: Restart the idle input reader
  ansible.builtin.systemd_service:
    name: desktop-idle-input.service
    daemon_reload: true
    state: restarted
  become: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart the idle backstop
  ansible.builtin.systemd_service:
    name: desktop-idle-backstop.service
    daemon_reload: true
    scope: user
    state: restarted
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"

# CanReload=yes, so the drop-in takes effect without restarting logind under a
# live graphical session.
- name: Reload systemd-logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: reloaded
  become: true

# Oneshot with RemainAfterExit, so restart rather than start. Refetches every
# filter list, so only a changed filter fires it.
- name: Recompile the malcontent web filter lists
  ansible.builtin.systemd_service:
    name: malcontent-webd-update.service
    state: restarted
  become: true

- name: Update font cache
  ansible.builtin.command: fc-cache --force
  become: true
  changed_when: true

# GTK prefers hicolor's icon-theme.cache over scanning, so a new icon stays
# invisible until it is rebuilt.
- name: Update hicolor icon cache
  ansible.builtin.command: gtk-update-icon-cache --force /usr/share/icons/hicolor
  become: true
  changed_when: true

- name: Update GRUB
  ansible.builtin.command: update-grub
  become: true
  changed_when: true

# Reload then re-trigger, so a new rule reaches already-plugged hubs. Handlers run
# in definition order, so the reload must stay above.
- name: Reload the udev rules
  ansible.builtin.command:
    argv:
      - udevadm
      - control
      - --reload-rules
  changed_when: false
  become: true

# --action=change re-asserts power/control on plugged hubs without a reboot.
- name: Apply the udev rules to the USB devices
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --subsystem-match=usb
      - --action=change
  changed_when: false
  become: true
