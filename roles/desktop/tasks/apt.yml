---
- name: Install common system packages
  ansible.builtin.apt:
    name:
      # Cursor theme, selected by gtk-cursor-theme-name in the dotfiles. GTK widget
      # themes come from theme.yml.
      - adwaita-icon-theme
      - desktop-file-utils
      - file-roller
      # Only a Recommends of ubuntu-desktop-minimal, which gnome.yml installs
      # with recommends disabled.
      - gnome-keyring
      - gvfs-backends
      - imagemagick
      - jq
      - libnotify-bin
      - network-manager
      - python3-pip
      - python3-setuptools
      - xdg-user-dirs
      - xdg-utils
      # X11-only, but ~/.bashrc sources functions using it on every desktop.
      - xdotool
      # Icon theme selected by /etc/gtk-3.0/settings.ini, and the only packaged one
      # shipping system-software-update-symbolic, which eww.yml copies to hicolor.
      - yaru-theme-icon
      - zenity
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# Papers replaced Evince, but is only packaged on Ubuntu >= 26.04.
- name: Install document viewer
  ansible.builtin.apt:
    name: "{{ 'papers' if ansible_facts['distribution_version'] is version('26.04', '>=') else 'evince' }}"
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# Conflicts with NetworkManager: systemd-networkd-wait-online times out on
# NetworkManager's interfaces, costing 2 minutes at boot.
- name: Disable systemd-networkd
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - systemd-networkd.service
    - systemd-networkd-wait-online.service
  become: true
