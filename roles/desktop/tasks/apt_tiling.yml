---
# Session utilities a tiling WM does not provide for itself; GNOME ships its own.
# X11 tools here serve both sessions (niri runs them under XWayland); tools with a
# true Wayland replacement live in the bspwm and niri roles.
- name: Install tiling window manager system packages
  ansible.builtin.apt:
    name:
      - blueman
      - feh
      # apt, not flatpak: the sandboxed build captures through the Screenshot
      # portal, which no backend implements on a minimal X11 WM. GNOME has a
      # screenshot UI of its own.
      - flameshot
      - lxappearance
      - network-manager-gnome
      # The only volume UI a tiling session has. A gnome host makes do with the
      # GNOME sound panel, which lacks its per-app routing and port selection.
      - pavucontrol
      # Media keys, which GNOME binds itself.
      - playerctl
      - policykit-1-gnome
      - suckless-tools
      - wmctrl
      - xclip
      - xinput
      - xsel
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# CLEANUP (added 2026-09-19): packages and launcher entries removed by hand from the tiling
# host that converged first, so the other tiling hosts reach the same state when they next
# converge. Delete both tasks once every host with desktop_environment other than gnome has
# converged. Not for a gnome host: gnome-terminal is part of its session there.
- name: Purge the packages the tiling hosts no longer carry
  ansible.builtin.apt:
    name:
      - arduino
      - barrier
      - gnome-terminal
      - higan
      - minecraft-launcher
      - pocket-sync
      - rxvt-unicode
      - spotify-client
      - winetricks
      - xarchiver
      - xsane
    autoremove: true
    purge: true
    state: absent
  become: true

- name: Remove the launcher entries no package owns
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/applications/Alacritty.desktop
    - /usr/share/applications/xscreensaver.desktop
    - /usr/share/applications/xscreensaver-settings.desktop
  become: true
