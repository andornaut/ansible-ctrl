---
- name: Check if Google Chrome is already installed
  # Reads system state and needs no privilege, so it runs as the connecting account.
  #
  # The Status is what decides it: `dpkg-query -W <name>` alone exits 0 for a package dpkg
  # merely knows about, so a Chrome removed without --purge would read as installed and never
  # be put back.
  become: false
  ansible.builtin.command: dpkg-query -W -f='${Status}' google-chrome-stable
  register: desktop_chrome_check
  failed_when: false
  changed_when: false
  # Run under --check too: skipped, it registers an empty stdout, which reads as a Chrome
  # that is not installed and sends the task below to fetch the .deb. package: deb: downloads
  # before its own check-mode guard, so that is ~120MB per host on every check run.
  check_mode: false

- name: Install Google Chrome
  ansible.builtin.package:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
  become: true
  when: "'ok installed' not in desktop_chrome_check.stdout"

# Not a conffile, so dpkg reverts the flag on every Chrome self-update: patch it,
# then shadow it below under /usr/local/share, which XDG_DATA_DIRS ranks first.
# `[ \t]+`, not `\s+`, which would match a newline and swallow the next line.
- name: Configure Google Chrome for Wayland
  ansible.builtin.replace:
    path: /usr/share/applications/google-chrome.desktop
    regexp: '^(Exec=\S+)(?:[ \t]+--ozone-platform-hint=\S+)*'
    replace: '\1 --ozone-platform-hint=auto'
  become: true

- name: Create the local applications directory
  ansible.builtin.file:
    path: /usr/local/share/applications
    state: directory
    mode: "0755"
  become: true

# Same desktop id, resolved through XDG_DATA_DIRS, so default_browser.yml is unaffected.
- name: Shadow the Google Chrome desktop entry so the Wayland flag survives dpkg
  ansible.builtin.copy:
    src: /usr/share/applications/google-chrome.desktop
    dest: /usr/local/share/applications/google-chrome.desktop
    remote_src: true
    mode: "0644"
    owner: root
    group: root
  become: true

# parental_controls.yml owns the contents: Chrome merges every file it finds here.
- name: Create Chrome managed policies directory
  ansible.builtin.file:
    path: "{{ desktop_chrome_policies_dir }}"
    state: directory
    mode: "0755"
  become: true
