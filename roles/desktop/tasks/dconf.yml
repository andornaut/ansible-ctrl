---
- name: Install dconf dependencies
  ansible.builtin.apt:
    name:
      - dconf-cli
      - python3-psutil
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# dconf writes to the invoking user's database, so run as desktop_user.
# XDG_RUNTIME_DIR is unset when Ansible escalates to a user it did not log in as.
- name: Configure keyboard settings
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
  block:
    - name: Prevent Super+Space from switching input sources
      community.general.dconf:
        key: "/org/gnome/desktop/wm/keybindings/switch-input-source"
        value: "@au []"
        state: present

    - name: Set US keyboard layout as the only available layout
      community.general.dconf:
        key: "/org/gnome/desktop/input-sources/sources"
        value: "[('xkb', 'us')]"
        state: present

    - name: Prevent ibus-daemon from interfering with keyboard shortcuts
      community.general.dconf:
        key: "/org/gnome/settings-daemon/plugins/keyboard/active"
        value: "false"
        state: present

# The Ubuntu Dock is an extension of the GNOME session, so this runs nowhere else.
- name: Configure the Ubuntu Dock
  when: desktop_environment == "gnome"
  become: true
  become_user: "{{ desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
  block:
    # The dock reveals on a pointer press against its edge, which a fullscreen game
    # keeps the pointer at. Without this the reveal is not suppressed and the dock
    # draws over the game.
    - name: Keep the dock hidden while a window is fullscreen
      community.general.dconf:
        key: /org/gnome/shell/extensions/dash-to-dock/autohide-in-fullscreen
        value: "true"
        state: present
