---
- name: Install dunst build dependencies
  ansible.builtin.apt:
    name:
      - libdbus-1-dev
      - libglib2.0-dev
      - libgtk-3-dev
      - libnotify-dev
      - libpango1.0-dev
      - libx11-dev
      - libxdg-basedir-dev
      - libxinerama-dev
      - libxrandr-dev
      - libxss-dev
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# The download and the build run as desktop_user, so the release's Makefile never runs as
# root before its install step. become_user propagates into the block, so the tasks that need
# root name it back: a bare become: true would inherit this user and fail.
- name: Build and install dunst
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: desktop_dunst_tmp
      check_mode: false

    - name: Get latest dunst release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: dunst-project/dunst
        release_fact: desktop_dunst_release

    - name: Set dunst version fact
      ansible.builtin.set_fact:
        desktop_dunst_version: "{{ desktop_dunst_release.tag_name }}"

    - name: Download and unarchive dunst
      ansible.builtin.unarchive:
        src: "https://github.com/dunst-project/dunst/archive/refs/tags/{{ desktop_dunst_version }}.tar.gz"
        dest: "{{ desktop_dunst_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1
      register: desktop_dunst_download
      retries: 3
      delay: 5
      until: desktop_dunst_download is succeeded

    - name: Build dunst
      community.general.make:
        chdir: "{{ desktop_dunst_tmp.path }}"

    - name: Install dunst
      community.general.make:
        chdir: "{{ desktop_dunst_tmp.path }}"
        target: install
      become: true
      become_user: root
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ desktop_dunst_tmp.path }}"
        state: absent
      when: desktop_dunst_tmp.path is defined
      # Root: the install step can leave root-owned files in the build tree.
      become: true
      become_user: root
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false
