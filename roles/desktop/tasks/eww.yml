---
# Before the build dependencies, so a host without a toolchain fails early. The probe
# runs as the account that will build, cargo being per-user: probing any other reports
# on a toolchain the build will not use.
- name: Require the Rust toolchain
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Probe for the Rust toolchain
      ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
      vars:
        require_tools:
          - name: cargo
            probe: cargo --version
            hint: "It comes from the dev role: make dev -- --tags rust"

- name: Install eww build dependencies
  ansible.builtin.apt:
    name:
      - libdbusmenu-glib-dev
      - libdbusmenu-gtk3-dev
      - libgtk-layer-shell-dev
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# The staging directory, the clone and the build all run as the account whose cargo
# toolchain builds them. become_user propagates into the block, so the two tasks that
# need root name it back: a bare become: true would inherit this user and fail.
- name: Build and install eww
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: desktop_eww_tmp
      check_mode: false

    # Build from main: the latest stable release is stale.
    - name: Clone eww repository (main branch)
      ansible.builtin.git:
        repo: https://github.com/elkowar/eww.git
        dest: "{{ desktop_eww_tmp.path }}"
        version: master
        depth: 1
      register: desktop_eww_clone
      retries: 3
      delay: 5
      until: desktop_eww_clone is succeeded

    # The remaps keep the random build directory out of the binary, so an unchanged
    # commit installs byte-identical and the restart handler does not fire.
    - name: Build eww
      ansible.builtin.command:
        cmd: cargo build --release --no-default-features --features x11 --features=wayland
        chdir: "{{ desktop_eww_tmp.path }}"
      environment:
        RUSTFLAGS: >-
          --remap-path-prefix={{ desktop_eww_tmp.path }}=/build
          --remap-path-prefix={{ desktop_user_home }}/.cargo=/cargo
      changed_when: true

    - name: Install eww binary
      ansible.builtin.copy:
        src: "{{ desktop_eww_tmp.path }}/target/release/eww"
        dest: /usr/local/bin/
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart eww
      become: true
      become_user: root
  always:
    # ~1GB of cargo output, on a /tmp tmpfs sized at half of RAM.
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ desktop_eww_tmp.path }}"
        state: absent
      when: desktop_eww_tmp.path is defined
      become: true
      become_user: root
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false

# eww's systray resolves icons through hicolor only, which does not ship the icon
# update-notifier publishes. Yaru is the only Ubuntu-packaged theme that has it.
# The Yaru file is a symlink, so remote_src copies the target.
- name: Install system-software-update-symbolic into the hicolor icon theme
  ansible.builtin.copy:
    src: /usr/share/icons/Yaru/scalable/apps/software-updater-symbolic.svg
    dest: /usr/share/icons/hicolor/scalable/apps/system-software-update-symbolic.svg
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Update hicolor icon cache
  become: true

- name: Configure eww service
  block:
    # eww is under /usr/local, so its unit belongs here. /etc/systemd/user is the
    # administrator's and outranks it, so a copy left there would shadow this one.
    - name: Create the local systemd user unit directory
      ansible.builtin.file:
        path: /usr/local/lib/systemd/user
        state: directory
        mode: "0755"
      become: true

    - name: Install eww.service
      ansible.builtin.copy:
        dest: /usr/local/lib/systemd/user/eww.service
        mode: "0644"
        content: |
          [Unit]
          Description=ElKowars wacky widgets
          Documentation=https://elkowar.github.io/eww/
          # PartOf and After only, never Requires: graphical-session.target ships
          # StopWhenUnneeded=yes, so a unit that requires it is what keeps it up, and a bar
          # in that position takes every unit wanted by the session down with it when it
          # crashes. The session's own target holds it; the bar follows.
          PartOf=graphical-session.target
          After=graphical-session.target
          #ConditionEnvironment=WAYLAND_DISPLAY

          [Service]
          Type=exec
          # The daemon ignores SIGTERM once its windows are mapped, so ExecStop uses
          # `eww kill`. The timeout and ExecStartPre catch a server that survives anyway.
          TimeoutStopSec=5
          # It segfaults on a monitor reconnect now and then; a bar that stays dead until
          # the next login is the wrong outcome. ExecStartPre clears what the crash left.
          Restart=on-failure
          RestartSec=2
          ExecStartPre=-/usr/local/bin/eww kill
          ExecStart=/usr/local/bin/eww daemon --no-daemonize --logs
          ExecStartPost=/usr/local/bin/eww open {{ desktop_eww_bar }}
          ExecReload=/usr/local/bin/eww reload
          ExecStop=-/usr/local/bin/eww kill
          Slice=session.slice

          [Install]
          WantedBy=graphical-session.target
      notify: Restart eww
      become: true

    # Symlinking works with the user manager down, so the unit activates at next login
    # either way; the task below starts it now when a session is present.
    - name: Create the wants directory for eww.service
      ansible.builtin.file:
        path: "{{ desktop_user_home }}/.config/systemd/user/graphical-session.target.wants"
        state: directory
        mode: "0755"
      when: desktop_user_home_mounted | bool
      become: true
      become_user: "{{ desktop_user }}"

    - name: Enable eww service
      ansible.builtin.file:
        src: /usr/local/lib/systemd/user/eww.service
        dest: "{{ desktop_user_home }}/.config/systemd/user/graphical-session.target.wants/eww.service"
        state: link
        # state=link rejects an absent src before check mode is considered, and the unit file
        # above is a no-op under --check. force skips that test, so a dry run reports the missing
        # symlink instead of failing; a real run always has the unit, written immediately above.
        force: true
      when: desktop_user_home_mounted | bool
      become: true
      become_user: "{{ desktop_user }}"

    - name: Start eww service in the active session
      ansible.builtin.systemd_service:
        name: eww.service
        daemon_reload: true
        scope: user
        state: started
      become: true
      become_user: "{{ desktop_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
      when: desktop_user_systemd.stat.exists
