---
# Probed, not required: the removals below are no-ops without flatpak. The install
# branch asserts for itself.
- name: Check for flatpak
  # Reads system state and needs no privilege, so it runs as the connecting account.
  become: false
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v flatpak
  register: desktop_firefox_flatpak_bin
  changed_when: false
  failed_when: false
  check_mode: false

# One record, written unconditionally: two files pinning the same package resolve by
# filename order. -1 blocks the Mozilla repo and Ubuntu's alike, blocks firefox as a
# dependency, and makes dist-upgrade remove it. Only the apt method raises it to 1000.
- name: Pin Firefox to the chosen install method
  ansible.builtin.copy:
    content: |
      Package: firefox*
      Pin: {{ 'origin packages.mozilla.org' if (desktop_install_firefox | bool and desktop_install_firefox_apt | bool) else 'release a=*' }}
      Pin-Priority: {{ 1000 if (desktop_install_firefox | bool and desktop_install_firefox_apt | bool) else -1 }}
    dest: /etc/apt/preferences.d/firefox
    mode: "0644"
  become: true

- name: Configure Firefox Apt installation method
  when: desktop_install_firefox | bool and desktop_install_firefox_apt | bool
  block:
    - name: Remove Firefox flatpak if using apt
      become: true
      become_user: "{{ desktop_user }}"
      community.general.flatpak:
        name: org.mozilla.firefox
        method: user
        state: absent
      when: desktop_firefox_flatpak_bin.rc == 0

    - name: Configure Firefox apt packages
      block:
        # Ubuntu's firefox, the snap transitional package included, carries "ubuntu" in its
        # version and Mozilla's does not.
        - name: Remove Firefox if installed from non-Mozilla source
          ansible.builtin.shell: >-
            set -o pipefail &&
            dpkg-query -W -f '${db:Status-Abbrev} ${Version}\n' firefox 2>/dev/null
            | grep -q '^ii .*ubuntu'
          args:
            executable: /bin/bash
          register: desktop_firefox_installed
          failed_when: false
          changed_when: false
          check_mode: false
          become: false

        - name: Purge old Firefox package
          ansible.builtin.apt:
            name: firefox
            purge: true
            state: absent
          become: true
          when: desktop_firefox_installed.rc == 0

        - name: Download Mozilla apt signing key
          ansible.builtin.get_url:
            url: https://packages.mozilla.org/apt/repo-signing-key.gpg
            dest: /etc/apt/keyrings/packages.mozilla.org.asc
            mode: "0644"
          register: desktop_firefox_key_download
          retries: 3
          delay: 5
          until: desktop_firefox_key_download is succeeded
          become: true

        # CLEANUP (added 2026-09-25): the same source without arch=, which apt_repository
        # leaves beside the line below. Delete once every desktop host with the apt Firefox
        # install method has converged.
        - name: Remove the Mozilla repository line without an architecture
          ansible.builtin.apt_repository:
            repo: >-
              deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc]
              https://packages.mozilla.org/apt mozilla main
            state: absent
            update_cache: false
          become: true

        - name: Add Mozilla apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ desktop_arch }} signed-by=/etc/apt/keyrings/packages.mozilla.org.asc]
              https://packages.mozilla.org/apt mozilla main
            mode: "0644"
            state: present
            update_cache: true
          become: true

        - name: Install Firefox and dependencies
          ansible.builtin.apt:
            name:
              - firefox
              - speech-dispatcher # Required for text-to-speech
            state: latest
            install_recommends: false
            update_cache: true
          become: true

- name: Configure Firefox flatpak installation method
  when: desktop_install_firefox | bool and not desktop_install_firefox_apt | bool
  block:
    - name: Require flatpak
      # Probed as the account whose flatpak installation receives the app.
      become: true
      become_user: "{{ desktop_user }}"
      block:
        - name: Probe for flatpak
          ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
          vars:
            require_tools:
              - name: flatpak
                probe: flatpak --version
                hint: "It comes from this role's flatpak tag: make desktop -- --tags flatpak"

    # The pin at the top of this file prevents an install; it cannot undo one.
    - name: Remove Firefox apt package
      ansible.builtin.apt:
        name: firefox
        purge: true
        state: absent
      become: true

    - name: Install and configure Firefox flatpak for the target user
      become: true
      become_user: "{{ desktop_user }}"
      block:
        - name: Install Firefox flatpak
          community.general.flatpak:
            name: org.mozilla.firefox
            method: user

        # Here rather than in flatpak.yml's loop: this install is conditional, so Firefox
        # is not in desktop_flatpak_apps. The grants themselves stay in the one map.
        - name: Configure Firefox flatpak permissions
          ansible.builtin.include_tasks: flatpak_override.yml
          vars:
            desktop_flatpak_override_app: org.mozilla.firefox
            desktop_flatpak_override_args: >-
              {{ (desktop_flatpak_overrides['default'] | default([]))
                 + (desktop_flatpak_overrides['org.mozilla.firefox'] | default([])) }}

# Firefox's own print dialog sends no ColorModel for a colour job, so a queue whose PPD
# defaults to Gray prints it grayscale. The system dialog sends one. The parental controls
# policies apply to every account on the host: policies.json has no per-user scope.
- name: Configure Firefox policies
  when: desktop_install_firefox | bool
  become: true
  vars:
    desktop_firefox_policies:
      UseSystemPrintDialog: true
    # DoH resolves past nss-malcontent and the router's DNS filter alike.
    desktop_firefox_family_policies:
      DisablePrivateBrowsing: true
      DNSOverHTTPS:
        Enabled: false
        Locked: true
  block:
    - name: Create Firefox policies directory
      ansible.builtin.file:
        path: "{{ desktop_firefox_policies_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Firefox policies
      ansible.builtin.copy:
        content: |
          {{ {'policies': desktop_firefox_policies
               | combine(desktop_firefox_family_policies if desktop_install_parental_controls | bool else {})}
             | to_nice_json }}
        dest: "{{ desktop_firefox_policies_dir }}/policies.json"
        mode: "0644"

# Purge any copy an earlier run installed; the pin above stays at -1. The flatpak
# removal runs as desktop_user because the install was per-user.
- name: Remove Firefox
  when: not desktop_install_firefox | bool
  block:
    - name: Remove Firefox flatpak
      become: true
      become_user: "{{ desktop_user }}"
      community.general.flatpak:
        name: org.mozilla.firefox
        method: user
        state: absent
      when: desktop_firefox_flatpak_bin.rc == 0

    - name: Remove Firefox apt package
      ansible.builtin.apt:
        name: firefox
        purge: true
        state: absent
      become: true
