---
# Probed, not required: the removals below are no-ops without flatpak. The install
# branch asserts for itself.
- name: Check for flatpak
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v flatpak
  register: desktop_firefox_flatpak_bin
  changed_when: false
  failed_when: false
  check_mode: false

# One record, written unconditionally: two files pinning the same package resolve by
# filename order. -1 blocks the Mozilla repo and Ubuntu's alike, blocks firefox as a
# dependency, and makes dist-upgrade remove it. Only the apt method raises it to 1000.
- name: Pin Firefox to the chosen install method
  ansible.builtin.copy:
    content: |
      Package: firefox*
      Pin: {{ 'origin packages.mozilla.org' if (desktop_install_firefox and desktop_install_firefox_apt) else 'release a=*' }}
      Pin-Priority: {{ 1000 if (desktop_install_firefox and desktop_install_firefox_apt) else -1 }}
    dest: /etc/apt/preferences.d/firefox
    mode: "0644"
  become: true

- name: Configure Firefox Apt installation method
  when: desktop_install_firefox and desktop_install_firefox_apt
  block:
    - name: Remove Firefox flatpak if using apt
      become: true
      become_user: "{{ desktop_user }}"
      community.general.flatpak:
        name: org.mozilla.firefox
        method: user
        state: absent
      when: desktop_firefox_flatpak_bin.rc == 0

    - name: Configure Firefox apt packages
      block:
        - name: Remove Firefox if installed from non-Mozilla source
          ansible.builtin.shell: set -o pipefail && dpkg -l firefox 2>/dev/null | grep -q "^ii"
          register: desktop_firefox_installed
          failed_when: false
          changed_when: false
          become: true

        - name: Purge old Firefox package
          ansible.builtin.apt:
            name: firefox
            purge: true
            state: absent
          become: true
          when: desktop_firefox_installed.rc == 0

        - name: Download Mozilla apt signing key
          ansible.builtin.get_url:
            url: https://packages.mozilla.org/apt/repo-signing-key.gpg
            dest: /etc/apt/keyrings/packages.mozilla.org.asc
            mode: "0644"
          become: true

        - name: Add Mozilla apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc]
              https://packages.mozilla.org/apt mozilla main
            state: present
            update_cache: true
          become: true

        - name: Install Firefox and dependencies
          ansible.builtin.apt:
            name:
              - firefox
              - speech-dispatcher # Required for text-to-speech
            state: latest
            install_recommends: false
            update_cache: true
          become: true

- name: Configure Firefox flatpak installation method
  when: desktop_install_firefox and not desktop_install_firefox_apt
  block:
    - name: Require flatpak
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: flatpak
            probe: flatpak --version
            hint: "It comes from this role's flatpak tag: make desktop -- --tags flatpak"

    # The pin at the top of this file prevents an install; it cannot undo one.
    - name: Remove Firefox apt package
      ansible.builtin.apt:
        name: firefox
        purge: true
        state: absent
      become: true

    - name: Install and configure Firefox flatpak for the target user
      become: true
      become_user: "{{ desktop_user }}"
      block:
        - name: Install Firefox flatpak
          community.general.flatpak:
            name: org.mozilla.firefox
            method: user

        - name: Configure Firefox cursor theme
          ansible.builtin.command: >-
            flatpak override --user --env=XCURSOR_THEME={{ desktop_cursor_theme | quote }}
            org.mozilla.firefox
          changed_when: true

# Purge any copy an earlier run installed; the pin above stays at -1. The flatpak
# removal runs as desktop_user because the install was per-user.
- name: Remove Firefox
  when: not desktop_install_firefox
  block:
    - name: Remove Firefox flatpak
      become: true
      become_user: "{{ desktop_user }}"
      community.general.flatpak:
        name: org.mozilla.firefox
        method: user
        state: absent
      when: desktop_firefox_flatpak_bin.rc == 0

    - name: Remove Firefox apt package
      ansible.builtin.apt:
        name: firefox
        purge: true
        state: absent
      become: true
