---
# apt.yml installs flameshot everywhere; only tiling hosts need a unit, flameshot
# binding to the watcher present at start and never re-registering, so PartOf is
# what returns the icon after eww restarts. The dotfiles' autostart entry is the
# other launcher, and its NotShowIn must list every environment given a unit here.
- name: Configure flameshot service
  block:
    # eww.yml creates this too, but --tags flameshot skips eww.yml.
    - name: Create the local systemd user unit directory
      ansible.builtin.file:
        path: /usr/local/lib/systemd/user
        state: directory
        mode: "0755"
      become: true

    - name: Install flameshot.service
      ansible.builtin.copy:
        dest: /usr/local/lib/systemd/user/flameshot.service
        mode: "0644"
        content: |
          [Unit]
          Description=Flameshot screenshot tool
          Documentation=https://flameshot.org/
          PartOf=eww.service
          After=eww.service

          [Service]
          Type=exec
          # eww.service is "started" before its systray claims the watcher name, so
          # wait for the name; a timeout fails the unit rather than losing the icon.
          ExecStartPre=/usr/bin/gdbus wait --session --timeout 10 org.kde.StatusNotifierWatcher
          ExecStart=/usr/bin/flameshot
          Slice=session.slice

          [Install]
          WantedBy=eww.service
      notify: Restart flameshot
      become: true

    - name: Enable flameshot service
      ansible.builtin.systemd_service:
        name: flameshot.service
        daemon_reload: true
        enabled: true
        scope: user
        state: started
      become: true
      become_user: "{{ desktop_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
