---
# apt_tiling.yml installs flameshot on the tiling hosts; only they need a unit, flameshot
# binding to the watcher present at start and never re-registering, so PartOf is
# what returns the icon after eww restarts. The dotfiles' autostart entry is the
# other launcher, and its NotShowIn must list every environment given a unit here.
- name: Configure flameshot service
  block:
    # eww.yml creates this too, but --tags flameshot skips eww.yml.
    - name: Create the local systemd user unit directory
      ansible.builtin.file:
        path: /usr/local/lib/systemd/user
        state: directory
        mode: "0755"
      become: true

    - name: Install flameshot.service
      ansible.builtin.copy:
        dest: /usr/local/lib/systemd/user/flameshot.service
        mode: "0644"
        content: |
          [Unit]
          Description=Flameshot screenshot tool
          Documentation=https://flameshot.org/
          PartOf=eww.service
          After=eww.service

          [Service]
          Type=exec
          # eww.service is "started" before its systray claims the watcher name, so
          # wait for the name; a timeout fails the unit rather than losing the icon.
          ExecStartPre=/usr/bin/gdbus wait --session --timeout 10 org.kde.StatusNotifierWatcher
          ExecStart=/usr/bin/flameshot
          Slice=session.slice

          [Install]
          WantedBy=eww.service
      notify: Restart flameshot
      become: true

    # Symlinking works with the user manager down, so the unit activates at next login
    # either way; the task below starts it now when a session is present.
    - name: Create the wants directory for flameshot.service
      ansible.builtin.file:
        path: "{{ desktop_user_home }}/.config/systemd/user/eww.service.wants"
        state: directory
        mode: "0755"
      when: desktop_user_home_mounted | bool
      become: true
      become_user: "{{ desktop_user }}"

    - name: Enable flameshot service
      ansible.builtin.file:
        src: /usr/local/lib/systemd/user/flameshot.service
        dest: "{{ desktop_user_home }}/.config/systemd/user/eww.service.wants/flameshot.service"
        state: link
        # state=link rejects an absent src before check mode is considered, and the unit file
        # above is a no-op under --check. force skips that test, so a dry run reports the missing
        # symlink instead of failing; a real run always has the unit, written immediately above.
        force: true
      when: desktop_user_home_mounted | bool
      become: true
      become_user: "{{ desktop_user }}"

    - name: Start flameshot service in the active session
      ansible.builtin.systemd_service:
        name: flameshot.service
        daemon_reload: true
        scope: user
        state: started
      become: true
      become_user: "{{ desktop_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
      when: desktop_user_systemd.stat.exists
