---
- name: Remove system packages replaced by flatpak
  become: true
  block:
    - name: Purge packages replaced by flatpak
      ansible.builtin.apt:
        name: "{{ desktop_apt_pinned_packages }}"
        autoremove: true
        purge: true
        state: absent

    # A pin, not a dpkg hold: dpkg discards a hold for an unknown package, and the
    # pin also blocks these as dependencies and has dist-upgrade remove them.
    - name: Pin packages replaced by flatpak
      ansible.builtin.copy:
        content: |
          Package: {{ desktop_apt_pinned_packages | join(' ') }}
          Pin: release a=*
          Pin-Priority: -1
        dest: /etc/apt/preferences.d/flatpak-replacements
        mode: "0644"

- name: Configure flatpak
  block:
    - name: Install flatpak packages
      ansible.builtin.apt:
        name:
          - flatpak
          - flatpak-builder
        state: latest
        install_recommends: false
      become: true

    - name: Install and configure flatpak applications for the target user
      become: true
      become_user: "{{ desktop_user }}"
      block:
        - name: Add flathub repository
          community.general.flatpak_remote:
            name: flathub
            flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
            method: user

        # No org.gtk.Gtk3theme extensions: flathub's names do not always match the
        # host's theme. theme.yml copies the host's own into ~/.themes.
        - name: Install flatpak applications
          community.general.flatpak:
            name: "{{ desktop_flatpak_apps }}"
            method: user

        # An override is a file of its own, so one is written whether or not the
        # application it names is installed.
        - name: Configure flatpak application permissions
          ansible.builtin.command:
            argv: "{{ ['flatpak', 'override', '--user'] + desktop_flatpak_grants + [item] }}"
          vars:
            # The blanket grants plus this application's own; either may be absent.
            desktop_flatpak_grants: >-
              {{ (desktop_flatpak_overrides['default'] | default([]))
                 + (desktop_flatpak_overrides[item] | default([])) }}
          loop: "{{ desktop_flatpak_apps }}"
          changed_when: true

        - name: Uninstall the flatpak applications this host has turned off
          community.general.flatpak:
            name: "{{ desktop_flatpak_removed_apps }}"
            method: user
            state: absent
          when: desktop_flatpak_removed_apps | length > 0

        # An override is a file of its own and outlives the application it names.
        - name: Remove the permission overrides of the uninstalled applications
          ansible.builtin.file:
            path: "{{ desktop_user_home }}/.local/share/flatpak/overrides/{{ item }}"
            state: absent
          loop: "{{ desktop_flatpak_removed_apps }}"

        # A flag turned off leaves nothing behind, the application's own settings and state
        # included. Nothing else writes here, flatpak giving each application its own tree.
        - name: Remove the data directories of the uninstalled applications
          ansible.builtin.file:
            path: "{{ desktop_user_home }}/.var/app/{{ item }}"
            state: absent
          loop: "{{ desktop_flatpak_removed_apps }}"

        # Most of what an uninstalled application cost on disk is its runtime. --unused takes
        # only what nothing installed still needs. LC_ALL pins the locale, the report
        # below being matched as text.
        - name: Remove the flatpak runtimes nothing installed still needs
          ansible.builtin.command:
            argv:
              [
                flatpak,
                uninstall,
                --user,
                --unused,
                --assumeyes,
                --noninteractive,
              ]
          environment:
            LC_ALL: C
          register: desktop_flatpak_unused
          changed_when: "'Nothing unused' not in desktop_flatpak_unused.stdout"
