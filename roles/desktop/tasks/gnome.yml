---
# install_recommends is false to keep snapd and the Firefox snap out. GNOME 49+ is
# Wayland-only, so no xserver-xorg; X11 apps run under XWayland, which GNOME pulls in.
- name: Install GNOME desktop
  ansible.builtin.apt:
    name:
      - ubuntu-desktop-minimal
    state: present
    install_recommends: false
    update_cache: true
  become: true

# Only Recommends of ubuntu-desktop-minimal, installed above with recommends off.
- name: Install GNOME applications
  ansible.builtin.apt:
    name:
      - baobab
      - gnome-calculator
      - gnome-clocks
      - gnome-disk-utility
      - gnome-font-viewer
      - gnome-system-monitor
      - gnome-text-editor
      - loupe
      - seahorse
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Enable gdm3 display manager
  ansible.builtin.systemd_service:
    name: gdm3
    daemon_reload: true
    enabled: true
    masked: false
  become: true
