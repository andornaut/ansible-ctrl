---
# install_recommends is false to keep snapd and the Firefox snap out. GNOME 49+ is
# Wayland-only, so no xserver-xorg; X11 apps run under XWayland, which GNOME pulls in.
- name: Install GNOME desktop
  ansible.builtin.apt:
    name:
      - ubuntu-desktop-minimal
    state: present
    install_recommends: false
    update_cache: true
  become: true

# Only Recommends of ubuntu-desktop-minimal, installed above with recommends off.
- name: Install GNOME applications
  ansible.builtin.apt:
    name:
      - gnome-calculator
      - gnome-disk-utility
      - gnome-system-monitor
      - gnome-text-editor
      - loupe
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# Also under display-manager, which masks every other manager and would otherwise leave a
# gnome host with none enabled.
- name: Enable gdm3 display manager
  tags: display-manager
  ansible.builtin.systemd_service:
    name: gdm3
    daemon_reload: true
    enabled: true
    masked: false
  become: true

# polkitd watches rules.d, so the rule applies on write; gnome-shell re-asks logind on its
# next session-state change, a lock or unlock included.
- name: Keep Power Off and Restart on the lock screen while another user has a session
  ansible.builtin.copy:
    src: 50-ansible-role-desktop-lock-screen-power.rules
    dest: /etc/polkit-1/rules.d/50-ansible-role-desktop-lock-screen-power.rules
    mode: "0644"
  become: true
