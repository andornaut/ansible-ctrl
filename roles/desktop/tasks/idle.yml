---
# Blanking, locking and monitor power-off: one policy, three mechanisms. See the
# README for which timeouts each honours.
#
# Files that may be dotfiles symlinks take blockinfile/lineinfile, which resolve the
# link where template/copy would corrupt the repo tree. idle_check_dotfile.yml
# fails first on a dangling one.

- name: Validate idle timeouts
  ansible.builtin.assert:
    that:
      # Zero disables the screensaver outright, so the session never locks.
      - desktop_screen_blank_minutes | int > 0
      - desktop_screen_lock_minutes | int >= desktop_screen_blank_minutes | int
      - desktop_screen_off_minutes | int >= desktop_screen_lock_minutes | int
    fail_msg: >-
      Idle timeouts must satisfy 0 < desktop_screen_blank_minutes
      ({{ desktop_screen_blank_minutes }}) <= desktop_screen_lock_minutes
      ({{ desktop_screen_lock_minutes }}) <= desktop_screen_off_minutes
      ({{ desktop_screen_off_minutes }}).
    success_msg: >-
      Screen blanks after {{ desktop_screen_blank_minutes }}m, locks after
      {{ desktop_screen_lock_minutes }}m, monitor powers off after
      {{ desktop_screen_off_minutes }}m

# Four keys, not lock-enabled alone: a screensaver that does not activate on idle never
# reaches the lock, and the lockdown key forbids one outright. Neither is visible from
# lock-enabled, so a host with it set can still be leaving the session open. The timeouts
# belong to the same guarantee rather than beside it: idle-delay at 0 disables the
# screensaver, so the session never locks, and a long lock-delay leaves it unlocked for
# that long after it blanks.
#
# System-wide and locked, not written into desktop_user's database: every account that logs
# into GNOME gets the policy and none can turn it off, where a per-account write reaches one
# account and reports converged beside another whose session never locks. The lock is also
# what keeps the host's value authoritative, an unlocked default sitting underneath whatever
# an account has already set.
- name: Guarantee the GNOME lock and idle policy for every account
  when: desktop_environment == "gnome"
  become: true
  block:
    - name: Create the system dconf database
      ansible.builtin.include_tasks: dconf_local_db.yml

    - name: Set the lock and idle policy
      ansible.builtin.template:
        src: dconf-idle.j2
        dest: /etc/dconf/db/local.d/00-idle
        mode: "0644"
      notify: Update dconf database

    - name: Pin the lock and idle policy against a per-account override
      ansible.builtin.template:
        src: dconf-idle-locks.j2
        dest: /etc/dconf/db/local.d/locks/00-idle
        mode: "0644"
      notify: Update dconf database

- name: Configure bspwm idle timeouts
  when: desktop_environment == "bspwm"
  block:
    # Role-owned, not a dotfile: it carries per-host timeouts.
    - name: Install the xsecurelock session script
      ansible.builtin.template:
        src: xsecurelock-session.j2
        dest: "{{ desktop_xsecurelock_session }}"
        owner: root
        group: root
        mode: "0755"
      become: true

    # An autostart entry, not a --user unit: user@.service is outside the logind
    # session scope, and xss-lock there ignores the session's Lock signal.
    - name: Configure the xss-lock autostart entry
      become: true
      become_user: "{{ desktop_user }}"
      block:
        - name: Create the autostart directory
          ansible.builtin.file: # noqa: risky-file-permissions
            path: "{{ desktop_xss_lock_autostart | dirname }}"
            state: directory

        - name: Install the xss-lock autostart entry
          ansible.builtin.template:
            src: xss-lock.desktop.j2
            dest: "{{ desktop_xss_lock_autostart }}"
            mode: "0644"

- name: Configure niri idle timeouts
  when: desktop_environment == "niri"
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Check the hypridle configuration
      ansible.builtin.include_tasks: idle_check_dotfile.yml
      vars:
        idle_dotfile_path: "{{ desktop_hypridle_conf }}"

    - name: Create the hypr configuration directory
      ansible.builtin.file: # noqa: risky-file-permissions
        path: "{{ desktop_hypridle_conf | dirname }}"
        state: directory

    # eww closes its windows when the monitor powers off, so the template reopens
    # the bar on resume: https://github.com/elkowar/eww/issues/477
    - name: Configure hypridle
      ansible.builtin.blockinfile:
        path: "{{ desktop_hypridle_conf }}"
        block: "{{ lookup('ansible.builtin.template', 'hypridle.conf.j2') }}"
        create: true
        mode: "0644"
      notify: Restart hypridle

# xss-lock sets the session idle hint at blank time; this drop-in tells logind what
# to do about it. Unset writes nothing; 0 writes IdleAction=ignore.
- name: Configure bspwm idle suspend
  when:
    - desktop_environment == "bspwm"
    - desktop_suspend_inactive_managed
  become: true
  block:
    # The drop-in gets suspend minus blank, which must be positive:
    # IdleActionSec=0 means "no idle action".
    - name: Assert that idle suspend outlasts screen blanking
      ansible.builtin.assert:
        that:
          - desktop_suspend_inactive_minutes | int == 0
            or desktop_suspend_inactive_minutes | int > desktop_screen_blank_minutes | int
        fail_msg: >-
          desktop_suspend_inactive_minutes ({{ desktop_suspend_inactive_minutes }}) must be 0
          or greater than desktop_screen_blank_minutes ({{ desktop_screen_blank_minutes }}) on
          a bspwm host: logind starts counting when xss-lock marks the session idle, which is
          when the screen blanks.
        success_msg: >-
          {{ (desktop_suspend_inactive_minutes | int > 0)
             | ternary('Suspends after ' ~ desktop_suspend_inactive_minutes ~ 'm idle',
                       'Idle suspend disabled') }}

    - name: Create the logind drop-in directory
      ansible.builtin.file:
        path: "{{ desktop_logind_idle_action_conf | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure the logind idle action
      ansible.builtin.template:
        src: logind-idle-action.conf.j2
        dest: "{{ desktop_logind_idle_action_conf }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd-logind

# A permanent off switch, not a migration: logind applies the drop-in to every
# session, so a host that leaves bspwm would keep suspending to an unmanaged policy.
# The niri hypridle block needs none: it is inert off niri, and may be a shared dotfile.
- name: Remove the bspwm idle configuration
  when: desktop_environment != "bspwm"
  become: true
  block:
    - name: Remove the xsecurelock session script
      ansible.builtin.file:
        path: "{{ desktop_xsecurelock_session }}"
        state: absent

    - name: Remove the xss-lock autostart entry
      ansible.builtin.file:
        path: "{{ desktop_xss_lock_autostart }}"
        state: absent
      become: true
      become_user: "{{ desktop_user }}"

    - name: Remove the logind idle action
      ansible.builtin.file:
        path: "{{ desktop_logind_idle_action_conf }}"
        state: absent
      notify: Reload systemd-logind

# The same permanent off switch as above, for a stronger reason: a leftover default is a
# value an account can change, but a leftover lock makes the key unwritable and is reachable
# only by deleting the file.
- name: Remove the GNOME lock and idle policy
  when: desktop_environment != "gnome"
  become: true
  block:
    - name: Remove the lock and idle policy and its lock file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/dconf/db/local.d/00-idle
        - /etc/dconf/db/local.d/locks/00-idle
      notify: Update dconf database

# Last, so its assert reads the timeouts the blocks above have already validated.
- name: Configure the idle backstop
  ansible.builtin.import_tasks: idle_backstop.yml
