---
# The floor under idle.yml's policy, for the case an application holds an idle inhibitor.
# Which tools each environment reads and powers the panel down with is in README.md.

# Only the blank timeout bounds this. desktop_suspend_inactive_minutes does not: an idle
# inhibitor defers idle suspend as surely as it defers blanking, so a backstop above the
# suspend timeout still fires in the one case suspend cannot, and stays out of the way when
# nothing inhibits and the host suspends first.
- name: Validate the idle backstop timeout
  ansible.builtin.assert:
    that:
      - desktop_idle_backstop_minutes | int > desktop_screen_blank_minutes | int
      - desktop_idle_backstop_minutes | int > 0
    fail_msg: >-
      desktop_idle_backstop_minutes ({{ desktop_idle_backstop_minutes }}) must be above 0 and
      above desktop_screen_blank_minutes ({{ desktop_screen_blank_minutes }}). Below the
      blank timeout it would pre-empt the session's own blanking rather than floor it.
    success_msg: >-
      Display powers down after {{ desktop_idle_backstop_minutes }}m of input idle through
      "{{ desktop_idle_backstop_mechanism }}", whatever inhibits it

# Before the backstop, which exits and waits for a restart while the stamp is missing.
- name: Install the idle input reader
  become: true
  block:
    - name: Install the idle input reader command
      ansible.builtin.copy:
        src: desktop-idle-input.py
        dest: "{{ desktop_idle_input_command }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart the idle input reader

    - name: Install the idle input reader service
      ansible.builtin.template:
        src: desktop-idle-input.service.j2
        dest: "{{ desktop_idle_input_unit }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the idle input reader

    - name: Enable the idle input reader service
      ansible.builtin.systemd_service:
        name: desktop-idle-input.service
        daemon_reload: true
        enabled: true
        state: started

- name: Install the idle backstop
  become: true
  block:
    # ddcutil ships the modules-load.d entry that loads i2c-dev and the udev rule that grants
    # the logged-in user the bus, so the backstop needs no root and no group of its own.
    - name: Install the idle backstop packages
      ansible.builtin.apt:
        name: >-
          {{ {"ddc": ["ddcutil"]}.get(desktop_idle_backstop_mechanism, []) }}
        state: latest
        install_recommends: false
        update_cache: true

    # Role-owned, not a dotfile: it carries the host's threshold and its mechanism.
    - name: Install the idle backstop command
      ansible.builtin.template:
        src: desktop-idle-backstop.j2
        dest: "{{ desktop_idle_backstop_command }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart the idle backstop

    # eww.yml and flameshot.yml create this too, but --tags idle skips both.
    - name: Create the local systemd user unit directory
      ansible.builtin.file:
        path: "{{ desktop_idle_backstop_unit | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the idle backstop service
      ansible.builtin.template:
        src: desktop-idle-backstop.service.j2
        dest: "{{ desktop_idle_backstop_unit }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the idle backstop

    - name: Enable and start desktop-idle-backstop.service
      ansible.builtin.include_tasks: enable_user_unit.yml
      vars:
        desktop_enable_unit: desktop-idle-backstop.service
        desktop_enable_unit_wanted_by: graphical-session.target
