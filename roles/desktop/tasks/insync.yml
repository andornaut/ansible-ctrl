---
- name: Configure Insync repository
  block:
    # By full fingerprint, the one https://www.insynchq.com/downloads/linux publishes: a
    # short key ID is a search that any key colliding on its last 32 bits also answers.
    - name: Download Insync apt signing key
      ansible.builtin.get_url:
        url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xAEEB94E9C5A3B54ECFA4A66AA684470CACCAF35C
        dest: /etc/apt/keyrings/insync.asc
        mode: "0644"
      register: desktop_insync_key_download
      retries: 3
      delay: 5
      until: desktop_insync_key_download is succeeded
      become: true

    - name: Add Insync apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/insync.asc]
          http://apt.insync.io/ubuntu {{ ansible_facts['distribution_release'] }} non-free contrib
        mode: "0644"
        filename: insync
        update_cache: true
      become: true

- name: Install and configure Insync
  become: true
  block:
    - name: Install Insync package
      ansible.builtin.apt:
        name: insync
        state: latest
        install_recommends: false

    - name: Fix Wayland compatibility
      # Insync's bundled libwayland-client is too old for the amdgpu libEGL under
      # Wayland: "undefined symbol: wl_display_create_queue_with_name".
      ansible.builtin.file:
        path: /usr/lib/insync/libwayland-client.so.0
        state: absent

    - name: Write insync.desktop with Wayland compatibility fix
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Insync
          GenericName=Insync
          Comment=Launch Insync
          Icon=insync
          Categories=Network;
          # https://forums.insynchq.com/t/insync-3-9-4-fails-to-load-on-ubuntu-24-04-2-lts-addressed/36032/5
          Exec=insync start --qt-qpa-platform=xcb
          TryExec=insync
          Terminal=false
        dest: /usr/share/applications/insync.desktop
        mode: "0644"
