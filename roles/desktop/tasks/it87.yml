---
# ITE IT8696E + IT8883 Super I/O driver for Gigabyte AM5 boards. The mainline it87
# driver does not cover these chips, so the fan pwm/hwmon CoolerControl manages
# needs this out-of-tree fork: https://github.com/frankcrawford/it87
- name: Install it87 fan control driver
  become: true
  when: desktop_install_it87
  block:
    - name: Install it87 DKMS build prerequisites
      ansible.builtin.apt:
        name:
          - build-essential
          - dkms
          - git
          - "linux-headers-{{ ansible_facts['kernel'] }}"
        state: present
        update_cache: true

    - name: Clone it87 driver source
      ansible.builtin.git:
        repo: "{{ desktop_it87_repo }}"
        dest: /usr/src/it87
        version: "{{ desktop_it87_version }}"
      register: desktop_it87_source

    # The checkout arrives at the run's umask. Additive, so nothing the checkout chose is
    # taken away and a run that has nothing to open reports no change; capital X grants
    # execute only where the checkout already had it.
    #
    # This reaches /usr/src/it87 alone. The dkms target below stages a second copy under
    # /usr/src/it87-<version>, and that task is gated on the checkout having moved, so a
    # host whose staged copy was written under a closing umask keeps it until the next
    # build re-stages it. dkms reads that copy as root either way.
    - name: Let every account read the it87 source
      ansible.builtin.file:
        path: /usr/src/it87
        state: directory
        recurse: true
        mode: a+rX

    - name: Check whether it87 is registered with DKMS for the running kernel
      ansible.builtin.command: dkms status it87 -k {{ ansible_facts['kernel'] }}
      register: desktop_it87_dkms
      changed_when: false

    # The "dkms" target stages /usr/src/it87-<version>, then dkms add/build/install.
    - name: Build and install it87 via DKMS
      ansible.builtin.command:
        cmd: make dkms
        chdir: /usr/src/it87
      when: desktop_it87_source.changed or "installed" not in desktop_it87_dkms.stdout
      changed_when: true

    - name: Configure it87 module options
      ansible.builtin.copy:
        dest: /etc/modprobe.d/ansible-role-desktop-it87.conf
        content: "options it87 force_id=0x8696,0x8883 ignore_resource_conflict=1\n"
        mode: "0644"

    # Probing at systemd-modules-load time fails with ENODEV, so load it later,
    # with retries, before CoolerControl reads the hwmon.
    - name: Install the it87 load unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/it87.service
        content: |
          [Unit]
          Description=Load the it87 Super I/O driver
          After=sysinit.target
          Before=coolercontrold.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'for _ in 1 2 3 4 5 6; do modprobe it87 && exit 0; sleep 5; done; exit 1'

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Enable and start it87.service
      ansible.builtin.systemd_service:
        name: it87.service
        daemon_reload: true
        enabled: true
        state: started

# Remove the managed drop-ins so the module options do not outlive the flag. The
# DKMS module and it87.service stay; a full teardown is out of scope.
- name: Remove the it87 module options when disabled
  become: true
  when: not desktop_install_it87
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/modprobe.d/ansible-role-desktop-it87.conf
