---
- name: Install LACT
  vars:
    desktop_lact_ubuntu: "{{ ansible_facts['distribution_version'] | replace('.', '') }}"
    desktop_lact_urls: >-
      {{ desktop_lact_release.assets
      | selectattr('name', 'match', 'lact-.*\.amd64\.ubuntu-' ~ desktop_lact_ubuntu ~ '\.deb')
      | rejectattr('name', 'match', 'lact-headless-.*')
      | map(attribute='browser_download_url') | list }}
  block:
    - name: Get latest LACT release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: ilya-zlobintsev/LACT
        release_fact: desktop_lact_release

    - name: Require a LACT package for this Ubuntu release
      ansible.builtin.assert:
        that: desktop_lact_urls | length > 0
        fail_msg: >-
          LACT {{ desktop_lact_release.tag_name }} publishes no lact-*.amd64.ubuntu-{{
          desktop_lact_ubuntu }}.deb for Ubuntu {{ ansible_facts["distribution_version"] }}.
        quiet: true

    - name: Set LACT download URL fact
      ansible.builtin.set_fact:
        desktop_lact_download_url: "{{ desktop_lact_urls | first }}"

    # Run under --check too: apt's deb: downloads the package before it compares versions,
    # so without this every run fetches it again.
    - name: Check the installed LACT version
      ansible.builtin.command: dpkg-query -W -f='${Status} ${Version}' lact
      register: desktop_lact_installed
      failed_when: false
      changed_when: false
      check_mode: false
      become: false

    # The asset is named lact-<version>.amd64.ubuntu-<release>.deb, <version> being the
    # package's own. A name that does not parse falls through to the install.
    - name: Install LACT package
      ansible.builtin.apt:
        deb: "{{ desktop_lact_download_url }}"
        install_recommends: false
        update_cache: true
      become: true
      when: >-
        desktop_lact_installed.stdout !=
        'install ok installed ' ~ (desktop_lact_download_url | basename
        | regex_replace('^lact-(.*)\\.amd64\\.ubuntu-.*\\.deb$', '\\1'))

    - name: Enable and start lactd
      ansible.builtin.systemd_service:
        name: lactd.service
        daemon_reload: true
        enabled: true
        state: started
      become: true
