---
- name: Install and configure lemurs display manager
  block:
    - name: Install lemurs dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - curl
          - libpam0g-dev
          - libxcb-xkb-dev
          - libxcb1-dev
          - pkg-config
        state: latest
        install_recommends: false
        update_cache: true
      become: true

    - name: Install lemurs
      become: true
      block:
        - name: Create a temporary directory
          ansible.builtin.tempfile:
            state: directory
          register: desktop_lemurs_tmp
          check_mode: false

        - name: Get latest lemurs release
          ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
          vars:
            release_repo: coastalwhite/lemurs
            release_fact: desktop_lemurs_release

        - name: Set lemurs version fact
          ansible.builtin.set_fact:
            desktop_lemurs_version: "{{ desktop_lemurs_release.tag_name }}"

        - name: Download lemurs binary
          ansible.builtin.get_url:
            url: >-
              https://github.com/coastalwhite/lemurs/releases/download/{{ desktop_lemurs_version
              }}/lemurs-x86_64-unknown-linux-gnu.tar.xz
            dest: "{{ desktop_lemurs_tmp.path }}/lemurs.tar.xz"
            mode: "0644"
          register: desktop_lemurs_download
          # This and the extraction write only to the temporary directory. Under --check
          # neither would, and the copy below would have no binary to compare.
          check_mode: false
          retries: 3
          delay: 5
          until: desktop_lemurs_download is succeeded

        - name: Extract lemurs binary
          ansible.builtin.unarchive:
            src: "{{ desktop_lemurs_tmp.path }}/lemurs.tar.xz"
            dest: "{{ desktop_lemurs_tmp.path }}"
            remote_src: true
          check_mode: false

        - name: Install lemurs binary
          ansible.builtin.copy:
            src: "{{ desktop_lemurs_tmp.path }}/lemurs-x86_64-unknown-linux-gnu/lemurs"
            dest: /usr/local/bin/lemurs
            mode: "0755"
            remote_src: true
      always:
        - name: Remove the temporary directory
          ansible.builtin.file:
            path: "{{ desktop_lemurs_tmp.path }}"
            state: absent
          when: desktop_lemurs_tmp.path is defined
          # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
          check_mode: false

    - name: Configure lemurs
      block:
        - name: Create lemurs configuration directory
          ansible.builtin.file:
            path: /etc/lemurs
            state: directory
            mode: "0755"
          become: true

        - name: Download default lemurs configuration
          ansible.builtin.get_url:
            url: "https://raw.githubusercontent.com/coastalwhite/lemurs/{{ desktop_lemurs_version }}/extra/config.toml"
            dest: "/etc/lemurs/config.toml"
            mode: "0644"
          register: desktop_lemurs_config_download
          retries: 3
          delay: 5
          until: desktop_lemurs_config_download is succeeded
          become: true

        - name: Override configuration settings
          ansible.builtin.lineinfile:
            path: /etc/lemurs/config.toml
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
          loop:
            - regexp: '^xsessions_path\s*=.*'
              line: 'xsessions_path = "/usr/local/share/xsessions"'
            - regexp: '^wayland_sessions_path\s*=.*'
              line: 'wayland_sessions_path = "/usr/local/share/wayland-sessions"'
            - regexp: '^system_shell\s*=.*'
              line: 'system_shell = "/bin/bash"'
          become: true

        # /usr/local, the admin's unit directory: /usr/lib belongs to dpkg.
        - name: Create the local systemd unit directory
          ansible.builtin.file:
            path: /usr/local/lib/systemd/system
            state: directory
            mode: "0755"
          become: true

        - name: Download lemurs systemd service
          ansible.builtin.get_url:
            url: >-
              https://raw.githubusercontent.com/coastalwhite/lemurs/{{ desktop_lemurs_version
              }}/extra/lemurs.service
            dest: /usr/local/lib/systemd/system/lemurs.service
            mode: "0644"
          register: desktop_lemurs_service_download
          retries: 3
          delay: 5
          until: desktop_lemurs_service_download is succeeded
          become: true

        - name: Update ExecStart path in service file
          ansible.builtin.lineinfile:
            path: /usr/local/lib/systemd/system/lemurs.service
            regexp: '^ExecStart\s*=.*'
            line: "ExecStart=/usr/local/bin/lemurs"
          become: true

        - name: Download xsetup.sh script
          ansible.builtin.get_url:
            url: >-
              https://raw.githubusercontent.com/coastalwhite/lemurs/{{ desktop_lemurs_version
              }}/extra/xsetup.sh
            dest: /etc/lemurs/xsetup.sh
            mode: "0755"
          register: desktop_lemurs_xsetup_download
          retries: 3
          delay: 5
          until: desktop_lemurs_xsetup_download is succeeded
          become: true

        - name: Copy lemurs.pam file to /etc/pam.d/lemurs
          ansible.builtin.copy:
            src: lemurs.pam
            dest: /etc/pam.d/lemurs
            mode: "0644"
          become: true

    # CLEANUP (added 2026-09-24): drop once every lemurs desktop has converged. The unit
    # used to be installed under /usr/lib, and its enablement symlinks, the
    # display-manager.service alias among them, point there: removing that copy without
    # re-enabling leaves the display manager dangling at the next boot.
    - name: Move the lemurs unit out of the vendor directory
      become: true
      block:
        - name: Check for the lemurs unit in the vendor directory
          ansible.builtin.stat:
            path: /usr/lib/systemd/system/lemurs.service
          register: desktop_lemurs_vendor_unit

        - name: Remove the lemurs unit from the vendor directory
          ansible.builtin.file:
            path: /usr/lib/systemd/system/lemurs.service
            state: absent
          when: desktop_lemurs_vendor_unit.stat.exists

        # reenable, which the systemd module lacks: it rewrites every symlink enable made,
        # against the unit's new path.
        - name: Re-enable lemurs against its new unit path
          ansible.builtin.command: # noqa: command-instead-of-module
            argv: [systemctl, reenable, lemurs.service]
          changed_when: true
          when: desktop_lemurs_vendor_unit.stat.exists

    - name: Enable lemurs display manager
      ansible.builtin.systemd_service:
        name: lemurs.service
        daemon_reload: true
        enabled: true
        masked: false
      become: true
