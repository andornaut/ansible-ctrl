---
# desktop_user must not derive from whoever ansible connects as, which is root
# under cron.
- name: Validate desktop_user
  ansible.builtin.assert:
    that:
      - desktop_user != "root"
    fail_msg: >-
      desktop_user resolved to "root", which would write user-scoped state to /root.
      Set primary_user in the inventory (or desktop_user in host_vars) to the target
      account.
    success_msg: 'desktop_user "{{ desktop_user }}" is valid'
  tags: always

- name: Resolve home directory for {{ desktop_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ desktop_user }}"
  tags: always

# systemctl --user reaches this socket, which exists only while the account's manager
# runs, so only while it is logged in. Every user unit here is enabled by symlink and
# started or restarted only when this finds it, converging the rest without a session.
- name: Check for a running user manager for {{ desktop_user }}
  ansible.builtin.stat:
    path: "/run/user/{{ desktop_user_uid }}/systemd/private"
  register: desktop_user_systemd
  changed_when: false
  become: true
  become_user: "{{ desktop_user }}"
  tags: always

# ecryptfs keeps its configuration beside the home rather than inside it, so this answers whether
# the home is encrypted whether or not it is mounted now. The markers inside cannot: which of them
# is visible is what the mount decides. Derived from the resolved home, never a fixed /home:
# ecryptfs-setup-private writes to $(dirname $HOME)/.ecryptfs/$USER, so a home elsewhere would
# miss the marker and this would answer "not encrypted", which is the wrong way to be wrong.
- name: Check for an encrypted home for {{ desktop_user }}
  ansible.builtin.stat:
    path: "{{ desktop_user_home | dirname }}/.ecryptfs/{{ desktop_user }}"
  register: desktop_user_home_ecryptfs
  changed_when: false
  become: true
  tags: always

# getent answers with the home's path whether or not anything is mounted there, so nothing
# below would notice: a run against a locked home writes the enable symlinks, dconf databases
# and dotfiles onto the mountpoint and reports changed, and the next login mounts over them.
# `| default([])` fails closed: without the mounts fact an encrypted home counts as unmounted.
- name: Require an encrypted home to be mounted for {{ desktop_user }}
  ansible.builtin.assert:
    that: desktop_user_home in (ansible_facts['mounts'] | default([]) | map(attribute='mount'))
    fail_msg: >-
      {{ desktop_user }}'s home is encrypted and {{ desktop_user_home }} is not mounted, so
      this host is at its login screen or the home was never unlocked. Log in as
      {{ desktop_user }}, or run ecryptfs-mount-private there, and re-run. If that account
      has no encrypted home any more, remove the stale
      {{ desktop_user_home | dirname }}/.ecryptfs/{{ desktop_user }}, which is what this reads.
    quiet: true
  when: desktop_user_home_ecryptfs.stat.exists
  tags: always

- name: Validate desktop environment
  ansible.builtin.assert:
    that:
      - desktop_environment is defined and desktop_environment in ["gnome", "niri", "bspwm"]
    fail_msg: >-
      desktop_environment must be set (no default) to "gnome", "niri", or "bspwm".
      Set it in host_vars for this host.
    success_msg: Desktop environment "{{ desktop_environment }}" is valid
  # always: desktop.yml's --tags bspwm/niri select the WM role by this variable.
  tags: always

# Here rather than in default_browser.yml, which would raise an opaque templating
# error, and only after the browser installs have purged and pinned packages.
- name: Validate default browser
  ansible.builtin.assert:
    that:
      - desktop_default_browser in ["firefox", "google-chrome"]
      - not (desktop_default_browser == "firefox" and not desktop_install_firefox | bool)
    fail_msg: >-
      desktop_default_browser must be "firefox" or "google-chrome", and cannot be
      "firefox" when desktop_install_firefox is false.
    success_msg: Default browser "{{ desktop_default_browser }}" is valid
  # Tagged browser so a --tags browser run validates the pairing first.
  tags: browser

- name: Install common system packages
  ansible.builtin.import_tasks: apt.yml

# Ahead of gnome.yml: enabling gdm3 fails while display-manager.service is an alias for
# another manager, so the tiling managers are masked and their alias removed first.
- name: Configure display manager
  tags: display-manager
  block:
    - name: Validate display manager configuration
      ansible.builtin.assert:
        that:
          - (desktop_install_ly | bool | int) + (desktop_install_lemurs | bool | int) == 1
        # Every other display manager is masked below, so none chosen boots to a console.
        fail_msg: >-
          A {{ desktop_environment }} host needs exactly one display manager: set one of
          desktop_install_ly or desktop_install_lemurs to true in host_vars.
        success_msg: Display manager configuration is valid
      when: desktop_environment != "gnome"

    # desktop_display_manager_aliases names the unit files display-manager.service may
    # point at: lemurs.service is enabled through that alias alone, and gdm3's resolves to
    # gdm.service or gdm3.service depending on the packaging.
    - name: Set the display manager to keep
      ansible.builtin.set_fact:
        desktop_display_manager: >-
          {{ 'gdm3' if desktop_environment == 'gnome'
             else 'lemurs' if desktop_install_lemurs | bool
             else 'ly@tty2' }}
        desktop_display_manager_aliases: >-
          {{ ['gdm.service', 'gdm3.service'] if desktop_environment == 'gnome'
             else ['lemurs.service'] if desktop_install_lemurs | bool
             else [] }}

    # The kept manager's aliases are excluded with it, so a gnome host keeps gdm.service.
    # A unit that is not installed is masked all the same, then fails enabled: false as
    # missing; any other failure is real, such as a unit file in /etc/systemd/system that
    # mask will not replace with its /dev/null link.
    - name: Disable other display manager services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        daemon_reload: true
        enabled: false
        masked: true
      register: desktop_display_manager_masked
      failed_when: >-
        desktop_display_manager_masked is failed
        and 'Could not find the requested service' not in desktop_display_manager_masked.msg | default('')
      loop: >-
        {{ ['gdm', 'gdm3', 'lightdm', 'lemurs', 'ly@tty2']
           | reject('in', [desktop_display_manager]
                          + desktop_display_manager_aliases | map('regex_replace', '[.]service$', '') | list)
           | list }}
      become: true

    - name: Stat display-manager.service symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/display-manager.service
        follow: false
      register: desktop_display_manager_link
      become: false

    - name: Remove display-manager.service symlink to another display manager
      ansible.builtin.file:
        path: /etc/systemd/system/display-manager.service
        state: absent
      when: >-
        desktop_display_manager_link.stat.exists
        and (desktop_display_manager_link.stat.lnk_source | default('') | basename)
        not in desktop_display_manager_aliases
      become: true

    - name: Configure the tiling display manager
      when: desktop_environment != "gnome"
      block:
        # ly and lemurs both greet on tty2, so free it before either unit is enabled.
        - name: Prevent TTY conflicts
          ansible.builtin.systemd_service:
            name: getty@tty2.service
            daemon_reload: true
            state: stopped
            enabled: false
          become: true

        - name: Install and configure lemurs display manager
          ansible.builtin.import_tasks: lemurs.yml
          when: desktop_install_lemurs | bool

        - name: Install and configure ly display manager
          ansible.builtin.import_tasks: ly.yml
          when: desktop_install_ly | bool

- name: Install GNOME desktop
  ansible.builtin.import_tasks: gnome.yml
  tags: gnome
  when: desktop_environment == "gnome"

- name: Configure common applications
  block:
    - name: Configure Alacritty
      ansible.builtin.import_tasks: alacritty.yml
      tags: alacritty

    - name: Configure Google Chrome
      ansible.builtin.import_tasks: chrome.yml
      tags: browser

    - name: Configure CoolerControl
      ansible.builtin.import_tasks: coolercontrol.yml
      tags: coolercontrol

    # Unconditional: each file gates on its own flag and removes its drop-ins when off.
    - name: Install it87 fan control driver
      ansible.builtin.import_tasks: it87.yml
      tags: it87

    - name: Install nct6687d fan control driver
      ansible.builtin.import_tasks: nct6687d.yml
      tags: nct6687d

    - name: Pin USB autosuspend off for reset-prone hubs
      ansible.builtin.import_tasks: usb_hub_autosuspend.yml
      tags: usb-autosuspend

    - name: Grant the keyboard configurator interfaces to the seat
      ansible.builtin.import_tasks: keyboard_configurator.yml
      tags: keyboard-configurator

    - name: Configure dconf
      ansible.builtin.import_tasks: dconf.yml
      tags: dconf

    # After dconf.yml, which installs the dconf-cli the folders are listed and reset with.
    - name: Configure the GNOME app grid
      ansible.builtin.import_tasks: app_grid.yml
      tags: app-grid

    - name: Configure the desktop entry overrides
      ansible.builtin.import_tasks: app_entries.yml
      tags: app-entries

    - name: Configure file-roller archive associations
      ansible.builtin.import_tasks: file_roller.yml
      tags: file-roller

    # After dconf.yml, which installs the dconf-cli that the GNOME timeouts are set with.
    - name: Configure screen blanking and locking
      ansible.builtin.import_tasks: idle.yml
      tags: idle

    # flatpak.yml must run before firefox.yml: it installs the flatpak package
    # and adds the flathub remote, which the Firefox flatpak install depends on.
    - name: Configure flatpak
      ansible.builtin.import_tasks: flatpak.yml
      tags: flatpak

    - name: Configure Firefox
      ansible.builtin.import_tasks: firefox.yml
      tags: browser

    # After chrome.yml and firefox.yml, which install the .desktop files it picks
    # between, and sharing their tag so --tags browser repoints the default.
    - name: Configure the default browser
      ansible.builtin.import_tasks: default_browser.yml
      tags: browser

    - name: Configure fonts
      ansible.builtin.import_tasks: fonts.yml
      tags: fonts

    # After dconf.yml (dconf-cli) and flatpak.yml (the theme override).
    - name: Configure GTK themes
      ansible.builtin.import_tasks: theme.yml
      tags: theme

    - name: Configure GRUB
      ansible.builtin.import_tasks: grub.yml
      tags: grub

    - name: Configure Insync
      ansible.builtin.import_tasks: insync.yml
      tags: insync
      when: desktop_install_insync | bool

    - name: Configure LACT
      ansible.builtin.import_tasks: lact.yml
      tags: lact

    - name: Configure OpenRGB
      ansible.builtin.import_tasks: openrgb.yml
      tags: openrgb
      when: desktop_install_openrgb | bool

    # No `when`: the file branches on the flag itself, so that turning it off lifts
    # the filters an earlier run enforced.
    - name: Configure parental controls
      ansible.builtin.import_tasks: parental_controls.yml
      tags: parental-controls

- name: Configure tiling window manager applications
  when: desktop_environment != "gnome"
  block:
    - name: Install tiling window manager system packages
      ansible.builtin.import_tasks: apt_tiling.yml

    - name: Configure dunst
      ansible.builtin.import_tasks: dunst.yml
      tags: dunst

    - name: Configure eww
      ansible.builtin.import_tasks: eww.yml
      tags: eww

    # After eww.yml, which installs the eww.service that flameshot.service is PartOf.
    - name: Configure flameshot
      ansible.builtin.import_tasks: flameshot.yml
      tags: flameshot

    - name: Configure pavolume
      ansible.builtin.import_tasks: pavolume.yml
      tags: pavolume

    - name: Configure rofi
      ansible.builtin.import_tasks: rofi.yml
      tags: rofi

    - name: Configure nwg-drawer
      ansible.builtin.import_tasks: nwg_drawer.yml
      tags: nwg-drawer

# Last, and unconditional: the file branches on the node list itself, so emptying it
# removes the drop-in an earlier run installed. Last because a host that asks for node
# properties its WirePlumber cannot read fails here, and that must not take the rest of
# the role with it.
- name: Suppress unusable audio nodes
  ansible.builtin.import_tasks: wireplumber.yml
  tags: wireplumber
