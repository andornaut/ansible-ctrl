---
# nwg-drawer is a fullscreen application grid: search, category buttons and one icon per
# .desktop entry, the GNOME app grid's shape for the tiling hosts. It runs resident under a
# user unit so opening it is a signal rather than a GTK start: SIGUSR1 toggles the window.
#
# Written for wlroots compositors; on an X11 session it skips layer-shell and opens an
# undecorated maximized window, which bspwm tiles unless a rule makes it fullscreen. That
# rule lives in the bspwmrc dotfile beside the sxhkd binding that sends the signal.

# The libraries nwg-drawer links against. The build dependencies below depend on them, but
# are installed only for a build.
- name: Install nwg-drawer runtime libraries
  ansible.builtin.apt:
    name:
      - libatk1.0-0t64
      - libcairo-gobject2
      - libcairo2
      - libgdk-pixbuf-2.0-0
      - libglib2.0-0t64
      - libgtk-3-0t64
      - libgtk-layer-shell0
      - libpango-1.0-0
    state: latest
    install_recommends: false
  become: true

- name: Get latest nwg-drawer release
  ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
  vars:
    release_repo: nwg-piotr/nwg-drawer
    release_fact: desktop_nwg_drawer_release

# Prints "nwg-drawer version 0.7.5", the tag without its v.
- name: Check the installed nwg-drawer version
  ansible.builtin.include_tasks: version_check.yml
  vars:
    desktop_version_check_command: [/usr/local/bin/nwg-drawer, -v]
    desktop_version_check_tag: "{{ desktop_nwg_drawer_release.tag_name }}"
    desktop_version_check_fact: desktop_nwg_drawer_outdated

# The download and the build run as the account whose Go module cache holds the
# dependencies. become_user propagates into the block, so the tasks that need root name
# it back: a bare become: true would inherit this user and fail.
- name: Build and install nwg-drawer
  when: desktop_nwg_drawer_outdated | bool
  become: true
  become_user: "{{ desktop_user }}"
  block:
    # Before the build dependencies, so a host without a toolchain fails early. The dev
    # role installs Go under /usr/local/go, which is on no service account's PATH, so the
    # probe and the build name the binary.
    - name: Require the Go toolchain
      ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
      vars:
        require_tools:
          - name: go
            probe: /usr/local/go/bin/go version
            hint: "It comes from the dev role: make dev -- --limit {{ inventory_hostname }} --tags go"

    # gotk4 is cgo over the GTK 3 headers; the layer-shell binding is a build dependency
    # even where the session is X11.
    - name: Install nwg-drawer build dependencies
      ansible.builtin.apt:
        name:
          - gcc
          - libgirepository1.0-dev
          - libgtk-3-dev
          - libgtk-layer-shell-dev
          - pkg-config
        state: latest
        install_recommends: false
        update_cache: true
      become: true
      become_user: root

    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: desktop_nwg_drawer_tmp
      check_mode: false

    # The release publishes no assets, so the tag's source archive is the download.
    - name: Download and unarchive nwg-drawer
      ansible.builtin.unarchive:
        src: "https://github.com/nwg-piotr/nwg-drawer/archive/refs/tags/{{ desktop_nwg_drawer_release.tag_name }}.tar.gz"
        dest: "{{ desktop_nwg_drawer_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1
      register: desktop_nwg_drawer_download
      retries: 3
      delay: 5
      until: desktop_nwg_drawer_download is succeeded

    # -trimpath keeps the random build directory and the account's module cache paths
    # out of the binary.
    - name: Build nwg-drawer
      ansible.builtin.command:
        cmd: /usr/local/go/bin/go build -trimpath -o bin/nwg-drawer .
        chdir: "{{ desktop_nwg_drawer_tmp.path }}"
      changed_when: true

    - name: Install nwg-drawer binary
      # --check skips the build, so there is no output to install from.
      when: not ansible_check_mode
      ansible.builtin.copy:
        src: "{{ desktop_nwg_drawer_tmp.path }}/bin/nwg-drawer"
        dest: /usr/local/bin/nwg-drawer
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart nwg-drawer
      become: true
      become_user: root

    # The program walks XDG_DATA_DIRS for a nwg-drawer/desktop-directories, and
    # /usr/local/share is in the default list. The .directory files are not copied from
    # the release: the role supplies the whole set below, and a second writer would flip
    # them on every run.
    - name: Install nwg-drawer data files
      # --check skips the build, so there is no output to install from.
      when: not ansible_check_mode
      ansible.builtin.copy:
        src: "{{ desktop_nwg_drawer_tmp.path }}/{{ item }}"
        dest: /usr/local/share/nwg-drawer/
        remote_src: true
        owner: root
        group: root
        mode: "u=rwX,go=rX"
      loop:
        - img
        - drawer.css
      notify: Restart nwg-drawer
      become: true
      become_user: root
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ desktop_nwg_drawer_tmp.path }}"
        state: absent
      when: desktop_nwg_drawer_tmp.path is defined
      become: true
      become_user: root
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false

# The drawer's categories are fixed in its code, one .directory file each, and the file
# names are its contract: utility, development, game, graphics, internet-and-network,
# office, audio-video, system-tools and other. A file under another name is never read,
# and a missing one renders a button with no label. Each file's Name is the button's
# label, and the buttons are sorted by label with "other" pinned last, so the labels set
# the order as well. Upstream's labels are the freedesktop menu spec's (Accessories,
# Programming, System Tools); these use the vocabulary of the GNOME app grid's folders
# (desktop_app_grid_folders: Utilities, System, Graphics, Office). Shared vocabulary, not
# shared contents: the drawer files by freedesktop category, the GNOME grid by the ids the
# map names. An entry whose categories match none of the buttons lands under "other",
# relabelled Hobbies, where the override maps send the electronics, FPV, CAD and 3D
# printing tools (Electronics and Engineering are freedesktop additional categories the
# drawer does not map); an entry with no Categories line at all shows under All only.
# Upstream's files carry a Name[<locale>] for every locale, so these name none.
- name: Label the drawer's categories
  ansible.builtin.copy:
    src: nwg-drawer/desktop-directories/
    dest: /usr/local/share/nwg-drawer/desktop-directories/
    mode: "0644"
  notify: Restart nwg-drawer
  become: true

- name: Configure nwg-drawer service
  block:
    # eww.yml creates this too, but --tags nwg-drawer skips eww.yml.
    - name: Create the local systemd user unit directory
      ansible.builtin.file:
        path: /usr/local/lib/systemd/user
        state: directory
        mode: "0755"
      become: true

    - name: Install nwg-drawer.service
      ansible.builtin.copy:
        dest: /usr/local/lib/systemd/user/nwg-drawer.service
        mode: "0644"
        content: |
          [Unit]
          Description=nwg-drawer application grid
          Documentation=https://github.com/nwg-piotr/nwg-drawer
          # PartOf and After only, never Requires: graphical-session.target ships
          # StopWhenUnneeded=yes, and whatever requires it is what holds it up.
          PartOf=graphical-session.target
          After=graphical-session.target

          [Service]
          Type=exec
          # Resident: the window is built once and SIGUSR1 toggles it. The terminal is what
          # a "run in terminal" entry opens in; the default is foot, which no host here has.
          ExecStart=/usr/local/bin/nwg-drawer -r -term alacritty
          Restart=on-failure
          RestartSec=2
          Slice=session.slice

          [Install]
          WantedBy=graphical-session.target
      notify: Restart nwg-drawer
      become: true

    - name: Enable and start nwg-drawer.service
      ansible.builtin.include_tasks: enable_user_unit.yml
      vars:
        desktop_enable_unit: nwg-drawer.service
        desktop_enable_unit_wanted_by: graphical-session.target
