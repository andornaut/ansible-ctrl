---
- name: Install pavolume build dependencies
  ansible.builtin.apt:
    name: libpulse-dev
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Build and install pavolume
  become: true
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: desktop_pavolume_tmp

    - name: Clone pavolume git repository
      ansible.builtin.git:
        repo: "https://github.com/andornaut/pavolume.git"
        dest: "{{ desktop_pavolume_tmp.path }}"
        depth: 1
        version: main

    - name: Build pavolume
      community.general.make:
        chdir: "{{ desktop_pavolume_tmp.path }}"

    # Not `make install`, whose `cp -p` cannot write a binary that is running: pavolume
    # runs as a daemon, so that install fails with "Text file busy" every time and leaves
    # whatever was there before. copy writes a temp file and renames over the target,
    # which the running process does not block, and names the mode rather than carrying
    # the build umask across.
    - name: Install pavolume
      ansible.builtin.copy:
        src: "{{ desktop_pavolume_tmp.path }}/pavolume"
        dest: /usr/local/bin/pavolume
        remote_src: true
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ desktop_pavolume_tmp.path }}"
        state: absent
      when: desktop_pavolume_tmp.path is defined
