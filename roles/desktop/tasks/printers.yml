---
# A driverless queue passes PDF (and JPEG) through to the printer, and a printer whose interpreter
# cannot render a document reports the job completed having printed nothing, or prints an error
# page. Each queue here is driverless with only its raster filters kept, so CUPS renders every job
# on this host and the printer receives finished pages. Each queue takes the name the print
# dialogs derive from the printer's DNS-SD name, so it shadows the driverless destination they
# would otherwise list beside it.
- name: Configure printers
  when: desktop_printers | length > 0
  # lpstat's output is compared against its English strings.
  environment:
    LC_ALL: C
  vars:
    # A PPD's filters, as the formats CUPS may hand the printer: raster only, which no printer
    # interprets, and never a passthrough of anything else.
    desktop_printers_raster_formats: image/urf|image/pwg-raster
    desktop_printers_raster: '^\*cupsFilter2: "\S+ ({{ desktop_printers_raster_formats }}) '
    desktop_printers_passthrough: '^\*cupsFilter2: "(?!\S+ ({{ desktop_printers_raster_formats }}) )'
    desktop_printers_stale: >-
      {%- set ns = namespace(stale=[]) -%}
      {%- for printer, device, filters in desktop_printers
            | zip(desktop_printers_device.results, desktop_printers_filters.results) -%}
      {%- if device.stdout != 'device for ' ~ printer.name ~ ': ' ~ printer.uri
            or filters.stdout_lines | select('match', desktop_printers_raster) | list | length == 0
            or filters.stdout_lines | select('match', desktop_printers_passthrough) | list | length > 0 -%}
      {%- set ns.stale = ns.stale + [printer] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.stale }}
  block:
    - name: Install CUPS
      ansible.builtin.apt:
        name: [cups, cups-browsed]
        update_cache: true
      become: true

    - name: Stop cups-browsed creating driverless queues
      ansible.builtin.lineinfile:
        path: /etc/cups/cups-browsed.conf
        regexp: '^CreateIPPPrinterQueues\s'
        insertafter: "^# CreateIPPPrinterQueues All"
        line: CreateIPPPrinterQueues No
      register: desktop_printers_browsed
      become: true

    - name: Find the driverless queues cups-browsed made
      ansible.builtin.command:
        argv: [lpstat, -v]
      register: desktop_printers_browsed_queues
      changed_when: false
      check_mode: false
      failed_when: false
      become: false

    # Before any queue is written: cups-browsed claims a queue under a name it made, so it replaces
    # one lpadmin rewrites and re-creates one lpadmin deletes. Stopping it deletes its queues, and
    # it starts with CreateIPPPrinterQueues No making none.
    - name: Restart cups-browsed
      ansible.builtin.systemd_service:
        name: cups-browsed.service
        state: restarted
      when: >-
        desktop_printers_browsed is changed
        or desktop_printers_browsed_queues.stdout_lines
           | select('match', '^device for (' ~ desktop_printers | map(attribute='name') | map('regex_escape') | join('|') ~ '): implicitclass://')
           | list | length > 0
      become: true

    - name: Read the installed printer queues
      ansible.builtin.command:
        argv: [lpstat, -v, "{{ item.name }}"]
      register: desktop_printers_device
      changed_when: false
      check_mode: false
      failed_when: false
      loop: "{{ desktop_printers }}"
      loop_control:
        label: "{{ item.name }}"
      become: false

    - name: Read the installed printer filters
      ansible.builtin.command:
        argv: [grep, '^\*cupsFilter2:', "/etc/cups/ppd/{{ item.name }}.ppd"]
      register: desktop_printers_filters
      changed_when: false
      check_mode: false
      failed_when: false
      loop: "{{ desktop_printers }}"
      loop_control:
        label: "{{ item.name }}"
      become: true

    - name: Report the printer queues to create
      ansible.builtin.debug:
        msg: "{{ desktop_printers_stale | map(attribute='name') | list }}"
      changed_when: true
      when: ansible_check_mode and desktop_printers_stale | length > 0

    # lpadmin -m everywhere queries the printer, so one that is off or out of reach (a laptop away
    # from home) is left for a later run rather than failing the play.
    - name: Probe the printers whose queues need creating
      ansible.builtin.wait_for:
        host: "{{ item.uri | urlsplit('hostname') }}"
        port: "{{ item.uri | urlsplit('port') | default(631, true) }}"
        timeout: 5
      register: desktop_printers_probe
      ignore_errors: true
      check_mode: false
      loop: "{{ desktop_printers_stale }}"
      loop_control:
        label: "{{ item.name }}"
      become: false

    - name: Report the printers left for a later run
      ansible.builtin.debug:
        msg: >-
          Unreachable, so their queues are not created this run:
          {{ desktop_printers_probe.results | selectattr('failed') | map(attribute='item.name') | join(', ') }}
      when: desktop_printers_probe.results | selectattr('failed') | list | length > 0

    # The live queue only ever receives the raster-only PPD: cupsd's IPP Everywhere PPD is taken
    # from a scratch queue that is never enabled. Not libcupsfilters' `driverless`, which from 2.1
    # on writes no raster filter at all for a printer that accepts PDF.
    - name: Create the printer queues
      when: not ansible_check_mode and desktop_printers_create | length > 0
      vars:
        desktop_printers_create: >-
          {{ desktop_printers_probe.results | rejectattr('failed') | map(attribute='item') | list }}
      block:
        - name: Create a temporary directory for the PPDs
          ansible.builtin.tempfile:
            state: directory
            suffix: .desktop-printers
          register: desktop_printers_tmp
          check_mode: false
          become: false

        - name: Generate the driverless PPDs in scratch queues
          ansible.builtin.command:
            argv:
              [
                lpadmin,
                -p,
                "{{ item.name }}-ppd",
                -v,
                "{{ item.uri }}",
                -m,
                everywhere,
              ]
          changed_when: false
          loop: "{{ desktop_printers_create }}"
          loop_control:
            label: "{{ item.name }}"
          become: true

        - name: Copy the driverless PPDs
          ansible.builtin.copy:
            src: "/etc/cups/ppd/{{ item.name }}-ppd.ppd"
            dest: "{{ desktop_printers_tmp.path }}/{{ item.name }}.ppd"
            remote_src: true
            mode: "0644"
          loop: "{{ desktop_printers_create }}"
          loop_control:
            label: "{{ item.name }}"
          become: true

        - name: Remove the passthrough filters from the PPDs
          ansible.builtin.lineinfile:
            path: "{{ desktop_printers_tmp.path }}/{{ item.name }}.ppd"
            regexp: "{{ desktop_printers_passthrough }}"
            state: absent
          loop: "{{ desktop_printers_create }}"
          loop_control:
            label: "{{ item.name }}"
          become: true

        - name: Find the raster filters left in the PPDs
          ansible.builtin.command:
            argv:
              [
                grep,
                -cP,
                "{{ desktop_printers_raster }}",
                "{{ desktop_printers_tmp.path }}/{{ item.name }}.ppd",
              ]
          register: desktop_printers_raster_lines
          changed_when: false
          failed_when: false
          loop: "{{ desktop_printers_create }}"
          loop_control:
            label: "{{ item.name }}"
          become: true

        - name: Refuse a PPD left with no raster filter
          ansible.builtin.assert:
            that: item.rc == 0
            fail_msg: >-
              {{ item.item.uri }} offers neither URF nor PWG raster, so its queue would have no
              filter left. Print to it through a vendor driver instead.
            quiet: true
          loop: "{{ desktop_printers_raster_lines.results }}"
          loop_control:
            label: "{{ item.item.name }}"

        - name: Install the printer queues
          ansible.builtin.command:
            argv:
              - lpadmin
              - -p
              - "{{ item.name }}"
              - -E
              - -v
              - "{{ item.uri }}"
              - -P
              - "{{ desktop_printers_tmp.path }}/{{ item.name }}.ppd"
              - -o
              - printer-is-shared=false
          changed_when: true
          loop: "{{ desktop_printers_create }}"
          loop_control:
            label: "{{ item.name }}"
          become: true
      always:
        - name: Remove the scratch queues
          ansible.builtin.command:
            argv: [lpadmin, -x, "{{ item.name }}-ppd"]
          changed_when: false
          failed_when: false
          loop: "{{ desktop_printers_create }}"
          loop_control:
            label: "{{ item.name }}"
          become: true

        - name: Remove the temporary PPD directory
          ansible.builtin.file:
            path: "{{ desktop_printers_tmp.path }}"
            state: absent
          when: desktop_printers_tmp.path is defined
          check_mode: false
          become: true

    # cupsd's live default, not printers.conf, which cupsd rewrites up to 30s later. lpstat -d
    # prefers LPDEST, PRINTER and ~/.cups/lpoptions: become drops the variables and HOME points at
    # no directory.
    - name: Read the default printer
      ansible.builtin.command:
        argv: [lpstat, -d]
      environment:
        LC_ALL: C
        HOME: /nonexistent
      register: desktop_printers_default
      changed_when: false
      failed_when: false
      check_mode: false
      become: true

    - name: Set the default printer
      ansible.builtin.command:
        argv: [lpadmin, -d, "{{ desktop_printers[0].name }}"]
      changed_when: true
      when: >-
        desktop_printers_default.stdout != 'system default destination: ' ~ desktop_printers[0].name
      become: true
