---
# The libraries rofi links against. The build dependencies below depend on them, but are
# installed only for a build.
- name: Install rofi runtime libraries
  ansible.builtin.apt:
    name:
      - libcairo2
      - libgdk-pixbuf-2.0-0
      - libglib2.0-0t64
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libstartup-notification0
      - libwayland-client0
      - libwayland-cursor0
      - libxcb-cursor0
      - libxcb-ewmh2
      - libxcb-icccm4
      - libxcb-imdkit1
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-util1
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxcb1
      - libxkbcommon-x11-0
      - libxkbcommon0
    state: latest
    install_recommends: false
  become: true

# Wayland fork: https://github.com/lbonn/rofi#wayland-support
- name: Get latest rofi release
  ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
  vars:
    release_repo: lbonn/rofi
    release_fact: desktop_rofi_release

- name: Set rofi version fact
  ansible.builtin.set_fact:
    desktop_rofi_version: "{{ desktop_rofi_release.tag_name }}"

# Prints "Version: 1.7.9+wayland1", the tag as it stands.
- name: Check the installed rofi version
  ansible.builtin.include_tasks: version_check.yml
  vars:
    desktop_version_check_command: [/usr/local/bin/rofi, -v]
    desktop_version_check_tag: "{{ desktop_rofi_version }}"
    desktop_version_check_fact: desktop_rofi_outdated

# The download, configure and build run as desktop_user; only the package installs and
# `ninja install` need root. become_user propagates into the block, so the tasks that need
# root name it back: a bare become: true would inherit this user and fail.
- name: Build and install rofi
  when: desktop_rofi_outdated | bool
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Install rofi build dependencies
      ansible.builtin.apt:
        # Every dependency() in rofi's meson.build, the ones other tasks happen to install
        # included.
        name:
          - bison
          - flex
          - libcairo2-dev
          - libgdk-pixbuf-2.0-dev
          - libglib2.0-dev
          - libpango1.0-dev
          - libstartup-notification0-dev
          - libwayland-dev
          - libxcb-cursor-dev
          - libxcb-ewmh-dev
          - libxcb-icccm4-dev
          - libxcb-imdkit-dev
          - libxcb-keysyms1-dev
          - libxcb-randr0-dev
          - libxcb-util-dev
          - libxcb-xinerama0-dev
          - libxcb-xkb-dev
          - libxkbcommon-x11-dev
          - ninja-build
          - wayland-protocols
        state: latest
        install_recommends: false
        update_cache: true
      become: true
      become_user: root

    # noble's "meson" is 1.3, too old to build rofi; it ships meson-1.5 as well,
    # which later releases do not.
    - name: Install meson
      ansible.builtin.apt:
        name: "{{ 'meson' if ansible_facts['distribution_version'] is version('25.04', '>=') else 'meson-1.5' }}"
        state: latest
        install_recommends: false
      become: true
      become_user: root

    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: desktop_rofi_tmp
      check_mode: false

    - name: Download and unarchive rofi
      ansible.builtin.unarchive:
        src: "https://github.com/lbonn/rofi/releases/download/{{ desktop_rofi_version }}/rofi-{{ desktop_rofi_version }}.tar.xz"
        dest: "{{ desktop_rofi_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1
      register: desktop_rofi_download
      retries: 3
      delay: 5
      until: desktop_rofi_download is succeeded

    - name: Configure rofi build
      ansible.builtin.command:
        cmd: meson setup build
        chdir: "{{ desktop_rofi_tmp.path }}"
      changed_when: true

    - name: Build rofi
      ansible.builtin.command:
        cmd: ninja -C build
        chdir: "{{ desktop_rofi_tmp.path }}"
      changed_when: true

    - name: Install rofi
      ansible.builtin.command:
        cmd: ninja -C build install
        chdir: "{{ desktop_rofi_tmp.path }}"
      changed_when: true
      become: true
      become_user: root
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ desktop_rofi_tmp.path }}"
        state: absent
      when: desktop_rofi_tmp.path is defined
      # Root: `ninja install` can leave root-owned files in the build tree.
      become: true
      become_user: root
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false
