---
# Required rather than skipped: the override below is the only way flatpaks get
# the theme, so skipping would leave them on Adwaita and report success.
- name: Require flatpak
  # Probed as the account whose flatpak installation the override below writes.
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Probe for flatpak
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: flatpak
            probe: flatpak --version
            hint: "It comes from this role's flatpak tag: make desktop -- --tags flatpak"

- name: Validate GTK theme
  ansible.builtin.assert:
    that:
      - desktop_gtk_theme in desktop_gtk_themes
    fail_msg: >-
      desktop_gtk_theme ("{{ desktop_gtk_theme }}") must be one of desktop_gtk_themes, the
      only themes this role installs.
    success_msg: GTK theme "{{ desktop_gtk_theme }}" is valid

- name: Install GTK theme packages
  ansible.builtin.apt:
    name: "{{ desktop_gtk_theme_packages }}"
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# /etc/xdg, not /etc/gtk-3.0, which GTK reads first but is a dpkg conffile. Only
# bspwm and niri read these; GNOME takes the dconf keys below, over XSettings.
- name: Configure the system GTK theme
  become: true
  block:
    - name: Create the system GTK configuration directories
      ansible.builtin.file:
        path: /etc/xdg/gtk-{{ item }}
        state: directory
        mode: "0755"
      loop:
        - "3.0"
        - "4.0"

    - name: Set the system GTK theme
      ansible.builtin.copy:
        content: |
          [Settings]
          gtk-theme-name = {{ desktop_gtk_theme }}
          gtk-application-prefer-dark-theme = {{ desktop_gtk_theme_prefer_dark | ternary(1, 0) }}
        dest: /etc/xdg/gtk-{{ item }}/settings.ini
        mode: "0644"
      loop:
        - "3.0"
        - "4.0"

- name: Configure the GTK theme for the target user
  become: true
  become_user: "{{ desktop_user }}"
  block:
    # Every desktop, not just GNOME: xdg-desktop-portal-gtk serves these keys as the
    # system appearance that browsers and Electron apps read.
    - name: Configure the GNOME appearance
      community.general.dconf:
        key: "{{ item.key }}"
        value: "'{{ item.value }}'"
        state: present
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ desktop_user_uid }}"
      loop:
        - key: /org/gnome/desktop/interface/gtk-theme
          value: "{{ desktop_gtk_theme }}"
        - key: /org/gnome/desktop/interface/color-scheme
          value: "{{ desktop_gtk_theme_color_scheme }}"

    - name: Create the flatpak theme directory
      ansible.builtin.file:
        path: "{{ desktop_gtk_themes_dir }}"
        state: directory
        mode: "0755"

    # Copied, not symlinked: inside the sandbox the link would resolve against the
    # flatpak runtime, which has no such theme.
    - name: Copy the GTK themes where flatpak applications can find them
      ansible.builtin.copy:
        src: /usr/share/themes/{{ item }}
        dest: "{{ desktop_gtk_themes_dir }}/"
        remote_src: true
        mode: preserve
      loop: "{{ desktop_gtk_themes }}"

    # Global, so it covers the games role's flatpaks too. GTK_THEME names the theme
    # mounted at ~/.themes; the settings portal would fall back to Adwaita on a name
    # GTK cannot resolve. `flatpak override` reports nothing, so diff `--show`.
    - name: Apply the flatpak theme override
      ansible.builtin.shell:
        cmd: |
          before="$(flatpak override --user --show)"
          flatpak override --user \
            --filesystem={{ desktop_gtk_themes_dir | quote }}:ro \
            --env=GTK_THEME={{ desktop_gtk_theme | quote }}
          after="$(flatpak override --user --show)"
          [ "${before}" = "${after}" ] || echo CHANGED
        executable: /bin/bash
      register: desktop_flatpak_theme_override
      changed_when: "'CHANGED' in desktop_flatpak_theme_override.stdout"
