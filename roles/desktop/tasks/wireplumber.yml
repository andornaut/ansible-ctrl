---
# Gated here rather than at the import, so emptying the map removes the drop-in.
# The file name carries the ansible-role marker that makes it safe to remove.
- name: Apply the WirePlumber node properties in desktop_wireplumber_node_properties
  when: desktop_wireplumber_node_properties | length > 0
  vars:
    # Empty where wireplumber is absent, or where its output carries no such line, so the
    # assertions below say which rather than raising on a match that found nothing. Two
    # components are accepted: a release that ships 0.5 rather than 0.5.0 reads the drop-in
    # directory just the same.
    desktop_wireplumber_linked: >-
      {{ (desktop_wireplumber_version.stdout | default('')
          | regex_search('Linked with libwireplumber ([0-9]+\.[0-9]+(?:\.[0-9]+)?)', '\1'))
         | default([''], true) | first }}
  block:
    # 0.5 reads /etc/wireplumber/wireplumber.conf.d; 0.4 configures the ALSA monitor through
    # Lua in main.lua.d and reads no drop-in directory at all, so the file below would be
    # written, reported changed, and never read.
    - name: Read the WirePlumber version
      ansible.builtin.command:
        argv: "{{ ['wireplumber', '--version'] }}"
      register: desktop_wireplumber_version
      changed_when: false
      # A host without wireplumber installed is one of the things the assertions below
      # report, so the missing binary must not fail the task first.
      failed_when: false
      # Reads a version and writes nothing, and the assert below needs it under --check too.
      check_mode: false
      become: false

    - name: Require WirePlumber to be installed
      ansible.builtin.assert:
        that:
          - desktop_wireplumber_linked | length > 0
        fail_msg: >-
          desktop_wireplumber_node_properties is set, but `wireplumber --version` reported
          no linked version on this host, so there is nothing here to configure:
          {{ (desktop_wireplumber_version.stdout | default('') ~ ' '
             ~ desktop_wireplumber_version.stderr | default('')) | trim }}
        quiet: true
      become: false

    - name: Require a WirePlumber that reads the drop-in directory
      ansible.builtin.assert:
        that:
          - desktop_wireplumber_linked is version('0.5', '>=')
        fail_msg: >-
          desktop_wireplumber_node_properties needs WirePlumber 0.5 or newer, which reads
          /etc/wireplumber/wireplumber.conf.d. This host has {{ desktop_wireplumber_linked }},
          which takes its ALSA monitor rules as Lua from main.lua.d and would ignore the
          drop-in while the run reported it applied. Clear the variable for this host.
        success_msg: >-
          WirePlumber {{ desktop_wireplumber_linked }} reads the drop-in directory
      become: false

    # /etc holds no drop-in directory until one is made; 0.5's packaged drop-ins are
    # under /usr/share.
    - name: Create the WirePlumber drop-in directory
      ansible.builtin.file:
        path: /etc/wireplumber/wireplumber.conf.d
        state: directory
        mode: "0755"
      become: true

    - name: Install the WirePlumber node-properties drop-in
      ansible.builtin.template:
        src: 51-ansible-role-desktop-wireplumber-node-properties.conf.j2
        dest: /etc/wireplumber/wireplumber.conf.d/51-ansible-role-desktop-wireplumber-node-properties.conf
        mode: "0644"
      become: true
      notify: Restart WirePlumber

- name: Remove the WirePlumber node-properties drop-in when the map is empty
  when: desktop_wireplumber_node_properties | length == 0
  ansible.builtin.file:
    path: /etc/wireplumber/wireplumber.conf.d/51-ansible-role-desktop-wireplumber-node-properties.conf
    state: absent
  become: true
  notify: Restart WirePlumber
