---
# The account the user-scoped tasks act on.
dev_user: "{{ primary_user }}"

# Several GB of SDK, useful only where Android apps are built.
dev_install_android_sdk: false
# Google names the command line tools archive after a build number, and offers no
# stable alias for the newest one.
dev_android_sdk_cmdline_tools_build: "13114758"
# The API level and build-tools an Android project compiles against. Both are
# what its Gradle files name, so raise them when a project does.
dev_android_sdk_platform_version: "35"
dev_android_sdk_build_tools_version: "35.0.0"
# Where Android Studio also looks, so a later IDE install finds this one.
dev_android_sdk_root: "{{ dev_user_home }}/Android/Sdk"

# Secure Boot refuses the DKMS modules until the machine owner key is enrolled.
dev_install_virtualbox: false
# Oracle publishes one apt package per minor series (virtualbox-7.2).
dev_virtualbox_version: "7.2"

# Where upstream's own installer puts it.
dev_oh_my_pi_binary_path: "{{ dev_user_home }}/.local/bin/omp"

# The cron job scans every checkout under dev_ai_attributions_src_base_dir, so
# enable it only where those checkouts are.
dev_install_ai_attributions: false
# ai-attributions cron job (see README).
dev_ai_attributions_src_base_dir: "{{ dev_user_home }}/src/github.com/andornaut"

# Schedule: daily, 04:00. An hour after ai-maintainer, so the two do not run
# together on the Sunday they share.
dev_ai_attributions_cron_minute: "0"
dev_ai_attributions_cron_hour: "4"

dev_ai_attributions_exclude_repositories: []
dev_ai_attributions_binary_path: "{{ dev_user_home }}/.local/bin/ai-attributions"

# --quiet prints nothing for a repository that found nothing, so cron mails the
# days that need an answer and no others. --agents-files opts in to the agent
# instruction file check, which the tool leaves off.
#
# --exit-code is left off deliberately. Nothing here reads the status, and a
# non-zero one is always printed with the report explaining it, so asking for a
# status would mail a notice about the same fork every morning. The mail is the
# signal: a finding prints either way.
dev_ai_attributions_scan_flags: --quiet --agents-files

# The cron job runs a coding agent against every checkout under
# dev_ai_maintainer_src_base_dir, so enable it only where those checkouts are.
dev_install_ai_maintainer: false
# ai-maintainer cron job (see README).
dev_ai_maintainer_src_base_dir: "{{ dev_user_home }}/src/github.com/andornaut/ai-maintainer"
dev_ai_maintainer_agent_command: "claude"
dev_ai_maintainer_agent_flags: "--dangerously-skip-permissions"

# Schedule: weekly, Sunday 03:00.
dev_ai_maintainer_cron_minute: "0"
dev_ai_maintainer_cron_hour: "3"
dev_ai_maintainer_cron_day: "*"
dev_ai_maintainer_cron_weekday: "0"

dev_ai_maintainer_dependency_min_age_days: 30
dev_ai_maintainer_exclude_repositories: []
dev_ai_maintainer_script_args: "--quiet"
dev_ai_maintainer_script_path: "{{ dev_user_home }}/.local/bin/ai-maintainer"

# When this project checkout exists, the role symlinks the script to it instead
# of downloading from GitHub.
dev_ai_maintainer_project_script_path: "{{ dev_ai_maintainer_src_base_dir }}/ai-maintainer"
