---
# Everything below writes under dev_user_home, so run as dev_user: the cron entry
# runs the script as that account.
#
# The staging half (tempfile, checksummed get_url, unarchive, the always: cleanup) is the
# same sequence as roles/faramir/tasks/broker.yml, which installs the other checksummed
# goreleaser release this repo consumes. Roles share no task files, so a fix to the
# retry idiom or the check_mode placement belongs in both.
- name: Install ai-attributions
  become: true
  become_user: "{{ dev_user }}"
  block:
    - name: Create the ai-attributions binary directory
      ansible.builtin.file:
        path: "{{ dev_ai_attributions_binary_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Create a temporary directory for the ai-attributions release
      ansible.builtin.tempfile:
        state: directory
      register: dev_ai_attributions_release_tmp
      check_mode: false

    - name: Download the ai-attributions release archive
      ansible.builtin.get_url:
        url: "{{ dev_ai_attributions_release_url }}/{{ dev_ai_attributions_release_archive }}"
        dest: "{{ dev_ai_attributions_release_tmp.path }}/{{ dev_ai_attributions_release_archive }}"
        # The archive and the checksums both resolve through the latest-release
        # redirect, so a download straddling a publish fails the checksum rather
        # than installing a mismatched binary.
        checksum: "sha256:{{ dev_ai_attributions_release_url }}/checksums.txt"
        mode: "0644"
      check_mode: false
      register: dev_ai_attributions_download
      until: dev_ai_attributions_download is succeeded
      retries: 3
      delay: 5

    - name: Unpack the ai-attributions binary
      ansible.builtin.unarchive:
        src: "{{ dev_ai_attributions_release_tmp.path }}/{{ dev_ai_attributions_release_archive }}"
        dest: "{{ dev_ai_attributions_release_tmp.path }}"
        remote_src: true
        # tar records a mode that extraction puts through the umask, so it is
        # set here rather than inherited.
        mode: "0755"
      check_mode: false

    # Left to run under --check, unlike the staging above: the unpacked binary is
    # really there, so the module reports whether this host's binary is stale
    # instead of skipping.
    - name: Install the ai-attributions binary
      ansible.builtin.copy:
        src: "{{ dev_ai_attributions_release_tmp.path }}/ai-attributions"
        dest: "{{ dev_ai_attributions_binary_path }}"
        remote_src: true
        mode: "0755"
  always:
    - name: Remove the temporary directory for the ai-attributions release
      ansible.builtin.file:
        path: "{{ dev_ai_attributions_release_tmp.path }}"
        state: absent
      when: dev_ai_attributions_release_tmp.path is defined
      # check_mode: false with the rest of the block, or every --check leaks an
      # unpacked archive into /tmp.
      check_mode: false
