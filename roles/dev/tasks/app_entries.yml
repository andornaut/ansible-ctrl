---
# Copied per role because roles share no task files; keep the copies in sync.
#
# Override copies of desktop entries in dev_user's ~/.local/share/applications, which every
# launcher reads ahead of the system and flatpak directories. A copy is the packaged entry
# with one field changed, so the id, Exec and actions stay whatever the package ships on each
# run; only the copies this role marks are pruned, so entries the account wrote itself stay.
- name: Configure the desktop entry overrides
  become: true
  become_user: "{{ dev_user }}"
  block:
    - name: Create the user applications directory
      ansible.builtin.file:
        path: "{{ dev_user_home }}/.local/share/applications"
        state: directory
        mode: "0755"

    - name: Write each desktop entry override
      ansible.builtin.include_tasks: app_entry_override.yml
      loop: "{{ dev_app_entry_overrides | dict2items }}"
      loop_control:
        loop_var: dev_app_entry
        label: "{{ dev_app_entry.key }}"

    - name: List the overrides this role wrote
      ansible.builtin.command:
        cmd: grep -lF "{{ dev_app_entry_marker }}" --include=*.desktop -r "{{ dev_user_home }}/.local/share/applications"
      register: dev_app_entries_written
      changed_when: false
      # grep exits 1 with no match, which is a host with no overrides yet.
      failed_when: dev_app_entries_written.rc > 1
      check_mode: false

    - name: Remove the overrides no longer named
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ dev_app_entries_written.stdout_lines | reject('in', dev_app_entry_paths) | list }}"
      vars:
        dev_app_entry_paths: >-
          {{ dev_app_entry_overrides | map('regex_replace', '^',
             dev_user_home ~ '/.local/share/applications/') | list }}
