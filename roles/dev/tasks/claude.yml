---
- name: Install Claude Code CLI
  ansible.builtin.include_tasks: install_user_cli.yml
  vars:
    dev_cli_name: Claude Code CLI
    dev_cli_bin: claude
    dev_cli_url: https://claude.ai/install.sh

- name: Install dependencies for Claude Code sandbox mode
  ansible.builtin.apt:
    name:
      - bubblewrap
      - socat
    state: latest
  become: true

# shell, not command: `command -v` is a builtin with no binary to exec.
- name: Check for VS Code
  # Reads system state and needs no privilege, so it runs as the connecting account.
  become: false
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v code
  register: dev_claude_vscode_bin
  changed_when: false
  failed_when: false

# Extensions install per user, so this has to be dev_user's.
- name: Install Claude Code VS Code extension
  ansible.builtin.command:
    cmd: code --install-extension anthropic.claude-code
  register: dev_claude_vscode_ext
  changed_when: "'successfully installed' in dev_claude_vscode_ext.stdout"
  when: dev_claude_vscode_bin.rc == 0
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

# The apt node is older than chrome-devtools-mcp's engines range, so it installs into
# dev_node_version's nvm tree and is registered by absolute path, whatever PATH Claude
# Code starts with. --isolated gives each session a throwaway Chrome profile. Without
# --enable-automation, Chrome no longer reports navigator.webdriver, which sites such as
# Amazon answer with an interstitial. The two --no flags keep page URLs and usage
# statistics from being sent to Google.
- name: Install and register chrome-devtools-mcp
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "{{ dev_claude_node_bin }}:/usr/local/bin:/usr/bin:/bin"
  vars:
    dev_claude_node_bin: "{{ dev_user_home }}/.nvm/versions/node/{{ dev_node_version }}/bin"
    dev_claude_mcp_command: "{{ dev_claude_node_bin }}/node"
    dev_claude_mcp_args:
      - "{{ dev_claude_node_bin }}/chrome-devtools-mcp"
      - --isolated
      - --ignoreDefaultChromeArg=--enable-automation
      - --no-usage-statistics
      - --no-performance-crux
  block:
    - name: Probe for Node {{ dev_node_version }}
      ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
      vars:
        require_tools:
          - name: node {{ dev_node_version }} and its npm
            probe: "{{ dev_claude_mcp_command }} --version && {{ dev_claude_node_bin }}/npm --version"
            hint: "It comes from this role's javascript tag: make dev -- --tags javascript"

    - name: Install chrome-devtools-mcp
      community.general.npm:
        name: chrome-devtools-mcp
        global: true
        state: latest
        executable: "{{ dev_claude_node_bin }}/npm"

    # add-json refuses a name that exists, so a registration whose command or args
    # differ is removed and added again.
    - name: Read the chrome-devtools MCP registration
      ansible.builtin.command:
        cmd: "{{ dev_user_home }}/.local/bin/claude mcp get chrome-devtools"
      register: dev_claude_mcp_get
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Register the chrome-devtools MCP server
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          {{ dev_user_home }}/.local/bin/claude mcp remove --scope user chrome-devtools;
          {{ dev_user_home }}/.local/bin/claude mcp add-json --scope user chrome-devtools
          {{ {'type': 'stdio', 'command': dev_claude_mcp_command, 'args': dev_claude_mcp_args} | to_json | quote }}
      changed_when: true
      when: >-
        ('Command: ' ~ dev_claude_mcp_command) not in dev_claude_mcp_get.stdout_lines | map('trim') | list
        or ('Args: ' ~ dev_claude_mcp_args | join(' ')) not in dev_claude_mcp_get.stdout_lines | map('trim') | list

# Each server runs per session as a container of its own account, reaching the
# homeautomation role's llama.cpp containers by name on its network: local-llm takes any
# model the router lists and is text only, local-embed serves embeddings, and local-vision
# reads images and PDFs under read-only mounts of its allowed roots. The image tags carry a
# hash of the Dockerfile, so editing one rebuilds it and re-registers the servers using it.
- name: Install and register the llama.cpp MCP servers
  when: dev_install_llamacpp_mcp | bool
  vars:
    dev_llamacpp_mcp_llm_image: >-
      local/mcp-ollama-vllm:{{ dev_llamacpp_mcp_llm_version }}-{{
      (lookup('ansible.builtin.file', role_path ~ '/files/mcp/local-llm/Dockerfile') | hash('sha256'))[:12] }}
    dev_llamacpp_mcp_vision_image: >-
      local/mcp-local-vision:{{ dev_llamacpp_mcp_vision_version[:12] }}-{{
      (lookup('ansible.builtin.file', role_path ~ '/files/mcp/local-vision/Dockerfile') | hash('sha256'))[:12] }}
    dev_llamacpp_mcp_images:
      - dir: local-llm
        image: "{{ dev_llamacpp_mcp_llm_image }}"
        args: { VERSION: "{{ dev_llamacpp_mcp_llm_version }}" }
      - dir: local-vision
        image: "{{ dev_llamacpp_mcp_vision_image }}"
        args: { COMMIT: "{{ dev_llamacpp_mcp_vision_version }}" }
    # /tmp is the only writable path: the root filesystem is read-only.
    dev_llamacpp_mcp_run_args:
      - run
      - --interactive
      - --rm
      - --init
      - --cap-drop=ALL
      - --security-opt=no-new-privileges:true
      - --read-only
      - --tmpfs=/tmp
      - --network={{ dev_llamacpp_mcp_network }}
    dev_llamacpp_mcp_servers:
      - name: local-llm
        account: mcp-local-llm
        uid: "{{ dev_llamacpp_mcp_llm_uid }}"
        args: >-
          {{ dev_llamacpp_mcp_run_args
             + ['--user=' ~ dev_llamacpp_mcp_llm_uid ~ ':' ~ dev_llamacpp_mcp_llm_uid,
                '--env=LOCAL_BACKEND=openai',
                '--env=LOCAL_HOST=' ~ dev_llamacpp_mcp_url,
                '--env=LOCAL_TIMEOUT=' ~ dev_llamacpp_mcp_llm_timeout,
                dev_llamacpp_mcp_llm_image] }}
      - name: local-embed
        account: mcp-local-embed
        uid: "{{ dev_llamacpp_mcp_embed_uid }}"
        args: >-
          {{ dev_llamacpp_mcp_run_args
             + ['--user=' ~ dev_llamacpp_mcp_embed_uid ~ ':' ~ dev_llamacpp_mcp_embed_uid,
                '--env=LOCAL_BACKEND=openai',
                '--env=LOCAL_HOST=' ~ dev_llamacpp_mcp_embed_url,
                '--env=LOCAL_EMBED_MODEL=' ~ dev_llamacpp_mcp_embed_model,
                '--env=LOCAL_TIMEOUT=' ~ dev_llamacpp_mcp_llm_timeout,
                dev_llamacpp_mcp_llm_image] }}
      - name: local-vision
        account: mcp-local-vision
        uid: "{{ dev_llamacpp_mcp_vision_uid }}"
        args: >-
          {{ dev_llamacpp_mcp_run_args
             + ['--user=' ~ dev_llamacpp_mcp_vision_uid ~ ':' ~ dev_llamacpp_mcp_vision_uid,
                '--env=VISION_MANAGED=0',
                '--env=VISION_SERVER_URL=' ~ dev_llamacpp_mcp_url,
                '--env=VISION_MODEL=' ~ dev_llamacpp_mcp_vision_model,
                '--env=VISION_ALLOWED_ROOTS=' ~ dev_llamacpp_mcp_vision_allowed_roots | join(':')]
             + (dev_llamacpp_mcp_vision_allowed_roots | map('regex_replace', '^(.*)$', '--volume=\1:\1:ro') | list)
             + [dev_llamacpp_mcp_vision_image] }}
  block:
    - name: Probe for docker access as {{ dev_user }}
      become: true
      become_user: "{{ dev_user }}"
      block:
        - name: Probe for docker access
          ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
          vars:
            require_tools:
              - name: docker, for {{ dev_user }}
                probe: docker info >/dev/null
                hint: "{{ dev_user }} must be in the docker group, from the docker role"

    - name: Create the MCP server accounts and build their images
      become: true
      block:
        - name: Create the MCP server groups
          ansible.builtin.group:
            name: "{{ item.account }}"
            gid: "{{ item.uid }}"
          loop: "{{ dev_llamacpp_mcp_servers }}"
          loop_control:
            label: "{{ item.account }}"

        # No home and no shell: nothing logs in as these, they only run the containers.
        - name: Create the MCP server accounts
          ansible.builtin.user:
            name: "{{ item.account }}"
            uid: "{{ item.uid }}"
            group: "{{ item.account }}"
            home: /nonexistent
            create_home: false
            shell: /usr/sbin/nologin
          loop: "{{ dev_llamacpp_mcp_servers }}"
          loop_control:
            label: "{{ item.account }}"

        # Traverse only: local-vision opens a named file that is world-readable and cannot
        # list the root itself.
        - name: Let local-vision traverse its allowed roots
          ansible.posix.acl:
            path: "{{ item }}"
            entity: mcp-local-vision
            etype: user
            permissions: x
            state: present
          loop: "{{ dev_llamacpp_mcp_vision_allowed_roots }}"

        - name: Create a temporary directory for the MCP image builds
          ansible.builtin.tempfile:
            state: directory
          register: dev_llamacpp_mcp_build_tmp
          check_mode: false

        - name: Copy the MCP Dockerfiles
          ansible.builtin.copy:
            src: mcp/{{ item.dir }}/Dockerfile
            dest: "{{ dev_llamacpp_mcp_build_tmp.path }}/{{ item.dir }}/"
            mode: "0644"
          loop: "{{ dev_llamacpp_mcp_images }}"
          loop_control:
            label: "{{ item.dir }}"

        - name: Build the MCP images
          community.docker.docker_image:
            name: "{{ item.image }}"
            source: build
            build:
              path: "{{ dev_llamacpp_mcp_build_tmp.path }}/{{ item.dir }}"
              args: "{{ item.args }}"
              pull: true
          loop: "{{ dev_llamacpp_mcp_images }}"
          loop_control:
            label: "{{ item.image }}"
      always:
        - name: Remove the MCP build directory
          ansible.builtin.file:
            path: "{{ dev_llamacpp_mcp_build_tmp.path }}"
            state: absent
          when: dev_llamacpp_mcp_build_tmp.path is defined
          check_mode: false

    - name: Register the MCP servers for {{ dev_user }}
      become: true
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_user_home }}"
      block:
        - name: Read the llama.cpp MCP registrations
          ansible.builtin.command:
            cmd: "{{ dev_user_home }}/.local/bin/claude mcp get {{ item.name }}"
          loop: "{{ dev_llamacpp_mcp_servers }}"
          loop_control:
            label: "{{ item.name }}"
          register: dev_llamacpp_mcp_get
          changed_when: false
          failed_when: false
          check_mode: false

        # add-json refuses a name that exists, so a registration whose command or args
        # differ is removed and added again.
        - name: Register the llama.cpp MCP servers
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              {{ dev_user_home }}/.local/bin/claude mcp remove --scope user {{ item.item.name }};
              {{ dev_user_home }}/.local/bin/claude mcp add-json --scope user {{ item.item.name }}
              {{ {'type': 'stdio', 'command': '/usr/bin/docker', 'args': item.item.args} | to_json | quote }}
          loop: "{{ dev_llamacpp_mcp_get.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          changed_when: true
          when: >-
            'Command: /usr/bin/docker' not in item.stdout_lines | map('trim') | list
            or ('Args: ' ~ item.item.args | join(' ')) not in item.stdout_lines | map('trim') | list

# CLEANUP (added 2026-10-22): the host installs the llama.cpp MCP servers had before they
# ran in containers. Delete once every dev host with dev_install_llamacpp_mcp has converged.
- name: Remove the host installs of the llama.cpp MCP servers
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.local/share/{{ item }}"
    state: absent
  loop:
    - mcp-ollama-vllm
    - mcp-local-vision
  become: true
  become_user: "{{ dev_user }}"

# CLEANUP (added 2026-09-24): Claude Desktop came from an unofficial apt repository whose
# key was trusted for root installs. Delete once every host in the dev group has converged.
- name: Remove Claude Desktop and its repository
  become: true
  block:
    - name: Remove Claude Desktop
      ansible.builtin.apt:
        name: claude-desktop
        state: absent
        purge: true

    - name: Remove the Claude Desktop repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dev_arch }}
          signed-by=/etc/apt/keyrings/claude-desktop.asc]
          https://pkg.claude-desktop-debian.dev stable main
        state: absent
        update_cache: true

    - name: Remove the Claude Desktop signing key
      ansible.builtin.file:
        path: /etc/apt/keyrings/claude-desktop.asc
        state: absent
