---
- name: Install Claude Code CLI
  ansible.builtin.include_tasks: install_user_cli.yml
  vars:
    dev_cli_name: Claude Code CLI
    dev_cli_bin: claude
    dev_cli_url: https://claude.ai/install.sh

# shell, not command: `command -v` is a builtin with no binary to exec.
- name: Check for VS Code
  # Reads system state and needs no privilege, so it runs as the connecting account.
  become: false
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v code
  register: dev_claude_vscode_bin
  changed_when: false
  failed_when: false

# Extensions install per user, so this has to be dev_user's.
- name: Install Claude Code VS Code extension
  ansible.builtin.command:
    cmd: code --install-extension anthropic.claude-code
  register: dev_claude_vscode_ext
  changed_when: "'successfully installed' in dev_claude_vscode_ext.stdout"
  when: dev_claude_vscode_bin.rc == 0
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

# CLEANUP (added 2026-09-24): Claude Desktop came from an unofficial apt repository whose
# key was trusted for root installs. Delete once every host in the dev group has converged.
- name: Remove Claude Desktop and its repository
  become: true
  block:
    - name: Remove Claude Desktop
      ansible.builtin.apt:
        name: claude-desktop
        state: absent
        purge: true

    - name: Remove the Claude Desktop repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dev_arch }}
          signed-by=/etc/apt/keyrings/claude-desktop.asc]
          https://pkg.claude-desktop-debian.dev stable main
        state: absent
        update_cache: true

    - name: Remove the Claude Desktop signing key
      ansible.builtin.file:
        path: /etc/apt/keyrings/claude-desktop.asc
        state: absent
