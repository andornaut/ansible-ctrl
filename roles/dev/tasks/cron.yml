---
# One cron file for the role, written from one template: a second task writing
# the same path would replace what the first put there, and a per-feature file
# leaves an entry behind on the host when its flag goes false.
- name: Create cron file for the dev role
  ansible.builtin.template:
    src: dev_cron.j2
    dest: /etc/cron.d/ansible-role-dev
    mode: "0644"
    owner: root
    group: root
  become: true
  when: dev_cron_scheduled | bool

- name: Remove the dev cron file where nothing is scheduled
  ansible.builtin.file:
    path: /etc/cron.d/ansible-role-dev
    state: absent
  become: true
  when: not dev_cron_scheduled | bool
