---
# Fetch a repository's latest release from a GitHub-shaped releases API and store it as a
# fact. Codeberg (Forgejo) serves the same endpoint and JSON shape.
#
# /releases/latest returns the release the project marks as latest, not whichever sorts first
# in the release list. That is the right side of the trade for upstreams that tag deliberately,
# because it cannot pick up a rolling build published alongside real tags. It does lag if a
# project ships a newer stable release without moving the pointer, which is why
# homeautomation/tasks/install_github_release_component.yml filters the list instead.
#
# Copied into each role that needs it rather than shared, because roles share no
# task files. Keep the copies in sync by hand.
#
# Required vars:
#   release_repo (str): "owner/repo"
#   release_fact (str): variable name to set with the release object
#
# Optional vars:
#   release_api_base (str): forge API base, default "https://api.github.com/repos".
#     Codeberg is "https://codeberg.org/api/v1/repos".
#
# The release object exposes .tag_name, .name, .tarball_url, .assets, etc. for the caller.
- name: Get the latest release of {{ release_repo }}
  ansible.builtin.uri:
    url: "{{ release_api_base | default('https://api.github.com/repos') }}/{{ release_repo }}/releases/latest"
    return_content: true
  register: dev_release_response
  retries: 3
  delay: 5
  # 4xx (rate limit, missing repo) is deterministic: retry only network errors and 5xx.
  until: >-
    dev_release_response.status == 200 or
    (dev_release_response.status >= 400 and dev_release_response.status < 500)

- name: Set fact to the latest release for {{ release_fact }}
  ansible.builtin.set_fact:
    "{{ release_fact }}": "{{ dev_release_response.json }}"
