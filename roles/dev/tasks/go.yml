---
- name: Get latest Go version
  ansible.builtin.uri:
    url: https://go.dev/dl/?mode=json
    return_content: true
  register: dev_go_releases
  # uri supports no check mode, so a --check run would skip this and leave the
  # register undefined for every task that templates it. The request only reads.
  check_mode: false
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx is deterministic.
  until: >-
    dev_go_releases.status == 200 or
    (dev_go_releases.status >= 400 and dev_go_releases.status < 500)

- name: Set Go version fact
  ansible.builtin.set_fact:
    dev_go_version: "{{ dev_go_releases.json[0].version }}"

# unarchive cannot compare versions before extracting, so gate on `go version`.
- name: Get installed Go version
  # Reads a system install by absolute path, so it needs no privilege.
  become: false
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go version
  register: dev_go_installed
  changed_when: false
  failed_when: false

- name: Remove Go packages from apt
  ansible.builtin.apt:
    name:
      - golang
      - golang-go
      - golang-doc
      - gccgo-go
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Install Go
  become: true
  when: dev_go_version not in dev_go_installed.stdout
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: dev_go_tmp

    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/{{ dev_go_version }}.linux-{{ dev_arch }}.tar.gz"
        dest: "{{ dev_go_tmp.path }}/go.tar.gz"
        mode: "0644"

    # unarchive merges into an existing tree rather than replacing it.
    - name: Remove old Go installation
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    # Named, not left to the archive: extraction puts the recorded mode through the
    # run's umask, and one that closes `other` installs a toolchain no account but root
    # can traverse. Capital X grants execute only where the archive already had it, so
    # the binaries stay binaries and the sources stay data.
    - name: Extract Go tarball to /usr/local
      ansible.builtin.unarchive:
        src: "{{ dev_go_tmp.path }}/go.tar.gz"
        dest: /usr/local
        remote_src: true
        mode: u=rwX,go=rX
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ dev_go_tmp.path }}"
        state: absent
      when: dev_go_tmp.path is defined
