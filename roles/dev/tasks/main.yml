---
- name: Validate dev_user
  ansible.builtin.assert:
    that:
      - dev_user != "root"
    fail_msg: >-
      dev_user resolved to "root", which would write user-scoped state to /root.
      Set primary_user in the inventory (or dev_user in host_vars) to the target account.
    success_msg: 'dev_user "{{ dev_user }}" is valid'
  tags: always

- name: Resolve home directory for {{ dev_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ dev_user }}"
  tags: always

- name: Import apt tasks
  ansible.builtin.import_tasks: apt.yml

# Languages first: the tools below depend on them.
- name: Import go tasks
  ansible.builtin.import_tasks: go.yml
  tags: go

- name: Import javascript tasks
  ansible.builtin.import_tasks: javascript.yml
  tags: javascript

- name: Import python tasks
  ansible.builtin.import_tasks: python.yml
  tags: python

- name: Import ruby tasks
  ansible.builtin.import_tasks: ruby.yml
  tags: ruby

- name: Import rust tasks
  ansible.builtin.import_tasks: rust.yml
  tags: rust

# Tools
- name: Import antigravity tasks
  ansible.builtin.import_tasks: antigravity.yml
  tags: antigravity

# vscode must run before claude and kilocode (they install VS Code extensions)
- name: Import vscode tasks
  ansible.builtin.import_tasks: vscode.yml
  tags: vscode

- name: Import claude tasks
  ansible.builtin.import_tasks: claude.yml
  tags: claude

- name: Import codex tasks
  ansible.builtin.import_tasks: codex.yml
  tags: codex

- name: Import cursor tasks
  ansible.builtin.import_tasks: cursor.yml
  tags: cursor

- name: Import kilocode tasks
  ansible.builtin.import_tasks: kilocode.yml
  tags: kilocode

- name: Import opencode tasks
  ansible.builtin.import_tasks: opencode.yml
  tags: opencode

- name: Import sops tasks
  ansible.builtin.import_tasks: sops.yml
  tags: sops

- name: Import virtualbox tasks
  ansible.builtin.import_tasks: virtualbox.yml
  tags: virtualbox
  when: dev_install_virtualbox | bool

# Drop the KVM blacklist so it does not outlive the flag. VirtualBox packages and
# modules stay; a full teardown is out of scope.
- name: Remove the VirtualBox KVM blacklist when disabled
  ansible.builtin.file:
    path: /etc/modprobe.d/ansible-role-dev-blacklist-kvm.conf
    state: absent
  become: true
  when: not dev_install_virtualbox | bool
  tags: virtualbox
  notify: Update initramfs

- name: Import ai-attributions tasks
  ansible.builtin.import_tasks: ai_attributions.yml
  tags: ai_attributions
  when: dev_install_ai_attributions

- name: Import ai-maintainer tasks
  ansible.builtin.import_tasks: ai_maintainer.yml
  tags: ai_maintainer
  when: dev_install_ai_maintainer

# Last, and gated on neither flag: the file it writes holds every scheduled
# entry the role owns, so it is rendered from the flags rather than skipped.
- name: Import cron tasks
  ansible.builtin.import_tasks: cron.yml
  tags:
    - ai_attributions
    - ai_maintainer
