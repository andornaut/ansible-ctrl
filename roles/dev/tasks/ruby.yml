---
- name: Install Ruby system packages
  ansible.builtin.apt:
    name:
      # What building an interpreter from source needs, for the ruby-install
      # below. ruby-dev covers native extensions built against the system Ruby,
      # which is a different job. libffi-dev is named here as well as in
      # python.yml, so `--tags ruby` on its own still has it.
      - libffi-dev
      - libgdbm-dev
      - libncurses-dev
      - libreadline-dev
      - libssl-dev
      - libyaml-dev
      - ruby
      - ruby-dev
      - zlib1g-dev
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Create a temporary directory
  become: true
  ansible.builtin.tempfile:
    state: directory
  register: dev_tmp_ruby

- name: Install Ruby tools
  become: true
  block:
    - name: Download and install chruby
      block:
        - name: Get latest chruby release
          ansible.builtin.include_tasks: get_latest_release.yml
          vars:
            release_repo: postmodern/chruby
            release_fact: dev_chruby_release

        - name: Set chruby download URL fact
          ansible.builtin.set_fact:
            dev_chruby_download_url: >-
              {{ dev_chruby_release.assets
              | selectattr('name', 'match', 'chruby-.*\.tar\.gz$')
              | map(attribute='browser_download_url') | first }}

        - name: Download chruby package
          ansible.builtin.get_url:
            url: "{{ dev_chruby_download_url }}"
            dest: "{{ dev_tmp_ruby.path }}/chruby.tar.gz"
            mode: "0644"

        - name: Extract chruby archive
          ansible.builtin.unarchive:
            src: "{{ dev_tmp_ruby.path }}/chruby.tar.gz"
            remote_src: true
            dest: "{{ dev_tmp_ruby.path }}"

        - name: Install chruby
          community.general.make:
            chdir: >-
              {{ dev_tmp_ruby.path }}/chruby-{{ dev_chruby_release.tag_name | replace('v', '') }}
            target: install

    - name: Download and install ruby-install
      block:
        - name: Get latest ruby-install release
          ansible.builtin.include_tasks: get_latest_release.yml
          vars:
            release_repo: postmodern/ruby-install
            release_fact: dev_ruby_install_release

        - name: Set ruby-install download URL fact
          ansible.builtin.set_fact:
            dev_ruby_install_download_url: >-
              {{ dev_ruby_install_release.assets
              | selectattr('name', 'match', 'ruby-install-.*\.tar\.gz$')
              | map(attribute='browser_download_url') | first }}

        - name: Download ruby-install package
          ansible.builtin.get_url:
            url: "{{ dev_ruby_install_download_url }}"
            dest: "{{ dev_tmp_ruby.path }}/ruby-install.tar.gz"
            mode: "0644"

        - name: Extract ruby-install archive
          ansible.builtin.unarchive:
            src: "{{ dev_tmp_ruby.path }}/ruby-install.tar.gz"
            remote_src: true
            dest: "{{ dev_tmp_ruby.path }}"

        - name: Install ruby-install
          community.general.make:
            chdir: >-
              {{ dev_tmp_ruby.path }}/ruby-install-{{ dev_ruby_install_release.tag_name | replace('v', '') }}
            target: install
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ dev_tmp_ruby.path }}"
        state: absent
      when: dev_tmp_ruby.path is defined

# Owned by dev_user, who runs the build below and has to write here.
- name: Create a temporary directory for the Ruby source
  ansible.builtin.tempfile:
    state: directory
  register: dev_tmp_ruby_src
  become: true
  become_user: "{{ dev_user }}"

# Installed as dev_user, not root: ruby-install writes to ~/.rubies for a user
# and /opt/rubies for root, chruby reads both, and auto.sh switches for the user.
#
# --no-install-deps because the apt task above names them; left on, ruby-install
# shells out to sudo apt-get partway through the play.
#
# --src-dir because ruby-install unpacks into ~/src otherwise, which is where
# the repositories live. --cleanup clears the tarball and the source tree after
# a build that succeeds; the always below covers one that does not.
- name: Install Ruby {{ dev_ruby_version }}
  block:
    - name: Build and install Ruby {{ dev_ruby_version }}
      ansible.builtin.command:
        cmd: >-
          ruby-install --no-install-deps --no-reinstall --cleanup
          --src-dir {{ dev_tmp_ruby_src.path }}
          ruby {{ dev_ruby_version }}
        creates: "{{ dev_ruby_root }}"
      become: true
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_user_home }}"
  always:
    - name: Remove the temporary directory for the Ruby source
      ansible.builtin.file:
        path: "{{ dev_tmp_ruby_src.path }}"
        state: absent
      when: dev_tmp_ruby_src.path is defined
      become: true

# Into the Ruby above rather than the system one, and into the directory chruby
# exports as GEM_HOME, so this is the bundler a `bundle exec` in mdtoc or til
# resolves. A version is named rather than left to `present`, which the older
# copy Ruby ships as a default gem already satisfies.
- name: Install Bundler {{ dev_bundler_version }}
  community.general.gem:
    name: bundler
    version: "{{ dev_bundler_version }}"
    executable: "{{ dev_ruby_root }}/bin/gem"
    state: present
    user_install: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    GEM_HOME: "{{ dev_ruby_gem_home }}"
