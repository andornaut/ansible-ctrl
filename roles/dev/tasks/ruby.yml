---
- name: Install Ruby system packages
  ansible.builtin.apt:
    name:
      # What building an interpreter from source needs, for the ruby-install
      # below. ruby-dev covers native extensions built against the system Ruby,
      # which is a different job. libffi-dev is named here as well as in
      # python.yml, so `--tags ruby` on its own still has it. make installs chruby
      # and ruby-install as well.
      - gcc
      - libffi-dev
      - libgdbm-dev
      - libncurses-dev
      - libreadline-dev
      - libssl-dev
      - libyaml-dev
      - make
      - ruby
      - ruby-dev
      - zlib1g-dev
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Create a temporary directory
  become: true
  ansible.builtin.tempfile:
    state: directory
  register: dev_tmp_ruby
  changed_when: false
  check_mode: false

- name: Install Ruby tools
  become: true
  block:
    - name: Download and install chruby and ruby-install
      ansible.builtin.include_tasks: install_release_make.yml
      vars:
        dev_release_make_name: "{{ dev_release_make_item.name }}"
        dev_release_make_repo: "{{ dev_release_make_item.repo }}"
        dev_release_make_probe: "{{ dev_release_make_item.probe }}"
        dev_release_make_dir: "{{ dev_tmp_ruby.path }}"
      loop:
        - name: chruby
          repo: postmodern/chruby
          # chruby is a shell function, so the probe sources it.
          probe: source "$1/share/chruby/chruby.sh" && chruby --version
        - name: ruby-install
          repo: postmodern/ruby-install
          probe: '"$1/bin/ruby-install" --version'
      loop_control:
        loop_var: dev_release_make_item
        label: "{{ dev_release_make_item.name }}"

    # Both Makefiles install with plain `cp`, which names no mode: a new file takes the
    # run's umask, and an existing one keeps whatever mode it was first created with, so
    # no later run corrects it. Additive, so nothing either project chose is taken away
    # and a run with nothing to open reports no change. Capital X grants execute only
    # where the file already had it, chruby.sh being sourced rather than run.
    - name: Let every account read the chruby and ruby-install libraries
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        recurse: true
        mode: a+rX
      loop:
        - /usr/local/share/chruby
        - /usr/local/share/ruby-install

    - name: Let every account run the chruby and ruby-install commands
      ansible.builtin.file:
        path: "{{ item }}"
        mode: a+rX
      loop:
        - /usr/local/bin/chruby-exec
        - /usr/local/bin/ruby-install
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ dev_tmp_ruby.path }}"
        state: absent
      when: dev_tmp_ruby.path is defined
      changed_when: false
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false

# Owned by dev_user, who runs the build below and has to write here.
- name: Create a temporary directory for the Ruby source
  ansible.builtin.tempfile:
    state: directory
  register: dev_tmp_ruby_src
  changed_when: false
  become: true
  become_user: "{{ dev_user }}"
  check_mode: false

# Installed as dev_user, not root: ruby-install writes to ~/.rubies for a user
# and /opt/rubies for root, chruby reads both, and auto.sh switches for the user.
#
# --no-install-deps because the apt task above names them; left on, ruby-install
# shells out to sudo apt-get partway through the play.
#
# --src-dir because ruby-install unpacks into ~/src otherwise, which is where
# the repositories live. --cleanup clears the tarball and the source tree after
# a build that succeeds; the always below covers one that does not.
- name: Install Ruby {{ dev_ruby_version }}
  block:
    - name: Build and install Ruby {{ dev_ruby_version }}
      ansible.builtin.command:
        cmd: >-
          ruby-install --no-install-deps --no-reinstall --cleanup
          --src-dir {{ dev_tmp_ruby_src.path }}
          ruby {{ dev_ruby_version }}
        creates: "{{ dev_ruby_root }}"
      become: true
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_user_home }}"
  always:
    - name: Remove the temporary directory for the Ruby source
      ansible.builtin.file:
        path: "{{ dev_tmp_ruby_src.path }}"
        state: absent
      when: dev_tmp_ruby_src.path is defined
      become: true
      changed_when: false
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false

# Into the Ruby above rather than the system one, and into the directory chruby
# exports as GEM_HOME, so this is the bundler a `bundle exec` in mdtoc or til
# resolves. A version is named rather than left to `present`, which the older
# copy Ruby ships as a default gem already satisfies.
- name: Install Bundler {{ dev_bundler_version }}
  community.general.gem:
    name: bundler
    version: "{{ dev_bundler_version }}"
    executable: "{{ dev_ruby_root }}/bin/gem"
    state: present
    user_install: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    GEM_HOME: "{{ dev_user_home }}/.gem/ruby/{{ dev_ruby_version }}"
