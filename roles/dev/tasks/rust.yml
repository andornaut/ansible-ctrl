---
- name: Install Rust system packages
  ansible.builtin.apt:
    name:
      - rustup
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# rustup installs into $HOME, and creates: checks dev_user's, so the two have to
# be the same account: run as the connecting one instead, the guard never matches
# and this reinstalls every run into the wrong home.
- name: Install Rust toolchain
  ansible.builtin.command: rustup default stable
  args:
    creates: "{{ dev_user_home }}/.cargo/bin/rustc"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
