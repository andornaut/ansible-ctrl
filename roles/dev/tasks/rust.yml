---
- name: Install Rust system packages
  ansible.builtin.apt:
    name:
      - rustup
    state: latest
    install_recommends: false
    update_cache: true
  become: true

# rustup installs into $HOME and `creates` checks dev_user's, so this must run as
# dev_user or it reinstalls every run into the wrong home.
- name: Install Rust toolchain
  ansible.builtin.command: rustup default stable
  args:
    creates: "{{ dev_user_home }}/.cargo/bin/rustc"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
