---
- name: Configure Visual Studio Code repository
  become: true
  block:
    # Microsoft's apt repo, not the standalone .deb: noble satisfies the deb's
    # libgtk-3-0 dependency through a versioned Provides, which apt resolves but
    # the apt module's deb pre-install check does not.
    - name: Download Visual Studio Code GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft-vscode.asc
        mode: "0644"

    - name: Add Visual Studio Code repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dev_arch }}
          signed-by=/etc/apt/keyrings/microsoft-vscode.asc]
          https://packages.microsoft.com/repos/code stable main
        mode: "0644"
        state: present
        update_cache: true

- name: Install Visual Studio Code
  ansible.builtin.apt:
    name:
      - code
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Configure Visual Studio Code for Wayland
  ansible.builtin.replace:
    path: /usr/share/applications/code.desktop
    # Consume any existing copies of the flag before writing one back, so repeated
    # runs do not accumulate. `\s` would match the newline and swallow the next line.
    regexp: '^Exec=(\S+)(?:[ \t]+--ozone-platform-hint=auto)*[ \t]*(.*)$'
    replace: 'Exec=\1 --ozone-platform-hint=auto \2'
  become: true
