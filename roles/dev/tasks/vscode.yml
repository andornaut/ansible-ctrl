---
- name: Configure Visual Studio Code repository
  become: true
  block:
    # Install via Microsoft's apt repo rather than the standalone .deb: the deb
    # depends on libgtk-3-0 (>= 3.9.10), which noble satisfies only through the
    # versioned Provides on libgtk-3-0t64. apt resolves that, but the apt module's
    # deb pre-install check does not, so a direct deb install fails as unsatisfiable.
    - name: Download Visual Studio Code GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft-vscode.asc
        mode: "0644"

    - name: Add Visual Studio Code repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dev_arch }}
          signed-by=/etc/apt/keyrings/microsoft-vscode.asc]
          https://packages.microsoft.com/repos/code stable main
        state: present
        update_cache: true

- name: Install Visual Studio Code
  ansible.builtin.apt:
    name:
      - code
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Configure Visual Studio Code for Wayland
  ansible.builtin.replace:
    path: /usr/share/applications/code.desktop
    # Consume any existing run of the flag before re-adding a single copy, so
    # that repeated runs neither match their own output nor accumulate flags.
    # \s would match the newline and pull the next line into an Exec= that has
    # no arguments, so the horizontal whitespace classes are load-bearing.
    regexp: '^Exec=(\S+)(?:[ \t]+--ozone-platform-hint=auto)*[ \t]*(.*)$'
    replace: 'Exec=\1 --ozone-platform-hint=auto \2'
  become: true
