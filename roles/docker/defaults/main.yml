---
# Added to the "docker" group, so the CLI works without sudo.
docker_user: "{{ primary_user }}"

docker_install_kubernetes: false
# Binds host port 5000, which Frigate also publishes by default. Setting it back to
# false stops installing and starting it but removes nothing: purging the package
# would destroy /var/lib/docker-registry.
docker_install_registry: false
