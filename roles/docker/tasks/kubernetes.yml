---
- name: Install Kubernetes tools
  become: true
  block:
    # /releases/latest, not release_stable: /releases is date-ordered, so its first
    # entry can be a patch of an older branch.
    - name: Get latest helm release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: helm/helm
        release_fact: docker_helm_release

    # unarchive has no version short circuit, so gate on the installed version.
    # `helm version --short` prints e.g. "v3.16.2+g13654a5".
    - name: Get installed helm version
      ansible.builtin.command:
        cmd: helm version --short
      register: docker_helm_installed
      changed_when: false
      failed_when: false
      # Reads a version and writes nothing. Run under --check too: skipped, it registers
      # rc 0, which reads as an installed helm on a host that has none.
      check_mode: false

    # Fetched into a temporary directory first: unarchive takes no checksum, and helm
    # publishes a .sha256sum beside each tarball.
    - name: Install helm binary
      when: docker_helm_release.tag_name not in docker_helm_installed.stdout
      vars:
        docker_helm_url: >-
          https://get.helm.sh/helm-{{ docker_helm_release.tag_name }}-linux-{{ docker_arch }}.tar.gz
      block:
        - name: Create a temporary directory for helm
          ansible.builtin.tempfile:
            state: directory
          register: docker_helm_tmp
          check_mode: false

        - name: Download helm
          ansible.builtin.get_url:
            url: "{{ docker_helm_url }}"
            checksum: "sha256:{{ docker_helm_url }}.sha256sum"
            dest: "{{ docker_helm_tmp.path }}/helm.tar.gz"
            mode: "0644"
          register: docker_helm_download
          retries: 3
          delay: 5
          until: docker_helm_download is succeeded
          # Into the temporary directory only, so a --check run downloads too: skipped, the
          # extraction after it fails on an archive that was never written.
          check_mode: false

        - name: Extract helm
          ansible.builtin.unarchive:
            src: "{{ docker_helm_tmp.path }}/helm.tar.gz"
            dest: /usr/local/bin/
            extra_opts:
              - "--strip-components=1"
            exclude:
              - LICENSE
              - README.md
            remote_src: true
      always:
        - name: Remove the temporary helm directory
          ansible.builtin.file:
            path: "{{ docker_helm_tmp.path }}"
            state: absent
          when: docker_helm_tmp.path is defined
          # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
          check_mode: false

    # Named here rather than on the unarchive above, as the kubectl and minikube tasks
    # below can name it inline: --strip-components leaves the stripped top-level member
    # as the archive's own path, which the module resolves to dest itself, so a mode or an
    # owner there lands on /usr/local/bin rather than on helm. Ownership is named because
    # extraction keeps the uid and gid the archive records. Unconditional, so a binary
    # installed under a umask that closed `other`, or owned by the id its archive carried,
    # is corrected without waiting for a version bump.
    # Skipped only where the path cannot be there to name: under --check the unarchive above
    # does not extract, so on a host with no helm the default `state: file` would fail the
    # run rather than report the two tasks it would have run.
    - name: Name the mode and ownership of the helm binary
      ansible.builtin.file:
        path: /usr/local/bin/helm
        mode: "0755"
        owner: root
        group: root
      when: docker_helm_installed.rc == 0 or not ansible_check_mode

    - name: Get latest kubectl version
      ansible.builtin.uri:
        url: "https://dl.k8s.io/release/stable.txt"
        return_content: true
      register: docker_kubectl_version
      retries: 3
      delay: 5
      # Retry network errors and 5xx only; 4xx is deterministic.
      until: >-
        docker_kubectl_version.status == 200 or
        (docker_kubectl_version.status >= 400 and docker_kubectl_version.status < 500)
      # uri supports no check mode, so a --check run would skip this and leave the
      # register undefined for every task that templates it. The request only reads.
      check_mode: false

    # checksum: downloads only on a digest mismatch. Same for minikube below.
    - name: Install kubectl binary
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ docker_kubectl_version.content }}/bin/linux/{{ docker_arch }}/kubectl"
        checksum: "sha256:https://dl.k8s.io/release/{{ docker_kubectl_version.content }}/bin/linux/{{ docker_arch }}/kubectl.sha256"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      register: docker_kubectl_download
      retries: 3
      delay: 5
      until: docker_kubectl_download is succeeded

    - name: Install minikube binary
      ansible.builtin.get_url:
        url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-{{ docker_arch }}"
        checksum: "sha256:https://storage.googleapis.com/minikube/releases/latest/minikube-linux-{{ docker_arch }}.sha256"
        dest: /usr/local/bin/minikube
        mode: "0755"
      register: docker_minikube_download
      retries: 3
      delay: 5
      until: docker_minikube_download is succeeded
