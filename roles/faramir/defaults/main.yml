---
# Account that owns the faramir checkout and runs the build. Never the agent.
#
# There is no account for the coding agent: it runs as this one. A separate uid
# could not reach the operator's checkouts, gh credential or commit identity,
# which is the work it is asked to do. See docs/scope.md in the faramir checkout
# for what that gives up and what still holds.
faramir_user: "{{ primary_user }}"

# Where the checkout lives. faramir publishes no release binaries, so they are
# built from source on the controller. Nothing else here reads the checkout:
# `faramir init` carries the units, the config, the hook and the docs inside the
# binary, so this role hands it a directory of binaries and no source layout.
faramir_src_dir: "{{ faramir_user_home }}/src/github.com/andornaut/faramir"

# The Go toolchain installs outside the default PATH, and a task's PATH is not a
# login shell's. See roles/dev/tasks/go.yml.
faramir_go_bin_dir: /usr/local/go/bin

# Shared group giving the agent and the three service accounts access to the
# working tree. Not a boundary; the boundaries are file modes.
#
# Passed to `faramir init`, which renders both the config the sockets check and
# the units that reach the working tree from it. The two cannot disagree, so
# this is an ordinary knob rather than a value that has to be kept in agreement
# with faramir's own files by hand.
faramir_dev_group: dev

# The three service uids. Passed to init, which renders the units and the config
# from them, so these are likewise free to change.
faramir_broker_user: faramir-broker
faramir_keeper_user: faramir-keeper
faramir_exec_user: faramir-exec

# The tree brokered commands run in: the operator's own checkout, so there is one
# copy of the inventory and nothing to keep in sync. The sops files are not here;
# they are read from faramir_secrets_dir, which the keeper sees through a bind of
# that one directory and nothing else of the home around it.
#
# It has to be reachable by faramir-exec, which is not the operator's uid. A home
# is 0700, so init shares the tree: group, setgid bits, and every directory from
# the home down made group-executable. Point this outside the homes instead and
# nothing is needed, at the cost of the tree no longer being the checkout you
# work in.
faramir_worktree: "{{ faramir_user_home }}/src/github.com/andornaut/ansible-ctrl"

# Where the base config and its drop-ins are installed. In the operator's home
# for the same reason as the store, with one difference that matters: a config
# the daemons cannot read is a daemon that will not start, where an unreadable
# store only empties the value set. The units are socket activated, so nothing
# tries before the operator has logged in.
faramir_config_dir: "{{ faramir_user_home }}/.faramir"

# Where the store lives. In the operator's home, which the store can be and the
# age key and the units cannot: those are what stop the agent, and the agent runs
# as this account. The store is not one of them, since that account's age
# identity decrypts it wherever it sits.
#
# Created 2770 root:{{ faramir_dev_group }}, so sops edits it in place through
# the group without sudo. The keeper reaches it through a bind of this one
# directory into an otherwise empty /home, rather than by giving up ProtectHome.
faramir_secrets_dir: "{{ faramir_config_dir }}/secrets"

# The managed sops files this project's playbooks draw on. Written to
# {{ faramir_config_dir }}/config.d/ansible-ctrl.toml as [secrets] files, every
# run, which the installed base config is not: init keeps an existing
# config.toml, so anything named there lands once and can never be reconciled.
#
# Every client of the broker sees every ref whatever file it came from, so the
# name buys per-file decryption errors and a per-file reload, not isolation.
faramir_secrets_files:
  - "{{ faramir_secrets_dir }}/ansible-ctrl.sops.yml"

# init keeps an existing config.toml and writes the new default to
# config.toml.dist beside it. Set true to have it write the config fresh
# instead. Destructive: edits made on the host are lost.
faramir_overwrite_config: false

# The SSH identity the broker lends to brokered commands through an agent it
# owns. Generated by init when missing, and written to the config drop-in as
# [ssh] keys, so this is the only place it is named.
#
# A key of the broker's own rather than the operator's. The executor's uid can
# authenticate with it without being able to read it, and the fleet can revoke
# the agent's reach without rotating the key the operator uses.
#
# Set empty to leave [ssh] keys unset, which is a working setup but not a
# recommended one: the keys then have to live where the executor's own uid can
# read them. The public key is printed at the end of every run; it opens nothing
# until faramir_fleet.yml puts it in authorized_keys on the managed hosts.
faramir_broker_ssh_key: /var/lib/faramir-broker/.ssh/id_ed25519

# An age identity for the operator, listed in .sops.yaml alongside the keeper's
# so the account that is responsible for these secrets can still read them.
# Without it the keeper is the only recipient and editing a value, rotating a
# credential or reading one back all have to go through the broker.
#
# Not a boundary. The coding agent runs as this same account, so it can read
# this identity and decrypt the store directly. The broker keeps values out of
# the agent's context and redacts what comes back; it does not stop an agent
# that goes looking. Set empty to close that path, at the cost of every operator
# read going through the broker as well.
faramir_operator_age_key: "{{ faramir_user_home }}/.config/sops/age/keys.txt"

# Register faramir's PreToolUse hook in this checkout's own agent settings, which
# is what redacts the output of everything the agent runs here.
#
# It auto-approves Bash in this checkout as a consequence: the hook rewrites
# every command so the output can be redacted, and a rewritten command matches no
# permission rule, so the hook's deny list is what refuses one instead. That
# trade is worth making where managed credentials are in play, which is what this
# checkout is for. Set false to keep Bash prompts here and get no redaction.
faramir_project_hook: true

# Install faramir's Read deny rules into the operator's own Claude settings.
# They refuse to open key material wherever the agent is working and take
# nothing away. The PreToolUse hook is a separate, per-project decision that
# neither init nor this role makes: registering it auto-approves Bash for that
# project.
faramir_install_agent_config: true

# Whether faramir_fleet.yml authorizes the broker's public key on the managed
# hosts and grants that account NOPASSWD sudo, or removes both. This role never
# reads it; the entry is here so the flag is documented where the rest are. That
# play applies no role and so defaults it itself, which is also why it must not
# bind the name at play or task scope: either would outrank host_vars and pin it
# to true.
#
# It writes to production hosts, so it is a separate play rather than something
# the controller-side role does behind your back.
faramir_fleet_authorize_key: true
