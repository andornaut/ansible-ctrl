---
# The controller: the one host the broker is installed on, and the one whose key
# the fleet authorizes. Named, not derived. The faramir group has to hold this
# host and no other, which tasks/ssh.yml asserts; taking the group's first member
# instead would let a second one in, and the fleet would then authorize whichever
# of them the inventory happened to list first while the other's brokered runs
# were refused everywhere, with nothing saying so.
#
# Two controllers is an error rather than a configuration: the fleet authorizes
# one broker's key, and these tasks say which broker.
#
# Matched against inventory_hostname exactly, so this is whatever the inventory
# calls the host, not a DNS name and not its ansible_host. Change it here if the
# controller is ever renamed or replaced; tasks/main.yml refuses to install
# anywhere else, and names both this value and the host it was applied to when it
# does.
faramir_controller: tron

# The operator's own login account: it owns the working tree and is who the
# broker is installed for. Never created here, and never a second account, the
# coding agent running as this one rather than as a uid of its own.
faramir_user: "{{ primary_user }}"

# Shared group giving the agent and the three service accounts access to the
# working tree. Not a boundary; the boundaries are file modes.
faramir_dev_group: dev

# The three service uids. Passed to init, which renders the units and the config
# from them, so these are free to change.
faramir_broker_user: faramir-broker
faramir_keeper_user: faramir-keeper
faramir_exec_user: faramir-exec

# Where the base config and its drop-ins are installed, with the age key and the
# store under it. In the operator's encrypted home, so a powered-off disk carries
# neither the ciphertext nor the key that opens it. The units are socket
# activated, so nothing tries to read any of it before the first login.
faramir_config_dir: "{{ faramir_user_home }}/.faramir"

# The SSH identity the broker lends to brokered commands. Generated by init when
# missing and rendered into config.toml on every run, so this is the only place
# it is named. Set empty to leave [ssh] keys unset, which works but puts the keys
# where the executor's own uid can read them.
#
# It opens nothing until tasks/ssh.yml puts the public half in authorized_keys
# on the managed hosts. Every run prints it.
faramir_broker_ssh_key: /var/lib/faramir-broker/.ssh/id_ed25519

# Register faramir's PreToolUse hook in this checkout's own agent settings, which
# is what redacts the output of everything the agent runs here.
#
# It auto-approves Bash in this checkout as a consequence: the hook rewrites
# every command so the output can be redacted, and a rewritten command matches no
# permission rule, so the hook's deny list is what refuses one instead. That
# trade is worth making where managed credentials are in play, which is what this
# checkout is for. Set false to keep Bash prompts here and get no redaction.
faramir_project_hook: true

# Agents this checkout is enrolled for, one --agent each. Each gets the hook
# above, its MCP server config and its share of the credentials block.
# Known: claude, gemini, kilocode, opencode.
faramir_project_agents:
  - claude

# Agents whose own settings get faramir's Read deny rules, one --agent each.
# They take nothing away, so this is account-wide where the hook above is not.
# Empty installs none. Known: claude, gemini, kilocode, opencode.
faramir_account_agents:
  - claude

# Whether tasks/ssh.yml authorizes the broker's public key on the managed hosts
# and grants that account NOPASSWD sudo, or removes both. Read only there, and
# main.yml never looks at it. A default rather than a play var, so host_vars
# outranks it and a host set false gets the teardown rather than being pinned to
# true.
faramir_fleet_authorize_key: true
