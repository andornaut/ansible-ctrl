---
# The host these playbooks are run from, and so the one whose broker key the fleet
# authorizes: the single member of the `faramir_controller` group. Derived rather than named,
# this repo being public and the inventory being where a host's name belongs.
#
# Empty unless the group holds exactly one host: with a bare index, adding a host or
# reordering the group would move the enrolment to a different machine and distribute a
# different key, and nothing would say so. Empty fails the asserts that read it.
faramir_controller_host: >-
  {{ (groups['faramir_controller'] | default([]))[0]
     if (groups['faramir_controller'] | default([])) | length == 1
     else '' }}

# The release whose assets are installed. `dev` is the rolling one CI re-cuts on every push
# to faramir's main, so the version on the host is only ever the last run's. A version tag
# (`v0.5.0`) pins instead.
#
# Named rather than resolved through the API: `dev` is published with make_latest=false, so
# /releases/latest never returns it.
faramir_release_tag: dev

# The operator's login account, which owns the working tree and the coding agent runs as.
# Never created here.
faramir_user: "{{ primary_user }}"

# Gives the agent and the service accounts the working tree. Not a boundary; file modes are.
#
# Passed on every run rather than left to faramir's own `faramir-client`, or a newly built
# host would come up under the other name with nothing saying why it differs.
faramir_client_group: dev

# Holds the age key, the broker's SSH key and the store. In the operator's encrypted home, so
# a powered-off disk carries none of them and socket activation reads nothing before first
# login.
faramir_config_dir: "{{ faramir_user_home }}/.config/faramir"

# One --agent each, passed to both init and enrol. Every agent the dev role installs that
# faramir knows, named rather than left to its `auto`, which covers an agent only after it
# has run once unguarded. What each one gets is in the README.
faramir_agents:
  - antigravity
  - claude
  - codex
  - kilocode
  - opencode
  - pi

# Whether a brokered command may ASK to sudo on the controller. It cannot sudo on its own:
# the executor's sudoers entry authenticates through a PAM service that asks the broker
# whether a human approved that command, so no password exists anywhere. Re-running without
# it takes the grant away.
#
# It is not only an escalation path: the executor unit drops NoNewPrivileges=, and with it
# the seccomp filter and ProtectSystem=strict, because a filter forces NoNewPrivileges= on
# and that makes every setuid binary inert, sudo included. So the hardening comes off the uid
# every brokered command runs as the moment this is true, whether or not anything is ever
# approved.
faramir_allow_sudo: false

# kernel.yama.ptrace_scope on the controller. Pinned rather than assumed: at 0 any process
# may ptrace any other of the same uid, and every brokered command shares the executor's, so
# one could read another's environment and with it the injected values and the escalation
# token. 1 restricts ptrace to a process's own descendants.
#
# `~` leaves the host's value alone, for a box that needs 0 for a debugger. Higher is
# accepted: 2 is admin-only and 3 refuses ptrace entirely, and faramir asks only that it not
# be 0.
faramir_ptrace_scope: 1

# What announces a waiting escalation, one list element per argument. Empty leaves
# `sudo faramir sudo watch` as the only place a question shows up, and a question nobody sees
# expires after [escalation] timeout_sec with every other brokered command on the host
# refused until it does.
#
# Passed only when faramir_allow_sudo is true, init refusing the pair otherwise. It must name
# "{prompt}" or "{id}"; keep "{id}" off anything that broadcasts, wall reaching every
# terminal on the host and the coding agent having one.
#
# The broker execs this as the account holding every decrypted value, with a fixed PATH and
# nothing else, so anything wanting the operator's session is out: /run/user/<uid> is 0700
# and the broker is not that uid. wall works because it is setgid tty; a request to something
# on the network works because the unit permits AF_INET.
faramir_notify_command: []

# How long a sudo question waits for a human before it is refused, 1 to 600, against
# faramir's own default of 120. Long enough to reach the terminal running
# `sudo faramir sudo watch`.
#
# It is a window, not a grace period: silence is a refusal either way, and raising it only
# moves when that refusal lands. The cost of a longer one is that a question nobody answers
# holds every other brokered command on the host until it expires.
faramir_sudo_timeout_sec: 300

# Paths the agent's file tools are refused. faramir compiles in no credential rules: an
# install refuses its own directories at their real paths and nothing else, so each entry
# here is the whole of what covers the store it names.
#
# One list, declared under every home on the host: the operator's, and each account named in
# faramir_shared_user_homes. So an entry is written relative to a home and in shortest form,
# with no leading slash and no `~`, which nothing expands; vars/main.yml joins each to each
# home and faramir matches the result as written. A directory refuses everything under it.
#
# The same shape everywhere, and the finer one where a home holds both a store and something
# the agent is asked to read beside it: `.ssh/id_*` rather than `.ssh/`, because this
# account's `config` and `known_hosts` are files an agent opens. An entry may carry one
# wildcard, a trailing `*` on its last component after at least one literal character, which
# is what lets a name be declared by the part of it that is fixed. The cost falls on the other
# accounts, where a name outside every shape here is not covered, and the answer there is to
# name it here rather than to block the directory in one home and the files in another.
#
# Every entry is configured whether or not a host has the file, the rule holding when the file
# appears and the run warning for each one that is not there. Most of the list is absent under
# most homes, which is the ordinary case and not a signal. What a removal cannot undo is in
# README.md.
#
# A path earns an entry where a host here has the tool that writes it: a binary installed, or a
# role that installs one. Adding the tool adds its path.
#
# The agent is refused any of these named at all, whatever it meant to do with it, and a shell
# pattern in the directory that could reach one goes with it. Every entry is written --strict
# besides, which reaches the brokered route alone. What the flag adds there, what it costs,
# and why faramir_blocked_commands cannot carry it: README.md.
faramir_blocked_home_paths:
  # The operator's own credential store, and the keys and keyrings beside it.
  - ".private"
  - ".gnupg"
  - ".local/share/keyrings"
  # mrs vaults, which the base role installs the manager for on every host. Encrypted, and
  # the `.bak` beside each one no less so, though that one opens under the password the vault
  # carried before the last change. The manager itself is refused as a command below.
  - ".local/share/mrs"
  # The NSS databases, holding client certificates and the private keys that go with them in
  # `key4.db` and `cert9.db`. Two locations: the older one, and the XDG data directory a newer
  # nss writes `nssdb` under. Not every host has both, and each rule holds when it appears.
  - ".pki"
  - ".local/share/pki"
  # The standard locations for an age identity, which is the key kind faramir's own store is
  # opened with: sops reads `~/.config/sops/age/keys.txt` and age-keygen writes `~/.age`.
  - ".config/sops"
  - ".age"
  # Passwords a client library reads without a keyring in front of it: `.netrc` for ftp, curl
  # and git, `.pgpass` for libpq. Both are the password in the clear under a fixed name.
  - ".netrc"
  - ".pgpass"
  # A kubeconfig, which holds a client certificate and key or a bearer token per cluster. The
  # file and not `.kube/`, the cache and the http cache beside it being neither.
  - ".kube/config"
  # SSH private keys, named by the prefix `ssh-keygen` gives every type it writes. That covers
  # a key renamed around that prefix, `id_rsa_work` and `id_ed25519_old` among them, which one
  # entry per key type could not. The directory stays unblocked, `config`, `known_hosts` and
  # `authorized_keys` beside the keys being files an agent is asked to read.
  #
  # A key named off the prefix entirely, `work_ed25519` or `github`, is still covered under no
  # home and needs its own entry. The wildcard narrows that gap and does not close it: it
  # opens the end of a name and there is no form that opens the start.
  #
  # The public halves go with the private ones, `.pub` being a suffix and the wildcard only
  # opening the end of a name. Accepted: reading one is ordinary and this refuses it, which is
  # a refusal rather than a disclosure, and the brokered route does not get it back, every
  # entry here being written --strict.
  #
  # Still weaker than a rule on the directory in one way, accepted as before: a pipeline where
  # neither half names a declared path reaches these.
  - ".ssh/id_*"
  # Site passwords the application keeps itself rather than handing to a keyring: MQTT
  # Explorer holds a broker's in `settings.json`, and irssi a server's and its NickServ
  # password in `config`. Neither is encrypted and neither is named by any rule.
  - ".config/MQTT-Explorer"
  - ".irssi"
  # The Chromium family's profile stores, holding every saved password, session cookie and
  # card in `Login Data` and its keyring entry. Each chrome install keeps a profile of its
  # own, so the prefix is what covers them: the three here today, and the `-beta`,
  # `-unstable` and `-canary` channels that are installed under the same name and one suffix.
  # Chromium's own directory shares no prefix with those and is its own entry.
  - ".config/google-chrome*"
  - ".config/chromium"
  # A flatpak gets a home of its own under `.var/app`, so an application installed that way
  # keeps a second copy of the store above. An entry per install method, each covering the
  # profile and whatever else that app home holds.
  - ".var/app/org.mozilla.firefox"
  # Firefox's native profile store, holding the same `logins.json`, `key4.db` and cookie jar
  # as the flatpak's. Written whether or not this host has the native install today.
  - ".mozilla"
  - ".var/app/org.chromium.Chromium"
  # FileZilla encodes each site's password in `sitemanager.xml` and `recentservers.xml`
  # rather than encrypting it. The flatpak's copy is the whole of it, that being the only way
  # it is installed here, so no native `~/.config/filezilla` is written. Installing the apt
  # build would want that directory added here as well, a rule matching the path as written.
  - ".var/app/org.filezillaproject.Filezilla"
  # Session tokens, which stand in for the password they were issued against: a sync account
  # and a storefront, itch keeping its API key in `db/butler.db`.
  - ".config/Insync"
  - ".config/itch"
  # The Bedrock launcher signs in to a Microsoft account and keeps the token beside a device
  # key of its own, so it goes whole.
  - ".var/app/io.github.wyze3306.BedrockOnLinux"
  #
  # The three game launchers are named file by file rather than whole, unlike the stores
  # above them. Each keeps its credentials in a few known places and keeps its installed-game
  # database, wine prefixes and runner versions everywhere else, and that second half is what
  # an agent is asked to read and change. A whole-tree entry refuses both.
  #
  # All three are installed as flatpaks here, so a `.var/app` home is the live copy and no
  # native path is earned under the rule above: a path earns an entry where a host here has
  # the tool that writes it. Steam is the exception and its native spellings are written
  # anyway, that one having an apt build the others do not and a `~/.steam` outside any
  # flatpak home. Lutris's `~/.cache/lutris` and Heroic's `~/.config/heroic` are deliberately
  # absent; installing either from apt would want them added.
  #
  # One spelling never covers another: faramir matches a path under a home in full rather than
  # any tail of it, so each is its own entry.
  #
  # Lutris keeps every storefront it has signed in to under the flatpak's `cache`: GOG,
  # Amazon, Humble Bundle, Epic, Steam, Battle.net, EA, Ubisoft and its own lutris.net token,
  # each an auth file or a cookie jar, and the directory holds nothing else that is not a
  # library cache, cover art or a downloaded runner tarball. The webkit view it signs in
  # through keeps those sessions a second time under `data/lutris`, which is why three
  # directories there go with it. `pga.db` beside them is the installed-game database and
  # `games`, `runners`, `runtime` and `system.yml` are its settings, so those stay readable.
  - ".var/app/net.lutris.Lutris/cache"
  - ".var/app/net.lutris.Lutris/data/lutris/localstorage"
  - ".var/app/net.lutris.Lutris/data/lutris/storage"
  - ".var/app/net.lutris.Lutris/data/lutris/databases"
  # Steam's `config` directory is a credential store rather than the game configuration:
  # `config.vdf` and `loginusers.vdf` hold the refresh tokens and `cefdata` and `htmlcache`
  # hold the store's cookies, while `libraryfolders.vdf` beside them names the libraries on
  # other disks and is how installed games are found. Named one by one for that reason.
  # `local.vdf` and the `ssfn` sentry sit in the root beside `steamapps`, `appcache`,
  # `compatdata` and `userdata`, which stay readable for the same purpose.
  #
  # One tree, four spellings, and an entry covers the one it is written as: faramir matches
  # the path as text and resolves no symlink. `data` is a symlink to `.local/share` inside the
  # flatpak home, and `.steam/root` and `.steam/steam` are two more pointing at the same
  # place, which is how Steam's own launcher reaches it.
  #
  # The two canonical spellings are named file by file, so `steamapps`, `appcache`,
  # `compatdata` and `userdata` stay readable through them. The two symlinks go whole instead:
  # nothing needs reaching through one when the same file is readable at the spelling beside
  # it, and enumerating a second and third copy of the credential list is how a file gets left
  # out of one of them. That omission is the refresh tokens read through a path no rule
  # mentions, which is what a whole-directory entry cannot have.
  #
  # The `ssfn` sentry is named by its prefix, the one shape a path entry may carry a wildcard
  # in: a trailing `*` on the last component, after at least one literal character. Its full
  # name carries a per-account number, which this repo is public and does not hold, and a
  # re-authorization writes a different one that the prefix covers without an edit.
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/config.vdf"
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/loginusers.vdf"
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/cefdata"
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/htmlcache"
  - ".var/app/com.valvesoftware.Steam/data/Steam/local.vdf"
  - ".var/app/com.valvesoftware.Steam/data/Steam/ssfn*"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/config.vdf"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/loginusers.vdf"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/cefdata"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/htmlcache"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/local.vdf"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/ssfn*"
  - ".var/app/com.valvesoftware.Steam/.steam/root"
  - ".var/app/com.valvesoftware.Steam/.steam/steam"
  - ".var/app/com.valvesoftware.Steam/.steam/steam.token"
  # The native spellings of the same, for a host carrying the apt build, `~/.steam`'s two
  # symlinks among them: the apt build writes the same pair, pointing at `.local/share/Steam`.
  - ".local/share/Steam/config/config.vdf"
  - ".local/share/Steam/config/loginusers.vdf"
  - ".local/share/Steam/config/cefdata"
  - ".local/share/Steam/config/htmlcache"
  - ".local/share/Steam/local.vdf"
  - ".local/share/Steam/ssfn*"
  - ".steam/root"
  - ".steam/steam"
  - ".steam/steam.token"
  # Heroic signs in through three storefront backends, each keeping its credentials under a
  # config directory of its own, and through an Electron view that keeps those sessions a
  # second time. `config.json`, `GamesConfig`, `store`, `store_cache`, `lib-cache`,
  # `sideload_apps`, `tools` and the `legendary` metadata beside them are the settings and
  # the installed-game lists, and stay readable. Its `cache` sibling needs no entry, holding
  # shader and wine caches and no credential.
  - ".var/app/com.heroicgameslauncher.hgl/config/legendary/user.json"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/legendaryConfig"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/gogdlConfig"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/nile_config"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/gog_store/auth.json"
  # The Electron half: the cookie jar, the per-storefront partitions each holding a login of
  # its own, and the profile files that carry a session beside them. The two SQLite stores are
  # named by prefix, so each covers whichever journal sidecar its mode writes.
  #
  # The same set the editors further down block, `IndexedDB`, `Service Worker` and
  # `WebStorage` included: this view signs in to Epic, GOG and Amazon, and a session persisted
  # in one of those is the session `Local Storage` holds. Not under this profile today, and
  # the rule holds when they appear.
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Cookies*"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Partitions"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Local Storage"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Session Storage"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/IndexedDB"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Service Worker"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/WebStorage"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Local State"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Network Persistent State"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Trust Tokens*"
  # What vim persists between sessions, which is content and not only filenames: a register
  # holds the text of the last yank or delete, so a line taken out of a decrypted file is
  # written to disk and survives there. Where the dotfiles' `vimrc` points `viminfofile`; the
  # default location any other vim writes is named below.
  - ".vim/tmp"
  # Registry and package-index tokens, each under a fixed name its tool reads without a
  # keyring in front of it: npm's `_authToken`, poetry's PyPI tokens, and the two spellings
  # of git's plaintext credential store. The cargo and git ones are not here today, and the
  # rule holds when they appear.
  #
  # The npm one is also linked on the controller, so that host warns once a run that this
  # entry adds nothing to the link. Kept: a link is set per host and this list is the fleet's,
  # and a dev host with npm and no link has nothing else refusing the file.
  - ".npmrc"
  - ".config/pypoetry/auth.toml"
  - ".git-credentials"
  - ".config/git/credentials"
  - ".cargo/credentials.toml"
  # One signed-in token per tool, each at the fixed path its tool writes. `.credentials.json`
  # is not the `credentials` name it reads like, and `config.yaml` is a config carrying a
  # model provider's API key inline. faramir configures cursor not at all, so there a rule is
  # the whole of what covers it.
  - ".claude/.credentials.json"
  - ".codex/auth.json"
  - ".local/share/opencode/auth.json"
  - ".continue/config.yaml"
  - ".gemini/config/config.json"
  # The rest of the agents' tokens, each under the fixed name its tool writes: the pi, kilo
  # and cursor CLIs, and the two files a gemini sign-in leaves beside its config. The gemini
  # pair is not here until someone signs that CLI in, and the rule holds when it appears.
  - ".pi/agent/auth.json"
  - ".local/share/kilo/auth.json"
  - ".config/cursor/auth.json"
  - ".gemini/oauth_creds.json"
  - ".gemini/google_accounts.json"
  # Two agent configs that carry a provider's key inline rather than naming an environment
  # variable. Blocking them means adding a model provider to either is the operator's at a
  # terminal; the MCP configs beside them name no credential and stay readable.
  #
  # Both extensions of each. Either CLI reads whichever is present and merges the two where
  # both are, so the key may sit in either, and a rule naming one leaves the other open.
  # `.json` is also the name faramir renders its own deny rules into, so blocking it keeps
  # an agent from editing the rules it is held to.
  - ".config/kilo/kilo.json"
  - ".config/kilo/kilo.jsonc"
  - ".config/opencode/opencode.json"
  - ".config/opencode/opencode.jsonc"
  # Then Claude Desktop's, the GitHub CLI's and clasp's Google refresh token. `hosts.yml` and
  # not `.config/gh`: `config.yml` beside it is aliases and editor settings, which an agent is
  # asked to edit.
  - ".config/Claude/buddy-tokens.json"
  - ".config/gh/hosts.yml"
  - ".clasprc.json"
  # Docker's registry auth, which with no credsStore holds base64 user:pass and which no
  # managed ref carries, so nothing redacts it either. Blocked rather than linked: `docker
  # login` replaces the file by rename, and the replacement is created 0600, which would take
  # the broker's read with it.
  - ".docker/config.json"
  # The default location vim writes its register history to, which is content and not only
  # filenames: a register holds the text of the last yank or delete. The directory the
  # dotfiles' `vimrc` points `viminfofile` at is above; this covers any other vim.
  - ".viminfo"
  # Claude Code's own config, which holds each MCP server's environment and so whatever key
  # was written into one. The file and not `.claude/`, which holds the instructions and the
  # settings an agent is asked to edit; `.claude/.credentials.json` is named above.
  - ".claude.json"
  # The keys authenticating to the daemon and to each session's socket. Two directories rather
  # than `.claude/`, which also holds the skills, the plugins and the projects tree, all of them
  # read and written in ordinary work.
  - ".claude/daemon"
  - ".claude/sessions"
  # Shell environment the dotfiles keep out of the committed `bashrc`, which is where an
  # export carrying a token goes. Beside `.private` above, and blocked for the same reason.
  - ".bashrc.private"
  # The adb private key, which is what a paired device authorizes. The file alone, the public
  # half beside it not blocked.
  - ".android/adbkey"
  # Zoom's signed-in session, which it keeps outside a keyring. The directory, a session
  # being more than one file.
  - ".zoom/data"
  # Two Electron profiles keeping a signed-in session outside a keyring: the chat client's
  # under its flatpak app home, and the sync client's web view beside the config directory
  # already blocked above. The session is more than one file, so the directory in each case.
  - ".var/app/com.discordapp.Discord"
  - ".local/share/Insync"
  # The RubyGems API key, which publishes as its owner. Two locations because gem reads
  # whichever the environment points it at.
  - ".gnome/.gem/credentials"
  - ".local/share/gem/credentials"
  # Each editor's secret store, `state.vscdb` and the extensions' saved tokens beside it. The
  # globalStorage directory and not the editor's own, which holds `settings.json`, the
  # keybindings and the MCP config, all files an agent is asked to edit. The per-workspace
  # copy of `state.vscdb` is left readable: an editor writes a new one for every workspace
  # opened, and no list of paths keeps up with that.
  - ".config/Code/User/globalStorage"
  - ".config/Cursor/User/globalStorage"
  - ".config/Antigravity/User/globalStorage"
  # The local history beside it, which is the exception to `User/` being readable. It is not
  # configuration but a mirror: a verbatim copy of every file the editor saved, whatever the
  # file was and wherever it lives, kept under a hashed directory naming the source. So it
  # holds past copies of `settings.json` and of any inventory or config opened for an edit,
  # and blocking a file by its own path leaves the copies behind. Nothing an agent is asked
  # to edit is in here: the editor writes it and reads it back through its own UI.
  - ".config/Code/User/History"
  - ".config/Cursor/User/History"
  - ".config/Antigravity/User/History"
  # Settings Sync's cache, which is a synced copy of the settings files and carries the account
  # that signed the sync in. Blocking `settings.json` and leaving this behind blocks nothing.
  - ".config/Code/User/sync"
  - ".config/Cursor/User/sync"
  - ".config/Antigravity/User/sync"
  # Per-workspace state, each directory named by an opaque id and holding a `state.vscdb` of the
  # same kind as the one in `globalStorage`. Named as the directory because the ids are
  # unbounded: one is minted per workspace opened, so the files under it cannot be listed ahead
  # of time. Nothing here is edited, the editor writing it and reading it back itself.
  - ".config/Code/User/workspaceStorage"
  - ".config/Cursor/User/workspaceStorage"
  - ".config/Antigravity/User/workspaceStorage"
  # The same store again, in the directory the forks share rather than under any one of them.
  # It holds nothing else, so the directory is the entry: the `-shm` and `-wal` companions are
  # the same database and there is no use in naming them apart.
  - ".vscode-shared/sharedStorage"
  # The web session each of those editors keeps beside `globalStorage`, every one of them an
  # Electron profile: the cookie jar and its journal, which holds rows written but not yet
  # merged, and the stores a signed-in extension puts a token in. Per file for the reason
  # globalStorage is: everything an agent is asked to edit lives under `User/`, and a rule
  # naming the editor's directory would take that with it.
  #
  # `IndexedDB`, `Service Worker` and `WebStorage` are not under every editor today and the rule
  # holds when they appear. What is deliberately left out is `Network Persistent State`, which
  # records the hosts a profile has spoken to and carries no credential.
  #
  # The two names carrying a space are matched as the literal path, so the file tools are
  # refused them outright and a shell command reaches them only in the escaped spelling
  # (`Local\ Storage`); the quoted one is refused like any other path.
  #
  # `Cookies*` rather than the file and its `-journal`: the jar is SQLite, so the sidecar
  # beside it is named for the journal mode in force and holds the same rows either way.
  # `-journal` is the rollback one and `-wal`/`-shm` the write-ahead one, which no list of
  # literal names had.
  - ".config/Code/Cookies*"
  - ".config/Code/Local Storage"
  - ".config/Code/Session Storage"
  - ".config/Code/IndexedDB"
  - ".config/Code/Service Worker"
  - ".config/Code/WebStorage"
  - ".config/Cursor/Cookies*"
  - ".config/Cursor/Local Storage"
  - ".config/Cursor/Session Storage"
  - ".config/Cursor/IndexedDB"
  - ".config/Cursor/Service Worker"
  - ".config/Cursor/WebStorage"
  - ".config/Antigravity/Cookies*"
  - ".config/Antigravity/Local Storage"
  - ".config/Antigravity/Session Storage"
  - ".config/Antigravity/IndexedDB"
  - ".config/Antigravity/Service Worker"
  - ".config/Antigravity/WebStorage"
  # Clipboard history, which holds whatever was copied through it, a password included.
  - ".clipboard"
  - ".var/app/app.getclipboard.Clipboard"
  # Claude Desktop, an Electron profile like the editors above and split the same way, the
  # session stores by path. `buddy-tokens.json` is declared further up, and its two MCP configs
  # below. `Partitions/` is named whole rather than per partition: the app adds one per embedded
  # view, each a profile of its own, and nothing under there is edited.
  - ".config/Claude/Cookies*"
  - ".config/Claude/Local Storage"
  - ".config/Claude/Session Storage"
  - ".config/Claude/IndexedDB"
  - ".config/Claude/WebStorage"
  - ".config/Claude/Partitions"
  # Electron and QtWebEngine apps whose whole directory goes, there being no file in them an
  # agent is asked to edit. Each keeps a cookie jar, and a device configurator signs in to a
  # vendor account like anything else.
  - ".config/uhk-agent"
  - ".config/ExpressLRS Configurator"
  - ".config/betaflight-configurator"
  - ".local/share/org.coolercontrol.CoolerControl"
  # The launcher's web cache, which holds the account session. The rest of `.minecraft` is
  # saves and mods, so the directory itself stays readable.
  - ".minecraft/webcache"
  # An MCP config names each server's environment, so a server configured with a literal key
  # rather than a `faramir://` ref holds that key in the clear. Editing one is ordinary work,
  # and this stops that: the guard refuses a declared path named at all, so a change to a server
  # list is the operator's to make. Declared for the editors that have no such file yet, the
  # rule holding when it appears.
  - ".config/Code/User/mcp.json"
  - ".config/Cursor/User/mcp.json"
  - ".config/Antigravity/User/mcp.json"
  - ".config/Claude/config.json"
  - ".config/Claude/claude_desktop_config.json"

# faramir has no name form: an entry is a path or a command, and a path is absolute and
# literal, a wildcard in one refused at load. So a rule that matched the tail of whatever an
# agent named, wherever it turned up, has no equivalent here, and what only a pattern could
# say is not said at all. Name the directory where a pattern suggests itself.
#
# Left uncovered by that: `*.key` and `*.pem`, whose every instance here is a CA bundle or a
# test fixture; `*.vault` and `vault.yml`, which nothing here writes; `.env*`,
# which lives in working trees that come and go; and `state.vscdb*`, which an editor writes
# once per workspace and again for each new one, so no list of paths keeps up. The
# globalStorage directory holding the secret store is blocked by path instead.
#
# Nothing reaches a file an agent opens inside a container either, where the path is the
# mount point's and not the host's.

# The homes of other accounts on this fleet, absolute and one per account. The list above is
# declared under each of them as well as under the operator's. Empty here and set in
# `group_vars`, an account name being inventory data and this repo being public.
#
# Set for the whole faramir group and not only the host holding the account: a rule refuses a
# command that names the path, and the agent types its commands on the controller, where
# `ssh <host> sudo cat <path>` reaches the account's files over a NOPASSWD sudo the file modes
# never see. Absent on the hosts without the account, which is the ordinary case for an entry.
faramir_shared_user_homes: []
faramir_blocked_commands:
  # The GitHub CLI's token, which it keeps in `~/.config/gh/hosts.yml`. That file is blocked
  # by path already, so these are the other way to the same value: `gh auth token` prints it,
  # and `--show-token` (`-t`) unmasks what `gh auth status` otherwise prints as `gho_****`.
  #
  # `status` bare rather than the flag spelled out, because an entry is literal words with any
  # run of whitespace between them and nothing else: `gh auth status --show-token` matches
  # that spelling and not `gh auth status -h github.com -t`, where a flag sits between the
  # words. No entry can say "the flag anywhere among the others", so the subcommand is the
  # only form that covers every way of asking. That takes the default `gh auth status` too,
  # which prints the token masked and no value, and the check is the whole of what the refusal
  # costs.
  #
  # `git-credential` beside them, which `gh auth --help` does not list: it speaks the git
  # credential helper protocol, so a `get` on stdin returns the same token as `password=`,
  # and it reads `hosts.yml` directly whether or not `gh auth setup-git` ever configured the
  # helper.
  #
  # Not bare `gh auth`, which would also take `gh auth login` and `gh auth refresh`: those
  # write the token rather than print it, and are the operator's at a terminal anyway.
  - gh auth git-credential
  - gh auth status
  - gh auth token
  # The operator's own vault manager. Bare, so every subcommand goes with it: `export` and
  # `search` print secrets, `edit` decrypts a vault into $EDITOR, `add` writes to one, and
  # `vault delete` destroys one. That takes `vault list` and `vault default` too, which print
  # names and paths and no secrets, and the listing is the whole of what the refusal costs.
  - mrs
  - op read
  - op item get
  - op inject
  - pass show
  # Bare, unlike `pass show` above: no flag on this fleet carries the word, so every
  # subcommand is covered rather than the one spelling.
  - gopass
  - vault read
  - vault kv get

# Credentials another tool owns, read where that tool keeps them rather than copied into the
# store. One entry per ref: `ref`, `path`, `type` (`text`, `base64`, `json`, `yaml`, `toml`,
# `ini`) and `key` for the four that select.
#
# Empty here and set in `host_vars`, unlike the blocked paths above: `link add` refuses a new
# entry whose file is not there, so a link named in defaults fails the run on a controller
# that does not have that file.
#
# A link is the stronger entry, and the one that can stop the host. What it grants, when to
# prefer a block, and why a shape this host's links already name is left out of its block
# entries: README.md.
#
# Written --strict, as the blocks above are: the file is named by ref and never by path.
faramir_links: []

# What a linked file is set to, so the broker keeps reading it. The broker is the only
# account that opens one, so its own group is tighter than the client group, which would
# add the executor and the operator to the readership of a credential neither needs.
#
# 0640 rather than 0600: the file stays the owning tool's to write, and the broker only
# reads it. A file the broker cannot read stops every brokered command, not just the ones
# wanting that ref, so this is converged rather than left to whatever wrote the file last.
faramir_link_file_group: faramir-broker
faramir_link_file_mode: "0640"

# The agent home's mode, and the group faramir admits through it. init grants the client
# group traversal here; converging it means a home that loses the group is put back on the
# next run rather than staying broken until a brokered command reports it. 0710 rather than
# 0750: traversal is what the group needs, and a listing is not.
faramir_user_home_mode: "0710"

# Whether tasks/ssh.yml authorizes the key and the NOPASSWD sudo, or removes both.
faramir_fleet_authorize_key: true

# System-wide, so one file covers the executor, the renewal cron's root and the operator,
# and survives a service account being recreated.
faramir_fleet_known_hosts_path: /etc/ssh/ssh_known_hosts

# The name ssh looks an entry up under: the address ansible dials, bracketed with the port
# when that is not 22. An entry under any other name is never consulted.
faramir_fleet_known_hosts_name: >-
  {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ (ansible_port | int))
     if (ansible_port | default(22) | int) != 22
     else (ansible_host | default(inventory_hostname)) }}

# Undefined, so the module picks ~/.ssh/authorized_keys; set in host_vars for a host that
# regenerates that file, as the pfSense routers do.
# faramir_fleet_authorized_keys_path: /root/.ssh/authorized_keys2
