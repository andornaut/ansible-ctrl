---
# The host these playbooks are run from, and so the one whose broker key the fleet
# authorizes: the single member of the `faramir_controller` group. Derived rather than named,
# this repo being public and the inventory being where a host's name belongs.
#
# Empty unless the group holds exactly one host: with a bare index, adding a host or
# reordering the group would move the enrolment to a different machine and distribute a
# different key, and nothing would say so. Empty fails the asserts that read it.
faramir_controller_host: >-
  {{ (groups['faramir_controller'] | default([]))[0]
     if (groups['faramir_controller'] | default([])) | length == 1
     else '' }}

# The release whose assets are installed. `dev` is the rolling one CI re-cuts on every push
# to faramir's main, so the version on the host is only ever the last run's. A version tag
# (`v0.5.0`) pins instead.
#
# Named rather than resolved through the API: `dev` is published with make_latest=false, so
# /releases/latest never returns it.
faramir_release_tag: dev

# The operator's login account, which owns the working tree and the coding agent runs as.
# Never created here.
faramir_user: "{{ primary_user }}"

# Gives the agent and the service accounts the working tree. Not a boundary; file modes are.
#
# Passed on every run rather than left to faramir's own `faramir-client`, or a newly built
# host would come up under the other name with nothing saying why it differs.
faramir_client_group: dev

# Holds the age key, the broker's SSH key and the store. In the operator's encrypted home, so
# a powered-off disk carries none of them and socket activation reads nothing before first
# login.
faramir_config_dir: "{{ faramir_user_home }}/.config/faramir"

# One --agent each, passed to both init and init-project. Every agent the dev role installs
# that faramir knows, named rather than left to its `auto`, which covers an agent only after
# it has run once unguarded. What each one gets is in the README.
faramir_agents:
  - antigravity
  - claude
  - codex
  - kilocode
  - opencode
  - pi

# Whether a brokered command may ASK to sudo on the controller. It cannot sudo on its own:
# the executor's sudoers entry authenticates through a PAM service that asks the broker
# whether a human approved that command, so no password exists anywhere. Re-running without
# it takes the grant away.
#
# It is not only an escalation path: the executor unit drops NoNewPrivileges=, and with it
# the seccomp filter and ProtectSystem=strict, because a filter forces NoNewPrivileges= on
# and that makes every setuid binary inert, sudo included. So the hardening comes off the uid
# every brokered command runs as the moment this is true, whether or not anything is ever
# approved.
faramir_allow_sudo: false

# kernel.yama.ptrace_scope on the controller. Pinned rather than assumed: at 0 any process
# may ptrace any other of the same uid, and every brokered command shares the executor's, so
# one could read another's environment and with it the injected values and the escalation
# token. 1 restricts ptrace to a process's own descendants.
#
# `~` leaves the host's value alone, for a box that needs 0 for a debugger. Higher is
# accepted: 2 is admin-only and 3 refuses ptrace entirely, and faramir asks only that it not
# be 0.
faramir_ptrace_scope: 1

# What announces a waiting escalation, one list element per argument. Empty leaves
# `sudo faramir sudo watch` as the only place a question shows up, and a question nobody sees
# expires after [escalation] timeout_sec with every other brokered command on the host
# refused until it does.
#
# Passed only when faramir_allow_sudo is true, init refusing the pair otherwise. It must name
# "{prompt}" or "{id}"; keep "{id}" off anything that broadcasts, wall reaching every
# terminal on the host and the coding agent having one.
#
# The broker execs this as the account holding every decrypted value, with a fixed PATH and
# nothing else, so anything wanting the operator's session is out: /run/user/<uid> is 0700
# and the broker is not that uid. wall works because it is setgid tty; a request to something
# on the network works because the unit permits AF_INET.
faramir_notify_command: []

# How long a sudo question waits for a human before it is refused, 1 to 600, against
# faramir's own default of 120. Long enough to reach the terminal running
# `sudo faramir sudo watch`.
#
# It is a window, not a grace period: silence is a refusal either way, and raising it only
# moves when that refusal lands. The cost of a longer one is that a question nobody answers
# holds every other brokered command on the host until it expires.
faramir_sudo_timeout_sec: 300

# Paths the agent's file tools are refused. faramir compiles in no credential rules: an
# install refuses its own directories at their real paths and nothing else, so each entry
# across these two lists is the whole of what covers the store it names.
#
# Absolute and in shortest form, a rule matching the path as written; no `~`, which nothing
# expands. A directory refuses everything under it. Every entry is configured whether or not
# this host has the file, the rule holding when the file appears and the run warning for each
# one that is not there; how the two lists differ and what a removal cannot undo is in
# README.md.
#
# Every entry in this list is written --strict, so a command naming one is refused whatever
# it meant to do with it and not only where it would read, copy or move it. A path names one
# file on this host, which bounds what that refuses; faramir_blocked_commands cannot carry it,
# a command entry already being about what a command does. What --strict costs is in
# README.md.
faramir_blocked_paths:
  # The operator's own credential store, and the keys and keyrings beside it.
  - "{{ faramir_user_home }}/.private"
  - "{{ faramir_user_home }}/.gnupg"
  - "{{ faramir_user_home }}/.local/share/keyrings"
  # mrs vaults, which the base role installs the manager for on every host. Encrypted, and
  # the `.bak` beside each one no less so, though that one opens under the password the vault
  # carried before the last change. The manager itself is refused as a command below.
  - "{{ faramir_user_home }}/.local/share/mrs"
  # The NSS databases, holding client certificates and the private keys that go with them in
  # `key4.db` and `cert9.db`.
  - "{{ faramir_user_home }}/.pki"
  # The standard locations for an age identity, which is the key kind faramir's own store is
  # opened with: sops reads `~/.config/sops/age/keys.txt` and age-keygen writes `~/.age`.
  - "{{ faramir_user_home }}/.config/sops"
  - "{{ faramir_user_home }}/.age"
  # Passwords a client library reads without a keyring in front of it: `.netrc` for ftp, curl
  # and git, `.pgpass` for libpq. Both are the password in the clear under a fixed name.
  - "{{ faramir_user_home }}/.netrc"
  - "{{ faramir_user_home }}/.pgpass"
  # A kubeconfig, which holds a client certificate and key or a bearer token per cluster. The
  # file and not `.kube/`, the cache and the http cache beside it being neither.
  - "{{ faramir_user_home }}/.kube/config"
  # The operator's own SSH private keys, one entry per key name. The directory is not
  # blocked, `config`, `known_hosts` and `authorized_keys` beside the keys being files an
  # agent is asked to read. A key under a name of the operator's choosing needs its own entry.
  - "{{ faramir_user_home }}/.ssh/id_rsa"
  - "{{ faramir_user_home }}/.ssh/id_ecdsa"
  - "{{ faramir_user_home }}/.ssh/id_ed25519"
  # Site passwords the application keeps itself rather than handing to a keyring: MQTT
  # Explorer holds a broker's in `settings.json`, and irssi a server's and its NickServ
  # password in `config`. Neither is encrypted and neither is named by any rule.
  - "{{ faramir_user_home }}/.config/MQTT-Explorer"
  - "{{ faramir_user_home }}/.irssi"
  # The Chromium family's profile stores, holding every saved password, session cookie and
  # card in `Login Data` and its keyring entry. One entry per directory: the three chrome
  # installs keep three profiles, and a rule matches the path as written, so none of them
  # covers another.
  - "{{ faramir_user_home }}/.config/google-chrome"
  - "{{ faramir_user_home }}/.config/google-chrome-for-testing"
  - "{{ faramir_user_home }}/.config/google-chrome-headless"
  - "{{ faramir_user_home }}/.config/chromium"
  # A flatpak gets a home of its own under `.var/app`, so an application installed that way
  # keeps a second copy of the store above. An entry per install method, each covering the
  # profile and whatever else that app home holds.
  - "{{ faramir_user_home }}/.var/app/org.mozilla.firefox"
  # Firefox's native profile store, holding the same `logins.json`, `key4.db` and cookie jar
  # as the flatpak's. Written whether or not this host has the native install today.
  - "{{ faramir_user_home }}/.mozilla"
  - "{{ faramir_user_home }}/.var/app/org.chromium.Chromium"
  - "{{ faramir_user_home }}/.var/app/com.heroicgameslauncher.hgl"
  # FileZilla encodes each site's password in `sitemanager.xml` and `recentservers.xml`
  # rather than encrypting it. The flatpak's copy is the whole of it, that being the only way
  # it is installed here, so no native `~/.config/filezilla` is written. Installing the apt
  # build would want that directory added here as well, a rule matching the path as written.
  - "{{ faramir_user_home }}/.var/app/org.filezillaproject.Filezilla"
  # Session tokens, which stand in for the password they were issued against: a sync account
  # and two storefronts, itch keeping its API key in `db/butler.db`. Heroic and the
  # `legendary` it signs in with are installed as flatpaks, so the app directory above is
  # what covers those.
  - "{{ faramir_user_home }}/.config/Insync"
  - "{{ faramir_user_home }}/.local/share/Steam"
  - "{{ faramir_user_home }}/.config/itch"
  # Lutris keeps one per storefront it has been signed in to, under `cache/lutris`: GOG,
  # Amazon, Humble Bundle and Origin, each an auth file or a cookie jar. Steam's own is
  # covered by the flatpak path, an install made that way leaving `.local/share/Steam` a
  # shell.
  - "{{ faramir_user_home }}/.var/app/net.lutris.Lutris"
  - "{{ faramir_user_home }}/.var/app/com.valvesoftware.Steam"
  # Where a native Lutris keeps the same per-storefront auth files, the flatpak path above
  # covering only an install made that way. `~/.steam` for the same reason: it is the other
  # spelling of the store below it, and a rule matches the path as written.
  - "{{ faramir_user_home }}/.cache/lutris"
  - "{{ faramir_user_home }}/.steam"
  # What vim persists between sessions, which is content and not only filenames: a register
  # holds the text of the last yank or delete, so a line taken out of a decrypted file is
  # written to disk and survives there. Where the dotfiles' `vimrc` points `viminfofile`; the
  # default location any other vim writes is named below.
  - "{{ faramir_user_home }}/.vim/tmp"
  # Registry and package-index tokens, each under a fixed name its tool reads without a
  # keyring in front of it: npm's `_authToken`, poetry's PyPI tokens, and the two spellings
  # of git's plaintext credential store. The cargo and git ones are not here today, and the
  # rule holds when they appear.
  - "{{ faramir_user_home }}/.npmrc"
  - "{{ faramir_user_home }}/.config/pypoetry/auth.toml"
  - "{{ faramir_user_home }}/.git-credentials"
  - "{{ faramir_user_home }}/.config/git/credentials"
  - "{{ faramir_user_home }}/.cargo/credentials.toml"
  # One signed-in token per tool, each at the fixed path its tool writes. `.credentials.json`
  # is not the `credentials` name it reads like, and `config.yaml` is a config carrying a
  # model provider's API key inline. faramir configures cursor not at all, so there a rule is
  # the whole of what covers it.
  - "{{ faramir_user_home }}/.claude/.credentials.json"
  - "{{ faramir_user_home }}/.codex/auth.json"
  - "{{ faramir_user_home }}/.local/share/opencode/auth.json"
  - "{{ faramir_user_home }}/.continue/config.yaml"
  - "{{ faramir_user_home }}/.gemini/config/config.json"
  # The rest of the agents' tokens, each under the fixed name its tool writes: the pi, kilo
  # and cursor CLIs, and the two files a gemini sign-in leaves beside its config. The gemini
  # pair is not here until someone signs that CLI in, and the rule holds when it appears.
  - "{{ faramir_user_home }}/.pi/agent/auth.json"
  - "{{ faramir_user_home }}/.local/share/kilo/auth.json"
  - "{{ faramir_user_home }}/.config/cursor/auth.json"
  - "{{ faramir_user_home }}/.gemini/oauth_creds.json"
  - "{{ faramir_user_home }}/.gemini/google_accounts.json"
  # Two agent configs that carry a provider's key inline rather than naming an environment
  # variable. Blocking them means adding a model provider to either is the operator's at a
  # terminal; the MCP configs beside them name no credential and stay readable.
  - "{{ faramir_user_home }}/.config/kilo/kilo.json"
  - "{{ faramir_user_home }}/.config/opencode/opencode.json"
  # Then Claude Desktop's, the GitHub CLI's and clasp's Google refresh token. `hosts.yml` and
  # not `.config/gh`: `config.yml` beside it is aliases and editor settings, which an agent is
  # asked to edit.
  - "{{ faramir_user_home }}/.config/Claude/buddy-tokens.json"
  - "{{ faramir_user_home }}/.config/gh/hosts.yml"
  - "{{ faramir_user_home }}/.clasprc.json"
  # Docker's registry auth, which with no credsStore holds base64 user:pass and which no
  # managed ref carries, so nothing redacts it either. Blocked rather than linked: `docker
  # login` replaces the file by rename, and the replacement is created 0600, which would take
  # the broker's read with it.
  - "{{ faramir_user_home }}/.docker/config.json"
  # A cloud CLI's credential file, kept for the tool that writes it whether or not it is
  # installed here.
  - "{{ faramir_user_home }}/.aws"
  # The default location vim writes its register history to, which is content and not only
  # filenames: a register holds the text of the last yank or delete. The directory the
  # dotfiles' `vimrc` points `viminfofile` at is above; this covers any other vim.
  - "{{ faramir_user_home }}/.viminfo"
  # Claude Code's own config, which holds each MCP server's environment and so whatever key
  # was written into one. The file and not `.claude/`, which holds the instructions and the
  # settings an agent is asked to edit; `.claude/.credentials.json` is named above.
  - "{{ faramir_user_home }}/.claude.json"
  # Shell environment the dotfiles keep out of the committed `bashrc`, which is where an
  # export carrying a token goes. Beside `.private` above, and blocked for the same reason.
  - "{{ faramir_user_home }}/.bashrc.private"
  # The adb private key, which is what a paired device authorizes. The file alone, the public
  # half beside it not blocked.
  - "{{ faramir_user_home }}/.android/adbkey"
  # Zoom's signed-in session, which it keeps outside a keyring. The directory, a session
  # being more than one file.
  - "{{ faramir_user_home }}/.zoom/data"
  # Two Electron profiles keeping a signed-in session outside a keyring: the chat client's
  # under its flatpak app home, and the sync client's web view beside the config directory
  # already blocked above. The session is more than one file, so the directory in each case.
  - "{{ faramir_user_home }}/.var/app/com.discordapp.Discord"
  - "{{ faramir_user_home }}/.local/share/Insync"
  # The RubyGems API key, which publishes as its owner. Two locations because gem reads
  # whichever the environment points it at.
  - "{{ faramir_user_home }}/.gnome/.gem/credentials"
  - "{{ faramir_user_home }}/.local/share/gem/credentials"
  # Each editor's secret store, `state.vscdb` and the extensions' saved tokens beside it. The
  # globalStorage directory and not the editor's own, which holds `settings.json`, the
  # keybindings and the MCP config, all files an agent is asked to edit. The per-workspace
  # copy of `state.vscdb` is left readable: an editor writes a new one for every workspace
  # opened, and no list of paths keeps up with that.
  - "{{ faramir_user_home }}/.config/Code/User/globalStorage"
  - "{{ faramir_user_home }}/.config/Cursor/User/globalStorage"
  - "{{ faramir_user_home }}/.config/Antigravity/User/globalStorage"
  # Clipboard history, which holds whatever was copied through it, a password included.
  - "{{ faramir_user_home }}/.clipboard"
  - "{{ faramir_user_home }}/.var/app/app.getclipboard.Clipboard"

# faramir has no name form: an entry is a path or a command, and a path is absolute. So a
# rule that matched the tail of whatever an agent named, wherever it turned up, has no
# equivalent here, and what only a pattern could say is not said at all.
#
# Left uncovered by that: `*.key` and `*.pem`, whose every instance here is a CA bundle or a
# test fixture; `*.vault` and `vault.yml`, which nothing here writes; `.env*`,
# which lives in working trees that come and go; and `state.vscdb*`, which an editor writes
# once per workspace and again for each new one, so no list of paths keeps up. The
# globalStorage directory holding the secret store is blocked by path instead.
#
# Nothing reaches a file an agent opens inside a container either, where the path is the
# mount point's and not the host's.

# Commands the agent's shell is refused. Literal words, not a pattern: the space between them
# matches any run of whitespace and nothing else is special, so write what you would type.
# This reaches the command guard alone, a command being neither a path nor a file name.
#
# `mrs` is the one this fleet runs, the base role installing it on every host; the rest are
# credential managers it does not, so each of those costs nothing until one is installed. An
# alternation is spelled out, `vault read` and `vault kv get` being two.
#
# An entry matches where a command starts: the beginning of a line, after a separator, or
# behind a prefix that runs something else (`sudo`, `env`, a `VAR=value` assignment). So a
# bare word covers every use of a tool, and a spelled-out subcommand narrows the rule to that
# one use of it. Neither matches the same word inside a flag or a path argument.
#
# A heredoc line starts at a command position like any other, so writing this list through a
# shell can be refused by an entry it names. Use an editor.
#
# sops, age and ansible-vault are deliberately absent. What they would guard, faramir's own
# store and key, is covered by path, and a blanket rule would stop the operator debugging an
# unrelated file through a brokered command. `age-keygen` goes with them: it creates a key
# rather than reading one, and the file here worth writing over is under a blocked path
# already.
faramir_blocked_commands:
  # The GitHub CLI's token, which it keeps in `~/.config/gh/hosts.yml`. That file is blocked
  # by path already, so these are the other way to the same value: `gh auth token` prints it,
  # and `--show-token` (`-t`) unmasks what `gh auth status` otherwise prints as `gho_****`.
  #
  # `status` bare rather than the flag spelled out, because an entry is literal words with any
  # run of whitespace between them and nothing else: `gh auth status --show-token` matches
  # that spelling and not `gh auth status -h github.com -t`, where a flag sits between the
  # words. No entry can say "the flag anywhere among the others", so the subcommand is the
  # only form that covers every way of asking. That takes the default `gh auth status` too,
  # which prints the token masked and no value, and the check is the whole of what the refusal
  # costs.
  #
  # `git-credential` beside them, which `gh auth --help` does not list: it speaks the git
  # credential helper protocol, so a `get` on stdin returns the same token as `password=`,
  # and it reads `hosts.yml` directly whether or not `gh auth setup-git` ever configured the
  # helper.
  #
  # Not bare `gh auth`, which would also take `gh auth login` and `gh auth refresh`: those
  # write the token rather than print it, and are the operator's at a terminal anyway.
  - gh auth git-credential
  - gh auth status
  - gh auth token
  # The operator's own vault manager. Bare, so every subcommand goes with it: `export` and
  # `search` print secrets, `edit` decrypts a vault into $EDITOR, `add` writes to one, and
  # `vault delete` destroys one. That takes `vault list` and `vault default` too, which print
  # names and paths and no secrets, and the listing is the whole of what the refusal costs.
  - mrs
  - op read
  - op item get
  - op inject
  - pass show
  # Bare, unlike `pass show` above: no flag on this fleet carries the word, so every
  # subcommand is covered rather than the one spelling.
  - gopass
  - vault read
  - vault kv get

# Credentials another tool owns, read where that tool keeps them rather than copied into the
# store. One entry per ref: `ref`, `path`, `type` (`text`, `base64`, `json`, `yaml`, `toml`,
# `ini`) and `key` for the four that select.
#
# Empty here and set in `host_vars`, unlike the blocked paths above: `link add` refuses a new
# entry whose file is not there, so a link named in defaults fails the run on a controller
# that does not have that file.
#
# A link is the stronger entry, and the one that can stop the host. What it grants, when to
# prefer a block, and why a linked path does not also go in `faramir_blocked_paths`:
# README.md.
#
# Written --strict, as the blocks above are: the file is named by ref and never by path.
faramir_links: []

# What a linked file is set to, so the broker keeps reading it. The broker is the only
# account that opens one, so its own group is tighter than the client group, which would
# add the executor and the operator to the readership of a credential neither needs.
#
# 0640 rather than 0600: the file stays the owning tool's to write, and the broker only
# reads it. A file the broker cannot read stops every brokered command, not just the ones
# wanting that ref, so this is converged rather than left to whatever wrote the file last.
faramir_link_file_group: faramir-broker
faramir_link_file_mode: "0640"

# The agent home's mode, and the group faramir admits through it. init grants the client
# group traversal here; converging it means a home that loses the group is put back on the
# next run rather than staying broken until a brokered command reports it. 0710 rather than
# 0750: traversal is what the group needs, and a listing is not.
faramir_user_home_mode: "0710"

# Whether tasks/ssh.yml authorizes the key and the NOPASSWD sudo, or removes both.
faramir_fleet_authorize_key: true

# System-wide, so one file covers the executor, the renewal cron's root and the operator,
# and survives a service account being recreated.
faramir_fleet_known_hosts_path: /etc/ssh/ssh_known_hosts

# The name ssh looks an entry up under: the address ansible dials, bracketed with the port
# when that is not 22. An entry under any other name is never consulted.
faramir_fleet_known_hosts_name: >-
  {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ (ansible_port | int))
     if (ansible_port | default(22) | int) != 22
     else (ansible_host | default(inventory_hostname)) }}

# Undefined, so the module picks ~/.ssh/authorized_keys; set in host_vars for a host that
# regenerates that file, as the pfSense routers do.
# faramir_fleet_authorized_keys_path: /root/.ssh/authorized_keys2
