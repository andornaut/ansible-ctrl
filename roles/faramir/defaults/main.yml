---
# The operator's own login account: it owns the working tree and is who the
# broker is installed for. Never a second account, and never created here.
#
# There is no account for the coding agent: it runs as this one. A separate uid
# could not reach the operator's checkouts, gh credential or commit identity,
# which is the work it is asked to do. See docs/scope.md in the faramir checkout
# for what that gives up and what still holds.
faramir_user: "{{ primary_user }}"

# Shared group giving the agent and the three service accounts access to the
# working tree. Not a boundary; the boundaries are file modes.
#
# Passed to `faramir init`, which renders both the config the sockets check and
# the units that reach the working tree from it. The two cannot disagree, so
# this is an ordinary knob rather than a value that has to be kept in agreement
# with faramir's own files by hand.
faramir_dev_group: dev

# The three service uids. Passed to init, which renders the units and the config
# from them, so these are likewise free to change.
faramir_broker_user: faramir-broker
faramir_keeper_user: faramir-keeper
faramir_exec_user: faramir-exec

# Where the base config and its drop-ins are installed. In the operator's home
# for the same reason as the store, with one difference that matters: a config
# the daemons cannot read is a daemon that will not start, where an unreadable
# store only empties the value set. The units are socket activated, so nothing
# tries before the operator has logged in.
faramir_config_dir: "{{ faramir_user_home }}/.faramir"

# Where the store lives. In the operator's home, which it can be because being
# in a home grants nothing: the directory is 2750 root:faramir-keeper, and that
# is the keeper's own group, so the account whose home it is cannot open a file
# in it. Editing one is `sudo faramir edit`.
#
# The keeper reaches it through a bind of this one directory into an otherwise
# empty /home, rather than by giving up ProtectHome.
#
# No list of files goes with it. faramir's base config globs this directory, so
# a sops file put here is managed by being here.
#
# Derived rather than passed: init takes no flag for it and always puts the
# store under the config directory, so the age key cannot be left behind by a
# store that moved. Named here because the checks and the docs refer to it.
faramir_secrets_dir: "{{ faramir_config_dir }}/secrets"

# The SSH identity the broker lends to brokered commands through an agent it
# owns. Generated by init when missing, and rendered into config.toml as
# [ssh] keys on every run, so this is the only place it is named.
#
# A key of the broker's own rather than the operator's. The executor's uid can
# authenticate with it without being able to read it, and the fleet can revoke
# the agent's reach without rotating the key the operator uses.
#
# Set empty to leave [ssh] keys unset, which is a working setup but not a
# recommended one: the keys then have to live where the executor's own uid can
# read them. The public key is printed at the end of every run; it opens nothing
# until faramir_fleet.yml puts it in authorized_keys on the managed hosts.
faramir_broker_ssh_key: /var/lib/faramir-broker/.ssh/id_ed25519

# Register faramir's PreToolUse hook in this checkout's own agent settings, which
# is what redacts the output of everything the agent runs here.
#
# It auto-approves Bash in this checkout as a consequence: the hook rewrites
# every command so the output can be redacted, and a rewritten command matches no
# permission rule, so the hook's deny list is what refuses one instead. That
# trade is worth making where managed credentials are in play, which is what this
# checkout is for. Set false to keep Bash prompts here and get no redaction.
faramir_project_hook: true

# Agents this checkout is enrolled for, one --agent each. Each gets the hook
# above, its MCP server config and its share of the credentials block.
# Known: claude, gemini, kilocode, opencode.
faramir_project_agents:
  - claude

# Agents whose own settings get faramir's Read deny rules, one --agent each.
# They refuse to open key material wherever the agent is working and take
# nothing away. Empty installs none. Known: claude, gemini, kilocode, opencode.
#
# The PreToolUse hook is a separate, per-project decision that neither init nor
# this role makes: registering it auto-approves Bash for that project.
faramir_account_agents:
  - claude

# Whether faramir_fleet.yml authorizes the broker's public key on the managed
# hosts and grants that account NOPASSWD sudo, or removes both. This role never
# reads it; the entry is here so the flag is documented where the rest are. That
# play applies no role and so defaults it itself, which is also why it must not
# bind the name at play or task scope: either would outrank host_vars and pin it
# to true.
#
# It writes to production hosts, so it is a separate play rather than something
# the controller-side role does behind your back.
faramir_fleet_authorize_key: true
