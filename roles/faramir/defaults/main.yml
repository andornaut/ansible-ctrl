---
# The one host the broker is installed on, and whose key the fleet authorizes: the
# single member of the `faramir` group. Derived rather than named, this repo being
# public and the inventory being where a host's name belongs.
#
# Empty unless that group holds exactly one host, rather than taking the first of
# however many: with a bare index, adding a host to the group or reordering it would
# move the broker to a different machine and distribute a different key, and nothing
# would say so. Empty fails both asserts below with the group's contents in the message.
faramir_controller: >-
  {{ (groups['faramir'] | default([]))[0]
     if (groups['faramir'] | default([])) | length == 1
     else '' }}

# The release whose assets are installed. `dev` is the rolling one CI re-cuts on every push
# to faramir's main, so each run installs whatever that tag points at now and the version on
# the host is only ever the last run's. A version tag (`v0.5.0`) pins instead.
#
# The tag is named rather than resolved through the API: `dev` is published with
# make_latest=false, so GitHub's /releases/latest never returns it.
faramir_release_tag: dev

# The operator's login account, which owns the working tree and the coding agent runs as.
# Never created here.
faramir_user: "{{ primary_user }}"

# Gives the agent and the service accounts the working tree. Not a boundary; file modes are.
faramir_client_group: dev

# Holds the age key, the broker's SSH key and the store. In the operator's encrypted home,
# so a powered-off disk carries none of them and socket activation reads nothing before
# first login.
faramir_config_dir: "{{ faramir_user_home }}/.config/faramir"

# One --agent each, passed to both init and init-project: the account-wide deny rules, and in
# the tree the redaction hook, the MCP server config and the credentials block. Every agent
# the dev role installs that faramir knows, named rather than left to its `auto`, which reads
# what a home or a tree already carries and so covers an agent only after it has run once
# unguarded. What each one gets is in the README. Known: antigravity, claude, kilocode,
# opencode, pi.
faramir_agents:
  - antigravity
  - claude
  - kilocode
  - opencode
  - pi

# Whether a brokered command may ASK to sudo on the controller. It cannot sudo on its own:
# the executor's sudoers entry authenticates through a PAM service that asks the broker
# whether a human approved that command, so no password exists anywhere. Re-running without
# it takes the grant away.
#
# It is not only an escalation path: the executor unit drops NoNewPrivileges=, and with it the
# seccomp filter and ProtectSystem=strict, because a filter forces NoNewPrivileges= on and
# that makes every setuid binary inert, sudo included. So the hardening comes off the uid
# every brokered command runs as the moment this is true, whether or not anything is ever
# approved.
faramir_allow_sudo: false

# kernel.yama.ptrace_scope on the controller. 1 restricts ptrace to a process's own
# descendants, which is Debian and Ubuntu's default and what RHEL, Fedora and Arch leave at
# 0. Pinned rather than assumed: at 0 any process may ptrace any other of the same uid, and
# every brokered command shares the executor's, so one could read another's environment and
# with it the injected values and the escalation token.
#
# It matters most where a grant exists. The executor unit carries SystemCallFilter=
# excluding @ptrace and so refuses the syscall outright, except on a host installed with
# --allow-sudo, which cannot carry a filter: one forces NoNewPrivileges= on and that makes
# sudo inert. Set here regardless, being the operator's own account's protection too.
#
# `~` leaves the host's value alone, for a box that needs 0 for a debugger. Higher than 1 is
# accepted: 2 is admin-only and 3 refuses ptrace entirely, and faramir asks only that it not
# be 0.
faramir_ptrace_scope: 1

# What announces a waiting escalation, one list element per argument. Empty leaves
# `sudo faramir escalations --watch` as the only place a question shows up, and a
# question nobody sees expires after [escalation] timeout_sec with every other brokered
# command on the host refused until it does.
#
# Passed only when faramir_allow_sudo is true, there being no [escalation] section to announce
# otherwise and init refusing the pair. It must name "{prompt}" or "{id}"; keep "{id}" off
# anything that broadcasts, wall reaching every terminal on the host and the coding agent
# having one.
#
# The broker execs this as the account holding every decrypted value, with a fixed PATH and
# nothing else, so anything wanting the operator's session is out: /run/user/<uid> is 0700
# and the broker is not that uid. wall works because it is setgid tty; a request to
# something on the network works because the unit permits AF_INET.
faramir_notify_command: []

# How long a sudo question waits for a human before it is refused, 1 to 600, against
# faramir's own default of 120. Long enough to reach the terminal running
# `sudo faramir escalations --watch`, which is where the question shows up while
# faramir_notify_command is empty.
#
# It is a window, not a grace period: silence is a refusal either way, and raising it only
# moves when that refusal lands. The cost of a longer one is that a question nobody answers
# holds every other brokered command on the host until it expires.
#
# Passed only when faramir_allow_sudo is true, as faramir_notify_command is: without the
# grant there is no [escalation] section for it to land in.
faramir_escalation_timeout_sec: 300

# Paths the agent's file tools are refused, on top of the names and suffixes faramir's own
# rules already carry: `id_rsa` and its kind, `*.key`, `*.pem`, a `credentials` path
# component, `.env*` dotfiles, sops and vault files, and the sops, age and faramir
# directories. What is listed here is what those miss.
#
# Absolute and in shortest form, a rule matching the path as written; no `~`, which nothing
# expands. A directory refuses everything under it, and a path that is not there is recorded
# and holds if it appears, which is what covers a home that is not mounted.
#
# It stops the agent's own file tools and nothing else: the file is never opened, so its mode
# is left alone and its value is in no redactor. A brokered command whose mode allows it may
# still read one of these and print it in the clear. `faramir_links` is the entry that covers
# both, at the price of faramir holding the value.
faramir_refused_paths:
  # The operator's own credential store, and the keys and keyrings beside it.
  - "{{ faramir_user_home }}/.private"
  - "{{ faramir_user_home }}/.gnupg"
  - "{{ faramir_user_home }}/.local/share/keyrings"
  # The agent's own OAuth token. `.credentials.json` is not the `credentials` component
  # faramir's rules name, so nothing else covers it.
  - "{{ faramir_user_home }}/.claude/.credentials.json"
  # Registry auth in the clear: with no credsStore, `auths` holds base64 user:pass, and no
  # managed ref carries those, so nothing redacts them either. Refused rather than linked
  # because `docker login` replaces the file by rename and the replacement is created 0600,
  # which takes the broker's read with it and leaves it refusing every ref until the next
  # run of this role grants it again.
  - "{{ faramir_user_home }}/.docker/config.json"
  # The browser credential stores: logins.json and key4.db, Login Data and its keyring entry.
  # The profile directory rather than those files, a rule being a literal path with no glob
  # and the directory holding them named after a random string. Nothing here manages a
  # browser profile: the policy files this repo deploys are under /etc.
  - "{{ faramir_user_home }}/.mozilla"
  - "{{ faramir_user_home }}/.config/google-chrome"
  - "{{ faramir_user_home }}/.config/chromium"

# Credentials another tool owns, read where that tool keeps them rather than copied into the
# store. One entry per ref: `ref`, `path`, `type` (`text`, `base64`, `json`, `yaml`, `toml`,
# `ini`) and `key` for the four that select.
#
# Empty here and set in `host_vars`, unlike the refused paths above: `link add` refuses a new
# entry whose file is not there, so a link named in defaults fails the run on a controller
# that does not have that file, while an absent refused path is recorded and warned about.
#
# A link is the stronger of the two entries. It refuses the path to the agent's file tools as
# a refusal does, and on top of that regroups the file so a brokered command is refused it
# too, and puts the value in the redactor. So a linked path does not also belong in
# `faramir_refused_paths`, where it would render the same rule and nothing else.
#
# It is also the one that can stop the host: a linked file that is there and will not read
# leaves the broker refusing `run` and `redact` for every ref until it is fixed, and a tool
# that rewrites its own file by rename takes the broker's read with it. A re-run of this role
# grants it again; between runs the agent has no broker. Prefer a refusal for a credential no
# brokered command asks for by name, and reserve a link for a file its owning tool rewrites
# in place.
#
# The ref namespace is the store's, so a name here that the store defines is refused, and a
# ref this install already defines against a different file, type or key is refused too
# rather than replaced.
faramir_links: []

# Whether tasks/ssh.yml authorizes the key and the NOPASSWD sudo, or removes both.
faramir_fleet_authorize_key: true

# System-wide, so one file covers the executor, the renewal cron's root and the operator,
# and survives a service account being recreated.
faramir_fleet_known_hosts_path: /etc/ssh/ssh_known_hosts

# The name ssh looks an entry up under: the address ansible dials, bracketed with the port
# when that is not 22. An entry under any other name is never consulted.
faramir_fleet_known_hosts_name: >-
  {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ (ansible_port | int))
     if (ansible_port | default(22) | int) != 22
     else (ansible_host | default(inventory_hostname)) }}

# Undefined, so the module picks ~/.ssh/authorized_keys; set in host_vars for a host that
# regenerates that file, as the pfSense routers do.
# faramir_fleet_authorized_keys_path: /root/.ssh/authorized_keys2
