---
# The single member of the `faramir_controller` group, derived because this repo is public.
# Empty unless the group holds exactly one host, so a second host fails the asserts rather
# than silently moving the enrolment and the distributed key to another machine.
faramir_controller_host: >-
  {{ (groups['faramir_controller'] | default([]))[0]
     if (groups['faramir_controller'] | default([])) | length == 1
     else '' }}

faramir_release_tag: dev

# The operator's login account, which owns the working tree and which the agent runs as.
# Never created here.
faramir_user: "{{ primary_user }}"

faramir_client_group: dev

faramir_config_dir: "{{ faramir_user_home }}/.config/faramir"

faramir_agents:
  - antigravity
  - claude
  - codex
  - kilocode
  - opencode
  - pi

# true also drops the executor unit's seccomp filter and ProtectSystem=strict: README.md.
faramir_allow_sudo: false

faramir_ptrace_scope: 1

# Keep "{id}" off anything that broadcasts: wall reaches every terminal, the agent's included.
faramir_notify_command: []

faramir_sudo_timeout_sec: 600

# Relative to each home, shortest form, no leading slash or `~`. What each entry holds and
# why it has its shape: README.md, "Blocked home paths".
faramir_blocked_home_paths:
  - ".private"
  - ".gnupg"
  - ".local/share/keyrings"
  - ".local/share/mrs"
  - ".pki"
  - ".local/share/pki"
  - ".config/sops"
  - ".age"
  - ".netrc"
  - ".pgpass"
  - ".kube/config"
  - ".ssh/id_*"
  - ".config/MQTT-Explorer"
  - ".irssi"
  - ".config/google-chrome*"
  - ".config/chromium"
  - ".var/app/org.mozilla.firefox"
  - ".mozilla"
  - ".var/app/org.chromium.Chromium"
  - ".var/app/org.filezillaproject.Filezilla"
  - ".config/Insync"
  - ".config/itch"
  - ".var/app/io.github.wyze3306.BedrockOnLinux"
  # Game launchers go file by file, leaving their game databases and logs readable.
  - ".var/app/net.lutris.Lutris/cache/lutris/.amazon.auth"
  - ".var/app/net.lutris.Lutris/cache/lutris/.gog.auth"
  - ".var/app/net.lutris.Lutris/cache/lutris/.gog.token"
  - ".var/app/net.lutris.Lutris/cache/lutris/.humblebundle.auth"
  - ".var/app/net.lutris.Lutris/cache/lutris/auth-token"
  - ".var/app/net.lutris.Lutris/cache/lutris/user.json"
  - ".var/app/net.lutris.Lutris/cache/lutris/amazon"
  - ".var/app/net.lutris.Lutris/cache/lutris/ea_app"
  - ".var/app/net.lutris.Lutris/cache/lutris/egs"
  - ".var/app/net.lutris.Lutris/cache/lutris/gog"
  - ".var/app/net.lutris.Lutris/cache/lutris/humblebundle"
  - ".var/app/net.lutris.Lutris/cache/lutris/origin"
  - ".var/app/net.lutris.Lutris/cache/lutris/ubisoft"
  - ".var/app/net.lutris.Lutris/cache/lutris/CacheStorage"
  - ".var/app/net.lutris.Lutris/cache/lutris/WebKitCache"
  - ".var/app/net.lutris.Lutris/data/lutris/localstorage"
  - ".var/app/net.lutris.Lutris/data/lutris/storage"
  - ".var/app/net.lutris.Lutris/data/lutris/databases"
  # Every spelling of Steam's tree is load-bearing: rules match the path as written and
  # resolve no symlink, so dropping a symlink entry opens its whole subtree.
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/config.vdf"
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/loginusers.vdf"
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/cefdata"
  - ".var/app/com.valvesoftware.Steam/data/Steam/config/htmlcache"
  - ".var/app/com.valvesoftware.Steam/data/Steam/local.vdf"
  - ".var/app/com.valvesoftware.Steam/data/Steam/ssfn*"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/config.vdf"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/loginusers.vdf"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/cefdata"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/config/htmlcache"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/local.vdf"
  - ".var/app/com.valvesoftware.Steam/.local/share/Steam/ssfn*"
  - ".var/app/com.valvesoftware.Steam/.steam/root"
  - ".var/app/com.valvesoftware.Steam/.steam/steam"
  - ".var/app/com.valvesoftware.Steam/.steam/steam.token"
  - ".local/share/Steam/config/config.vdf"
  - ".local/share/Steam/config/loginusers.vdf"
  - ".local/share/Steam/config/cefdata"
  - ".local/share/Steam/config/htmlcache"
  - ".local/share/Steam/local.vdf"
  - ".local/share/Steam/ssfn*"
  - ".steam/root"
  - ".steam/steam"
  - ".steam/steam.token"
  - ".var/app/com.heroicgameslauncher.hgl/config/legendary/user.json"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/legendaryConfig"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/gogdlConfig"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/nile_config"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/gog_store/auth.json"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Cookies*"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Partitions"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Local Storage"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Session Storage"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/IndexedDB"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Service Worker"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/WebStorage"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Local State"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Network Persistent State"
  - ".var/app/com.heroicgameslauncher.hgl/config/heroic/Trust Tokens*"
  - ".vim/tmp"
  - ".npmrc"
  - ".config/pypoetry/auth.toml"
  - ".git-credentials"
  - ".config/git/credentials"
  - ".cargo/credentials.toml"
  - ".claude/.credentials.json"
  - ".codex/auth.json"
  - ".local/share/opencode/auth.json"
  - ".continue/config.yaml"
  - ".gemini/config/config.json"
  - ".pi/agent/auth.json"
  - ".local/share/kilo/auth.json"
  - ".config/cursor/auth.json"
  - ".gemini/oauth_creds.json"
  - ".gemini/google_accounts.json"
  - ".config/kilo/kilo.json"
  - ".config/kilo/kilo.jsonc"
  - ".config/opencode/opencode.json"
  - ".config/opencode/opencode.jsonc"
  - ".config/gh/hosts.yml"
  - ".clasprc.json"
  - ".docker/config.json"
  - ".viminfo"
  - ".claude.json"
  - ".claude/daemon"
  - ".claude/sessions"
  - ".bashrc.private"
  - ".android/adbkey"
  - ".zoom/data"
  - ".var/app/com.discordapp.Discord"
  - ".local/share/Insync"
  - ".gnome/.gem/credentials"
  - ".local/share/gem/credentials"
  - ".vscode-shared/sharedStorage"
  - ".clipboard"
  - ".var/app/app.getclipboard.Clipboard"
  - ".config/Code"
  - ".config/Cursor"
  - ".config/Antigravity"
  - ".config/Claude"
  - ".config/uhk-agent"
  - ".config/ExpressLRS Configurator"
  - ".config/betaflight-configurator"
  - ".local/share/org.coolercontrol.CoolerControl"
  - ".minecraft/webcache"

faramir_shared_user_homes: []
# Absolute paths outside any home, blocked as they are: host_vars, for what only one host has.
faramir_blocked_system_paths: []
# Literal words: README.md, "Blocked commands".
faramir_blocked_commands:
  - gh auth git-credential
  - gh auth status
  - gh auth token
  - mrs
  - op read
  - op item get
  - op inject
  - pass show
  - gopass
  - vault read
  - vault kv get

faramir_links: []

faramir_link_file_group: faramir-broker
faramir_link_file_mode: "0640"

faramir_user_home_mode: "0710"

# Whether tasks/ssh.yml authorizes the key and the NOPASSWD sudo, or removes both.
faramir_fleet_authorize_key: true

# System-wide, so one file covers the executor, the renewal cron's root and the operator,
# and survives a service account being recreated.
faramir_fleet_known_hosts_path: /etc/ssh/ssh_known_hosts

# The name ssh looks an entry up under: the address ansible dials, bracketed with the port
# when that is not 22. An entry under any other name is never consulted.
faramir_fleet_known_hosts_name: >-
  {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ (ansible_port | int))
     if (ansible_port | default(22) | int) != 22
     else (ansible_host | default(inventory_hostname)) }}

# Undefined, so the module picks ~/.ssh/authorized_keys, and a host in the routers group
# /root/.ssh/authorized_keys2. Set in host_vars for any other host that regenerates that file.
# faramir_fleet_authorized_keys_path: /root/.ssh/authorized_keys2
