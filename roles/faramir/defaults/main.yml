---
# The one host the broker is installed on, and whose key the fleet authorizes. Named rather
# than taken as the faramir group's first member, which would let a second in silently.
# Matched against inventory_hostname exactly.
faramir_controller: controller

# The operator's login account, owning the working tree. Never created here, and
# never a second account: the coding agent runs as this one.
faramir_user: "{{ primary_user }}"

# Gives the agent and the service accounts the working tree. Not a boundary; the
# boundaries are file modes.
faramir_client_group: dev

# The base config and its drop-ins, with the age key, the broker's SSH key and the store
# under it. In the operator's encrypted home, so a powered-off disk carries none of them,
# and at faramir's documented per-operator placement, which its deny rules name by hand as
# well as deriving from the installed path. The units are socket activated, so nothing
# reads it before first login.
#
# init grants the client group traversal of every directory from the home down, so this
# also makes ~/.config passable by the broker and the executor: execute without read, so
# what is inside stays governed by its own mode.
faramir_config_dir: "{{ faramir_user_home }}/.config/faramir"

# One --agent each, passed to both init and init-project: the account-wide Read deny
# rules, and in the tree the redaction hook, the MCP server config and the credentials
# block. Known: claude, gemini, kilocode, opencode.
faramir_agents:
  - claude

# Whether tasks/ssh.yml authorizes the key and the NOPASSWD sudo, or removes both.
# A default rather than a play var, so host_vars can turn it off per host.
faramir_fleet_authorize_key: true

# Where tasks/ssh.yml pins the fleet's SSH host keys. System-wide rather than under the
# executor's home: ssh reads it for every uid on the controller, so one file covers the
# executor, the cert-renewal cron's root and the operator alike, and it survives the
# service accounts being recreated. Public keys only, hence world-readable.
faramir_fleet_known_hosts_path: /etc/ssh/ssh_known_hosts

# The name ssh looks an entry up under: the address ansible dials, bracketed with the port
# when that is not 22. An entry filed under any other name is never consulted, so this has
# to track whatever the inventory sets rather than the host's own idea of its name.
faramir_fleet_known_hosts_name: >-
  {{ ('[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ (ansible_port | int))
     if (ansible_port | default(22) | int) != 22
     else (ansible_host | default(inventory_hostname)) }}

# Where tasks/ssh.yml writes the broker's key, when the host's own default will not hold
# it. Undefined here, so the authorized_key module picks ~/.ssh/authorized_keys; set in
# host_vars for a host that manages that file itself. The pfSense routers do: it is
# generated from config.xml on boot and on every user save, so their key goes in
# ~/.ssh/authorized_keys2, which sshd reads by default and pfSense leaves alone.
# faramir_fleet_authorized_keys_path: /root/.ssh/authorized_keys2
