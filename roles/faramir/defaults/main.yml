---
# The one host the broker is installed on, and whose key the fleet authorizes.
# Named rather than taken as the faramir group's first member, which would let a
# second in silently. Matched against inventory_hostname exactly.
faramir_controller: tron

# The operator's login account, owning the working tree. Never created here, and
# never a second account: the coding agent runs as this one.
faramir_user: "{{ primary_user }}"

# Gives the agent and the service accounts the working tree. Not a boundary; the
# boundaries are file modes.
faramir_dev_group: dev

# Passed to init, which renders the units and config from them, so free to change.
faramir_broker_user: faramir-broker
faramir_keeper_user: faramir-keeper
faramir_exec_user: faramir-exec

# The base config and its drop-ins, with the age key and store under it. In the
# operator's encrypted home, so a powered-off disk carries neither ciphertext nor
# key. The units are socket activated, so nothing reads it before first login.
faramir_config_dir: "{{ faramir_user_home }}/.faramir"

# The identity the broker lends to brokered commands, generated by init when
# missing. Empty leaves [ssh] unset, which works but puts the keys where the
# executor's uid can read them. It opens nothing until tasks/ssh.yml has run.
faramir_broker_ssh_key: /var/lib/faramir-broker/.ssh/id_ed25519

# faramir's PreToolUse hook, which redacts the output of everything the agent runs
# here. It auto-approves Bash as a consequence: the hook rewrites every command,
# and a rewritten command matches no permission rule, so the hook's deny list
# refuses one instead. False keeps the Bash prompts and gets no redaction.
faramir_project_hook: true

# One --agent each. Each gets the hook above, its MCP server config and its share
# of the credentials block. Known: claude, gemini, kilocode, opencode.
faramir_project_agents:
  - claude

# One --agent each, for faramir's Read deny rules. Account-wide, unlike the hook
# above, the rules taking nothing away. Empty installs none.
faramir_account_agents:
  - claude

# Whether tasks/ssh.yml authorizes the key and the NOPASSWD sudo, or removes both.
# A default rather than a play var, so host_vars can turn it off per host.
faramir_fleet_authorize_key: true
