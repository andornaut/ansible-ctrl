---
# Install the broker on the controller. Applied to the faramir group as faramir.yml's first
# play, through main.yml. What this adds over `faramir init` is in the README; the accounts,
# directories, age key and units belong to faramir.

# First, and matched against faramir_controller rather than group membership: this entry
# point provisions whichever host it runs on, while ssh.yml next door covers hosts: all.
# The working-tree check below is not a backstop for it.
- name: Require the controller
  ansible.builtin.assert:
    that: inventory_hostname == faramir_controller
    fail_msg: >-
      This role installs the broker on {{ faramir_controller }}, the controller:
      service accounts, systemd units, the age key and root's config directory.
      {{ inventory_hostname }} is not that host. Apply it with make faramir,
      whose first play targets the faramir group. Authorizing the broker's key
      on this host is that run's second play, which applies tasks/ssh.yml. If
      the controller was renamed or replaced, faramir_controller is where its
      name is set.
    quiet: true
  tags: always

# faramir_user_home indexes this; the config dir, store and age key hang off it.
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd
  tags: always

- name: Validate the faramir account
  ansible.builtin.assert:
    that:
      # Inventory data, so an omission would otherwise surface several tasks later.
      - faramir_user is defined and faramir_user | length > 0
      - faramir_user != "root"
      # faramir_user_home indexes the passwd entry, so an account this host does
      # not have would otherwise fail on a missing dictionary key.
      - faramir_user in ansible_facts["getent_passwd"]
    fail_msg: >-
      faramir_user must be an existing non-root account on this host. Set
      primary_user in the inventory (or faramir_user in host_vars) to the
      account the coding agent runs as.
    quiet: true
  tags: always

# Brokered commands run in the checkout this play was run from, which playbook_dir names.
# That path is the controller's, so this also catches a remote host in the faramir
# group.
- name: Check for the working tree
  ansible.builtin.stat:
    path: "{{ playbook_dir }}"
  register: faramir_worktree_dir

- name: Require the working tree
  ansible.builtin.assert:
    that: faramir_worktree_dir.stat.isdir | default(false)
    fail_msg: >-
      No directory at {{ playbook_dir }} on this host. faramir enrols the
      checkout the play was run from, so this role applies only to the
      controller holding that checkout.
    quiet: true

# Asserted, not installed: roles here declare no dependencies, and a second installer
# would drift from the dev role's.
- name: Require sops
  ansible.builtin.include_tasks: require_tools.yml
  vars:
    require_tools:
      - name: sops
        probe: command -v sops
        hint: "It comes from the dev role: make dev -- --tags sops"

# CLEANUP (added 2026-08-09): remove once the controller has run this play. Earlier
# versions kept the broker's key in the broker account's home. Moved rather than left for
# init to regenerate: the managed hosts authorize this key, and a new one would reach none
# of them until the fleet play had run. init re-asserts the directory and both halves'
# ownership afterwards, so nothing here needs the broker account's name. Only the two
# files move: the directory they came out of is the broker account's .ssh, holding the
# known_hosts brokered runs verify the fleet against.
- name: Move the broker's SSH key under the config directory
  become: true
  block:
    - name: Check for a broker key at the previous path
      ansible.builtin.stat:
        path: /var/lib/faramir-broker/.ssh/id_ed25519
      register: faramir_previous_ssh_key

    - name: Check for a broker key at the current path
      ansible.builtin.stat:
        path: "{{ faramir_broker_ssh_key }}"
      register: faramir_current_ssh_key

    - name: Move both halves
      when:
        - faramir_previous_ssh_key.stat.exists
        - not faramir_current_ssh_key.stat.exists
      block:
        - name: Create the key directory
          ansible.builtin.file:
            path: "{{ faramir_broker_ssh_key | dirname }}"
            state: directory
            mode: "0700"

        # mv, which keeps the owner and mode the broker needs and leaves no window
        # with the key in two places.
        - name: Move the key
          ansible.builtin.command:
            argv:
              - mv
              - "{{ item.src }}"
              - "{{ item.dest }}"
          loop:
            - src: /var/lib/faramir-broker/.ssh/id_ed25519
              dest: "{{ faramir_broker_ssh_key }}"
            - src: /var/lib/faramir-broker/.ssh/id_ed25519.pub
              dest: "{{ faramir_broker_ssh_key }}.pub"
          changed_when: true

# Staged, not kept: init installs the binary it was run from, so anything left here would
# be a second copy nothing updates. ~7MB a run. Runs under --check too, where init gets
# --dry-run and still needs a binary to preflight with.
- name: Install faramir from the dev release
  block:
    - name: Create a temporary directory for the faramir release
      ansible.builtin.tempfile:
        state: directory
      register: faramir_release_tmp
      check_mode: false

    - name: Download the faramir release archive
      ansible.builtin.get_url:
        url: "{{ faramir_release_url }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_release_tmp.path }}/{{ faramir_release_archive }}"
        # `dev` is a moving tag, so a download straddling a re-cut fails the
        # checksum rather than installing mismatched binaries.
        checksum: "sha256:{{ faramir_release_url }}/checksums.txt"
        mode: "0644"
      check_mode: false
      # A redirect to object storage, so failures here are network failures.
      register: faramir_download
      until: faramir_download is succeeded
      retries: 3
      delay: 5

    # Beside the archive: init installs only the binary it was run from.
    - name: Unpack the faramir binary
      ansible.builtin.unarchive:
        src: "{{ faramir_release_tmp.path }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_release_tmp.path }}"
        remote_src: true
        # Applied to the unpacked binary, whose archive mode tar drops through
        # the umask; the next task runs it.
        mode: "0755"
      check_mode: false

    # init reports per step in JSON, so changed_when reads its answer rather than
    # inferring one. Guarded on stdout: changed_when is evaluated even on failure, where
    # an empty report would add a parse error to the real one.
    - name: Install faramir
      ansible.builtin.command:
        argv: "{{ faramir_init_argv }}"
      become: true
      register: faramir_init
      check_mode: false
      changed_when: faramir_init.stdout | length > 0 and (faramir_init.stdout | from_json).changed

    - name: Read what the install did
      ansible.builtin.set_fact:
        faramir_report: "{{ faramir_init.stdout | from_json }}"
  always:
    - name: Remove the temporary directory for the faramir binaries
      ansible.builtin.file:
        path: "{{ faramir_release_tmp.path }}"
        state: absent
      when: faramir_release_tmp.path is defined
      # check_mode: false with the rest of the block, or every --check run leaks
      # an unpacked archive into /tmp.
      check_mode: false

# After provisioning, so it reads the client group out of the config init installed rather
# than being told twice. Only this checkout; enrol another with `cd <dir> && sudo faramir
# init-project`. Runs the installed binary, the staging directory being gone, so a first
# --check run on a fresh host skips.
- name: Check for the installed faramir binary
  ansible.builtin.stat:
    path: "{{ faramir_binary }}"
  register: faramir_binary_stat

- name: Enrol this checkout as a faramir project
  ansible.builtin.command:
    argv: "{{ faramir_init_project_argv }}"
  become: true
  register: faramir_project
  check_mode: false
  changed_when: faramir_project.stdout | length > 0 and (faramir_project.stdout | from_json).changed
  when: faramir_binary_stat.stat.exists | default(false)

# Guarded, the task above being skipped under --check on a host with no binary yet,
# which leaves the register without stdout.
- name: Read what the enrolment did
  ansible.builtin.set_fact:
    faramir_project_report: "{{ faramir_project.stdout | from_json }}"
  when: faramir_project.stdout | default('') | length > 0

# init and init-project warn rather than fail on what installs cleanly and does nothing: a
# group membership needing a fresh login, an executor in the broker's group, an
# account-wide hook. One per line; an empty list skips the task.
- name: Show what faramir warned about
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ (faramir_report.warnings | default([])) + (faramir_project_report.warnings | default([])) }}"

# This project names no secrets file: faramir's base config globs the store
# directory, so a sops file is managed by being in it.

# faramir's own agent snippet covers the broker, not this repo. Without these two
# flags a brokered run reaches the wrong hosts or no credentials at all.
- name: Tell the agent how to run a playbook through the broker
  ansible.builtin.blockinfile:
    # The target, not the CLAUDE.md symlink: blockinfile writes through either,
    # but a host without the symlink would end up with two divergent files.
    path: "{{ playbook_dir }}/AGENTS.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_client_group }}"
    # Group-writable like the rest of the tree: init-project adds group write to
    # every file, so 0644 here would never converge.
    mode: "0664"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Run a
      playbook with both of these:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir'` excludes the controller, which a brokered
      run cannot configure: commands run as a uid with no sudo there, so those
      tasks fail after the rest of the run has already applied. The operator
      applies the controller's own playbooks.

      `faramir_list_secrets` shows the available names. Do not use `make`: it is
      the operator's entry point and prompts for a sudo password, which a
      brokered command has no terminal to answer.
  become: true

# A broker serving zero refs, an agent holding no key and an unrecognised client group all
# look like a healthy install: units up, nothing reachable. Skipped under --check, where
# init wrote nothing to examine.
- name: Check that the install works
  when: not ansible_check_mode
  block:
    - name: Ask faramir whether the install is doing its job
      ansible.builtin.command:
        argv: "{{ faramir_doctor_argv }}"
      become: true
      register: faramir_doctor
      changed_when: false
      failed_when: false

    # A doctor that cannot run at all leaves stdout empty, which the tasks below
    # would report as a parse error naming nothing.
    - name: Require faramir doctor to have reported
      ansible.builtin.assert:
        that: faramir_doctor.stdout | length > 0
        fail_msg: >-
          faramir doctor produced no report: rc {{ faramir_doctor.rc }},
          {{ faramir_doctor.stderr | default('no stderr') }}.
        quiet: true

    - name: Read what faramir doctor found
      ansible.builtin.set_fact:
        faramir_doctor_report: "{{ faramir_doctor.stdout | from_json }}"

    - name: Show what faramir doctor found
      ansible.builtin.debug:
        msg: "{{ item.check }}: {{ item.status }}"
      loop: "{{ faramir_doctor_report.findings }}"
      loop_control:
        label: "{{ item.check }}"

    - name: Require a working install
      ansible.builtin.assert:
        that: not faramir_doctor_report.failed
        fail_msg: >-
          {{ faramir_doctor_report.findings
             | selectattr('status', 'equalto', 'failed')
             | map(attribute='detail') | join('; ') }}
        quiet: true

# Every run, not only when the key is new: it has to be in authorized_keys on
# every managed host, which the play after this one does.
- name: Show the public key the fleet has to authorize
  ansible.builtin.debug:
    msg:
      - "broker public key ({{ faramir_broker_ssh_key }}.pub):"
      - "{{ faramir_report.broker_public_key | default('none; faramir_broker_ssh_key is empty') }}"
      - "It must be in ~/.ssh/authorized_keys for the account ansible connects as
         on every managed host, or brokered playbooks authenticate as nobody. The
         next play of this run puts it there, over the whole inventory."
  when: faramir_broker_ssh_key | length > 0
