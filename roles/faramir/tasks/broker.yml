---
# What this adds over `faramir init` is in the README; the accounts, directories, age key
# and units are its.

# Before anything installs. An empty faramir_controller_host makes faramir_is_controller
# false on every host, so the enrolment, the agent's block and the key notice would all skip
# with the play reporting success, and the entries this run wrote would reach config.toml and
# no agent file in the tree. ssh.yml catches it, one play too late.
- name: Require the inventory to name one controller
  ansible.builtin.assert:
    that: faramir_controller_host | length > 0
    fail_msg: >-
      The faramir_controller group holds
      {{ groups['faramir_controller'] | default([]) | join(', ') or 'no hosts' }}, and it has
      to hold exactly one: it is what names the host these playbooks are run from, and so
      which install gets the checkout enrolled and the key the fleet authorizes.
    quiet: true
  tags: always

- name: Require a host the broker is installed on
  ansible.builtin.assert:
    that: inventory_hostname in (groups['faramir'] | default([]))
    fail_msg: >-
      This installs the broker: service accounts, systemd units, the age key and
      root's config directory. {{ inventory_hostname }} is in no position to take
      them, the faramir group holding
      {{ groups['faramir'] | default([]) | join(', ') or 'no hosts' }}. Apply it
      with make faramir, whose first play targets that group. Authorizing the
      controller's key on this host is that run's second play, which applies
      tasks/ssh.yml.
    quiet: true
  tags: always

# faramir_user_home indexes this; the config dir, store and age key hang off it.
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd
  tags: always

- name: Validate the faramir account
  ansible.builtin.assert:
    that:
      - faramir_user is defined and faramir_user | length > 0
      - faramir_user != "root"
      - faramir_user in ansible_facts["getent_passwd"]
    fail_msg: >-
      faramir_user must be an existing non-root account on this host. Set
      primary_user in the inventory (or faramir_user in host_vars) to the
      account the coding agent runs as.
    quiet: true
  tags: always

# The controller's alone: the enrolment below is what needs it, and a host that runs no
# playbook has no checkout to enrol.
- name: Check for the working tree
  ansible.builtin.stat:
    path: "{{ playbook_dir }}"
  register: faramir_worktree_dir
  become: false
  when: faramir_is_controller | bool

- name: Require the working tree
  ansible.builtin.assert:
    that: faramir_worktree_dir.stat.isdir | default(false)
    fail_msg: >-
      No directory at {{ playbook_dir }} on this host, which the controller group
      names as the one these playbooks are run from. faramir enrols the checkout
      the play was run from, so that host is the one holding it.
    quiet: true
  when: faramir_is_controller | bool

- name: Install what the broker execs
  ansible.builtin.import_tasks: sops.yml

- name: Install faramir from release {{ faramir_release_tag }}
  become: true
  block:
    - name: Create a temporary directory for the faramir release
      ansible.builtin.tempfile:
        state: directory
      register: faramir_release_tmp
      check_mode: false

    - name: Download the faramir release archive
      ansible.builtin.get_url:
        url: "{{ faramir_release_url }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_release_tmp.path }}/{{ faramir_release_archive }}"
        # Verified against the checksums goreleaser published with the same tag,
        # so a truncated or tampered archive fails here rather than installing.
        checksum: "sha256:{{ faramir_release_url }}/checksums.txt"
        mode: "0644"
      check_mode: false
      register: faramir_download
      until: faramir_download is succeeded
      retries: 3
      delay: 5

    # Beside the archive: init installs only the binary it was run from.
    - name: Unpack the faramir binary
      ansible.builtin.unarchive:
        src: "{{ faramir_release_tmp.path }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_release_tmp.path }}"
        remote_src: true
        # The archive mode goes through the umask, and the next task runs this.
        mode: "0755"
      check_mode: false

    # changed_when runs even on failure, where an empty report would add a parse
    # error to the real one.
    - name: Install faramir
      ansible.builtin.command:
        argv: "{{ faramir_init_argv }}"
      register: faramir_init
      check_mode: false
      changed_when: faramir_init.stdout | length > 0 and (faramir_init.stdout | from_json).changed

    - name: Read what the install did
      ansible.builtin.set_fact:
        faramir_report: "{{ faramir_init.stdout | from_json }}"
      when: faramir_init.stdout | length > 0
  always:
    - name: Remove the temporary directory for the faramir binaries
      ansible.builtin.file:
        path: "{{ faramir_release_tmp.path }}"
        state: absent
      when: faramir_release_tmp.path is defined
      # check_mode: false with the rest of the block, or every --check leaks an
      # unpacked archive into /tmp.
      check_mode: false

# Runs the installed binary, the staging directory being gone, so a first --check run on a
# fresh host has none and skips.
- name: Check for the installed faramir binary
  ansible.builtin.stat:
    path: "{{ faramir_binary }}"
  register: faramir_binary_stat
  become: false

# After init, which installs the binary these run, and before the enrolment, which renders
# the entries into this tree's agent files: an enrolment that ran first would write rules
# naming none of them, and the tree would carry none until the next run. Only the
# account-wide rule files are an add's own to render, which on a host with no enrolment is
# the whole of what the rules reach.
- name: Converge the config entries
  ansible.builtin.import_tasks: entries.yml
  when: faramir_binary_stat.stat.exists | default(false)

- name: Enrol this checkout as a faramir project
  ansible.builtin.command:
    argv: "{{ faramir_init_project_argv }}"
  become: true
  register: faramir_project
  check_mode: false
  changed_when: faramir_project.stdout | length > 0 and (faramir_project.stdout | from_json).changed
  when:
    - faramir_is_controller | bool
    - faramir_binary_stat.stat.exists | default(false)

- name: Read what the enrolment did
  ansible.builtin.set_fact:
    faramir_project_report: "{{ faramir_project.stdout | from_json }}"
  when: faramir_project.stdout | default('') | length > 0

# init and init-project warn rather than fail on what installs cleanly but does nothing,
# such as a group membership needing a fresh login.
- name: Show what faramir warned about
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ (faramir_report.warnings | default([])) + (faramir_project_report.warnings | default([])) }}"

# init grants the client group traversal from the home down, and what that reaches is
# whatever the `other` bits allow: the umask is 0002, so a directory created later arrives
# 0775. The immediate children suffice, a directory closed to other closing the tree under
# it.
- name: Close the operator's ~/.config to accounts outside it
  become: true
  block:
    - name: List what sits beside the config directory
      ansible.builtin.find:
        paths: "{{ faramir_user_home }}/.config"
        file_type: any
        recurse: false
      register: faramir_config_siblings

    # The config directory is exempt and must stay so: it is root's, 0755, and the service
    # accounts are in none of its groups, so they reach config.toml and the store through
    # those `other` bits alone. Closing it stops every daemon.
    - name: Close each one to other
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: o-rwx
        # The symlink, not whatever it points at, which is out of this task's scope.
        follow: false
      loop: >-
        {{ faramir_config_siblings.files
           | rejectattr('path', 'equalto', faramir_config_dir)
           | rejectattr('islnk')
           | selectattr('mode', 'search', '[^0]$')
           | list }}
      loop_control:
        label: "{{ item.path | basename }} ({{ item.mode }})"

# faramir's own agent snippet covers the broker, not this repo: which flags an unprivileged
# brokered run needs, and what the approved route costs instead. The controller's alone,
# there being no checkout to write it into anywhere else.
- name: Tell the agent how to run a playbook through the broker
  when: faramir_is_controller | bool
  ansible.builtin.blockinfile:
    # The target, not a symlink to it: a host without the symlink would end up with two
    # divergent files.
    path: "{{ playbook_dir }}/AGENTS.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_client_group }}"
    # init-project adds group write to every file, so 0644 here would never converge.
    mode: "0664"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Two routes,
      the second reaching the controller at the cost of an approval.

      Unprivileged, needing no approval, and unable to configure the controller:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir_controller'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir_controller'` excludes the controller because `become`
      there raises an escalation per task, which would leave the run failing after
      the rest of it has already applied.

      Approved once, then root for the whole run:

          faramir run -- sudo make <playbook>

      One approval covers it: no per-task prompt, and no `--ask-become-pass`,
      which a root run never gets. Root reads the sops store itself, so this
      route needs no `--env-file`.

      `faramir_refs` shows the available names.
  become: true

# Yama, so that one brokered command cannot ptrace another and read the values injected into
# it. Before the doctor check below, which reports on what this leaves.
- name: Restrict ptrace to a process's own descendants
  when: faramir_ptrace_scope is not none
  become: true
  block:
    # Absent on a kernel built without CONFIG_SECURITY_YAMA, where there is no knob to set
    # and the sysctl module would fail rather than skip.
    - name: Check for Yama
      ansible.builtin.stat:
        path: /proc/sys/kernel/yama/ptrace_scope
      register: faramir_yama

    - name: Set kernel.yama.ptrace_scope
      ansible.posix.sysctl:
        name: kernel.yama.ptrace_scope
        value: "{{ faramir_ptrace_scope | int }}"
        # 60-, so it is read after the 10-ptrace.conf procps ships and wins where the two
        # disagree.
        sysctl_file: /etc/sysctl.d/60-faramir-ptrace.conf
        sysctl_set: true
        reload: true
      when: faramir_yama.stat.exists

    - name: Say when there is no Yama to set
      ansible.builtin.debug:
        msg: >-
          This kernel has no /proc/sys/kernel/yama/ptrace_scope, so nothing restricts one
          process of the executor's uid from ptracing another. faramir doctor reports the
          same as unchecked.
      when: not faramir_yama.stat.exists

# A broker serving zero refs and an agent holding no key both look like a healthy install:
# units up, nothing reachable.
- name: Check that the install works
  when: not ansible_check_mode
  block:
    - name: Ask faramir whether the install is doing its job
      ansible.builtin.command:
        argv: "{{ faramir_doctor_argv }}"
      become: true
      register: faramir_doctor
      changed_when: false
      failed_when: false

    - name: Require faramir doctor to have reported
      ansible.builtin.assert:
        that: faramir_doctor.stdout | length > 0
        fail_msg: >-
          faramir doctor produced no report: rc {{ faramir_doctor.rc }},
          {{ faramir_doctor.stderr | default('no stderr') }}.
        quiet: true

    - name: Read what faramir doctor found
      ansible.builtin.set_fact:
        faramir_doctor_report: "{{ faramir_doctor.stdout | from_json }}"

    - name: Show what faramir doctor found
      ansible.builtin.debug:
        msg: "{{ item.check }}: {{ item.status }}"
      loop: "{{ faramir_doctor_report.findings }}"
      loop_control:
        label: "{{ item.check }}"

    - name: Require a working install
      ansible.builtin.assert:
        that: not faramir_doctor_report.failed
        fail_msg: >-
          {{ faramir_doctor_report.findings
             | selectattr('status', 'equalto', 'failed')
             | map(attribute='detail') | join('; ') }}
        quiet: true

# The controller's alone. init mints a key on every host it runs on, but only this one's
# reaches anything: nothing authorizes the others, and a host that runs no playbook has
# nothing to reach.
- name: Show the public key the fleet has to authorize
  when: faramir_is_controller | bool
  ansible.builtin.debug:
    msg:
      - "broker public key ({{ faramir_broker_ssh_key }}.pub):"
      # Absent under --check, where init runs --dry-run and mints nothing.
      - "{{ faramir_report.broker_public_key | default('not reported') }}"
      - "It must be in ~/.ssh/authorized_keys for the account ansible connects as
         on every managed host, or brokered playbooks authenticate as nobody. The
         next play of this run puts it there, over the whole inventory."
