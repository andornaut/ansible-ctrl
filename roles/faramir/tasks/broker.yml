---
# What this adds over `faramir init` is in the README; the accounts, directories, age key
# and units are its.

# Before anything installs. An empty faramir_controller_host makes faramir_is_controller
# false on every host, so the enrolment, the agent's block and the key notice would all skip
# with the play reporting success, and the entries this run wrote would reach config.toml and
# no agent file in the tree. ssh.yml catches it, one play too late.
- name: Require the inventory to name one controller
  ansible.builtin.assert:
    that: faramir_controller_host | length > 0
    fail_msg: >-
      The faramir_controller group holds
      {{ groups['faramir_controller'] | default([]) | join(', ') or 'no hosts' }} and has to
      hold exactly one: it names the host these playbooks run from, and so which install gets
      the checkout and the key the fleet authorizes.
    quiet: true
  tags: always

- name: Require a host the broker is installed on
  ansible.builtin.assert:
    that: inventory_hostname in (groups['faramir'] | default([]))
    fail_msg: >-
      This installs the broker: service accounts, units, the age key and root's config
      directory. {{ inventory_hostname }} is not in the faramir group, which holds
      {{ groups['faramir'] | default([]) | join(', ') or 'no hosts' }}. Apply it with
      make faramir, whose first play targets that group and whose second authorizes the
      controller's key here.
    quiet: true
  tags: always

# faramir_user_home indexes this; the config dir, store and age key hang off it.
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd
  tags: always

- name: Validate the faramir account
  ansible.builtin.assert:
    that:
      - faramir_user is defined and faramir_user | length > 0
      - faramir_user != "root"
      - faramir_user in ansible_facts["getent_passwd"]
    fail_msg: >-
      faramir_user must be an existing non-root account on this host. Set
      primary_user in the inventory (or faramir_user in host_vars) to the
      account the coding agent runs as.
    quiet: true
  tags: always

# ecryptfs-utils keeps a user's configuration and ciphertext outside the home, under a fixed
# path, so this answers whether the home is encrypted whether or not it is mounted right now.
# The markers inside the home cannot: which of them is visible is what the mount decides.
- name: Check whether the operator's home is encrypted
  ansible.builtin.stat:
    path: "/home/.ecryptfs/{{ faramir_user }}"
  become: true
  register: faramir_home_ecryptfs
  tags: always

# getent answers with the home's path whether or not anything is mounted there, so nothing
# below would notice. A run against a locked home writes the config directory, the age key,
# the broker's key and the store onto the mountpoint, in the clear on the underlying
# filesystem, and the next login hides all four under the mount. It also reads every
# credential store in that home as absent, so tasks/entries.yml blocks none of them and says
# the host has none.
#
# Only where the home is encrypted. A plain home is part of / and is a mount point on no host,
# so requiring a mount would fail every machine that has nothing to unlock.
#
# `| default([])` fails closed: without the mounts fact this cannot answer, and answering "not
# encrypted" is the wrong way to be wrong.
- name: Require an encrypted home to be mounted
  ansible.builtin.assert:
    that: faramir_user_home in (ansible_facts['mounts'] | default([]) | map(attribute='mount'))
    fail_msg: >-
      {{ faramir_user }}'s home is encrypted and {{ faramir_user_home }} is not mounted, so
      this host is at its login screen or the home was never unlocked. Installing now would
      write the age key and the store onto the mountpoint and block nothing under the home.
      Log in as {{ faramir_user }}, or run ecryptfs-mount-private there, and re-run.
    quiet: true
  when: faramir_home_ecryptfs.stat.exists
  tags: always

# The controller's alone: the enrolment below is what needs it, and a host that runs no
# playbook has no checkout to enrol.
- name: Check for the working tree
  ansible.builtin.stat:
    path: "{{ playbook_dir }}"
  register: faramir_worktree_dir
  become: false
  when: faramir_is_controller | bool

- name: Require the working tree
  ansible.builtin.assert:
    that: faramir_worktree_dir.stat.isdir | default(false)
    fail_msg: >-
      No directory at {{ playbook_dir }}, and faramir_controller names this host as the
      one these playbooks run from. faramir enrols the checkout the run started in.
    quiet: true
  when: faramir_is_controller | bool

- name: Install what the broker execs
  ansible.builtin.import_tasks: sops.yml

- name: Install faramir from release {{ faramir_release_tag }}
  become: true
  block:
    - name: Create a temporary directory for the faramir release
      ansible.builtin.tempfile:
        state: directory
      register: faramir_release_tmp
      check_mode: false

    - name: Download the faramir release archive
      ansible.builtin.get_url:
        url: "{{ faramir_release_url }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_release_tmp.path }}/{{ faramir_release_archive }}"
        # Verified against the checksums goreleaser published with the same tag,
        # so a truncated or tampered archive fails here rather than installing.
        checksum: "sha256:{{ faramir_release_url }}/checksums.txt"
        mode: "0644"
      check_mode: false
      register: faramir_download
      until: faramir_download is succeeded
      retries: 3
      delay: 5

    # Beside the archive: init installs only the binary it was run from.
    - name: Unpack the faramir binary
      ansible.builtin.unarchive:
        src: "{{ faramir_release_tmp.path }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_release_tmp.path }}"
        remote_src: true
        # The archive mode goes through the umask, and the next task runs this.
        mode: "0755"
      check_mode: false

    # CLEANUP (added 2026-08-21): drop both of these once every host in the
    # `faramir` group has run this play, no config naming the old key left.
    #
    # faramir renamed [[secret.refuse]] to [[secret.block]], and its loader
    # rejects a key it does not know rather than passing over it. So a host
    # whose config still names the old one is not repaired by the next run:
    # init reads the config before it rewrites it, and the daemons do not start
    # on a config that will not load either. The rename has to land before the
    # new binary runs.
    #
    # Here rather than at the top of the run, because the two disagree in both
    # directions: the old binary does not parse the new key any more than the
    # new one parses the old. The archive is unpacked by this point, so a
    # download that failed leaves the config alone, and init is the next task,
    # which is the shortest window the pair can be out of step for.
    - name: Check for a config naming the entries by their old key
      ansible.builtin.stat:
        path: "{{ faramir_config_dir }}/config.toml"
      register: faramir_config_stat
      check_mode: false

    # No check_mode: false, unlike its siblings here. A --check run reports the
    # rewrite rather than making it, which leaves the config as the installed
    # binary expects it.
    #
    # The cost is that --check against a host still carrying the old key fails at
    # the init below, which parses the config it was not allowed to rewrite. That
    # is the right way round: a --check that wrote would be no check at all, and
    # the failure names a host that has not converged since the rename.
    - name: Rename the entries this faramir no longer parses
      ansible.builtin.replace:
        path: "{{ faramir_config_dir }}/config.toml"
        # Unanchored, matching the rewrite this was verified with. An anchored
        # pattern that missed on leading whitespace would report success and
        # leave the host unable to start its broker.
        regexp: '\[\[secret\.refuse\]\]'
        replace: '[[secret.block]]'
      when: faramir_config_stat.stat.exists

    # changed_when runs even on failure, where an empty report would add a parse
    # error to the real one.
    - name: Install faramir
      ansible.builtin.command:
        argv: "{{ faramir_init_argv }}"
      register: faramir_init
      check_mode: false
      changed_when: faramir_init.stdout | length > 0 and (faramir_init.stdout | from_json).changed

    - name: Read what the install did
      ansible.builtin.set_fact:
        faramir_report: "{{ faramir_init.stdout | from_json }}"
      when: faramir_init.stdout | length > 0

    # CLEANUP (added 2026-08-22): drop this once every host in the `faramir`
    # group has run this play, no install carrying the old helper left.
    #
    # faramir renamed the helper PAM execs from pam-approve to pam-escalate.
    # init writes the new one, repoints the PAM stack at it and rewrites
    # [escalation] helper, but removes neither the old file nor reports it, so
    # every host that has ever been installed with faramir_allow_sudo keeps a
    # root-owned executable that nothing references and whose job is to open the
    # broker socket.
    #
    # After init and not before: until init has rewritten them, the PAM stack
    # and config.toml both name the old path, and the auth line is `requisite`,
    # so a host that lost the file first fails every brokered sudo until the
    # next run of this play.
    #
    # No stat guard, `state: absent` being one: a host installed without the
    # grant has no such file, and the task reports nothing on it.
    - name: Remove the PAM helper this faramir no longer execs
      ansible.builtin.file:
        path: /usr/local/libexec/faramir/pam-approve
        state: absent
  always:
    - name: Remove the temporary directory for the faramir binaries
      ansible.builtin.file:
        path: "{{ faramir_release_tmp.path }}"
        state: absent
      when: faramir_release_tmp.path is defined
      # check_mode: false with the rest of the block, or every --check leaks an
      # unpacked archive into /tmp.
      check_mode: false

# Runs the installed binary, the staging directory being gone, so a first --check run on a
# fresh host has none and skips.
- name: Check for the installed faramir binary
  ansible.builtin.stat:
    path: "{{ faramir_binary }}"
  register: faramir_binary_stat
  become: false

# After init, which installs the binary these run, and before the enrolment, which renders
# the entries into this tree's agent files: an enrolment that ran first would write rules
# naming none of them, and the tree would carry none until the next run. Only the
# account-wide rule files are an add's own to render, which on a host with no enrolment is
# the whole of what the rules reach.
- name: Converge the config entries
  ansible.builtin.import_tasks: entries.yml
  when: faramir_binary_stat.stat.exists | default(false)

- name: Enrol this checkout as a faramir project
  ansible.builtin.command:
    argv: "{{ faramir_init_project_argv }}"
  become: true
  register: faramir_project
  check_mode: false
  changed_when: faramir_project.stdout | length > 0 and (faramir_project.stdout | from_json).changed
  when:
    - faramir_is_controller | bool
    - faramir_binary_stat.stat.exists | default(false)

- name: Read what the enrolment did
  ansible.builtin.set_fact:
    faramir_project_report: "{{ faramir_project.stdout | from_json }}"
  when: faramir_project.stdout | default('') | length > 0

# init and init-project warn rather than fail on what installs cleanly but does nothing,
# such as a group membership needing a fresh login.
- name: Show what faramir warned about
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ (faramir_report.warnings | default([])) + (faramir_project_report.warnings | default([])) }}"

- name: Close what the install opened
  ansible.builtin.import_tasks: harden.yml

- name: Check the install and show its key
  ansible.builtin.import_tasks: verify.yml
