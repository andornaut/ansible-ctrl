---
# CLEANUP (added 2026-08-22): delete this file, its include and its tag once every host
# carrying a faramir install has run it once.
#
# A block entry that stops being declared leaves its rendered rule behind, an agent's own
# configuration being merged rather than replaced. faramir keeps a record of what it renders
# and removes a recorded rule the current render no longer produces, so residue stops
# accumulating from that release on. It cannot reach what earlier renders wrote, holding no
# record of having written it, and no later version can obtain one: a record is written from
# what a render produces now. That earlier residue is what this removes, and the two never
# overlap. faramir removes only what it recorded writing; this removes only what it did not.
#
# Two families, both reported by `faramir doctor` as rules it no longer writes:
#
#   The store entry, in the spellings an earlier render produced before it was rewritten to
#   one trailing wildcard. No current render reproduces them, so they stay for ever otherwise.
#
#   The config directory in its name-relative spellings, superseded by the absolute paths
#   faramir now derives from its own layout. doctor names these and declines to remove them,
#   an entry carrying no sign of who added it.
#
# Exact strings, never a shape. Each file also holds absolute-path rules for the same two
# directories that a render still produces and that must survive, and they are spelled with
# the same words as everything below. A pattern over those words would take live protection
# with it and report the removal as a change. What is listed is what goes; the regexp is
# anchored to a whole line so a longer rule containing one of these is left standing.

- name: Remove rendered rules that predate faramir's record of them
  become: true
  become_user: "{{ faramir_user }}"
  tags: cleanup_rendered_rules
  vars:
    # Two shapes. claude keeps an array of rule strings under `permissions.deny`; opencode and
    # kilocode keep a mapping of glob to decision, in two sections of one file, which a
    # whole-file pass covers without naming either section.
    faramir_stale_rendered:
      - path: "{{ faramir_user_home }}/.claude/settings.json"
        shape: array
        rules:
          - "Read(**/secrets*)"
          - "Edit(**/secrets*)"
          - "Read(**/secrets*.yml)"
          - "Edit(**/secrets*.yml)"
          - "Read(**/secrets*.yaml)"
          - "Edit(**/secrets*.yaml)"
          - "Read(**/.config/faramir/**)"
          - "Edit(**/.config/faramir/**)"
      - path: "{{ faramir_user_home }}/.config/opencode/opencode.json"
        shape: mapping
        rules:
          - "*/secrets*"
          - "*secrets*.yaml"
          - "*secrets*.yml"
          - "secrets*"
          - "*.config/faramir/*"
          - "*/.config/faramir/*"
      - path: "{{ faramir_user_home }}/.config/kilo/kilo.json"
        shape: mapping
        rules:
          - "*/secrets*"
          - "*secrets*.yaml"
          - "*secrets*.yml"
          - "secrets*"
          - "*.config/faramir/*"
          - "*/.config/faramir/*"
  block:
    # An agent the operator has never run has no configuration to clean, and lineinfile fails
    # on a path that is not there rather than passing over it.
    - name: Find which agent configurations this host has
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_attributes: false
        get_checksum: false
        get_mime: false
      loop: "{{ faramir_stale_rendered }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: faramir_stale_stat
      changed_when: false

    - name: Keep the agent configurations that are there
      ansible.builtin.set_fact:
        faramir_stale_present: >-
          {{ faramir_stale_stat.results | selectattr('stat.exists')
             | map(attribute='item') | list }}
      become: false

    # Anchored to the whole line, so an absolute-path rule that carries one of these as a
    # substring is left standing. The trailing comma is optional: the last member of an array
    # or an object has none.
    #
    # A line match cannot see which array it is in, and the array shape carries `allow` and
    # `ask` beside `deny` in the same spelling. Read the file rather than trust the shape: a
    # string the operator put under either of those would otherwise go with the deny rules.
    - name: Read the configurations whose rules are an array
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: faramir_stale_slurp
      loop: "{{ faramir_stale_present | selectattr('shape', 'equalto', 'array') | list }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Rescued rather than fatal, for the reason the removals below carry: this import runs
    # ahead of harden.yml, so failing here would leave the install unhardened over residue.
    # Rescued to taking nothing, because a file that will not parse is one whose decisions
    # cannot be read, and removing blind is the thing this task exists to avoid.
    - name: Work out which array rules the removal may take
      block:
        - name: Set aside the stale rules the operator has decided on elsewhere
          ansible.builtin.set_fact:
            faramir_stale_array_removable: >-
              {{ (faramir_stale_array_removable | default([]))
                 + [{'path': item.item.path,
                     'rules': item.item.rules | difference(faramir_stale_elsewhere)}] }}
            faramir_stale_array_kept: >-
              {{ (faramir_stale_array_kept | default([]))
                 + [{'path': item.item.path, 'rules': faramir_stale_elsewhere}] }}
          loop: "{{ faramir_stale_slurp.results }}"
          loop_control:
            label: "{{ item.item.path | basename }}"
          vars:
            faramir_stale_doc: "{{ item.content | b64decode | from_json }}"
            faramir_stale_elsewhere: >-
              {{ item.item.rules
                 | select('in', (faramir_stale_doc.permissions.allow | default([]))
                                + (faramir_stale_doc.permissions.ask | default([]))) | list }}
          become: false
      rescue:
        - name: Take nothing from the array configurations
          ansible.builtin.set_fact:
            faramir_stale_array_removable: []
            faramir_stale_array_kept: []
          become: false

        - name: Say which array configurations could not be read
          ansible.builtin.debug:
            msg: >-
              {{ faramir_stale_present | selectattr('shape', 'equalto', 'array')
                 | map(attribute='path') | join(', ') }} did not parse as JSON, so what the
              operator has decided there cannot be read and nothing was taken. Fix the file
              by hand, then re-run this tag.

    - name: Name the stale rules the operator has decided on elsewhere
      ansible.builtin.debug:
        msg: >-
          {{ item.path }}: {{ item.rules | join(', ') }} stand. They sit under
          permissions.allow or permissions.ask, where removing one would take a decision the
          operator made. Drop them by hand, or take the strings out of this task's list.
      loop: "{{ faramir_stale_array_kept | default([]) | selectattr('rules') | list }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # validate runs against the candidate, so a removal that would leave the previous line's
    # comma dangling is refused and the file is left as it was, rather than written as JSON
    # the agent cannot parse. Refused and not fatal: this import runs ahead of harden.yml, so
    # a failure here would abort the run and leave the install unhardened for a reason that
    # has nothing to do with hardening, which costs more than the residue it came to clear.
    # What it could not take is named below and stands until a hand removes it.
    - name: Drop each stale rule from an array of rules
      ansible.builtin.lineinfile:
        path: "{{ item.0.path }}"
        regexp: '^\s*"{{ item.1 | regex_escape }}",?\s*$'
        state: absent
        validate: python3 -m json.tool %s
      loop: >-
        {{ faramir_stale_array_removable | default([]) | subelements('rules') }}
      loop_control:
        label: "{{ item.0.path | basename }}: {{ item.1 }}"
      register: faramir_stale_array_drop
      ignore_errors: true

    - name: Drop each stale rule from a mapping of rules
      ansible.builtin.lineinfile:
        path: "{{ item.0.path }}"
        regexp: '^\s*"{{ item.1 | regex_escape }}"\s*:\s*"deny",?\s*$'
        state: absent
        validate: python3 -m json.tool %s
      loop: >-
        {{ faramir_stale_present | selectattr('shape', 'equalto', 'mapping')
           | list | subelements('rules') }}
      loop_control:
        label: "{{ item.0.path | basename }}: {{ item.1 }}"
      register: faramir_stale_mapping_drop
      ignore_errors: true

    # A cleanup nobody watches, so what it could not take is named rather than left to be
    # noticed when the rule refuses something. The removal is line-based, and the one case it
    # cannot serve is a rule sitting last in its array or section, where taking the line
    # strands the comma on the line above.
    - name: Name the rules that had to be left in place
      ansible.builtin.debug:
        msg: >-
          {{ item.item.0.path }}: {{ item.item.1 }} stands. Taking its line would have left
          JSON the agent cannot parse, which happens where the rule is the last of its array
          or section. Remove it by hand along with the comma above it, then re-run this tag.
      # Both lists are joined before the filter runs. A filter binds tighter than the join, so
      # without the outer parentheses only the second list is filtered and the first arrives
      # whole, naming every rule the task took as one it could not.
      loop: >-
        {{ ((faramir_stale_array_drop.results | default([]))
            + (faramir_stale_mapping_drop.results | default([])))
           | selectattr('failed', 'defined') | selectattr('failed') | list }}
      loop_control:
        label: "{{ item.item.0.path | basename }}: {{ item.item.1 }}"

    # A deployment check and not an interlock. Removing a line the config no longer declares
    # is safe against any faramir: an install that keeps no record renders nothing for an
    # entry that has gone, so there is nothing for it to put back. What the record's absence
    # means is that the half which stops residue accumulating is not running on this host, so
    # what this task clears once will collect again.
    - name: Check whether faramir records what it renders
      ansible.builtin.stat:
        path: "{{ faramir_config_dir }}/written-rules.json"
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: faramir_written_rules
      changed_when: false

    - name: Say that this host will collect the same residue again
      ansible.builtin.debug:
        msg: >-
          {{ faramir_config_dir }}/written-rules.json is absent, so this faramir keeps no
          record of the rules it renders and removes none of them. What this task cleared
          will collect again the next time an entry stops being declared.
      when: not faramir_written_rules.stat.exists

    # A cleanup nobody watches, so the run says what it passed over rather than doing it
    # silently. It names nothing on a host that has already run it, which is what finishing
    # looks like.
    - name: Name the agent configurations this host has no copy of
      ansible.builtin.debug:
        msg: >-
          No such configuration, nothing to clean:
          {{ faramir_stale_missing | map('basename') | sort | join(', ') }}
      when: faramir_stale_missing | length > 0
      vars:
        faramir_stale_missing: >-
          {{ faramir_stale_rendered | map(attribute='path') | list
             | difference(faramir_stale_present | map(attribute='path') | list) }}
