---
# The config entries that name a file rather than hold a value: paths blocked to the agent's
# file tools, and credentials read where another tool keeps them. `faramir init` re-asserts
# both from config.toml once written, so this converges the list and init carries it on.
#
# The block entries converge both ways, so `block ls --declared` and defaults/main.yml agree
# once a run finishes and an entry added on a host by hand does not survive one. The links
# are adds only: a link grants the broker read and regroups the file, so dropping one changes
# what the host can serve. Take it out of faramir_links and run the rm by hand.
#
# Why each entry is shaped the way it is: README.md.

# A bare string here is the mistake a one-account list invites, and it does not fail as one:
# the join in vars/main.yml iterates a string per character, so the run reaches faramir with
# `h/.ssh` and `//.ssh` and fails partway through the adds, with the paths before them already
# applied. Held to the shape before anything is written.
- name: Require the shared account homes to be a list of absolute paths
  ansible.builtin.assert:
    that:
      - faramir_shared_user_homes | type_debug == "list"
      - faramir_shared_user_homes | reject('match', '^/[^/]') | list | length == 0
      - faramir_shared_user_homes | select('match', '.*/$') | list | length == 0
    fail_msg: >-
      faramir_shared_user_homes is one absolute home per account, in a list and without a
      trailing slash. This host has {{ faramir_shared_user_homes | to_json }}.
    quiet: true

# faramir holds each entry to its own rules, but only once the command runs: a missing key
# here builds a command naming the wrong thing, or fails as an undefined attribute rather
# than as the entry it came from.
- name: Require each link to name a ref, a path and a type
  ansible.builtin.assert:
    that:
      - item.ref | default('') | length > 0
      - item.path | default('') | length > 0
      - item.type | default('') | length > 0
    fail_msg: >-
      Each faramir_links entry names ref, path and type, plus key for the four types that
      select (json, yaml, toml, ini). This one is {{ item }}.
    quiet: true
  loop: "{{ faramir_links }}"
  loop_control:
    label: "{{ item.ref | default('an entry naming no ref') }}"

# One invocation per form rather than one per entry: `--path` and `--command` are repeatable,
# and an add either writes every entry it names and the rules for them or leaves the host as
# it was. The form is what has to stay apart, being the flag an entry goes in under and the
# thing --strict rides on; no form is the default and a bare argument is refused.
#
# Two calls rather than one per entry because each one re-renders every agent's rule files,
# which is the cost that scales with the list and not with what changed. What it gives up is
# per-entry reporting: the label names the form and a count, `changed` is true where any entry
# in the call changed, and a single malformed entry fails the whole call.
#
# Every path is named whether or not this host has the file. faramir writes the rule for an
# absent path and it holds when the file appears, which is the window a credential store is
# worth a rule in: a tool signed in after a converge is covered before the next one. The run
# warns for each path that is not there, and a path spelled wrong warns the same way.
#
# One entry per shape and home, vars/main.yml having joined the list to the operator's home
# and to each in faramir_shared_user_homes. Most of what that produces is absent, which is the
# case above: the rule is there to refuse a command naming the path, wherever that command
# would have reached it.
#
# --strict on the path entries alone, the agent being refused one named at all whatever the
# entry carries. What the flag adds on the brokered route: README.md. A path names one file on
# this host, so that is a rule whose reach is known when it is written.
#
# Not on a command entry, which faramir refuses the flag for, a command entry already being
# about what a command does.
#
# The strictness converges with the entry, an add naming a different one changing the entry
# rather than writing a second.
#
# No check_mode: false, unlike the init tasks. These have no --dry-run, so a --check run
# skips them rather than writing entries.
#
# Each entry command takes its subject under the flag naming its form, --path or --command; no
# form is the default and a bare argument is refused. Both are idempotent, so the role names
# every entry on every run rather than diffing the host first: re-applying is what puts back a
# grant a tool took away by renaming its own file, and a rule an agent's settings dropped.
#
# No --agent-user, and none of these takes one: `init` is the only command that names the
# operator, and each of these reads what it recorded in [server] agent_user. A command that
# resolved it afresh would rename the host's owner as a side effect of adding an entry.
- name: Block the declared paths and commands to the agent
  ansible.builtin.command:
    argv: >-
      {{ [faramir_binary, 'block', 'add', '--json']
         + (['--' ~ item.key] | product(item.value) | flatten | list)
         + (['--strict'] if item.key == 'path' else []) }}
  become: true
  # An empty list would name no entry at all, which the command refuses.
  when: item.value | length > 0
  loop: "{{ faramir_block_declared | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value | length }})"
  vars:
    faramir_block_declared:
      path: "{{ faramir_blocked_paths }}"
      command: "{{ faramir_blocked_commands }}"
  register: faramir_block
  changed_when: faramir_block.stdout | length > 0 and (faramir_block.stdout | from_json).changed

# The only way to find an entry the lists have stopped naming: the adds above see the list
# and not the host. --declared leaves out the rules the install derives from its own layout,
# which no entry wrote and none removes.
#
# After the adds, so an entry renamed in one run is written under its new form before the old
# one is taken away.
#
# The one faramir command here that root buys nothing for: the listing reads config.toml,
# which is 0644, rather than the store or the log. The writes above and doctor below need it.
#
# Both readers of this register default with `default('[]', true)` rather than the
# one-argument form: under --check the command module is skipped and still registers a full
# result, so stdout is defined and empty, which only the boolean form substitutes for.
# from_json('') raises.
- name: List the block entries this host declares
  ansible.builtin.command:
    argv: "{{ [faramir_binary, 'block', 'ls', '--declared', '--json'] }}"
  become: false
  register: faramir_block_ls
  changed_when: false

# A kind this role does not know is a faramir that has grown a fourth form, which the removal
# below would match against no list and leave standing.
- name: Require every declared entry to name a form this role knows
  ansible.builtin.assert:
    that: faramir_block_unknown_kinds | length == 0
    fail_msg: >-
      `block ls --declared` reported {{ faramir_block_unknown_kinds | join(', ') }}, which
      this role has no list to compare against and no flag to remove with.
    quiet: true
  vars:
    faramir_block_unknown_kinds: >-
      {{ (faramir_block_ls.stdout | default('[]', true) | from_json)
         | map(attribute='kind') | unique | difference(['path', 'command']) }}

# Compared per form, the form being part of what identifies an entry.
#
# stdout defaults for the --check run, where the listing above is skipped along with the adds
# and there is nothing to compare.
- name: Find the entries this role no longer declares
  ansible.builtin.set_fact:
    faramir_block_stale:
      path: >-
        {{ faramir_block_rows | selectattr('kind', 'equalto', 'path')
           | map(attribute='entry') | reject('in', faramir_blocked_paths) | list }}
      command: >-
        {{ faramir_block_rows | selectattr('kind', 'equalto', 'command')
           | map(attribute='entry') | reject('in', faramir_blocked_commands) | list }}
  become: false
  vars:
    faramir_block_rows: "{{ faramir_block_ls.stdout | default('[]', true) | from_json }}"

# An entry comes back out under the flag it went in under, the form being part of what
# identifies it, and a removal ends the declaration and no more: README.md.
- name: Stop blocking the entries this role no longer declares
  ansible.builtin.command:
    argv: >-
      {{ [faramir_binary, 'block', 'rm', '--json']
         + (['--' ~ item.key] | product(item.value) | flatten | list) }}
  become: true
  # Usually nothing, and a removal naming no entry is refused like an add.
  when: item.value | length > 0
  loop: "{{ faramir_block_stale | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value | length }})"
  register: faramir_block_rm
  changed_when: faramir_block_rm.stdout | length > 0 and (faramir_block_rm.stdout | from_json).changed

# --strict on every link, which reaches the brokered route alone, the agent being refused the
# path either way. What the flag adds there: README.md. Re-adding a ref under a different
# strictness changes the entry, so this converges like the rest of one.
- name: Read a linked secret out of the file its own tool maintains
  ansible.builtin.command:
    # --key only for the types that select, faramir refusing it for the two that do not.
    argv: >-
      {{ [faramir_binary, 'link', 'add', '--json', '--strict',
          item.ref, item.path, '--type', item.type]
         + (['--key', item.key] if item.key | default('') | length > 0 else []) }}
  become: true
  loop: "{{ faramir_links }}"
  loop_control:
    label: "{{ item.ref }}"
  register: faramir_link
  changed_when: faramir_link.stdout | length > 0 and (faramir_link.stdout | from_json).changed

# Named because a removal only half finishes. Under --json the command reports the removal
# and says none of this, printing that line only where a person is reading its output.
- name: Name the entries this run stopped declaring
  ansible.builtin.debug:
    msg: >-
      No longer declared, so removed: {{ faramir_block_stale_entries | sort | join(', ') }}.
      The rules each one rendered come out of the agent's settings with it, faramir keeping a
      record of what it wrote there.
  when: faramir_block_stale_entries | length > 0
  vars:
    faramir_block_stale_entries: "{{ faramir_block_stale.values() | flatten }}"

# What installs cleanly and then does not work: a linked file that has gone, and whatever
# else an add reports without failing on. Gathered once, both readers below being over the
# same list.
- name: Collect what the entries warned about
  ansible.builtin.set_fact:
    faramir_entry_warnings: >-
      {{ (faramir_block.results | default([])
          + faramir_block_rm.results | default([])
          + faramir_link.results | default([]))
         | map(attribute='stdout', default='')
         | reject('equalto', '')
         | map('from_json')
         | map(attribute='warnings', default=[])
         | flatten }}
  become: false

- name: Show what the entries warned about
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ faramir_entry_warnings | reject('search', 'is not there') | list }}"

# The rest of them, which is one per declared path this host does not have: most of the list
# under every home, and the summary below is the reading that means anything. Kept behind -v
# rather than dropped, a run that has to name which path is the run that has just changed one.
#
# One message rather than a loop: a debug the verbosity skips still reports per item, so a
# loop here would print the line it exists to avoid.
- name: Name the declared paths this host does not have
  ansible.builtin.debug:
    msg: "{{ faramir_entry_warnings | select('search', 'is not there') | list }}"
    verbosity: 1

# The list is declared under every home and most of it is absent under each, so the warnings
# above are not something to read entry by entry. Counted per home instead, which is the one
# reading that separates them: a home with nothing present is what an account name spelled
# wrong looks like, and a home that is simply new has most of its paths present.
#
# Counted from the warnings rather than from the filesystem: an absent path is exactly what
# the add reported, so this asks the host nothing it was not already told.
- name: Say how much of the list each home has
  ansible.builtin.debug:
    msg: >-
      {{ item }}: {{ faramir_home_declared | int - faramir_home_absent | int }} of
      {{ faramir_home_declared }} declared paths are present.
      {{ 'None of them, so read the home as spelled wrong until proven otherwise.'
         if faramir_home_absent | int == faramir_home_declared | int else '' }}
  loop: "{{ [faramir_user_home] + faramir_shared_user_homes }}"
  vars:
    faramir_home_declared: "{{ faramir_blocked_home_paths | length }}"
    faramir_home_absent: >-
      {{ faramir_entry_warnings | select('match', item ~ '/')
         | select('search', 'is not there') | list | length }}
