---
# The config entries that name files rather than hold values: paths blocked to the agent's
# file tools, and credentials read where another tool keeps them. Both are `faramir init`'s
# to re-assert once written, so this converges the list and init carries it from there.
#
# The block entries converge both ways: what the lists name is added, and a declared entry
# they do not name is removed, so `block ls --declared` and defaults/main.yml agree once a
# run finishes. An entry added on a host by hand does not survive a run, which is the point:
# this role is the whole of what the fleet declares.
#
# A removal ends the declaration and no more. It cannot take the rendered rule out of an
# agent's settings, those files being merged rather than replaced, so the host goes on
# refusing what the entry named until that line is deleted by hand. faramir doctor warns
# about the ones still standing.
#
# The links are adds only. Take one out by removing it from faramir_links and running the rm
# by hand: a link grants the broker read and regroups the file, so dropping one is a change
# to what the host can serve rather than a list falling back into agreement.

# faramir holds each entry to its own rules and says which one an entry broke, but only
# once the command runs: a missing key here builds a command naming the wrong thing, or
# fails as an undefined attribute rather than as the entry it came from.
- name: Require each link to name a ref, a path and a type
  ansible.builtin.assert:
    that:
      - item.ref | default('') | length > 0
      - item.path | default('') | length > 0
      - item.type | default('') | length > 0
    fail_msg: >-
      Each faramir_links entry names ref, path and type, plus key for the four types that
      select (json, yaml, toml, ini). This one is {{ item }}.
    quiet: true
  loop: "{{ faramir_links }}"
  loop_control:
    label: "{{ item.ref | default('an entry naming no ref') }}"

# Whether the controller has each of them. As root, so the answer is the path's and not the
# running account's, a directory it cannot traverse reading as absent. get_checksum off: a
# checksum is read out of the file's own bytes, and every path here is a credential store.
- name: Find which blocked paths the controller has
  ansible.builtin.stat:
    path: "{{ item }}"
    get_attributes: false
    get_checksum: false
    get_mime: false
  become: true
  loop: "{{ faramir_blocked_paths }}"
  register: faramir_blocked_stat
  changed_when: false

# The list is what every host might carry, so an entry naming a path this one does not have is
# skipped rather than failing the run: what the host has is what the host blocks. Absent
# can only mean the host has no such thing here, broker.yml having already refused to run
# against a home that is encrypted and not mounted, which is the other way a path reads absent.
- name: Keep the blocked paths that are there
  ansible.builtin.set_fact:
    faramir_blocked_present: >-
      {{ faramir_blocked_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
  become: false

- name: Block a path to the agent's file tools
  ansible.builtin.command:
    argv: "{{ faramir_block_argv + [item] }}"
  become: true
  # No check_mode: false, unlike the init tasks. These have no --dry-run, so a --check run
  # skips them rather than writing entries.
  loop: "{{ faramir_blocked_present }}"
  register: faramir_block
  changed_when: faramir_block.stdout | length > 0 and (faramir_block.stdout | from_json).changed

# No stat, unlike the paths above: a name is matched against what the agent writes rather than
# resolved against this host, so there is nothing here to find and an entry matching no file
# today is the point of several of them. For the same reason none of these belongs in the
# "Skipped, no such path" report below, which reads the paths alone.
- name: Block a name to the agent's file tools
  ansible.builtin.command:
    argv: "{{ faramir_block_argv + ['--name', item] }}"
  become: true
  loop: "{{ faramir_blocked_names }}"
  register: faramir_block_name
  changed_when: >-
    faramir_block_name.stdout | length > 0
    and (faramir_block_name.stdout | from_json).changed

# No stat either, and for a further reason: what a command names may be on no host at all, the
# point of every entry in that list being a tool this fleet does not install.
- name: Block a command to the agent's shell
  ansible.builtin.command:
    argv: "{{ faramir_block_argv + ['--command', item] }}"
  become: true
  loop: "{{ faramir_blocked_commands }}"
  register: faramir_block_command
  changed_when: >-
    faramir_block_command.stdout | length > 0
    and (faramir_block_command.stdout | from_json).changed

# What the host declares, which is the only way to find an entry the lists have stopped
# naming: the adds above see the list and not the host. --declared leaves out the rules the
# install derives from its own layout, which no entry wrote and none removes.
#
# After the adds, so an entry renamed in one run is written under its new form before the old
# one is taken away. Root, like the adds: the config it reads is the install's own, in the
# directory whose mode keeps the agent's uid out.
- name: List the block entries this host declares
  ansible.builtin.command:
    argv: "{{ [faramir_binary, 'block', 'ls', '--declared', '--json'] }}"
  become: true
  register: faramir_block_declared
  changed_when: false

# Compared per form, the form being part of what identifies an entry: a name is not the same
# entry as a path spelled the same way. Everything that is neither a path nor a command is
# one of the name forms, `ls` reporting the shape a pattern was read as -- name, suffix,
# prefix, glob, dir -- rather than the word the entry was written with.
#
# Against the whole of faramir_blocked_paths rather than the present half above: a path this
# host does not have today is one the adds skip, not one the lists dropped, and removing it
# would leave the entry going in and out with the file.
#
# stdout defaults for the --check run, where the listing above is skipped along with the adds
# and there is nothing to compare.
- name: Find the entries this role no longer declares
  ansible.builtin.set_fact:
    faramir_block_stale_paths: >-
      {{ faramir_block_rows | selectattr('kind', 'equalto', 'path')
         | map(attribute='entry') | reject('in', faramir_blocked_paths) | list }}
    faramir_block_stale_names: >-
      {{ faramir_block_rows | rejectattr('kind', 'in', ['path', 'command'])
         | map(attribute='entry') | reject('in', faramir_blocked_names) | list }}
    faramir_block_stale_commands: >-
      {{ faramir_block_rows | selectattr('kind', 'equalto', 'command')
         | map(attribute='entry') | reject('in', faramir_blocked_commands) | list }}
  become: false
  vars:
    faramir_block_rows: "{{ faramir_block_declared.stdout | default('[]') | from_json }}"

- name: Stop blocking a path this role no longer declares
  ansible.builtin.command:
    argv: "{{ faramir_block_rm_argv + [item] }}"
  become: true
  loop: "{{ faramir_block_stale_paths }}"
  register: faramir_block_rm_path
  changed_when: >-
    faramir_block_rm_path.stdout | length > 0
    and (faramir_block_rm_path.stdout | from_json).changed

- name: Stop blocking a name this role no longer declares
  ansible.builtin.command:
    argv: "{{ faramir_block_rm_argv + ['--name', item] }}"
  become: true
  loop: "{{ faramir_block_stale_names }}"
  register: faramir_block_rm_name
  changed_when: >-
    faramir_block_rm_name.stdout | length > 0
    and (faramir_block_rm_name.stdout | from_json).changed

- name: Stop blocking a command this role no longer declares
  ansible.builtin.command:
    argv: "{{ faramir_block_rm_argv + ['--command', item] }}"
  become: true
  loop: "{{ faramir_block_stale_commands }}"
  register: faramir_block_rm_command
  changed_when: >-
    faramir_block_rm_command.stdout | length > 0
    and (faramir_block_rm_command.stdout | from_json).changed

- name: Read a linked secret out of the file its own tool maintains
  ansible.builtin.command:
    # --key only for the types that select, faramir refusing it for the two that do not.
    argv: >-
      {{ faramir_link_argv + [item.ref, item.path, '--type', item.type]
         + (['--key', item.key] if item.key | default('') | length > 0 else []) }}
  become: true
  loop: "{{ faramir_links }}"
  loop_control:
    label: "{{ item.ref }}"
  register: faramir_link
  changed_when: faramir_link.stdout | length > 0 and (faramir_link.stdout | from_json).changed

# Named rather than passed over quietly: an entry skipped here is a credential store this host
# does not have. A path created after a run is blocked by the next one and not before.
#
# Skipped rather than not blocked: this run wrote no entry, and an earlier one that did leaves
# a rule that stands, `faramir init` re-asserting it from config.toml however the file fares.
- name: Name the blocked paths the controller does not have
  ansible.builtin.debug:
    msg: >-
      Skipped, no such path:
      {{ faramir_blocked_paths | difference(faramir_blocked_present) | sort | join(', ') }}
  # Read off the difference rather than the two lengths, which stopped agreeing once
  # faramir_blocked_present grew the always-blocked entries: a run with one path skipped and
  # one added back that way would have counted equal and said nothing.
  when: faramir_blocked_paths | difference(faramir_blocked_present) | length > 0

# Named because a removal only half finishes: the entry is gone and the rendered rule is not,
# so the host keeps refusing what it named. Under --json the command reports the removal and
# says none of this, printing that line only where a person is reading its output.
- name: Name the entries this run stopped declaring
  ansible.builtin.debug:
    msg: >-
      No longer declared, so removed:
      {{ (faramir_block_stale_paths + faramir_block_stale_names
          + faramir_block_stale_commands) | sort | join(', ') }}.
      The rule each rendered stays in the agent's settings, which are merged rather than
      replaced, until that line is deleted by hand.
  when: >-
    (faramir_block_stale_paths + faramir_block_stale_names
     + faramir_block_stale_commands) | length > 0

# What installs cleanly and then does not work: a linked file that has gone, and whatever else
# an add reports without failing on.
- name: Show what the entries warned about
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: >-
    {{ (faramir_block.results | default([])
        + faramir_block_name.results | default([])
        + faramir_block_command.results | default([])
        + faramir_block_rm_path.results | default([])
        + faramir_block_rm_name.results | default([])
        + faramir_block_rm_command.results | default([])
        + faramir_link.results | default([]))
       | map(attribute='stdout', default='')
       | reject('equalto', '')
       | map('from_json')
       | map(attribute='warnings', default=[])
       | flatten }}
