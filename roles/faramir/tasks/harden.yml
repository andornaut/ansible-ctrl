---
# Closing what the install opened: the operator's ~/.config to accounts outside it,
# the agent's block on running these playbooks, and ptrace between brokered commands.
#
# And pinning what it granted. The two below are init's to set and nothing here undoes them;
# converging them means an access that goes missing is restored on the next run. Left alone
# it surfaces as a redaction faramir refuses to run, which withholds the output of every
# brokered command rather than the ones wanting the ref that went unread, so the symptom
# names neither the file nor the account that lost it.
- name: Keep the agent home traversable by the client group
  ansible.builtin.file:
    path: "{{ faramir_user_home }}"
    # No owner: the account owns its own home, and naming it here would be a second answer
    # to a question passwd has already settled.
    group: "{{ faramir_client_group }}"
    mode: "{{ faramir_user_home_mode }}"
    follow: false
  become: true

# The levels between the home and the enrolled tree, and neither end: the home is set above,
# and the tree itself is faramir's, shared setgid by init-project. Declared here rather than
# left to the install, which reaches them by walking down from the home and so decides the
# mode of directories that are the operator's and no part of any enrolled tree.
#
# The same mode and group as the home, so the walk to a shared tree is gated the same way at
# every step. Redundant while the home holds, and the whole of the gate if it is ever widened
# by something that does not subtract the way roles/base does.
#
# An enrolled tree sitting directly in the home yields no levels and an empty loop.
- name: Keep the levels between the home and the enrolled tree traversable
  ansible.builtin.file:
    path: "{{ faramir_user_home }}/{{ faramir_project_parents[:item] | join('/') }}"
    group: "{{ faramir_client_group }}"
    mode: "{{ faramir_user_home_mode }}"
    follow: false
  loop: "{{ range(1, (faramir_project_parents | length) + 1) | list }}"
  loop_control:
    label: "{{ faramir_user_home }}/{{ faramir_project_parents[:item] | join('/') }}"
  vars:
    # Ordered: the second reads the first, and a vars block renders one key at a time.
    faramir_project_rel_dir: "{{ playbook_dir | relpath(faramir_user_home) | dirname }}"
    faramir_project_parents: >-
      {{ [] if faramir_project_rel_dir in ['.', ''] else faramir_project_rel_dir.split('/') }}
  when:
    # playbook_dir is the enrolled tree, and only the controller has a checkout of it. A tree
    # outside the home has no levels this role is answerable for.
    - faramir_is_controller | bool
    - playbook_dir.startswith(faramir_user_home ~ '/')
  become: true

# `link add` refuses an entry whose file is not there, so tasks/entries.yml has already
# failed the run if one is missing and there is nothing to guard against here.
- name: Keep the files the links name readable by the broker
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: "{{ faramir_link_file_group }}"
    mode: "{{ faramir_link_file_mode }}"
    follow: false
  loop: "{{ faramir_links }}"
  loop_control:
    label: "{{ item.ref }}"
  register: faramir_link_files
  become: true

# A group or mode change moves neither mtime nor size, which is all the broker fingerprints,
# so it does not notice one and goes on serving what it read before. What degrades a ref is
# the file being replaced, which the broker does notice and then fails to read; the change
# above is the repair after that, and only then is a re-read owed. Gated on a change for that
# reason: an unchanged file is one the broker never gave up on.
#
# Said rather than done. `faramir reload` clears it, stopping the socket-activated services so
# the next brokered command loads them fresh, and a broker restart would do as well. Neither
# can run from here: a stop waits for the brokered command still inside the executor, which is
# this play wherever the run was launched through `faramir run`, and the command waits on the
# stop. TimeoutStopSec ends the deadlock by killing the broker out from under the run.
- name: Say which linked files were repaired and have not been re-read
  ansible.builtin.debug:
    msg: >-
      Corrected the group or mode of {{ faramir_link_repaired | join(', ') }}. The broker goes
      on refusing a ref it gave up on until it re-reads the file, so run `sudo faramir reload`
      from a root shell, outside any `faramir run`. Until then `faramir status` exits non-zero
      and `faramir doctor` fails, both naming the ref.
  vars:
    faramir_link_repaired: >-
      {{ faramir_link_files.results | default([]) | selectattr('changed')
         | map(attribute='item.ref') | list }}
  when: faramir_link_repaired | length > 0
  become: false

# init grants the client group traversal from the home down, and what that reaches is
# whatever the `other` bits allow: the umask is 0002, so a directory created later arrives
# 0775. The immediate children suffice, a directory closed to other closing the tree under
# it.
- name: Close the operator's ~/.config to accounts outside it
  become: true
  block:
    - name: List what sits beside the config directory
      ansible.builtin.find:
        paths: "{{ faramir_user_home }}/.config"
        file_type: any
        recurse: false
      register: faramir_config_siblings

    # The config directory is exempt and must stay so: it is root's, 0755, and the service
    # accounts are in none of its groups, so they reach config.toml and the store through
    # those `other` bits alone. Closing it stops every daemon.
    - name: Close each one to other
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: o-rwx
        # The symlink, not whatever it points at, which is out of this task's scope.
        follow: false
      loop: >-
        {{ faramir_config_siblings.files
           | rejectattr('path', 'equalto', faramir_config_dir)
           | rejectattr('islnk')
           | selectattr('mode', 'search', '[^0]$')
           | list }}
      loop_control:
        label: "{{ item.path | basename }} ({{ item.mode }})"

# faramir's own agent snippet covers the broker, not this repo: which flags an unprivileged
# brokered run needs, and what the approved route costs instead. The controller's alone,
# there being no checkout to write it into anywhere else.
- name: Tell the agent how to run a playbook through the broker
  when: faramir_is_controller | bool
  ansible.builtin.blockinfile:
    # The target, not a symlink to it: a host without the symlink would end up with two
    # divergent files.
    path: "{{ playbook_dir }}/AGENTS.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_client_group }}"
    # init-project adds group write to every file, so 0644 here would never converge.
    mode: "0664"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Two routes,
      the second reaching the controller at the cost of an approval.

      Unprivileged, needing no approval, and unable to configure the controller:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir_controller'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir_controller'` excludes the controller because `become`
      there raises an escalation per task, which would leave the run failing after
      the rest of it has already applied.

      Approved once, then root for the whole run:

          faramir run -- sudo make <playbook>

      One approval covers it: no per-task prompt, and no `--ask-become-pass`,
      which a root run never gets. Root reads the sops store itself, so this
      route needs no `--env-file`.

      `faramir_refs` shows the available names.
  become: true

# Yama, so that one brokered command cannot ptrace another and read the values injected into
# it. Before the doctor check below, which reports on what this leaves.
- name: Restrict ptrace to a process's own descendants
  when: faramir_ptrace_scope is not none
  become: true
  block:
    # Absent on a kernel built without CONFIG_SECURITY_YAMA, where there is no knob to set
    # and the sysctl module would fail rather than skip.
    - name: Check for Yama
      ansible.builtin.stat:
        path: /proc/sys/kernel/yama/ptrace_scope
      register: faramir_yama

    - name: Set kernel.yama.ptrace_scope
      ansible.posix.sysctl:
        name: kernel.yama.ptrace_scope
        value: "{{ faramir_ptrace_scope | int }}"
        # 60-, so it is read after the 10-ptrace.conf procps ships and wins where the two
        # disagree.
        sysctl_file: /etc/sysctl.d/60-faramir-ptrace.conf
        sysctl_set: true
        reload: true
      when: faramir_yama.stat.exists

    - name: Say when there is no Yama to set
      ansible.builtin.debug:
        msg: >-
          This kernel has no /proc/sys/kernel/yama/ptrace_scope, so nothing restricts one
          process of the executor's uid from ptracing another. faramir doctor reports the
          same as unchecked.
      when: not faramir_yama.stat.exists
