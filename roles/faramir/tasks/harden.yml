---
# Closing what the install opened: the operator's ~/.config to accounts outside it,
# the agent's block on running these playbooks, and ptrace between brokered commands.
#
# Imported by broker.yml at the point it used to hold these, so ordering, become and
# the `broker` tag are what they were.

# init grants the client group traversal from the home down, and what that reaches is
# whatever the `other` bits allow: the umask is 0002, so a directory created later arrives
# 0775. The immediate children suffice, a directory closed to other closing the tree under
# it.
- name: Close the operator's ~/.config to accounts outside it
  become: true
  block:
    - name: List what sits beside the config directory
      ansible.builtin.find:
        paths: "{{ faramir_user_home }}/.config"
        file_type: any
        recurse: false
      register: faramir_config_siblings

    # The config directory is exempt and must stay so: it is root's, 0755, and the service
    # accounts are in none of its groups, so they reach config.toml and the store through
    # those `other` bits alone. Closing it stops every daemon.
    - name: Close each one to other
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: o-rwx
        # The symlink, not whatever it points at, which is out of this task's scope.
        follow: false
      loop: >-
        {{ faramir_config_siblings.files
           | rejectattr('path', 'equalto', faramir_config_dir)
           | rejectattr('islnk')
           | selectattr('mode', 'search', '[^0]$')
           | list }}
      loop_control:
        label: "{{ item.path | basename }} ({{ item.mode }})"

# faramir's own agent snippet covers the broker, not this repo: which flags an unprivileged
# brokered run needs, and what the approved route costs instead. The controller's alone,
# there being no checkout to write it into anywhere else.
- name: Tell the agent how to run a playbook through the broker
  when: faramir_is_controller | bool
  ansible.builtin.blockinfile:
    # The target, not a symlink to it: a host without the symlink would end up with two
    # divergent files.
    path: "{{ playbook_dir }}/AGENTS.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_client_group }}"
    # init-project adds group write to every file, so 0644 here would never converge.
    mode: "0664"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Two routes,
      the second reaching the controller at the cost of an approval.

      Unprivileged, needing no approval, and unable to configure the controller:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir_controller'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir_controller'` excludes the controller because `become`
      there raises an escalation per task, which would leave the run failing after
      the rest of it has already applied.

      Approved once, then root for the whole run:

          faramir run -- sudo make <playbook>

      One approval covers it: no per-task prompt, and no `--ask-become-pass`,
      which a root run never gets. Root reads the sops store itself, so this
      route needs no `--env-file`.

      `faramir_refs` shows the available names.
  become: true

# Yama, so that one brokered command cannot ptrace another and read the values injected into
# it. Before the doctor check below, which reports on what this leaves.
- name: Restrict ptrace to a process's own descendants
  when: faramir_ptrace_scope is not none
  become: true
  block:
    # Absent on a kernel built without CONFIG_SECURITY_YAMA, where there is no knob to set
    # and the sysctl module would fail rather than skip.
    - name: Check for Yama
      ansible.builtin.stat:
        path: /proc/sys/kernel/yama/ptrace_scope
      register: faramir_yama

    - name: Set kernel.yama.ptrace_scope
      ansible.posix.sysctl:
        name: kernel.yama.ptrace_scope
        value: "{{ faramir_ptrace_scope | int }}"
        # 60-, so it is read after the 10-ptrace.conf procps ships and wins where the two
        # disagree.
        sysctl_file: /etc/sysctl.d/60-faramir-ptrace.conf
        sysctl_set: true
        reload: true
      when: faramir_yama.stat.exists

    - name: Say when there is no Yama to set
      ansible.builtin.debug:
        msg: >-
          This kernel has no /proc/sys/kernel/yama/ptrace_scope, so nothing restricts one
          process of the executor's uid from ptracing another. faramir doctor reports the
          same as unchecked.
      when: not faramir_yama.stat.exists
