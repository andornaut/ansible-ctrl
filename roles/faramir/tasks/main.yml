---
# What this role still does, now that `faramir init` does the install:
#
#   downloads the binaries, which faramir publishes but does not install
#   runs init once, with this project's paths
#   names this project's sops files and SSH key in a config.d drop-in
#   tells the agent how to run a playbook through the broker
#   asks faramir doctor whether any of it works
#
# Everything else -- accounts, directories, the age key, .sops.yaml, the units,
# their sandboxing, the systemd ordering -- belongs to faramir
# and is not restated here. A setting named in both places is one that can
# disagree with itself.

# First: faramir_user_home comes from a passwd entry, and the config directory,
# the store and the operator's age key all hang off it.
# tags: always so a --tags run cannot skip either.
- name: Read the passwd and group databases
  ansible.builtin.getent:
    database: passwd
  tags: always

- name: Validate the faramir account
  ansible.builtin.assert:
    that:
      # primary_user is inventory data, so an inventory that omits it would
      # otherwise fail on an undefined lookup several tasks later.
      - faramir_user is defined and faramir_user | length > 0
      - faramir_user != "root"
      # Membership too, and not only that a name was given: faramir_user_home
      # indexes the passwd entry, so an account this host does not have fails
      # there instead, on a missing dictionary key that names nothing.
      # The account is never created here. It is the operator's own login, and
      # what makes it theirs -- the keys, the checkouts, the commit identity --
      # is not something this role could put back.
      - faramir_user in ansible_facts["getent_passwd"]
    fail_msg: >-
      faramir_user must be an existing non-root account on this host. Set
      primary_user in the inventory (or faramir_user in host_vars) to the
      account the coding agent runs as.
    quiet: true
  tags: always

- name: Require an architecture the dev release is built for
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      The faramir dev release ships amd64 binaries only, and this host is
      {{ ansible_facts['architecture'] }}. Build from source there, or install
      from a tagged release once faramir publishes one.
    quiet: true

# The tree brokered commands run in is the checkout this play was run from, so
# playbook_dir names it and no variable can point somewhere the operator does not
# actually work. That path is the controller's, and it is the target's too only
# because the host this role applies to is the controller: a remote host in the
# faramir group would be handed a directory that need not exist there. This is
# the check for that, and it is here rather than beside init-project so it fails
# before the download and the install rather than after them.
- name: Check for the working tree
  ansible.builtin.stat:
    path: "{{ playbook_dir }}"
  register: faramir_worktree_dir

- name: Require the working tree
  ansible.builtin.assert:
    that: faramir_worktree_dir.stat.isdir | default(false)
    fail_msg: >-
      No directory at {{ playbook_dir }} on this host. faramir enrols the
      checkout the play was run from, so this role applies only to the
      controller holding that checkout.
    quiet: true

# sops is asserted rather than installed: roles here declare no dependencies, and
# a second installer would drift from the dev role's. It is what the keeper execs
# to decrypt and what the operator edits the store with, so it is a run-time
# requirement and not only an install-time one.
# check_mode: false so the assert below has an rc to read; a skipped probe would
# fail on an undefined variable instead of reporting what is wrong.
- name: Locate sops
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v sops
  register: faramir_sops
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require sops
  ansible.builtin.assert:
    that: faramir_sops.rc == 0
    fail_msg: "sops is not installed. It comes from the dev role: make dev -- --tags sops"
    quiet: true

# Downloaded rather than built from a checkout: init copies the binaries it is
# given into /usr/local/bin and carries the units, the config, the hook and the
# docs inside them, so the controller needs no source layout and no Go
# toolchain.
#
# Staged in a temp directory rather than kept: what is installed is what init
# copied, and a directory of binaries left behind is a second copy that nothing
# updates. 23MB a run is the cost.
- name: Install faramir from the dev release
  block:
    - name: Create a temporary directory for the faramir binaries
      ansible.builtin.tempfile:
        state: directory
      register: faramir_staging
      # With the download and init below, which run under --check as well: init
      # is given --dry-run there and still has to find binaries to preflight
      # against, and all of this lands in a directory the always: below removes.
      check_mode: false

    - name: Download the faramir binaries
      ansible.builtin.get_url:
        url: "{{ faramir_release_url }}/{{ item }}"
        dest: "{{ faramir_staging.path }}/{{ item }}"
        mode: "0755"
      loop: "{{ faramir_release_binaries }}"
      loop_control:
        label: "{{ item }}"
      # A fresh temp directory means every download is a new file, so this would
      # report changed on every run. What changed on the host is what init says
      # below, which compares each binary against the installed one.
      changed_when: false
      check_mode: false
      # A release asset is a redirect to object storage, so a failure here is a
      # network one and worth retrying.
      register: faramir_download
      until: faramir_download is succeeded
      retries: 3
      delay: 5

    # The whole install, in one command. It is idempotent and reports per step,
    # so the changed state below is what it says rather than something inferred
    # from stat-ing the host before and after.
    #
    # check_mode: false with --dry-run added to the argv instead: init computes
    # the same answers and writes nothing, which a skipped task could not report.
    - name: Install faramir
      ansible.builtin.command:
        argv: "{{ faramir_init_argv }}"
      become: true
      register: faramir_init
      check_mode: false
      changed_when: (faramir_init.stdout | from_json).changed

    - name: Read what the install did
      ansible.builtin.set_fact:
        faramir_report: "{{ faramir_init.stdout | from_json }}"
  always:
    - name: Remove the temporary directory for the faramir binaries
      ansible.builtin.file:
        path: "{{ faramir_staging.path }}"
        state: absent
      when: faramir_staging.path is defined
      become: true

# Enrolling the tree is separate from provisioning the host, and runs after it:
# it reads the shared group out of the config init installed rather than being
# told it a second time, which is what keeps a tree from being group-owned by
# something the broker socket does not admit.
#
# What enrolling does is share the tree, because brokered commands run in it as
# faramir-exec, which is not the operator's uid, and a home is 0700: it group-
# owns the tree, sets the setgid bits, and makes every directory group-executable
# from the home down. The sops files are not in here; the keeper reads them from
# faramir_secrets_dir through a bind of that one directory.
#
# It also installs the PreToolUse hook and the MCP server config here, which is
# what makes the broker worth using in this checkout rather than merely
# reachable from it.
#
# Only this checkout. A host is provisioned once and there is no limit to how
# many trees you work in, so enrol another where it lives:
# cd <dir> && sudo faramir init-project
- name: Enrol this checkout as a faramir project
  ansible.builtin.command:
    argv:
      - /usr/local/bin/faramir
      - init-project
      - --json
      - --operator
      - "{{ faramir_user }}"
      - --config-dir
      - "{{ faramir_config_dir }}"
      - "--hook={{ faramir_project_hook | bool | lower }}"
      - "{{ playbook_dir }}"
  become: true
  register: faramir_project
  check_mode: false
  changed_when: not ansible_check_mode and (faramir_project.stdout | from_json).changed
  when: not ansible_check_mode

- name: Show what enrolling the checkout warned about
  ansible.builtin.debug:
    msg: "{{ (faramir_project.stdout | from_json).warnings }}"
  when:
    - faramir_project.stdout | default('') | length > 0
    - (faramir_project.stdout | from_json).warnings | default([]) | length > 0

# init warns rather than fails on the things with a legitimate shape that have
# nonetheless left somebody with a broker that installs cleanly and does
# nothing: a group membership that needs a fresh login, an executor in the
# broker's group, a hook registered account-wide.
- name: Show what the install warned about
  ansible.builtin.debug:
    msg: "{{ faramir_report.warnings }}"
  when: faramir_report.warnings | default([]) | length > 0

# Which sops files the broker manages belongs to this project, not to faramir,
# and faramir ships no list of them. It goes in a drop-in so the base config
# stays faramir's and neither has to be merged by hand.
#
# Written every run, unlike the base config, which init installs once and then
# keeps: a setting that only lands on a first install is one this role cannot
# reconcile afterwards.
#
# The SSH key is not named here. init generates it and writes it into its own
# drop-in, config.d/00-faramir-init.toml, so it is named once; naming it again
# here would put the same path in the merged list twice.
#
# Skipped under --check on a host init has not provisioned: --dry-run writes no
# config.d, and copy fails on a missing destination directory before it consults
# check mode, which would abort a check run against a fresh controller.
- name: Check for the config drop-in directory
  ansible.builtin.stat:
    path: "{{ faramir_config_dir }}/config.d"
  register: faramir_configd
  become: true

- name: Name this project's secrets in a config drop-in
  ansible.builtin.copy:
    dest: "{{ faramir_config_dir }}/config.d/ansible-ctrl.toml"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-ctrl's faramir role. Merged over
      # the base config, which is faramir's own and not edited here.
      [secrets]
      files = {{ faramir_secrets_files | to_json }}
  register: faramir_dropin
  become: true
  when: faramir_configd.stat.isdir | default(false)

# Neither daemon re-reads its config while running, and the keeper has to lead:
# it decrypts the file list the broker is then served, so restarting the broker
# first just fetches the old value set again. `faramir reload` is that order,
# which is why this is one command rather than two systemd_service tasks.
#
# A task rather than a handler, hence the noqa: doctor below reads what the
# broker loaded, so a restart deferred to the end of the play would report the
# state the drop-in was written to replace.
- name: Restart the daemons onto the new drop-in # noqa: no-handler
  ansible.builtin.command:
    cmd: /usr/local/bin/faramir reload
  when: faramir_dropin.changed
  changed_when: true
  become: true

# Everything below reconciles what an earlier layout left behind. faramir
# installs and never migrates: a version of `faramir init` carrying a repair
# cannot know when every host has run it, so it would carry it forever. These
# are here instead, and are deleted once the fleet has converged, after which an
# install is a first install again.

# CLEANUP (added 2026-08-08): the store used to live in /etc/faramir/secrets.
# Delete once every controller has run this and the directory is gone.
#
# Emptiness is checked rather than assumed: state=absent on a directory is
# recursive, and this one held every credential until the move. A host that
# still keeps its store there keeps it.
- name: Look for a store left in the old location
  ansible.builtin.find:
    paths: /etc/faramir/secrets
    hidden: true
    file_type: any
  register: faramir_old_store
  failed_when: false
  become: true

- name: Remove the old store directory once it is empty
  ansible.builtin.file:
    path: /etc/faramir/secrets
    state: absent
  when:
    - faramir_old_store.files is defined
    - faramir_old_store.files | length == 0
  become: true

# CLEANUP (added 2026-08-08): the keeper's sandbox and its credential source used
# to be systemd drop-ins, written half by faramir's installer and half by this
# role. They are conditionals inside the unit now, and a leftover drop-in
# outranks the unit it extends, so one left in place silently keeps the old
# config path or the old credential. Delete once every controller has run this.
- name: Remove the systemd drop-ins the units now carry themselves
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item.0 }}.service.d/{{ item.1 }}
    state: absent
  loop: "{{ ['faramir-broker', 'faramir-keeper', 'faramir-exec']
            | product(['config-path.conf', 'secrets-path.conf', 'tpm-credential.conf'])
            | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  register: faramir_stale_dropins
  become: true

- name: Restart the daemons after removing a stale drop-in # noqa: no-handler
  ansible.builtin.command:
    cmd: /usr/local/bin/faramir reload
  when: faramir_stale_dropins.changed
  changed_when: true
  become: true

# CLEANUP (added 2026-08-08): the config and its drop-ins used to be installed
# under /etc/faramir whatever faramir_config_dir said. They are in the operator's
# home now, and nothing reads the old copies, so what is left there is a second
# config that disagrees with the running one and reads as authoritative to
# anyone who finds it first. Delete once every controller has run this.
#
# Named rather than globbed, and the directory is never removed: /etc/faramir
# still holds age.key and age.key.cred, which are the one thing here that must
# survive every cleanup. Deleting the key makes every managed file unreadable
# retroactively.
- name: Look for a config left in the old location
  ansible.builtin.find:
    paths: /etc/faramir
    patterns: config.toml*
    recurse: false
  register: faramir_old_configs
  failed_when: false
  changed_when: false
  become: true
  when: faramir_config_dir != '/etc/faramir'

- name: Remove the config left in the old location
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (faramir_old_configs.files | default([]) | map(attribute='path') | list)
            + ['/etc/faramir/config.d'] }}"
  loop_control:
    label: "{{ item }}"
  when: faramir_config_dir != '/etc/faramir'
  become: true

# CLEANUP (added 2026-08-08): faramir used to create a second account for the
# coding agent to run as. It does not: the agent runs as the operator, because
# one confined to its own uid cannot reach the checkouts, the gh credential or
# the commit identity that are the work it is asked to do. See docs/scope.md in
# the faramir checkout. The account left behind runs nothing and owns a home the
# operator cannot read.
#
# The home goes with it. What it holds is a checkout of a public repository and
# an agent's own ~/.claude, neither of which is the only copy of anything. Left
# behind it would be a directory nothing manages, owned by a uid adduser can
# hand to somebody else, and readable by nobody who could tell you what is in
# it.
- name: Remove the retired agent account and its home
  ansible.builtin.user:
    name: agent
    state: absent
    remove: true
  become: true

- name: Remove the retired agent group
  ansible.builtin.group:
    name: agent
    state: absent
  become: true

# CLEANUP (added 2026-08-08): the guard hook used to be registered in the
# operator's own settings, where it covered every project. It is per project
# now, because registering it is what auto-approves Bash: a rewritten command
# matches no permission rule, so an account-wide registration carries that cost
# into every repository, including ones that were never enrolled and get no
# redaction in return. Delete these two once no host has one.
#
# faramir itself only reports this, on the grounds that the file belongs to the
# operator. It does: this is the operator's own automation, editing it on their
# say-so, and it keeps a backup.
- name: Read the operator's agent settings
  ansible.builtin.slurp:
    src: "{{ faramir_user_home }}/.claude/settings.json"
  register: faramir_settings_raw
  failed_when: false

# init keeps an existing settings.json and writes what it would have installed
# to settings.json.dist beside it. Nothing merges that, so a deny rule added
# upstream sits there unread: the operator's Read rules drift behind the ones
# faramir ships, which is how the store's own directory ended up uncovered.
- name: Read the agent settings faramir ships
  ansible.builtin.slurp:
    src: "{{ faramir_user_home }}/.claude/settings.json.dist"
  register: faramir_settings_dist
  failed_when: false

# No owner, group or mode: the file is the operator's and this is the one task
# that rewrites it while become is in force, so naming any of them is how it
# would come back owned by root. Ansible keeps what the destination had.
- name: Reconcile the operator's agent settings with what faramir ships
  ansible.builtin.template:
    src: claude-settings.json.j2
    dest: "{{ faramir_user_home }}/.claude/settings.json"
    backup: true
  vars:
    settings: "{{ faramir_settings_raw.content | b64decode | from_json }}"
    shipped: >-
      {{ (faramir_settings_dist.content | default('') | b64decode | from_json)
         if faramir_settings_dist.content is defined else {} }}
  when: faramir_settings_raw.content is defined
  become: true

# Removed once its rules are in, or doctor reports a leftover on every run and
# the operator is told to merge a file that has already been merged. init writes
# it again next run; by then this task has nothing left to take from it.
- name: Remove the defaults that have been merged
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ faramir_user_home }}/.claude/settings.json.dist"
    - "{{ faramir_config_dir }}/config.toml.dist"
  become: true

# CLEANUP (added 2026-08-08): init creates the config directory owned by the
# home's owner when it sits in one, but never re-owns a directory that is
# already there, on the grounds that an operator may have set it up themselves.
# One created root-owned by the installer that came before it therefore stays
# that way, and the operator needs sudo to edit their own config. Delete once no
# host has one.
#
# Not recursive: the store underneath is 2770 root:{{ faramir_dev_group }} and a
# recursive chown would flatten it.
- name: Give the operator back their own config directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ faramir_config_owner }}"
    group: "{{ faramir_config_owner }}"
    mode: "0755"
  loop:
    - "{{ faramir_config_dir }}"
    - "{{ faramir_config_dir }}/config.d"
  become: true

- name: Find a config the earlier installer left root-owned
  ansible.builtin.find:
    paths: "{{ faramir_config_dir }}"
    patterns: config.toml
    recurse: false
  register: faramir_root_configs
  failed_when: false
  changed_when: false
  become: true
  when: faramir_config_owner != 'root'

- name: Give the operator back their own config file
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ faramir_config_owner }}"
    group: "{{ faramir_config_owner }}"
    mode: "0644"
  loop: "{{ faramir_root_configs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

# faramir's own agent snippet says how the broker works and nothing about this
# repo. These two flags are what make a brokered run work here, and an agent
# that has to guess them gets a run that reaches the wrong hosts or no
# credentials at all.
- name: Tell the agent how to run a playbook through the broker
  ansible.builtin.blockinfile:
    # AGENTS.md, which every coding agent reads and which CLAUDE.md is a symlink
    # to here. blockinfile writes through a symlink, so naming either works, but
    # naming the target keeps a host without that symlink from ending up with
    # two files saying different things.
    path: "{{ playbook_dir }}/AGENTS.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_dev_group }}"
    # Not group-writable. The dev group includes the executor, and this file is
    # what tells the agent which paths to leave alone; a brokered command has no
    # reason to be able to rewrite it. The operator owns it and is who edits it.
    mode: "0644"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Run a
      playbook with both of these:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir'` excludes the controller, which a brokered
      run cannot configure: commands run as a uid with no sudo there, so those
      tasks fail after the rest of the run has already applied. The operator
      applies the controller's own playbooks.

      `faramir_list_secrets` shows the available names. Do not use `make`: it is
      the operator's entry point and prompts for a sudo password, which a
      brokered command has no terminal to answer.
  become: true

# The questions the install cannot answer about itself. A broker serving zero
# refs, an ssh-agent holding no key, and a shared group with members nobody
# recognises all look exactly like a healthy install: every socket is active,
# every unit is running, and nothing is redacted or reachable.
#
# Skipped under --check, where init wrote nothing and there is nothing new to
# examine.
- name: Ask faramir whether the install is doing its job
  ansible.builtin.command:
    argv:
      - /usr/local/bin/faramir
      - doctor
      - --json
      - --config-dir
      - "{{ faramir_config_dir }}"
      - --operator
      - "{{ faramir_user }}"
      - --group
      - "{{ faramir_dev_group }}"
      - --broker-user
      - "{{ faramir_broker_user }}"
      - --keeper-user
      - "{{ faramir_keeper_user }}"
      - --exec-user
      - "{{ faramir_exec_user }}"
  become: true
  register: faramir_doctor
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# Before the two tasks below, which are the role's only health gate and which
# both read stdout. Without this, a doctor that cannot run at all (missing
# binary, panic, or the failure path that writes its error to stderr) leaves
# stdout empty, skips both of them, and the run reports a working install.
- name: Require faramir doctor to have reported
  ansible.builtin.assert:
    that: faramir_doctor.stdout | length > 0
    fail_msg: >-
      faramir doctor produced no report: rc {{ faramir_doctor.rc }},
      {{ faramir_doctor.stderr | default('no stderr') }}.
    quiet: true
  when: not ansible_check_mode

- name: Show what faramir doctor found
  ansible.builtin.debug:
    msg: >-
      {{ (faramir_doctor.stdout | from_json).findings
         | map(attribute='check') | zip((faramir_doctor.stdout | from_json).findings
         | map(attribute='status')) | map('join', ': ') | list }}
  when: not ansible_check_mode

- name: Require a working install
  ansible.builtin.assert:
    that: not (faramir_doctor.stdout | from_json).failed
    fail_msg: >-
      {{ (faramir_doctor.stdout | from_json).findings
         | selectattr('status', 'equalto', 'failed')
         | map(attribute='detail') | join('; ') }}
    quiet: true
  when: not ansible_check_mode

# Printed every run, not only when the key was just generated: it is what has to
# be in authorized_keys on every managed host, and an install that never says so
# is one where the fleet silently rejects the agent. faramir_fleet.yml is what
# puts it there.
- name: Show the public key the fleet has to authorize
  ansible.builtin.debug:
    msg:
      - "broker public key ({{ faramir_broker_ssh_key }}.pub):"
      - "{{ faramir_report.broker_public_key | default('none; faramir_broker_ssh_key is empty') }}"
      - "It must be in ~/.ssh/authorized_keys for the account ansible connects as
         on every managed host, or brokered playbooks authenticate as nobody.
         Run: make faramir_fleet ASK_PASS=1"
  when: faramir_broker_ssh_key | length > 0
