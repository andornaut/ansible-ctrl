---
# What this role does that `faramir init` does not:
#
#   downloads the binary, which faramir publishes but does not install
#   enrols this checkout as a project
#   tells the agent how to run a playbook through the broker
#   asks faramir doctor whether any of it works
#
# The accounts, the directories, the age key, .sops.yaml, the units and their
# sandboxing belong to faramir and are not restated here: a setting named in
# both places is one that can disagree with itself.

# faramir_user_home indexes this, and the config directory, the store and the
# age key all hang off it. tags: always so a --tags run cannot skip it.
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd
  tags: always

- name: Validate the faramir account
  ansible.builtin.assert:
    that:
      # primary_user is inventory data, so an inventory that omits it would
      # otherwise fail on an undefined lookup several tasks later.
      - faramir_user is defined and faramir_user | length > 0
      - faramir_user != "root"
      # Membership too, and not only that a name was given: faramir_user_home
      # indexes the passwd entry, so an account this host does not have fails
      # there instead, on a missing dictionary key that names nothing.
      - faramir_user in ansible_facts["getent_passwd"]
    fail_msg: >-
      faramir_user must be an existing non-root account on this host. Set
      primary_user in the inventory (or faramir_user in host_vars) to the
      account the coding agent runs as.
    quiet: true
  tags: always

# The tree brokered commands run in is the checkout this play was run from, so
# playbook_dir names it and no variable can point somewhere the operator does not
# actually work. That path is the controller's, so this also catches a remote
# host in the faramir group, and runs before the install rather than after it.
- name: Check for the working tree
  ansible.builtin.stat:
    path: "{{ playbook_dir }}"
  register: faramir_worktree_dir

- name: Require the working tree
  ansible.builtin.assert:
    that: faramir_worktree_dir.stat.isdir | default(false)
    fail_msg: >-
      No directory at {{ playbook_dir }} on this host. faramir enrols the
      checkout the play was run from, so this role applies only to the
      controller holding that checkout.
    quiet: true

# sops is asserted rather than installed: roles here declare no dependencies, and
# a second installer would drift from the dev role's. The keeper execs it to
# decrypt, so it is a run-time requirement and not only an install-time one.
# check_mode: false so the assert below has an rc to read.
- name: Locate sops
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v sops
  register: faramir_sops
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require sops
  ansible.builtin.assert:
    that: faramir_sops.rc == 0
    fail_msg: "sops is not installed. It comes from the dev role: make dev -- --tags sops"
    quiet: true

# Staged in a temp directory rather than kept: init installs the binary it was
# run from, so what is installed is init's own copy and one left behind here
# would be a second copy that nothing updates. One ~7MB archive a run is the cost.
#
# The whole block runs under --check as well: init is given --dry-run there and
# still has to find a binary to preflight against, and all of it lands in a
# directory the always: below removes.
- name: Install faramir from the dev release
  block:
    - name: Create a temporary directory for the faramir release
      ansible.builtin.tempfile:
        state: directory
      register: faramir_staging
      check_mode: false

    - name: Download the faramir release archive
      ansible.builtin.get_url:
        url: "{{ faramir_release_url }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_staging.path }}/{{ faramir_release_archive }}"
        # checksums.txt is fetched from the same release and matched by asset
        # name. `dev` is a moving tag, so a download that straddles a re-cut
        # fails here rather than installing one build's binaries as another's.
        checksum: "sha256:{{ faramir_release_url }}/checksums.txt"
        mode: "0644"
      check_mode: false
      # A release asset is a redirect to object storage, so a failure here is a
      # network one and worth retrying.
      register: faramir_download
      until: faramir_download is succeeded
      retries: 3
      delay: 5

    # Beside the archive rather than in a directory of its own: init installs the
    # one binary it was run from and nothing else out of the directory it sits in.
    - name: Unpack the faramir binary
      ansible.builtin.unarchive:
        src: "{{ faramir_staging.path }}/{{ faramir_release_archive }}"
        dest: "{{ faramir_staging.path }}"
        remote_src: true
        # Applied to what came out of the archive, not to the directory holding
        # it: tar drops the archive's mode through the umask, and the next task
        # runs the binary unpacked here.
        mode: "0755"
      check_mode: false

    # The whole install, in one command. It reports per step, so changed is what
    # it says rather than something inferred from stat-ing the host.
    #
    # Guarded on stdout because changed_when is evaluated even when the command
    # failed: init that exits before writing its report leaves stdout empty, and
    # an unguarded filter reports a parse error beside the real one.
    - name: Install faramir
      ansible.builtin.command:
        argv: "{{ faramir_init_argv }}"
      become: true
      register: faramir_init
      check_mode: false
      changed_when: faramir_init.stdout | length > 0 and (faramir_init.stdout | from_json).changed

    - name: Read what the install did
      ansible.builtin.set_fact:
        faramir_report: "{{ faramir_init.stdout | from_json }}"
  always:
    - name: Remove the temporary directory for the faramir binaries
      ansible.builtin.file:
        path: "{{ faramir_staging.path }}"
        state: absent
      when: faramir_staging.path is defined
      # With the rest of the block: a removal that only simulated would leave
      # the unpacked archive in /tmp on every check run.
      check_mode: false

# Enrolling the tree is separate from provisioning the host and runs after it: it
# reads the client group out of the config init installed rather than being told
# it a second time, which is what keeps a tree from being group-owned by
# something the broker socket does not admit.
#
# Only this checkout. A host is provisioned once and there is no limit to how
# many trees you work in, so enrol another where it lives:
# cd <dir> && sudo faramir init-project
#
# Unlike init above, this runs the installed binary rather than the staged one,
# the staging directory being gone by now. Under --check that binary is only
# there if a previous run installed it, so a first run on a fresh host has
# nothing to preflight against and skips; anywhere else --dry-run reports what
# enrolling would change, which a skipped task could not.
- name: Check for the installed faramir binary
  ansible.builtin.stat:
    path: "{{ faramir_binary }}"
  register: faramir_binary_stat

- name: Enrol this checkout as a faramir project
  ansible.builtin.command:
    argv: "{{ faramir_init_project_argv }}"
  become: true
  register: faramir_project
  check_mode: false
  changed_when: faramir_project.stdout | length > 0 and (faramir_project.stdout | from_json).changed
  when: faramir_binary_stat.stat.exists | default(false)

# init and init-project both warn rather than fail on the things with a
# legitimate shape that have nonetheless left somebody with a broker that
# installs cleanly and does nothing: a group membership that needs a fresh
# login, an executor in the broker's group, a hook registered account-wide.
# One warning per line; an empty list skips the task.
- name: Show what faramir warned about
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ faramir_report.warnings | default([]) + faramir_project_warnings }}"

# This project names no secrets file: faramir's base config globs the store
# directory, so a sops file is managed by being in it.

# faramir's own agent snippet says how the broker works and nothing about this
# repo. These two flags are what make a brokered run work here, and an agent
# that has to guess them gets a run that reaches the wrong hosts or no
# credentials at all.
- name: Tell the agent how to run a playbook through the broker
  ansible.builtin.blockinfile:
    # AGENTS.md, which every coding agent reads and which CLAUDE.md is a symlink
    # to here. blockinfile writes through a symlink, so naming either works, but
    # naming the target keeps a host without that symlink from ending up with
    # two files saying different things.
    path: "{{ playbook_dir }}/AGENTS.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_dev_group }}"
    # Group-writable, like every other file in the tree: init-project adds group
    # write to all of them, so 0644 here is reverted on the next run and set back
    # on the one after, and the task never converges.
    mode: "0664"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Run a
      playbook with both of these:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir'` excludes the controller, which a brokered
      run cannot configure: commands run as a uid with no sudo there, so those
      tasks fail after the rest of the run has already applied. The operator
      applies the controller's own playbooks.

      `faramir_list_secrets` shows the available names. Do not use `make`: it is
      the operator's entry point and prompts for a sudo password, which a
      brokered command has no terminal to answer.
  become: true

# The questions the install cannot answer about itself. A broker serving zero
# refs, an ssh-agent holding no key, and a client group with members nobody
# recognises all look exactly like a healthy install: every socket is active,
# every unit is running, and nothing is redacted or reachable.
#
# The whole block is skipped under --check, where init wrote nothing and there
# is nothing new to examine.
- name: Check that the install works
  when: not ansible_check_mode
  block:
    - name: Ask faramir whether the install is doing its job
      ansible.builtin.command:
        argv: "{{ faramir_doctor_argv }}"
      become: true
      register: faramir_doctor
      changed_when: false
      failed_when: false

    # Before the tasks below, which all read the report. Without this, a doctor
    # that cannot run at all (missing binary, panic, or the failure path that
    # writes its error to stderr) leaves stdout empty and fails on a parse error
    # naming nothing.
    - name: Require faramir doctor to have reported
      ansible.builtin.assert:
        that: faramir_doctor.stdout | length > 0
        fail_msg: >-
          faramir doctor produced no report: rc {{ faramir_doctor.rc }},
          {{ faramir_doctor.stderr | default('no stderr') }}.
        quiet: true

    - name: Read what faramir doctor found
      ansible.builtin.set_fact:
        faramir_doctor_report: "{{ faramir_doctor.stdout | from_json }}"

    - name: Show what faramir doctor found
      ansible.builtin.debug:
        msg: "{{ item.check }}: {{ item.status }}"
      loop: "{{ faramir_doctor_report.findings }}"
      loop_control:
        label: "{{ item.check }}"

    - name: Require a working install
      ansible.builtin.assert:
        that: not faramir_doctor_report.failed
        fail_msg: >-
          {{ faramir_doctor_report.findings
             | selectattr('status', 'equalto', 'failed')
             | map(attribute='detail') | join('; ') }}
        quiet: true

# Printed every run, not only when the key was just generated: it is what has to
# be in authorized_keys on every managed host, and an install that never says so
# is one where the fleet silently rejects the agent. tasks/ssh.yml, which
# faramir_fleet.yml applies, is what puts it there.
- name: Show the public key the fleet has to authorize
  ansible.builtin.debug:
    msg:
      - "broker public key ({{ faramir_broker_ssh_key }}.pub):"
      - "{{ faramir_report.broker_public_key | default('none; faramir_broker_ssh_key is empty') }}"
      - "It must be in ~/.ssh/authorized_keys for the account ansible connects as
         on every managed host, or brokered playbooks authenticate as nobody.
         Run: make faramir_fleet ASK_PASS=1"
  when: faramir_broker_ssh_key | length > 0
