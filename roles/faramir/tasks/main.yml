---
# First: faramir_worktree and faramir_src_dir derive from passwd entries, so the
# guard below cannot check them until this has run.
# tags: always so a --tags run cannot skip either.
- name: Read the passwd and group databases
  ansible.builtin.getent:
    database: "{{ item }}"
  loop:
    - passwd
    - group
  tags: always

- name: Validate faramir accounts and worktree
  ansible.builtin.assert:
    that:
      # primary_user is inventory data, so an inventory that omits it would
      # otherwise fail on an undefined lookup several tasks later.
      - faramir_user is defined and faramir_user | length > 0
      - faramir_user != "root"
      - faramir_worktree.startswith("/")
    fail_msg: >-
      faramir_user must be a non-root account and faramir_worktree must be an
      absolute path. Set primary_user in the inventory (or faramir_user in
      host_vars) to the account the coding agent runs as.
    quiet: true
  tags: always

- name: Check for the faramir checkout
  ansible.builtin.stat:
    path: "{{ faramir_src_dir }}/Makefile"
  register: faramir_checkout

- name: Require the faramir checkout
  ansible.builtin.assert:
    that: faramir_checkout.stat.exists
    fail_msg: >-
      No faramir checkout at {{ faramir_src_dir }}. There are no published
      release binaries, so they are built from source here:
      git clone git@github.com:andornaut/faramir.git {{ faramir_src_dir }}
    quiet: true

# Go and sops are asserted rather than installed: roles here declare no
# dependencies, and a second installer for either would drift from the dev
# role's. check_mode: false so the asserts below have an rc to read; a skipped
# probe would fail on an undefined variable instead of reporting what is wrong.
- name: Locate the build and secret-store tools
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: command -v {{ item.cmd }}
  environment:
    PATH: "{{ faramir_go_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  register: faramir_tools
  changed_when: false
  failed_when: false
  check_mode: false
  loop:
    - cmd: go
      hint: "It comes from the dev role: make dev -- --tags go"
    - cmd: sops
      hint: "It comes from the dev role: make dev -- --tags sops"
  loop_control:
    label: "{{ item.cmd }}"

- name: Require the build and secret-store tools
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "{{ item.item.cmd }} is not installed. {{ item.item.hint }}"
    quiet: true
  loop: "{{ faramir_tools.results }}"
  loop_control:
    label: "{{ item.item.cmd }}"

- name: Build the faramir binaries
  tags: build
  block:
    # Reproducible: the Makefile builds with -trimpath and CGO_ENABLED=0, so the
    # checksum moves only when the source does. That makes it a usable signal
    # both for "did this build change anything" and for phase 3's change report.
    - name: Check the built broker binary
      ansible.builtin.stat:
        path: "{{ faramir_src_dir }}/bin/faramir-broker"
        checksum_algorithm: sha256
      register: faramir_built_before

    - name: Run make build
      ansible.builtin.command:
        cmd: make build
        chdir: "{{ faramir_src_dir }}"
      environment:
        PATH: "{{ faramir_go_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
      # Reported by the checksum comparison below: go build is a no-op when
      # nothing changed, and says nothing either way.
      changed_when: false

    - name: Check the built broker binary after the build
      ansible.builtin.stat:
        path: "{{ faramir_src_dir }}/bin/faramir-broker"
        checksum_algorithm: sha256
      register: faramir_built
      changed_when: >-
        faramir_built.stat.checksum != faramir_built_before.stat.checksum | default('')

# --skip-tags build is a reinstall of what is already there, which is only a
# thing to do when it is already there. Checked separately from the config
# probe below so that "not built" does not surface as "does not parse".
- name: Require the built binaries
  ansible.builtin.stat:
    path: "{{ faramir_src_dir }}/bin/{{ item }}"
  register: faramir_binaries
  loop:
    - faramir
    - faramir-broker
    - faramir-guard
  loop_control:
    label: "{{ item }}"

- name: Fail when the binaries are missing
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ faramir_src_dir }}/bin/{{ item.item }} is missing. Phase 3 refuses to
      install without it. Drop --skip-tags build, or run make build in the
      checkout.
    quiet: true
  loop: "{{ faramir_binaries.results }}"
  loop_control:
    label: "{{ item.item }}"

# Phase 3 refuses a config that does not parse, and it refuses it after the
# binaries and the hook are already on the host, leaving the install
# half-applied. Read the source config here, with the parser that will judge
# it, so a bad config stops the run before it touches root.
- name: Check that the source config parses
  ansible.builtin.command:
    cmd: bin/faramir-broker -c {{ faramir_config_src }} --parse-only
    chdir: "{{ faramir_src_dir }}"
  register: faramir_config_parse
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require a source config that parses
  ansible.builtin.assert:
    that: faramir_config_parse.rc == 0
    fail_msg: >-
      {{ faramir_config_src }} does not parse as a faramir config.
    quiet: true

# The phase scripts are idempotent re-assertions and report nothing a machine can
# read, so each one's changed_when comes from the state it establishes, checked
# here before any of them runs.
- name: Check the installed broker binary
  ansible.builtin.stat:
    path: /usr/local/bin/faramir-broker
    checksum_algorithm: sha256
  register: faramir_installed

- name: Check for the age key
  ansible.builtin.stat:
    path: /etc/faramir/age.key
  register: faramir_age_key

- name: Check for the agent's Claude settings
  ansible.builtin.stat:
    path: "{{ faramir_user_home }}/.claude/settings.json"
  register: faramir_agent_settings

# Phase 1 first: it creates the service accounts and the shared working tree,
# which everything below reads.
- name: Run phase 1, accounts and working tree permissions
  ansible.builtin.command:
    cmd: bash install/10-accounts.sh
    chdir: "{{ faramir_src_dir }}"
  register: faramir_phase_accounts
  become: true
  environment: "{{ faramir_install_env }}"
  # Phase 1 also re-chgrps and re-setgids the working tree every run, which
  # this does not detect. Only account creation is reported.
  changed_when: >-
    faramir_service_accounts | difference(ansible_facts['getent_passwd'] | list) | length > 0
    or faramir_dev_group not in ansible_facts['getent_group']

# The accounts phase 1 created are not in the facts gathered at the top of this
# role, and the checks below read them.
- name: Re-read the passwd and group databases
  ansible.builtin.getent:
    database: "{{ item }}"
  loop:
    - passwd
    - group

# Phase 2 writes .sops.yaml into the tree and phase 3 names it in the config, so
# it has to exist from here on. Phase 3 would otherwise install a broker that
# fails every command with "cwd does not exist".
- name: Check for the shared working tree
  ansible.builtin.stat:
    path: "{{ faramir_worktree }}"
  register: faramir_worktree_dir
  become: true

- name: Require the shared working tree
  ansible.builtin.assert:
    that: faramir_worktree_dir.stat.isdir | default(false)
    fail_msg: >-
      No working tree at {{ faramir_worktree }}. Brokered commands run there and
      the sops files are read from there, so it must exist before the broker is
      installed. It is meant to be your own checkout:
      git clone git@github.com:andornaut/ansible-ctrl.git {{ faramir_worktree }}
      Then re-run: phase 1 applies the group, the setgid bits and, for a tree
      inside your home, the ACL that lets the keeper and the executor reach it.
    quiet: true

- name: Provision the operator's age identity
  when: faramir_manage_operator_age_key | bool
  block:
    # Before phase 2, which is the only thing that writes .sops.yaml, and only
    # writes it once: a recipient added later means editing that file and
    # re-encrypting every managed value.
    - name: Create the operator's sops key directory
      ansible.builtin.file:
        path: "{{ faramir_operator_age_key | dirname }}"
        state: directory
        mode: "0700"

    # faramir keygen writes 0400 and refuses to overwrite, so creates: is belt
    # and braces rather than the only guard. Overwriting an age identity
    # destroys access to every value it was a recipient for.
    - name: Mint the operator's age identity
      ansible.builtin.command:
        cmd: bin/faramir keygen -o {{ faramir_operator_age_key | quote }}
        chdir: "{{ faramir_src_dir }}"
        creates: "{{ faramir_operator_age_key }}"

    # The public half only. The identity file holds both, and nothing here
    # needs the private one: sops finds it at this path on its own.
    - name: Read the operator's age recipient
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: set -o pipefail; grep -o 'age1[0-9a-z]*' {{ faramir_operator_age_key | quote }} | tail -1
      register: faramir_operator_recipient
      changed_when: false

    - name: Require an age recipient
      ansible.builtin.assert:
        that: faramir_operator_recipient.stdout is match("age1")
        fail_msg: >-
          No age recipient in {{ faramir_operator_age_key }}. Remove it and
          re-run, or set faramir_manage_operator_age_key=false to leave the
          keeper as the only one.
        quiet: true

- name: Provision the broker's SSH identity
  when: faramir_manage_broker_ssh_key | bool
  become: true
  block:
    # Before phase 3, which starts the broker: the agent loads its keys once at
    # startup, so a key that appears afterwards is not in it until a restart.
    #
    # A key the broker owns and the executor cannot read. Generating it grants
    # nothing on its own; it opens a host only once its public half is in that
    # host's authorized_keys, which is reported at the end of the run.
    - name: Generate the broker's SSH key
      community.crypto.openssh_keypair:
        path: "{{ faramir_broker_ssh_key }}"
        type: ed25519
        comment: "faramir broker on {{ inventory_hostname }}"
        owner: "{{ faramir_broker_user }}"
        group: "{{ faramir_broker_user }}"
        mode: "0600"
        # An existing key is left alone: regenerating one silently would lock
        # the broker out of every host its public half is already on.
        regenerate: never
      register: faramir_broker_key

- name: Install the rest of faramir
  become: true
  environment: "{{ faramir_install_env }}"
  block:
    # Mints the age key and writes .sops.yaml into the working tree. Runs before
    # phase 3, which refuses to start the services without a key.
    - name: Run phase 2, age key and sops configuration
      ansible.builtin.command:
        cmd: bash install/20-sops-init.sh
        chdir: "{{ faramir_src_dir }}"
      register: faramir_phase_sops
      changed_when: not faramir_age_key.stat.exists

    # Phase 3 keeps an existing config and writes config.toml.dist beside it, so
    # this is the only way the role can reconcile it. Guarded because the
    # installed config is where [ssh] keys and [secrets] files are edited by hand.
    - name: Discard the installed broker config so phase 3 writes it fresh
      ansible.builtin.file:
        path: /etc/faramir/config.toml
        state: absent
      when: faramir_overwrite_config | bool

    # Tracks the binaries. The unit files and worktree drop-ins are rewritten
    # every run, which this does not detect.
    - name: Run phase 3, binaries, config and systemd units
      ansible.builtin.command:
        cmd: bash install/30-install-broker.sh
        chdir: "{{ faramir_src_dir }}"
      register: faramir_phase_broker
      # default('') on both sides: --skip-tags build leaves faramir_built unset,
      # and a first install has nothing under /usr/local/bin yet.
      changed_when: >-
        faramir_installed.stat.checksum | default('') != faramir_built.stat.checksum | default('')
        or faramir_overwrite_config | bool

    # Writes ~agent/.claude/settings.json, the working tree's .mcp.json, and the
    # CLAUDE.md snippet. Keeps whatever it finds, so a second run is a no-op.
    - name: Run phase 4, agent configuration
      ansible.builtin.command:
        cmd: bash install/40-agent-config.sh
        chdir: "{{ faramir_src_dir }}"
      register: faramir_phase_agent
      changed_when: not faramir_agent_settings.stat.exists

    # The phases warn rather than fail on the things most likely to produce a
    # broker that installs cleanly and then does nothing: a worktree that does
    # not exist, an installed config naming a different one, an executor uid in
    # the broker's or keeper's group. Ansible swallows their stdout, so the
    # warnings are pulled back out here.
    - name: Show what the install phases warned about
      ansible.builtin.debug:
        msg: "{{ faramir_phase_warnings }}"
      vars:
        faramir_phase_warnings: >-
          {{ [faramir_phase_accounts, faramir_phase_sops,
              faramir_phase_broker, faramir_phase_agent]
             | map(attribute='stdout_lines', default=[]) | flatten
             | select('search', 'WARNING|SKIP') | list }}
      when: faramir_phase_warnings | length > 0

# No state or enabled key: the module then only reports the unit's status, which
# is what phase 3 has already enabled and started.
- name: Read the state of the faramir sockets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: faramir_socket_state
  loop: "{{ faramir_sockets }}"
  become: true

- name: Require the faramir sockets to be listening
  ansible.builtin.assert:
    that: item.status.ActiveState == "active"
    fail_msg: >-
      {{ item.item }} is {{ item.status.ActiveState }}. Phase 3 leaves the units
      installed but stopped when /etc/faramir/age.key is missing or systemd is
      not running; check journalctl -u {{ item.item }}.
    quiet: true
  loop: "{{ faramir_socket_state.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the installed faramir version
  ansible.builtin.command:
    cmd: /usr/local/bin/faramir --version
  register: faramir_version
  changed_when: false

# --check prints the operator-facing report: the managed files, the ref count
# and any per-file load error. Phase 3 runs it as its own install gate and fails
# there on a ref too short to redact, so reaching this means that list is empty;
# it is repeated here for the numbers, not the exit code.
- name: Report what the broker loaded
  ansible.builtin.command:
    cmd: /usr/local/bin/faramir-broker -c /etc/faramir/config.toml --check
  register: faramir_broker_check
  changed_when: false
  failed_when: false
  become: true

# A set_fact rather than a vars/ entry: this has to survive as a dict, and the
# guard keeps a non-JSON stdout (a config that failed to load, so the report
# went to stderr) from failing from_json instead of reporting the load error.
- name: Parse the broker report
  ansible.builtin.set_fact:
    faramir_secrets: >-
      {{ (faramir_broker_check.stdout | from_json).secrets
         if (faramir_broker_check.stdout | default('') | trim).startswith('{')
         else {} }}

# A list, one single-line template per entry: a folded multi-line message keeps
# the line breaks between its {{ }} blocks and renders with stray newlines.
- name: Show what the broker loaded
  ansible.builtin.debug:
    msg:
      - "version: {{ faramir_version.stdout }}"
      - "refs loaded: {{ faramir_secrets.ref_count | default('unknown') }}"
      - "files: {{ faramir_secrets.files | default([]) | join(', ') or 'none' }}"
      - "load errors: {{ faramir_secrets.errors | default([]) | join('; ') or 'none' }}"

# The keeper decrypts sops and nothing else, so a credential still held in
# ansible-vault is absent from the value set, and a value absent from the set is
# neither injectable nor redacted. Zero refs is therefore a broker that is
# running and protecting nothing, which is indistinguishable from a healthy
# install unless something says so. See the role README.
# Derived rather than configured. --check lists only the managed files it could
# stat, so an empty list means the sops file does not exist yet, which is what
# every install looks like before the vault is migrated. A file that exists and
# yields nothing is the real fault, and that is what this catches.
- name: Require the broker to have loaded at least one secret
  ansible.builtin.assert:
    that: faramir_secrets.ref_count | default(0) | int > 0
    fail_msg: >-
      The broker read {{ faramir_secrets.files | join(', ') }} and loaded no
      refs from it. Nothing is injectable and nothing is redacted: a playbook
      that prints a credential prints it in plaintext.
      {{ 'Load errors: ' ~ (faramir_secrets.errors | join('; '))
         if faramir_secrets.errors | default([]) | length > 0
         else 'The broker reported no load error, so the file parsed and is
               empty rather than unreadable.' }}
    quiet: true
  when: faramir_secrets.files | default([]) | length > 0

# Ansible loads every .yml under group_vars/ and host_vars/ as a vars file, and
# a sops file is valid YAML: it binds each var to its ENC[...] ciphertext, and
# since "vault" sorts after "vars" it also overwrites the lookup('env', ...)
# mapping the broker's injection relies on.  Nothing errors and no task fails.
# Hosts get configured with the ciphertext of a credential in place of the
# credential, which is why this is an assert and not a warning.
- name: Require the encrypted files to be outside the auto-loaded vars directories
  ansible.builtin.assert:
    that: faramir_secrets.files | default([]) | select('search', bad_dirs) | list | length == 0
    fail_msg: >-
      {{ faramir_secrets.files | select('search', bad_dirs) | join(', ') }}
      is under group_vars/ or host_vars/, which Ansible auto-loads. Every
      vault_* var would resolve to its ENC[...] ciphertext instead of the
      injected value, silently. Move it (secrets/ is not auto-loaded) and
      update [secrets] files in /etc/faramir/config.toml.
    quiet: true
  vars:
    bad_dirs: (^|/)(group_vars|host_vars)/

# Phase 4 installs faramir's own snippet, which says how the broker works and
# nothing about this repo. These two flags are what make a brokered run work
# here, and an agent that has to guess them gets a run that reaches the wrong
# hosts or no credentials at all.
- name: Tell the agent how to run a playbook through the broker
  ansible.builtin.blockinfile:
    path: "{{ faramir_worktree }}/CLAUDE.md"
    create: true
    owner: "{{ faramir_user }}"
    group: "{{ faramir_dev_group }}"
    mode: "0664"
    marker: "<!-- {mark} ansible-ctrl: brokered runs -->"
    block: |
      ## Running playbooks

      Credentials come from the broker and are never visible here. Run a
      playbook with both of these:

          faramir run --env-file faramir.env -- \
              ansible-playbook <playbook>.yml --limit '!faramir'

      `--env-file faramir.env` names every credential this repo uses, by
      reference. `--limit '!faramir'` excludes the controller, which a brokered
      run cannot configure: commands run as a uid with no sudo there, so those
      tasks fail after the rest of the run has already applied. The operator
      applies the controller's own playbooks.

      `faramir_list_secrets` shows the available names. Do not use `make`: it is
      the operator's entry point and prompts for a sudo password, which a
      brokered command has no terminal to answer.
  become: true

- name: Check the broker's SSH identity end to end
  when: faramir_manage_broker_ssh_key | bool
  become: true
  block:
    # The other way an install comes up healthy and does nothing. The broker
    # loads its keys at startup and only warns when none of them load, so a
    # missing or unreadable key leaves an agent holding nothing, every socket
    # active, and every playbook unable to reach a single managed host.
    #
    # Asked through the broker rather than read off disk, because what matters
    # is what a brokered command gets: the executor's uid can use the agent but
    # cannot read the key, so this is the only place the answer is visible.
    - name: Ask a brokered command what the agent holds
      ansible.builtin.command:
        cmd: /usr/local/bin/faramir run --quiet -- ssh-add -l
      register: faramir_agent_keys
      changed_when: false
      failed_when: false

    - name: Require the broker's agent to hold a key
      ansible.builtin.assert:
        that: "'SHA256' in faramir_agent_keys.stdout"
        fail_msg: >-
          The broker's ssh-agent holds no usable key
          ({{ faramir_agent_keys.stdout | default('') | trim
              or faramir_agent_keys.stderr | default('') | trim or 'no output' }}).
          Brokered commands can reach no managed host. Check that [ssh] keys in
          /etc/faramir/config.toml names {{ faramir_broker_ssh_key }}, then
          systemctl restart faramir-broker.
        quiet: true

    # Printed every run, not only when the key was just generated: it is what
    # has to be in authorized_keys on every managed host, and an install that
    # never says so is one where the fleet silently rejects the agent.
    - name: Show the public key the fleet has to authorize
      ansible.builtin.debug:
        msg:
          - "broker public key ({{ faramir_broker_ssh_key }}.pub):"
          - "{{ faramir_broker_key.public_key | default('unchanged; read it from the path above') }}"
          - "It must be in ~/.ssh/authorized_keys for the account ansible connects as
             on every managed host, or brokered playbooks authenticate as nobody."
