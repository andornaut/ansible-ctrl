---
# Authorize the broker's key on the hosts brokered playbooks reach.
# Applied over the whole inventory as faramir.yml's second play; each block below
# selects its hosts by comparing against faramir_controller. The linear strategy
# is what orders them: the key is published before any host is asked to authorize
# it, and every host has been asked before the brokered ping runs. See the README.

# The key comes off faramir_controller and the play targets the faramir group, so
# the two must agree. A group holding two hosts would distribute one broker's key
# and silently refuse the other's runs everywhere.
- name: Require the faramir group to hold the controller alone
  ansible.builtin.assert:
    that: groups['faramir'] | default([]) == [faramir_controller]
    fail_msg: >-
      The faramir group holds
      {{ groups['faramir'] | default([]) | join(', ') or 'no hosts' }}, and the
      controller is {{ faramir_controller }}. These tasks distribute one
      broker's key, from the one host make faramir installs a broker on, so that
      group has to hold that host and no other. If the controller was renamed or
      replaced, faramir_controller is where its name is set.
    quiet: true

- name: Read the broker's public key from the controller
  when: inventory_hostname == faramir_controller
  block:
    # 0700 faramir-broker, so become. The private half never leaves this host.
    - name: Read the broker's public key
      ansible.builtin.slurp:
        src: "{{ faramir_broker_ssh_key }}.pub"
      become: true
      register: faramir_broker_pubkey

    - name: Publish it to the other hosts
      ansible.builtin.set_fact:
        faramir_broker_authorized_key: "{{ faramir_broker_pubkey.content | b64decode | trim }}"

    - name: Require a public key
      ansible.builtin.assert:
        that: faramir_broker_authorized_key.startswith("ssh-")
        fail_msg: >-
          {{ faramir_broker_ssh_key }}.pub does not look like a public key. Run
          make faramir first; it generates the pair and prints the public half.
        quiet: true

# Every managed host but the controller, which connects locally and involves no
# key. faramir_fleet_authorize_key is a role default, so host_vars outranks it and
# a host set false runs the teardown below instead.
- name: Authorize the broker's key on the managed hosts
  when: inventory_hostname != faramir_controller
  block:
    # The block above is skipped when the controller is not in the run, and these
    # hosts carry on regardless, so fail here rather than on an unnamed lookup.
    - name: Require the broker's key to have been read
      ansible.builtin.assert:
        that: "'faramir_broker_authorized_key' in hostvars[faramir_controller]"
        fail_msg: >-
          The controller published no public key, so there is nothing to
          authorize here. It is in this run only when the run reaches it, and
          --limit '!faramir', which every brokered run carries, excludes it.
          Apply this playbook as the operator: make faramir
        quiet: true

    - name: Authorize the broker's key for the ansible account
      ansible.posix.authorized_key:
        user: "{{ ansible_user | default(primary_user) }}"
        key: "{{ hostvars[faramir_controller]['faramir_broker_authorized_key'] }}"
        state: "{{ 'present' if faramir_fleet_authorize_key | bool else 'absent' }}"
        # Not exclusive: that would lock out the operator's own keys.
        exclusive: false
        comment: "faramir broker on {{ faramir_controller }}"

    # The broker's key plus this entry means the agent is root here. Leave a host
    # out of this play to keep it agent-free.
    #
    # Passwordless because no become password can live in the store: it is the
    # operator's login password, and on the controller that reaches the age key.
    - name: Grant the ansible account passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/faramir-agent
        content: "{{ ansible_user | default(primary_user) }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s
      become: true
      when: faramir_fleet_authorize_key | bool

    - name: Remove the passwordless sudo grant
      ansible.builtin.file:
        path: /etc/sudoers.d/faramir-agent
        state: absent
      become: true
      when: not faramir_fleet_authorize_key | bool

# main.yml checks the agent holds a key; this checks the fleet accepts it. Asked
# through the broker, which is the path a brokered playbook takes.
- name: Prove a brokered run reaches the fleet
  when: inventory_hostname == faramir_controller
  block:
    - name: Ping every managed host through the broker
      ansible.builtin.command:
        argv:
          - /usr/local/bin/faramir
          - run
          - --quiet
          - --
          - ansible
          - all
          - -m
          - ping
          - --limit
          - "!faramir"
          - -o
      become: true
      register: faramir_fleet_ping
      changed_when: false
      failed_when: false

    - name: Require every host to answer
      ansible.builtin.assert:
        that:
          - "'UNREACHABLE' not in faramir_fleet_ping.stdout"
          - "'SUCCESS' in faramir_fleet_ping.stdout"
        fail_msg: >-
          A brokered ping did not reach every host. The broker holds a key; this
          says whether the fleet accepts it. Likeliest causes: these tasks have
          not authorized the account ansible connects as on every host, or
          ansible.cfg names a path that is ~-relative and so resolves to nothing
          for the executor's uid, which ansible exits 1 over rather than warning.
          Output: {{ faramir_fleet_ping.stdout | default('') | trim }}
          {{ faramir_fleet_ping.stderr | default('') | trim }}
        quiet: true
