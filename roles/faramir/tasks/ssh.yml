---
# The linear strategy is what lets the controller publish a fact the rest of this play reads.

- name: Require the inventory to name one controller, running the broker
  ansible.builtin.assert:
    that:
      - (groups['faramir_controller'] | default([])) | length == 1
      - faramir_controller_host in (groups['faramir'] | default([]))
    fail_msg: >-
      One key is distributed, from the host these playbooks run on, so faramir_controller
      needs exactly one host and that host has to be in faramir. It holds
      {{ groups['faramir_controller'] | default([]) | join(', ') or 'no hosts' }}, against
      faramir's {{ groups['faramir'] | default([]) | join(', ') or 'no hosts' }}.
    quiet: true

- name: Read the broker's public key from the controller
  when: inventory_hostname == faramir_controller_host
  block:
    # 0700 faramir-broker, so become.
    - name: Read the broker's public key
      ansible.builtin.slurp:
        src: "{{ faramir_broker_ssh_key }}.pub"
      become: true
      register: faramir_broker_pubkey

    - name: Publish it to the other hosts
      ansible.builtin.set_fact:
        faramir_broker_authorized_key: "{{ faramir_broker_pubkey.content | b64decode | trim }}"

    - name: Require a public key
      ansible.builtin.assert:
        that: faramir_broker_authorized_key.startswith("ssh-")
        fail_msg: >-
          {{ faramir_broker_ssh_key }}.pub does not look like a public key. Run
          make faramir, which generates the pair.
        quiet: true

- name: Authorize the broker's key on the managed hosts
  when: inventory_hostname != faramir_controller_host
  block:
    # Two asserts rather than one. A controller left out of the play and one that ran and
    # published nothing present identically here, and the advice the first needs sends you
    # away from the second.
    - name: Require the controller to be in this run
      ansible.builtin.assert:
        that: faramir_controller_host in ansible_play_hosts
        fail_msg: >-
          {{ faramir_controller_host }} is not in this play, so nothing published a key
          to authorize. Either a --limit left it out, `--limit '!faramir_controller'`
          being what every brokered run carries, or it failed earlier in this run; the
          output above says which. Apply as the operator: make faramir
        quiet: true

    # Names no path. The message is templated on every managed host whether or not the
    # assertion holds, and this play reaches hosts that never ran broker.yml: anything
    # resolving through faramir_user_home wants the getent that ran there, and raises rather
    # than reporting what it was asked about.
    - name: Require the broker's key to have been read
      ansible.builtin.assert:
        that: "'faramir_broker_authorized_key' in hostvars[faramir_controller_host]"
        fail_msg: >-
          {{ faramir_controller_host }} is in this run and published no key, so this is
          not a --limit: the tasks that read the broker's public key were skipped, which
          is what an inventory_hostname not matching the faramir_controller entry does.
        quiet: true

    - name: Authorize the broker's key for the ansible account
      # The connecting account owns the file it writes, so no escalation is needed. Not
      # become: true: this play reaches the routers, whose pfSense carries no sudo, and
      # ansible connects to them as root already.
      become: false
      ansible.posix.authorized_key:
        user: "{{ faramir_fleet_account }}"
        key: "{{ hostvars[faramir_controller_host]['faramir_broker_authorized_key'] }}"
        state: "{{ 'present' if faramir_fleet_authorize_key | bool else 'absent' }}"
        # Not exclusive: that would lock out the operator's own keys.
        exclusive: false
        comment: "faramir broker on {{ faramir_controller_host }}"
        # Default everywhere but the routers, which name authorized_keys2: pfSense rewrites
        # authorized_keys from config.xml on boot and on every user save. sshd reads both.
        path: "{{ faramir_fleet_authorized_keys_path | default(omit) }}"
        # The module creates ~/.ssh when it owns the path; a named path is the host's own.
        manage_dir: "{{ faramir_fleet_authorized_keys_path is not defined }}"

    # The broker's key plus this entry makes the agent root here; leave a host out of the
    # play to keep it agent-free. Passwordless because the store cannot hold a become
    # password: it is the operator's login password, which reaches the age key. Skipped for
    # root, which is every pfSense host: no sudo, no visudo, no /etc/sudoers.d.
    - name: Grant the ansible account passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/faramir-agent
        content: "{{ faramir_fleet_account }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s
      become: true
      when:
        - faramir_fleet_authorize_key | bool
        - faramir_fleet_account != "root"

    - name: Remove the passwordless sudo grant
      ansible.builtin.file:
        path: /etc/sudoers.d/faramir-agent
        state: absent
      become: true
      when:
        - not faramir_fleet_authorize_key | bool
        - faramir_fleet_account != "root"

# ssh verifies a host before it authenticates to it and the executor has no known_hosts, so
# without this a brokered run fails before the key above is ever offered. Read over this
# run's own connection, so what gets pinned is authenticated rather than trusted on sight.
- name: Collect the fleet's SSH host keys
  when: inventory_hostname != faramir_controller_host
  block:
    # Whichever types the host offers: the algorithm is negotiated per connection, so an
    # entry for a type ssh does not pick verifies nothing.
    # Unprivileged, the keys being public and this play reaching the routers, whose
    # pfSense has no sudo to escalate through.
    - name: Find the host's public SSH host keys
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: ssh_host_*_key.pub
      register: faramir_fleet_host_key_files
      become: false

    - name: Read them
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      become: false
      loop: "{{ faramir_fleet_host_key_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: faramir_fleet_host_key_contents

    # An entry is name, type and key; the .pub's trailing comment is not part of it.
    - name: Publish them as known_hosts entries
      ansible.builtin.set_fact:
        faramir_fleet_known_hosts_entries: >-
          {{ faramir_fleet_host_key_contents.results
             | map(attribute='content') | map('b64decode') | map('trim')
             | map('regex_replace', '^(\S+)\s+(\S+).*$',
                   faramir_fleet_known_hosts_name ~ ' \1 \2')
             | list }}

- name: Pin the fleet's host keys on the controller
  when: inventory_hostname == faramir_controller_host
  become: true
  block:
    - name: Check for a known_hosts file
      ansible.builtin.stat:
        path: "{{ faramir_fleet_known_hosts_path }}"
      register: faramir_fleet_known_hosts_stat

    - name: Read the entries already pinned
      ansible.builtin.slurp:
        src: "{{ faramir_fleet_known_hosts_path }}"
      register: faramir_fleet_known_hosts_slurped
      when: faramir_fleet_known_hosts_stat.stat.exists

    - name: Assemble what this run collected against what is already pinned
      ansible.builtin.set_fact:
        faramir_fleet_known_hosts_collected: >-
          {{ groups['all'] | difference([faramir_controller_host])
             | map('extract', hostvars, 'faramir_fleet_known_hosts_entries')
             | select('defined') | flatten }}
        faramir_fleet_known_hosts_pinned: >-
          {{ (faramir_fleet_known_hosts_slurped.content | default('') | b64decode).splitlines()
             | map('trim') | reject('match', '^(#|$)') | list }}

    - name: Require no pinned host key to have changed
      ansible.builtin.assert:
        that: faramir_fleet_known_hosts_changed | length == 0
        fail_msg: >-
          {{ faramir_fleet_known_hosts_changed | join(', ') }}
          is pinned in {{ faramir_fleet_known_hosts_path }} under a different key than the
          host presented. A reinstall rekeys a host and nothing else does: confirm that is
          what happened, drop those lines, and re-run.
        quiet: true
      vars:
        # The first two fields are what ssh looks an entry up under, so a line unpinned as
        # a whole whose first two fields are pinned is that name and type under a new key.
        faramir_fleet_known_hosts_prefix_pattern: '^(\S+\s+\S+).*$'
        faramir_fleet_known_hosts_pinned_prefixes: >-
          {{ faramir_fleet_known_hosts_pinned
             | map('regex_replace', faramir_fleet_known_hosts_prefix_pattern, '\1') | list }}
        faramir_fleet_known_hosts_changed: >-
          {{ faramir_fleet_known_hosts_collected
             | reject('in', faramir_fleet_known_hosts_pinned)
             | map('regex_replace', faramir_fleet_known_hosts_prefix_pattern, '\1')
             | select('in', faramir_fleet_known_hosts_pinned_prefixes) | list }}

    # Kept rather than rewritten from this run alone: a host that was down or left out by a
    # --limit contributes nothing, and dropping its entry would let the next run take a
    # fresh key for it as though never seen.
    - name: Pin them
      ansible.builtin.copy:
        dest: "{{ faramir_fleet_known_hosts_path }}"
        content: "{{ faramir_fleet_known_hosts_final | join('\n') }}\n"
        owner: root
        group: root
        mode: "0644"
      vars:
        faramir_fleet_known_hosts_final: >-
          {{ (faramir_fleet_known_hosts_pinned + faramir_fleet_known_hosts_collected)
             | unique | sort }}

# The hosts this play still holds, not the whole inventory: the rest were never targeted or
# were lost earlier, so neither got a key. What is left was reached as the operator moments
# ago, so a silent answer is a failure.
#
# Read off ansible's play list rather than probed through the broker, where a host that
# refuses its key looks exactly like one that is off.
- name: Prove a brokered run reaches the fleet
  when:
    - inventory_hostname == faramir_controller_host
    - faramir_fleet_ping_hosts | length > 0
  vars:
    faramir_fleet_ping_hosts: "{{ ansible_play_hosts | difference([faramir_controller_host]) }}"
  block:
    - name: Ping the hosts this run authorized, through the broker
      ansible.builtin.command:
        argv: >-
          {{ [faramir_binary, 'run', '--quiet', '--',
              'ansible', faramir_fleet_ping_hosts | join(','), '-m', 'ping'] }}
      become: true
      register: faramir_fleet_ping
      changed_when: false
      failed_when: false

    # Only the answers. Everything else is a failure whatever it says.
    - name: Collect the hosts that answered
      ansible.builtin.set_fact:
        faramir_fleet_ping_answered: >-
          {{ faramir_fleet_ping_lines | select('search', '\|\s*SUCCESS')
             | map('regex_replace', faramir_fleet_ping_host, '\1') | list }}
      vars:
        # One line per host, its result folded onto it: the callback renders a result as a
        # block, the host on the first line and the rest indented under it. What stays at
        # column 0 and names no host is a warning addressed to nobody.
        #
        # No -o: it selects the oneline callback, and flag and callback alike are removed in
        # ansible-core 2.23. The same fold is pick_unreachable in the Makefile.
        faramir_fleet_ping_lines: >-
          {{ faramir_fleet_ping.stdout | default('') | regex_replace('\n[ \t]+', ' ')
             | regex_findall('^\S+\s*\|.*$', multiline=True) }}
        faramir_fleet_ping_host: '^(\S+)\s*\|.*$'

    # Named even when the run passes: silence would read as having covered them.
    - name: Report the hosts this run never reached
      ansible.builtin.debug:
        msg: >-
          Lost earlier in this run, so neither authorized nor pinged:
          {{ faramir_fleet_ping_dropped | join(', ') }}. Fix what dropped them, above,
          and re-run.
      when: faramir_fleet_ping_dropped | length > 0
      vars:
        faramir_fleet_ping_dropped: >-
          {{ ansible_play_hosts_all | difference(ansible_play_hosts)
             | difference([faramir_controller_host]) }}

    - name: Require every host this run reached to answer through the broker
      ansible.builtin.assert:
        that:
          - faramir_fleet_ping_silent | length == 0
        fail_msg: >-
          A brokered ping did not clear the fleet, though this run reached each host
          as the operator and wrote the key.
          Did not answer: {{ faramir_fleet_ping_silent | join(', ') }}.
          Answered: {{ faramir_fleet_ping_answered | join(', ') or 'none' }}.
          So either the key is not authorized for the account ansible connects as, or
          the host is not pinned in {{ faramir_fleet_known_hosts_path }} under the
          address and port the inventory dials, or the executor cannot resolve the
          name, carrying no ssh config.
          Output: {{ faramir_fleet_ping.stdout | default('') | trim }}
          {{ faramir_fleet_ping.stderr | default('') | trim }}
        quiet: true
      vars:
        # Everything that is not an answer, so a host absent from the output entirely
        # counts alongside one the ping reached and could not.
        faramir_fleet_ping_silent: >-
          {{ faramir_fleet_ping_hosts | difference(faramir_fleet_ping_answered) }}
