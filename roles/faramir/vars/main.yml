---
# Derived from defaults/main.yml, not operator knobs. Role vars outrank host_vars, so
# a host cannot desync one from its source.

# From the getent in tasks/broker.yml.
faramir_user_home: "{{ ansible_facts['getent_passwd'][faramir_user][4] }}"

# `dev` is rolling, re-cut by CI on every push to faramir's main; faramir has no v
# tag yet. Its assets match a tagged release's, so moving to one is this URL alone.
faramir_release_url: https://github.com/andornaut/faramir/releases/download/dev

# goreleaser's names rather than Debian's: x86_64 kept, aarch64 to arm64. Same
# mapping as base_arch, which reads assets from the same CI.
faramir_arch: >-
  {{ {'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# One archive per platform, holding one binary. The kernel is unmapped: faramir
# builds for no other.
faramir_release_archive: "faramir_linux_{{ faramir_arch }}.tar.gz"

# Where init puts the binary, and so what every later invocation runs.
faramir_binary: /usr/local/bin/faramir

# The identity the broker lends to brokered commands. Mirrors faramir's default rather
# than being passed as --ssh-key: init mints one every run whether or not a host needs it,
# so the flag relocates rather than enables, and this role has no reason to relocate. Not
# a knob for the same reason, an override here naming a path init would not write to;
# tasks/ssh.yml reads the public half from it, and a stale value fails there on a missing
# file. Opens nothing until that has run.
faramir_broker_ssh_key: "{{ faramir_config_dir }}/id_ed25519"

# The whole invocation in one place. argv rather than a command string: the paths come from
# the inventory, and quoting an unusual one is not this role's problem.
#
# Only what this role decides: the service accounts and the SSH key path are faramir's
# defaults, and restating one here would be a second place for it to drift from.
#
# No tree is named: init provisions the host, and init-project below enrols the tree,
# reading the client group out of the config init installed.
#
# The staged binary, init installing the one it was run from, so this resolves only inside
# the install block that registers faramir_release_tmp.
faramir_init_argv: >-
  {{
    [faramir_release_tmp.path ~ '/faramir', 'init', '--json',
     '--operator-user', faramir_user,
     '--client-group', faramir_client_group,
     '--config-dir', faramir_config_dir]
    + (['--agent'] | product(faramir_agents) | flatten)
    + (['--dry-run'] if ansible_check_mode else [])
  }}

# The same, for the one tree this repo enrols. The directory is an argument rather
# than a flag, and naming it pins the enrolment to playbook_dir. The redaction hook is
# left to faramir's default, on being the only setting worth enrolling a tree for.
faramir_init_project_argv: >-
  {{
    [faramir_binary, 'init-project', '--json',
     '--operator-user', faramir_user,
     '--config-dir', faramir_config_dir]
    + (['--agent'] | product(faramir_agents) | flatten)
    + (['--dry-run'] if ansible_check_mode else [])
    + [playbook_dir]
  }}

# Only the two doctor cannot work out for itself. It reads the client group from [server]
# allowed_group and each service account from its unit, so every other name is an override
# for examining a host whose install is not this one, and passing faramir_client_group here
# would answer about the group this role wants rather than the one the sockets admit.
# --operator-user has no such source: doctor fails rather than guess who the agent runs as.
faramir_doctor_argv: >-
  {{
    [faramir_binary, 'doctor', '--json',
     '--operator-user', faramir_user,
     '--config-dir', faramir_config_dir]
  }}
