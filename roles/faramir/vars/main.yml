---
# Derived values, not operator knobs. In vars/ (not defaults/) so role vars outrank
# host_vars and a host cannot desync a derived value from its source.

# faramir_user home from passwd (getent runs in tasks/main.yml).
faramir_user_home: "{{ ansible_facts['getent_passwd'][faramir_user][4] }}"

# Where the binaries are downloaded from. `dev` is a rolling release, deleted and
# re-cut by CI on every push to faramir's main. Its assets are named and laid out
# exactly as a tagged release's, so moving to a tag means changing this URL and
# nothing else. faramir has no v tag yet.
faramir_release_url: https://github.com/andornaut/faramir/releases/download/dev

# Architecture name in the release asset, which is goreleaser's rather than
# Debian's: x86_64 is kept and aarch64 maps to arm64. Same mapping as base_arch,
# which reads the gog and mrs assets from the same CI.
faramir_arch: >-
  {{ {'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# One archive per platform, holding one binary. Linux only, and unmapped for that
# reason: faramir builds for no other kernel, so there is nothing for a system
# fact to select.
faramir_release_archive: "faramir_linux_{{ faramir_arch }}.tar.gz"

# Where init puts the binary, and so what every later invocation runs.
faramir_binary: /usr/local/bin/faramir

# Warnings from enrolling the checkout, which is skipped on a --check run
# against a host that has no binary yet: the register then holds no stdout.
faramir_project_warnings: >-
  {{ (faramir_project.stdout | from_json).warnings | default([])
     if faramir_project.stdout | default('') | length > 0 else [] }}

# The whole invocation, assembled once, so there is no second place a value can
# be set differently. An argv list rather than a command string: paths here come
# from the inventory and a shell-quoted string would make an unusual one this
# role's problem.
#
# No tree is named. init provisions the host; enrolling a tree is init-project
# below, which reads the client group out of the config init installed rather
# than being told it a second time.
#
# The binary is the staged one, init installing the binary it was itself run
# from. faramir_staging.path is the temp directory the install block registers,
# so this resolves only inside that block.
faramir_init_argv: >-
  {{
    [faramir_staging.path ~ '/faramir', 'init', '--json',
     '--operator', faramir_user,
     '--client-group', faramir_dev_group,
     '--broker-user', faramir_broker_user,
     '--keeper-user', faramir_keeper_user,
     '--exec-user', faramir_exec_user,
     '--config-dir', faramir_config_dir]
    + (['--ssh-key', faramir_broker_ssh_key]
       if faramir_broker_ssh_key | length > 0 else [])
    + (['--agent'] | product(faramir_account_agents) | flatten)
    + (['--dry-run'] if ansible_check_mode else [])
  }}

# The same, for the one tree this repo enrols. The directory is last because
# init-project takes it as an argument rather than a flag, and naming it keeps
# the enrolment on playbook_dir rather than on wherever ansible-playbook ran.
faramir_init_project_argv: >-
  {{
    [faramir_binary, 'init-project', '--json',
     '--operator', faramir_user,
     '--config-dir', faramir_config_dir,
     '--hook=' ~ (faramir_project_hook | bool | lower)]
    + (['--agent'] | product(faramir_project_agents) | flatten)
    + (['--dry-run'] if ansible_check_mode else [])
    + [playbook_dir]
  }}

# The same accounts and paths again: doctor checks the install against the names
# it is given rather than against the config it finds, so passing them is what
# makes an install that drifted from these variables a finding.
faramir_doctor_argv: >-
  {{
    [faramir_binary, 'doctor', '--json',
     '--operator', faramir_user,
     '--client-group', faramir_dev_group,
     '--broker-user', faramir_broker_user,
     '--keeper-user', faramir_keeper_user,
     '--exec-user', faramir_exec_user,
     '--config-dir', faramir_config_dir]
  }}
