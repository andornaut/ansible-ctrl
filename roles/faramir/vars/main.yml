---
# Derived from defaults/main.yml, not operator knobs. Role vars outrank host_vars, so
# a host cannot desync one from its source.

# From the getent in tasks/broker.yml.
faramir_user_home: "{{ ansible_facts['getent_passwd'][faramir_user][4] }}"

# Whether this host is the one the playbooks are run from, which decides the parts of the
# install that exist for that: the enrolled checkout, the fleet key and the agent's block on
# running them. False where faramir_controller_host is empty, no host being named '' .
faramir_is_controller: "{{ inventory_hostname == faramir_controller_host }}"

# Debian arch for the sops package, mapped from the kernel name Ansible reports. Apart from
# faramir_arch, which is goreleaser's naming and leaves x86_64 alone: a .deb is amd64.
faramir_deb_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# The account ansible connects to a managed host as, set per host by the inventory.
faramir_fleet_account: "{{ ansible_user | default(primary_user) }}"

faramir_release_repo: andornaut/faramir

# Assets hang off the tag itself, so faramir_release_tag is enough and nothing has to be
# resolved through the API first. The archive and the checksums.txt it is verified against
# both come from here, so both are read from the one release.
faramir_release_url: >-
  https://github.com/{{ faramir_release_repo }}/releases/download/{{ faramir_release_tag }}

# goreleaser's names rather than Debian's: x86_64 kept, aarch64 to arm64. Same
# mapping as base_arch, which reads assets from the same CI.
faramir_arch: >-
  {{ {'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# The kernel is unmapped: faramir builds for no other.
faramir_release_archive: "faramir_linux_{{ faramir_arch }}.tar.gz"

# Where init puts the binary, and so what every later invocation runs.
faramir_binary: /usr/local/bin/faramir

# The identity the broker lends to brokered commands. Mirrors faramir's default instead of
# passing --ssh-key, which relocates a key init mints either way: an override here would
# name a path init never writes, and tasks/ssh.yml reads the public half from it.
faramir_broker_ssh_key: "{{ faramir_config_dir }}/id_ed25519"

# argv rather than a command string: the paths come from the inventory and may need
# quoting. Resolves only inside the install block, which registers faramir_release_tmp.
faramir_init_argv: >-
  {{
    [faramir_release_tmp.path ~ '/faramir', 'init', '--json',
     '--agent-user', faramir_user,
     '--client-group', faramir_client_group,
     '--config-dir', faramir_config_dir]
    + (['--agent'] | product(faramir_agents) | flatten)
    + (['--allow-sudo'] if faramir_allow_sudo | bool else [])
    + ((['--notify-command'] | product(faramir_notify_command) | flatten)
       if (faramir_allow_sudo | bool and faramir_notify_command | length > 0)
       else [])
    + (['--escalation-timeout-sec', faramir_escalation_timeout_sec | string]
       if faramir_allow_sudo | bool else [])
    + (['--dry-run'] if ansible_check_mode else [])
  }}

# The same, for the one tree this repo enrols. The directory is an argument rather than a
# flag, and naming it pins the enrolment to playbook_dir.
faramir_init_project_argv: >-
  {{
    [faramir_binary, 'init-project', '--json',
     '--agent-user', faramir_user,
     '--config-dir', faramir_config_dir]
    + (['--agent'] | product(faramir_agents) | flatten)
    + (['--dry-run'] if ansible_check_mode else [])
    + [playbook_dir]
  }}

# The two entry commands, each taking its subject after these. Both are idempotent -- an
# entry the install already carries is re-applied rather than refused -- so the role names
# every entry on every run instead of diffing the host first, and reads `changed` off the
# report. The re-application is what puts back a grant a tool took away by renaming its own
# file, and a rule an agent's settings dropped.
#
# --agent-user for the reason faramir_doctor_argv carries it: nothing on the host says which
# account the agent runs as, and these render that account's rule files.
faramir_block_argv: >-
  {{ [faramir_binary, 'block', 'add', '--json',
      '--agent-user', faramir_user,
      '--config-dir', faramir_config_dir] }}

faramir_link_argv: >-
  {{ [faramir_binary, 'link', 'add', '--json',
      '--agent-user', faramir_user,
      '--config-dir', faramir_config_dir] }}

# Only the two doctor cannot read off the host: it takes the client group and the service
# accounts from the config and the units, but --agent-user has no such source and doctor
# fails rather than guess it.
faramir_doctor_argv: >-
  {{
    [faramir_binary, 'doctor', '--json',
     '--agent-user', faramir_user,
     '--config-dir', faramir_config_dir]
  }}
