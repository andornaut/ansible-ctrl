---
# Derived values, not operator knobs. In vars/ (not defaults/) so role vars outrank
# host_vars and a host cannot desync a derived value from its source.

# faramir_user home from passwd (getent runs in tasks/main.yml).
faramir_user_home: "{{ ansible_facts['getent_passwd'][faramir_user][4] }}"

# The uids phase 1 creates. All three are service accounts: the coding agent
# runs as you, so there is no fourth.
faramir_service_accounts:
  - "{{ faramir_broker_user }}"
  - "{{ faramir_keeper_user }}"
  - "{{ faramir_exec_user }}"

# Phase 3 enables these. Sockets, not services: all three are socket-activated.
faramir_sockets:
  - faramir-keeper.socket
  - faramir-exec.socket
  - faramir-broker.socket

# The phase scripts read their inputs from the environment. Assembled once here
# because all four share most of it, and a phase given a different worktree than
# its neighbours produces a broker whose units bind a tree its config never names.
faramir_install_env:
  OPERATOR: "{{ faramir_user }}"
  BROKER_USER: "{{ faramir_broker_user }}"
  KEEPER_USER: "{{ faramir_keeper_user }}"
  EXEC_USER: "{{ faramir_exec_user }}"
  DEV_GROUP: "{{ faramir_dev_group }}"
  CONFIG: "{{ faramir_config_src }}"
  # Where it is installed to, as against CONFIG, which is what is installed.
  CONFIG_DIR: "{{ faramir_config_dir }}"
  # Phase 2 writes .sops.yaml beside the store, so it has to agree with
  # faramir_secrets_files or sops edits the wrong directory's recipients.
  SECRETS_DIR: "{{ faramir_secrets_dir }}"
  FARAMIR_BIN: "{{ faramir_src_dir }}/bin"
  # Listed in .sops.yaml alongside the keeper's, so the operator can still read
  # the files they are responsible for. Empty until the identity below has been
  # minted, which is fine: phase 1 ignores it, and phase 2 is the only reader.
  EXTRA_AGE_RECIPIENTS: "{{ faramir_operator_recipient.stdout | default('') }}"
