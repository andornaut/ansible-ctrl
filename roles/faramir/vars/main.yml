---
# Derived values, not operator knobs. In vars/ (not defaults/) so role vars outrank
# host_vars and a host cannot desync a derived value from its source.

# faramir_user home from passwd (getent runs in tasks/main.yml).
faramir_user_home: "{{ ansible_facts['getent_passwd'][faramir_user][4] }}"

# Where the binaries are downloaded from. `dev` is a rolling release, deleted and
# re-cut by CI on every push to faramir's main. Its assets are named and laid out
# exactly as goreleaser names the ones a tagged release publishes, so moving to a
# tag means changing this URL and nothing else. faramir has no v tag yet.
faramir_release_url: https://github.com/andornaut/faramir/releases/download/dev

# Architecture name in the release asset, which is goreleaser's rather than
# Debian's: x86_64 is kept and aarch64 maps to arm64. Same mapping as base_arch,
# which reads the gog and mrs assets from the same CI.
faramir_arch: >-
  {{ {'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# One archive per platform, holding one binary. The three daemons, the MCP
# server and the PreToolUse hook are subcommands of it: what separates them is
# the uid each systemd unit runs its subcommand as. init installs it into
# /usr/local/bin, and libexec holds the hook's deny list and wrap script but no
# binary.
#
# Linux only, and unmapped for that reason: the broker reads peer credentials
# with SO_PEERCRED and the executor allocates PTYs with TIOCGPTN, so faramir
# builds for no other kernel and there is nothing for a system fact to select.
faramir_release_archive: "faramir_linux_{{ faramir_arch }}.tar.gz"

# Where the archive is unpacked, and what init is handed as --binaries: a
# directory holding what came out of it and nothing else. Still a directory
# rather than the file, because that is what init takes and what it defaults to
# from its own path. faramir_staging.path is the temp directory the install block
# registers, so this resolves only in there.
faramir_binaries_dir: "{{ faramir_staging.path }}/binaries"

# The whole invocation, assembled once. An argv list rather than a command
# string: paths here come from the inventory and a shell-quoted string would
# make an unusual one this role's problem.
#
# Everything init needs is on this line, so there is no second place a value can
# be set differently. The role's own share of the work afterwards is the two
# things that belong to this project rather than to faramir: which sops files
# the broker manages, and how a brokered playbook is run.
#
# No tree is named here. init provisions the host; enrolling a tree is
# `faramir init-project`, which is per project and reads the shared group out of
# the config init installed rather than being told it a second time.
#
# faramir_binaries_dir hangs off the temp directory the install block registers.
# Resolved where this is used rather than here, so it is only ever read inside
# the block that created it.
faramir_init_argv: >-
  {{
    [faramir_binaries_dir ~ '/faramir', 'init', '--json',
     '--operator', faramir_user,
     '--group', faramir_dev_group,
     '--broker-user', faramir_broker_user,
     '--keeper-user', faramir_keeper_user,
     '--exec-user', faramir_exec_user,
     '--config-dir', faramir_config_dir,
     '--secrets-dir', faramir_secrets_dir,
     '--binaries', faramir_binaries_dir]
    + (['--operator-age-key', faramir_operator_age_key]
       if faramir_operator_age_key | length > 0 else [])
    + (['--ssh-key', faramir_broker_ssh_key]
       if faramir_broker_ssh_key | length > 0 else [])
    + (['--agent-config'] if faramir_install_agent_config | bool else [])
    + (['--overwrite-config'] if faramir_overwrite_config | bool else [])
    + (['--dry-run'] if ansible_check_mode else [])
  }}
