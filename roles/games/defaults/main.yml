---
# The account the user-scoped tasks act on. Flatpak installs are method: user.
games_user: "{{ primary_user }}"

# GameMode holds an org.freedesktop.ScreenSaver inhibitor for as long as a game runs.
# GNOME provides that service and honours the inhibitor for blanking and idle suspend
# alike, with no cap on how long one may be held, so leaving this on keeps a static image
# lit for the length of a play session. True restores upstream's default.
games_gamemode_inhibit_screensaver: false

# Run games inside gamescope. A game that sizes its window to the display without setting
# the fullscreen state leaves GNOME's top bar and dock drawn above it; gamescope takes the
# fullscreen state itself and the game renders inside it. It also keeps a game's own
# display-mode changes off the desktop compositor, which can composite a recreated window
# as a blank surface.
#
# Reaches Lutris games, through system.yml, and Minecraft (Bedrock), through BedrockOnLinux's
# flatpak override, both running a gamescope wrapper on their sandbox PATH that README.md
# describes. Steam and Heroic games are not covered.
#
# The cost is a nested compositing step, so roughly a frame of latency, and an overlay or a
# screen recorder outside gamescope sees its window rather than the game.
#
# Off by default: it needs games_gamescope_resolution, which is site data with no default.
games_gamescope_enabled: false

# XKB options for the keyboard map gamescope gives the game. gamescope builds its nested
# server's map from the XKB_DEFAULT_* variables alone and ignores the host's, so a remap the
# session applies stops at its window. Duplicates the base role's Caps Lock remap, this role
# depending on no other. Empty for the plain layout.
games_gamescope_xkb_options: "caps:escape"

# The panel's mode as WIDTHxHEIGHT, which gamescope is told to output at. No default, and
# asserted when the flag is on: README.md's Gamescope section says why a guess fails
# silently. `xrandr --current` names it.
games_gamescope_resolution: ""

# Optional flatpak applications, each installed for games_user where its flag is on, and
# uninstalled where it is off. vars/main.yml holds the application ID each flag stands for.
#
# Off by default because neither is wanted on every gaming host, for different reasons:
#   Dolphin is installed for dolphin-tool, which converts GameCube disc images between .iso
#   and .rvz (noble packages no dolphin-emu), so it belongs where the library is converted:
#     flatpak run --command=dolphin-tool org.DolphinEmu.dolphin-emu convert ...
#   ProtonUp-Qt installs the Proton and Wine builds a title needs under Steam or Heroic. It is
#   a real need on a host that plays, but it installs arbitrary third-party builds, so it is
#   named rather than assumed. Without it a build is extracted by hand into
#   ~/.var/app/com.valvesoftware.Steam/data/Steam/compatibilitytools.d/.
games_install_dolphin: false
games_install_protonup_qt: false

# Flatpak applications every gaming host installs and configures for games_user.
games_flatpak_common:
  # Voice chat while playing. Not in the Ubuntu archive, and the .deb Discord publishes has
  # no repository behind it, so the flatpak is the only route that keeps itself current
  # against a client that refuses to start once it is a version behind.
  - com.discordapp.Discord
  - com.heroicgameslauncher.hgl
  - com.mojang.Minecraft
  - com.valvesoftware.Steam
  - net.lutris.Lutris
  - org.libretro.RetroArch
  - org.openjkdf2.OpenJKDF2

# Heroic's installs and wine prefixes, in its own ~/.local/games subdir. Granted in
# games_flatpak_overrides and written into config.json by tasks/heroic.yml: the sandbox can
# only stat granted paths and shows anything else as "not available".
games_heroic_dir: "{{ games_user_home }}/.local/games/Heroic"

# Lutris's installs, in its own ~/.local/games subdir. Written into system.yml by
# tasks/lutris.yml. No override needed: the flatpak already has `home` access.
games_lutris_dir: "{{ games_user_home }}/.local/games/Lutris"

# How often tasks/heroic.yml's timer exercises the Epic and GOG refresh tokens, as an
# OnUnitActiveSec value. Under the hosts' 4h idle-suspend threshold, so a refresh lands
# before the machine suspends.
games_heroic_token_refresh_interval: "3h"

# The sandboxes cannot see the host's and draw the pointer at the wrong size.
# Duplicates desktop_cursor_theme, this role depending on no other.
games_cursor_theme: Adwaita

# A key of games_retroarch_controllers. No default, and asserted: hotkey bindings are
# physical device indices, so a guess binds real but wrong buttons. README.md gives the
# grep that reads them out of the pad's autoconfig profile.
games_retroarch_controller: ""

# The panel's actual mode, as RetroArch's "Estimate Screen Refresh Rate" reports it. No
# default, and asserted: RetroArch derives the audio resampling ratio from it, so its 60.0
# default mistimes every core, heard as drift rather than seen as tearing.
games_retroarch_video_refresh_rate: ""

# Combined over games_retroarch_required_settings, so one key can be set alone.
games_retroarch_extra_settings: {}

# Install /usr/local/bin/syncretroid, which mirrors this role's RetroArch config onto a
# Retroid Pocket Flip 2 over adb. The handheld is a USB peripheral rather than an inventory
# host, so the command lands on the controller and no playbook runs it. Set it in the
# controller's host_vars. See files/retroid/README.md.
games_install_retroid_sync: false

# The controller's ROM library mount and the handheld's adb serial (`adb devices`), baked
# into the wrapper so the command takes no arguments. Site data, so no defaults;
# tasks/retroid.yml asserts both when the flag is on.
games_retroid_library_dir: ""
games_retroid_serial: ""
