# Retroid Pocket Flip 2 (Snapdragon 865, stock Android + ES-DE) profile for syncretroid.
#
# syncretroid takes the games role's vars/main.yml as its source of truth and applies the
# transforms below, so only the divergences live here.
#
# Per-divergence reasoning: ../../../../til/docs/retro-games.md. Run procedure and the two
# device-verified values (core library_names, pad indices): README.md.

package: com.retroarch.aarch64

# Removable sdcard mount; the uuid is discovered at run time unless pinned here.
# syncretroid discovers the real retroarch.cfg path rather than trusting app_files: a
# RetroArch with all-files-access may keep it under /storage/emulated/0/RetroArch/.
sdcard_uuid: ""
sdcard_root: "/storage/{uuid}"
app_files: "/storage/emulated/0/Android/data/{package}/files"

# Where each adb-pushed tree lands. Not cores or their .info, which need an exec-capable
# location (see cores_ref) and come from the in-app Core Updater.
device_dirs:
  system: "{sdcard_root}/BIOS"
  playlists: "{sdcard_root}/RETROARCH/playlists"
  thumbnails: "{sdcard_root}/RETROARCH/thumbnails"
  saves: "{sdcard_root}/RETROARCH/saves"
  states: "{sdcard_root}/RETROARCH/states"
  cache: "{sdcard_root}/RETROARCH/cache"
  # RetroArch's own shader dir is app-private, which adb cannot write. Shaders are text
  # and PNGs, so noexec does not bite as it does for cores.
  shaders: "{sdcard_root}/RETROARCH/shaders"
  roms: "{sdcard_root}/ROMS"

# The one exec-capable location RetroArch can dlopen from. Not pushed, adb being unable
# to write app-private storage; only used to build each playlist's core_path.
cores_ref: "/data/user/0/{package}/cores"

# The Android buildbot, keyed by ABI rather than the kernel arch the desktop uses. Files
# land as <core>_libretro_android.so, which is what each playlist's core_path must name.
buildbot_url: "https://buildbot.libretro.com/nightly/android/latest/{abi}"
core_abi: arm64-v8a
core_suffix: _libretro_android.so
info_zip_url: "https://buildbot.libretro.com/assets/frontend/info.zip"

# --- Systems table transforms (over games_retroarch_systems) ---

# GameCube (libretro Dolphin crashes on load here) and PS2 (LRPS2 is x86-only) run in the
# standalone apps via ES-DE instead. Pico-8 has no Flip 2 cores-table entry.
systems_remove:
  - Nintendo - GameCube
  - Sony - PlayStation 2
  - Pico-8

# Beetle Saturn has no dynarec and interprets both SH-2s, too slow on an 865.
systems_set:
  Sega - Saturn:
    core: yabasanshiro
    extensions: [chd, m3u]

# The four SNK/arcade systems carry over unchanged. Each needs a core_probe entry and
# rom_dir_names / esde_cores mappings below, or the sync aborts. Both cores must be
# installed on the device through the Core Updater.

# --- retroarch.cfg transforms (over games_retroarch_required_settings) ---

# Android drivers replace the desktop-Linux ones; menu ozone is kept from the base.
#
# vulkan rather than glcore, absent from the Android build: slang shaders load under
# neither gl nor GLES, so vulkan is the only driver that can run the CRT preset below.
# The two cores whose renderer cannot follow are pinned back to gl in core_overrides_set.
#
# rewind_buffer_size drops to 64MB from the desktop's 256MB. video_refresh_rate is the
# panel's actual mode, per RetroArch's "Estimate Screen Refresh Rate". audio_latency is
# RetroArch's default, the device having shipped an audibly laggy 128ms; raise it to 96
# if a core crackles. fastforward_ratio caps fast-forward, shipped uncapped.
settings_override:
  video_driver: vulkan
  audio_driver: audiotrack
  audio_latency: "64"
  input_driver: android
  input_joypad_driver: android
  rewind_buffer_size: "67108864"
  fastforward_ratio: "5.000000"
  video_refresh_rate: "60.000000"
  # syncretroid mirrors the thumbnail cache and prunes what is not in it, so an
  # on-demand download would be deleted on the next sync.
  network_on_demand_thumbnails: "false"
  # Nintendo-layout pad: physical A is the east button, so east confirms, matching
  # ES-DE's A=OK/B=Back. The device ships the Western south-confirms orientation.
  menu_swap_ok_cancel_buttons: "false"
  # The 865 has headroom, so RetroArch delays the core to present closer to vsync,
  # backing off before it would drop a frame. Needs video_threaded off, pinned in base.
  video_frame_delay_auto: "true"
  # The two keys the per-core presets hang off: the master toggle, shipped off, and what
  # makes RetroArch read the preset on core load. Either off leaves the shaders inert.
  video_shader_enable: "true"
  auto_shaders_enable: "true"

# Base keys removed from the device's retroarch.cfg: the mouse, lightgun and menu-mouse
# keys need a pointer, windowed_fullscreen is a desktop concept, and the keyboard binds
# are moot without a keyboard.
settings_drop:
  # Names nothing on Android, so dropped rather than failing to init the subsystem.
  - camera_driver
  - microphone_driver
  - midi_driver
  - video_windowed_fullscreen
  - input_player1_mouse_index
  - input_player1_gun_trigger_mbtn
  - input_player1_gun_offscreen_shot_mbtn
  - menu_mouse_enable
  - input_player1_up
  - input_player1_down
  - input_player1_left
  - input_player1_right
  - input_player1_a
  - input_player1_b
  - input_player1_x
  - input_player1_y
  - input_player1_l
  - input_player1_r
  - input_player1_start
  - input_player1_select
  - input_exit_emulator
  - input_fps_toggle
  - input_load_state
  - input_menu_toggle
  - input_pause_toggle
  - input_reset
  - input_save_state
  - input_screenshot
  - input_state_slot_decrease
  - input_state_slot_increase
  - input_toggle_fullscreen
  - input_rewind
  - input_hold_fast_forward

# Remapped from the base's flatpak paths to device_dirs above. libretro_directory and
# libretro_info_path are deliberately absent: cores live in the app-private dir.
directory_settings:
  system_directory: system
  playlist_directory: playlists
  thumbnails_directory: thumbnails
  savefile_directory: saves
  savestate_directory: states
  cache_directory: cache
  video_shader_dir: shaders
  rgui_browser_directory: roms

# Library system (No-Intro directory name) -> ES-DE short name, North-America variants.
# Feeds the generator's emit_system_dirs and the ROM mirror's ROMS/<short name>. A system
# absent here is not synced. GameCube and PS2 stay for the ROM mirror though they left the
# RetroArch table; the generator only looks up its own systems.
rom_dir_names:
  # ES-DE's arcade system, matching the library directory and the desktop playlist. Its
  # command list carries fourteen emulators, mostly MAME; esde_cores pins FinalBurn Neo.
  # Fall back to the single-emulator fbneo system if that pin proves unreliable.
  Arcade: arcade
  Atari - 2600: atari2600
  Atari - 7800: atari7800
  Atari - Jaguar: atarijaguar
  Atari - Lynx: atarilynx
  NEC - PC Engine - TurboGrafx 16: tg16
  NEC - PC Engine CD - TurboGrafx-CD: tg-cd
  Nintendo - Game Boy: gb
  Nintendo - Game Boy Advance: gba
  Nintendo - Game Boy Color: gbc
  Nintendo - GameCube: gc
  Nintendo - Nintendo 64: n64
  Nintendo - Nintendo DS: nds
  Nintendo - Nintendo Entertainment System: nes
  Nintendo - Super Nintendo Entertainment System: snes
  Pico-8: pico8
  Sega - 32X: sega32xna
  Sega - Dreamcast: dreamcast
  Sega - Game Gear: gamegear
  Sega - Master System - Mark III: mastersystem
  Sega - Mega Drive - Genesis: genesis
  Sega - Mega-CD - Sega CD: segacd
  Sega - Saturn: saturn
  SNK - Neo Geo: neogeo
  SNK - Neo Geo CD: neogeocd
  # ES-DE keeps ngp and ngpc separate; the library carries only Color.
  SNK - Neo Geo Pocket Color: ngpc
  Sony - PlayStation: psx
  Sony - PlayStation 2: ps2
  Sony - PlayStation Portable: psp
  The 3DO Company - 3DO: 3do

# ES-DE picks its own emulator per system, independent of the RetroArch playlists. Pins
# each to the core the games role prefers, as the <alternativeEmulator> in ROMS'
# gamelist.xml. Labels must match an ES-DE <command label> for that system exactly. pico8
# is omitted: which runtime is installed is not knowable here.
esde_cores:
  atari2600: Stella
  arcade: FinalBurn Neo
  atari7800: ProSystem
  atarijaguar: Virtual Jaguar
  atarilynx: Beetle Lynx
  tg16: Beetle PCE
  tg-cd: Beetle PCE
  gb: Gambatte
  gba: mGBA
  gbc: Gambatte
  gc: Dolphin (Standalone)
  n64: Mupen64Plus-Next
  nds: melonDS DS
  nes: Mesen
  snes: Snes9x - Current
  sega32xna: PicoDrive
  dreamcast: Flycast
  gamegear: Genesis Plus GX
  mastersystem: Genesis Plus GX
  genesis: Genesis Plus GX
  segacd: Genesis Plus GX
  saturn: YabaSanshiro
  neogeo: FinalBurn Neo
  neogeocd: NeoCD
  ngpc: Beetle NeoPop
  psx: Beetle PSX HW
  # Not in ES-DE's bundle: from the GlazedBelmont custom_systems, whose es_find_rules.xml
  # must target the installed package, not the .custom fork it ships with. See README.
  ps2: AetherSX2-Turnip (Standalone)
  psp: PPSSPP
  3do: Opera

# On internal storage, apart from the ROMs and media on the sdcard. The package is
# force-stopped before writing: ES-DE rewrites gamelist.xml on exit.
esde_gamelists_dir: "/storage/emulated/0/ES-DE/gamelists"
esde_package: org.es_de.frontend

# Rewind and fast-forward on the pad, as Android keycodes: L3=106 rewinds, R3=107
# fast-forwards, both held. The right-stick axes stay nul: this pad's is Z/RZ, which N64,
# PSP, DS and Dreamcast use in-game.
controller:
  input_rewind_axis: "nul"
  input_hold_fast_forward_axis: "nul"
  input_rewind_btn: "106"
  input_hold_fast_forward_btn: "107"

# --- Shaders ---

# CRT Geom Deluxe adds halation, phosphor persistence, raster bloom and real mask textures
# to plain crt-geom. slang-only, which is what settles the video driver above.
#
# syncretroid extracts the preset's file closure from the libretro pack into
# device_dirs.shaders and writes a per-core auto preset for every vulkan core. The pack is
# ~5500 files at one adb push each, so only the dozen the preset opens are pushed;
# installing the rest in-app afterwards is additive and never pruned.
#
# params are keyed by the #pragma names in geom-deluxe-params.inc and appended to each
# preset. Masks come out dim at 1080p, so aperture_brightboost is the first knob; zeroing
# halation and phosphor_amplitude drops the expensive passes.
shaders:
  zip_url: "https://buildbot.libretro.com/assets/frontend/shaders_slang.zip"
  preset: crt/crt-geom-deluxe.slangp
  params: {}

# --- Per-core override transforms (over games_retroarch_core_overrides) ---

# Dolphin and PCSX2 go with their systems.
core_overrides_remove:
  - dolphin
  - pcsx2

# The two cores taken back off the global vulkan driver, both hardware renderers whose
# build follows the frontend's. slang needs vulkan, so neither can have a shader preset.
core_overrides_set:
  # No Adreno driver runs ParaLLEl-RDP, so this stays on GLideN64 HLE, which under the
  # vulkan driver fails to load content at all. Pinned rather than left to
  # driver_switch_enable, which switches after instantiation and crashes here.
  mupen64plus_next:
    video_driver: gl
  # PPSSPP's docs recommend Vulkan, true of the standalone app, but the libretro core's
  # Vulkan path on Android has an unbroken run of crash reports. gl is verified here.
  ppsspp:
    video_driver: gl

# --- Per-core option transforms (over games_retroarch_core_options) ---

# N64 swaps ParaLLEl for GLideN64 HLE. Beetle PSX HW is pinned to Vulkan, falling back to
# software at 1x otherwise, at 2x internal resolution: an 845 collapsed at 4x and the core
# has no dynarec.
core_options_set:
  mupen64plus_next:
    mupen64plus-rdp-plugin: gliden64
    mupen64plus-rsp-plugin: hle
  mednafen_psx_hw:
    beetle_psx_hw_renderer: hardware_vk
    beetle_psx_hw_internal_resolution: 2x

# Stands in for files/retroarch-probe-cores.py, which cannot dlopen an ARM .so from the
# x86 controller. library_name must match the core's runtime name exactly (README, "Verify
# the core names"); the other two feed the generator's validation.
core_probe:
  stella:
    library_name: Stella
    valid_extensions: [a26, bin, zip]
    block_extract: false
  prosystem:
    library_name: ProSystem
    valid_extensions: [a78, bin, zip]
    block_extract: false
  virtualjaguar:
    library_name: Virtual Jaguar
    valid_extensions: [j64, jag, rom, zip]
    block_extract: false
  mednafen_lynx:
    library_name: Beetle Lynx
    valid_extensions: [lnx, lyx, o, zip]
    block_extract: false
  mednafen_pce:
    library_name: Beetle PCE
    valid_extensions: [pce, sgx, cue, ccd, chd, toc, m3u, zip]
    block_extract: false
  gambatte:
    library_name: Gambatte
    valid_extensions: [gb, gbc, dmg, zip]
    block_extract: false
  mgba:
    library_name: mGBA
    valid_extensions: [gb, gbc, gba, zip]
    block_extract: false
  mupen64plus_next:
    library_name: Mupen64Plus-Next
    valid_extensions: [n64, v64, z64, bin, u1, ndd, zip]
    block_extract: false
  melondsds:
    library_name: melonDS DS
    valid_extensions: [nds, dsi, zip]
    block_extract: false
  mesen:
    library_name: Mesen
    valid_extensions: [nes, fds, unif, unf, zip]
    block_extract: false
  snes9x:
    library_name: Snes9x
    valid_extensions: [smc, sfc, swc, fig, bs, st, zip]
    block_extract: false
  picodrive:
    library_name: PicoDrive
    valid_extensions:
      [bin, gen, smd, md, 32x, cue, iso, sms, 68k, chd, m3u, zip]
    block_extract: false
  flycast:
    library_name: Flycast
    valid_extensions: [chd, cdi, iso, elf, cue, gdi, lst, dat, bin, m3u]
    block_extract: false
  genesis_plus_gx:
    library_name: Genesis Plus GX
    valid_extensions:
      [mdx, md, smd, gen, bin, cue, iso, sms, gg, sg, 68k, sgd, chd, m3u, zip]
    block_extract: false
  yabasanshiro:
    library_name: YabaSanshiro
    valid_extensions: [cue, iso, chd, ccd, mds, bin, m3u, zip]
    block_extract: false
  fbneo:
    # fbneo is handed the .zip whole and opens the romset itself; the generator
    # allows it because zip is in valid_extensions.
    library_name: FinalBurn Neo
    valid_extensions: [zip, 7z, cue, ccd]
    block_extract: true
  neocd:
    library_name: NeoCD
    valid_extensions: [cue, chd]
    block_extract: false
  mednafen_ngp:
    library_name: Beetle NeoPop
    valid_extensions: [ngp, ngc, ngpc, npc, zip]
    block_extract: false
  mednafen_psx_hw:
    library_name: Beetle PSX HW
    valid_extensions: [cue, toc, m3u, ccd, exe, pbp, chd]
    block_extract: false
  ppsspp:
    library_name: PPSSPP
    valid_extensions: [iso, cso, pbp, elf, prx, chd]
    block_extract: false
  opera:
    library_name: Opera
    valid_extensions: [iso, bin, chd, cue]
    block_extract: false
