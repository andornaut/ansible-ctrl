---
- name: Install common system packages
  ansible.builtin.apt:
    name:
      # CPU governor and process priority during play. Flatpak games reach the
      # host daemon through gamemoderun over D-Bus.
      - gamemode
      # chdman, for .chd archives.
      - mame-tools
      # Performance overlay for native games; flatpak games use the Vulkan layer
      # extension from flatpak.yml.
      - mangohud
      # retroarch.yml copies the ~600MB BIOS set out of the ROM library with it.
      - rsync
      # udev rules for gamepads.
      - steam-devices
      # xwininfo, which files/lutris-launch-game.py asks gamescope's nested X server
      # whether the game has a window yet.
      - x11-utils
    state: latest
    install_recommends: false
    update_cache: true
  become: true
