---
# The bedrock tag does not select the flatpak tag, and every step here shells out
# to the binary.
- name: Require flatpak
  ansible.builtin.include_tasks: require_tools.yml
  vars:
    require_tools:
      - name: flatpak
        probe: flatpak --version
        hint: "It comes from this role's flatpak tag: make games -- --tags flatpak"

# Wine 11 has no esync/fsync, so /dev/ntsync is its only fast synchronization path: without
# the device every Win32 wait is a wineserver round-trip, and the wineserver serialises them,
# so Minecraft's worker threads queue behind one another. The module ships from Linux 6.14 and
# nothing autoloads it, the device matching no bus. The engine must also carry the backend,
# which is a launcher-side Install / Update, and BOL's doctor reports both halves.
- name: Enable Wine's fast synchronization path
  become: true
  become_user: root
  block:
    - name: Check whether the kernel ships the ntsync module
      ansible.builtin.command:
        cmd: modinfo ntsync
      register: games_bedrock_ntsync
      changed_when: false
      failed_when: false

    - name: Load ntsync, now and at every boot
      when: games_bedrock_ntsync.rc == 0
      community.general.modprobe:
        name: ntsync
        state: present
        persistent: present

    # modprobe writes the file itself and takes no mode, so it lands at whatever the
    # run's umask allows. systemd-modules-load reads it as root either way; this is so
    # the file can be read where every other file under /etc/modules-load.d can.
    - name: Name the mode of the ntsync module list
      when: games_bedrock_ntsync.rc == 0
      ansible.builtin.file:
        path: /etc/modules-load.d/ntsync.conf
        mode: "0644"

# github.com/Wyze3306/BedrockOnLinux ships only a release .flatpak bundle, which the flatpak
# module cannot install, taking app IDs and flatpakref URLs only. The launcher only: game
# files and Microsoft sign-in are interactive per-user steps.
#
# /releases/latest is unusable, the repo publishing its bundled engine components as full
# releases too, so take the first vN.N.N tag off a newest-first listing.
- name: Resolve the BedrockOnLinux releases
  ansible.builtin.uri:
    url: https://api.github.com/repos/Wyze3306/BedrockOnLinux/releases?per_page=100
  register: games_bedrock_releases
  # uri supports no check mode, so a --check run would skip this and leave the
  # register undefined for every task that templates it. The request only reads.
  check_mode: false
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx is deterministic.
  until: >-
    games_bedrock_releases.status == 200 or
    (games_bedrock_releases.status >= 400 and games_bedrock_releases.status < 500)

- name: Determine the latest BedrockOnLinux version
  ansible.builtin.set_fact:
    games_bedrock_tag: "{{ games_bedrock_latest_tag }}"
    games_bedrock_version: "{{ games_bedrock_latest_tag | regex_replace('^v', '') }}"
  vars:
    games_bedrock_latest_tag:
      "{{ games_bedrock_releases.json | rejectattr('draft') | rejectattr('prerelease')
      | map(attribute='tag_name') | select('match', '^v[0-9]+[.][0-9]+[.][0-9]+$') | first }}"

# --columns emits one tab-separated line per app off a terminal, and neither field
# can contain whitespace, so the pair below is a whole line or is not installed.
- name: List the flatpak applications installed for {{ games_user }}
  ansible.builtin.command:
    cmd: flatpak list --user --app --columns=application,version
  register: games_bedrock_flatpaks
  changed_when: false

- name: Install the latest BedrockOnLinux from the release bundle
  when: games_bedrock_installed not in games_bedrock_flatpaks.stdout_lines
  vars:
    games_bedrock_installed: "io.github.wyze3306.BedrockOnLinux\t{{ games_bedrock_version }}"
    games_bedrock_release_base: "https://github.com/Wyze3306/BedrockOnLinux/releases/download/{{ games_bedrock_tag }}"
    games_bedrock_bundle_name: "BedrockOnLinux-{{ games_bedrock_version }}-x86_64.flatpak"
  block:
    - name: Create a temporary directory for the BedrockOnLinux bundle
      ansible.builtin.tempfile:
        state: directory
      register: games_bedrock_tmp

    # get_url matches the destination file name against the release's SHA256SUMS,
    # so the download is verified without pinning a hash.
    - name: Download the BedrockOnLinux flatpak bundle
      ansible.builtin.get_url:
        url: "{{ games_bedrock_release_base }}/{{ games_bedrock_bundle_name }}"
        dest: "{{ games_bedrock_tmp.path }}/{{ games_bedrock_bundle_name }}"
        checksum: "sha256:{{ games_bedrock_release_base }}/BedrockOnLinux-{{ games_bedrock_version }}-SHA256SUMS"
        mode: "0644"

    # The bundle's ref is always "master", so a new version keeps the same ref and a
    # plain install fails with "already installed".
    - name: Install the BedrockOnLinux flatpak bundle
      ansible.builtin.command:
        cmd: >-
          flatpak install --user --noninteractive --or-update
          {{ games_bedrock_tmp.path }}/{{ games_bedrock_bundle_name }}
      changed_when: true
  always:
    - name: Remove the BedrockOnLinux bundle temporary directory
      ansible.builtin.file:
        path: "{{ games_bedrock_tmp.path }}"
        state: absent
      when: games_bedrock_tmp.path is defined

# Launch the game directly rather than the launcher GUI the flatpak's own entry opens: focus
# an existing window, else `play`. The entry's own "Play without the launcher" action runs the
# same `play`, but refuses while the Wine prefix is active instead of focusing the window, and
# `bedrock-on-linux shortcut` cannot write an entry the host desktop can see from inside the
# sandbox. The one-time version install and sign-in remain launcher steps.
- name: Install the direct-launch Minecraft (Bedrock) script and desktop entry
  vars:
    games_bedrock_icon_src: >-
      {{ games_user_home }}/.var/app/io.github.wyze3306.BedrockOnLinux/data/bedrock-on-linux/content/LargeLogo.png
    games_bedrock_icon_dir: "{{ games_user_home }}/.local/share/icons/hicolor/256x256/apps"
  block:
    - name: Create the user bin directory
      ansible.builtin.file:
        path: "{{ games_user_home }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Copy the Minecraft (Bedrock) launch script
      ansible.builtin.copy:
        src: minecraft-bedrock-launch.sh
        dest: "{{ games_user_home }}/.local/bin/minecraft-bedrock-launch.sh"
        mode: "0755"

    - name: Create the user applications directory
      ansible.builtin.file:
        path: "{{ games_user_home }}/.local/share/applications"
        state: directory
        mode: "0755"

    # The game's own UWP logo, rather than the launcher's. `content` is BedrockOnLinux's
    # symlink to the installed package, so the path survives a game update; it is absent
    # until the game itself is installed, which is an interactive launcher step.
    - name: Check for the installed game's icon
      ansible.builtin.stat:
        path: "{{ games_bedrock_icon_src }}"
      register: games_bedrock_icon

    - name: Create the user icon theme directory
      when: games_bedrock_icon.stat.exists
      ansible.builtin.file:
        path: "{{ games_bedrock_icon_dir }}"
        state: directory
        mode: "0755"

    # 256x256 rather than the source's own 480x480: the system hicolor's index.theme
    # names the sizes for every merged copy of the theme, a directory it does not name
    # is never searched, and GTK scales whatever it finds to the size asked for.
    - name: Install the Minecraft (Bedrock) icon
      when: games_bedrock_icon.stat.exists
      ansible.builtin.copy:
        src: "{{ games_bedrock_icon_src }}"
        dest: "{{ games_bedrock_icon_dir }}/minecraft-bedrock.png"
        remote_src: true
        mode: "0644"
      notify: Mark the user hicolor icon cache stale

    - name: Install the Minecraft (Bedrock) desktop entry
      ansible.builtin.template:
        src: minecraft-bedrock.desktop.j2
        dest: "{{ games_user_home }}/.local/share/applications/minecraft-bedrock.desktop"
        mode: "0644"

# The sandbox PATH grant for BOL's own gpu_safety check: it fail-closes under X11, the
# freedesktop runtime shipping no xrandr. Vendoring the host binary into a read-only grant
# on PATH keeps every check active, unlike BOL_ALLOW_UNSAFE_GPU or a --filesystem=host-os
# grant. No-op on Wayland, and xrandr links only against runtime libraries.
- name: Create the BedrockOnLinux sandbox helper directory
  ansible.builtin.file:
    path: "{{ games_bedrock_helper_dir }}"
    state: directory
    mode: "0755"

- name: Check for the host xrandr
  ansible.builtin.stat:
    path: /usr/bin/xrandr
  register: games_bedrock_xrandr

- name: Copy the host xrandr into the sandbox helper directory
  when: games_bedrock_xrandr.stat.exists
  ansible.builtin.copy:
    src: /usr/bin/xrandr
    dest: "{{ games_bedrock_helper_dir }}/xrandr"
    remote_src: true
    mode: "0755"

# BOL wraps the game in whatever `gamescope` its PATH finds when BOL_GAMESCOPE is set, so
# the gamescope helper directory goes first on it, as it does for Lutris; the extension's
# `bin` is not on this sandbox's PATH. The manifest's PATH is read rather than restated so
# the override tracks it. BOL_GAMESCOPE carrying options rather than `1`: BOL then passes
# them through instead of sizing the output from its own xrandr probe, so the size is the
# asserted one, as it is for Lutris. --force-windows-fullscreen sizes the game's window to
# that output too: a windowed game is otherwise shown at its own saved size, centred in the
# output.
- name: Read the BedrockOnLinux manifest
  ansible.builtin.command:
    argv: [flatpak, info, --user, -m, io.github.wyze3306.BedrockOnLinux]
  register: games_bedrock_manifest
  changed_when: false
  check_mode: false

- name: Grant the helper directories to the sandbox, on PATH, and turn on gamescope
  ansible.builtin.include_tasks: flatpak_override.yml
  vars:
    games_flatpak_override_app: io.github.wyze3306.BedrockOnLinux
    games_flatpak_override_args: >-
      {{ ['--filesystem=' ~ games_bedrock_helper_dir ~ ':ro',
          '--env=PATH=' ~ games_bedrock_path]
         + games_bedrock_gamescope_grants }}
    games_bedrock_wh: "{{ games_gamescope_resolution.split('x') }}"
    # /app/bin:/usr/bin is the runtime's default, for a manifest that sets none.
    games_bedrock_manifest_path: >-
      {{ games_bedrock_manifest.stdout | regex_findall('(?m)^PATH=(.*)$')
         | first | default('/app/bin:/usr/bin', true) }}
    games_bedrock_path: >-
      {{ ((games_gamescope_helper_dir ~ ':') if games_gamescope_enabled | bool else '')
         ~ games_bedrock_manifest_path ~ ':' ~ games_bedrock_helper_dir }}
    games_bedrock_gamescope_grants: >-
      {{ ['--filesystem=' ~ games_gamescope_helper_dir ~ ':ro',
          '--env=BOL_GAMESCOPE=-f -W ' ~ games_bedrock_wh[0] ~ ' -H ' ~ games_bedrock_wh[1]
          ~ ' -w ' ~ games_bedrock_wh[0] ~ ' -h ' ~ games_bedrock_wh[1]
          ~ ' --force-windows-fullscreen',
          '--env=XKB_DEFAULT_OPTIONS=' ~ games_gamescope_xkb_options]
         if games_gamescope_enabled | bool else [] }}

# CLEANUP (added 2026-09-05): the helper directory's previous name. Delete once every
# gaming host has converged.
- name: Remove the vendored-xrandr directory the helper directory replaced
  ansible.builtin.file:
    path: "{{ games_user_home }}/.local/share/bol-xrandr"
    state: absent
