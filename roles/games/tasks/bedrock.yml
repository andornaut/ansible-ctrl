---
# The bedrock tag does not select the flatpak tag, and every step here shells out
# to the binary.
- name: Require flatpak
  ansible.builtin.include_tasks: require_tools.yml
  vars:
    require_tools:
      - name: flatpak
        probe: flatpak --version
        hint: "It comes from this role's flatpak tag: make games -- --tags flatpak"

# github.com/Wyze3306/BedrockOnLinux ships only a release .flatpak bundle, which the
# flatpak module cannot install, taking app IDs and flatpakref URLs only. The
# launcher only: game files and Microsoft sign-in are interactive per-user steps.
#
# /releases/latest is unusable, the repo publishing its bundled engine components as
# full releases too, so take the first vN.N.N tag off a newest-first listing.
- name: Resolve the BedrockOnLinux releases
  ansible.builtin.uri:
    url: https://api.github.com/repos/Wyze3306/BedrockOnLinux/releases?per_page=100
  register: games_bedrock_releases
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx is deterministic.
  until: >-
    games_bedrock_releases.status == 200 or
    (games_bedrock_releases.status >= 400 and games_bedrock_releases.status < 500)

- name: Determine the latest BedrockOnLinux version
  ansible.builtin.set_fact:
    games_bedrock_tag: "{{ games_bedrock_latest_tag }}"
    games_bedrock_version: "{{ games_bedrock_latest_tag | regex_replace('^v', '') }}"
  vars:
    games_bedrock_latest_tag: "{{ games_bedrock_releases.json | rejectattr('draft') | rejectattr('prerelease')
      | map(attribute='tag_name') | select('match', '^v[0-9]+[.][0-9]+[.][0-9]+$') | first }}"

# --columns emits one tab-separated line per app off a terminal, and neither field
# can contain whitespace, so the pair below is a whole line or is not installed.
- name: List the flatpak applications installed for {{ games_user }}
  ansible.builtin.command:
    cmd: flatpak list --user --app --columns=application,version
  register: games_bedrock_flatpaks
  changed_when: false

- name: Install the latest BedrockOnLinux from the release bundle
  when: games_bedrock_installed not in games_bedrock_flatpaks.stdout_lines
  vars:
    games_bedrock_installed: "io.github.wyze3306.BedrockOnLinux\t{{ games_bedrock_version }}"
    games_bedrock_release_base: "https://github.com/Wyze3306/BedrockOnLinux/releases/download/{{ games_bedrock_tag }}"
    games_bedrock_bundle_name: "BedrockOnLinux-{{ games_bedrock_version }}-x86_64.flatpak"
  block:
    - name: Create a temporary directory for the BedrockOnLinux bundle
      ansible.builtin.tempfile:
        state: directory
      register: games_bedrock_tmp

    # get_url matches the destination file name against the release's SHA256SUMS,
    # so the download is verified without pinning a hash.
    - name: Download the BedrockOnLinux flatpak bundle
      ansible.builtin.get_url:
        url: "{{ games_bedrock_release_base }}/{{ games_bedrock_bundle_name }}"
        dest: "{{ games_bedrock_tmp.path }}/{{ games_bedrock_bundle_name }}"
        checksum: "sha256:{{ games_bedrock_release_base }}/BedrockOnLinux-{{ games_bedrock_version }}-SHA256SUMS"
        mode: "0644"

    # The bundle's ref is always "master", so a new version keeps the same ref and a
    # plain install fails with "already installed".
    - name: Install the BedrockOnLinux flatpak bundle
      ansible.builtin.command:
        cmd: >-
          flatpak install --user --noninteractive --or-update
          {{ games_bedrock_tmp.path }}/{{ games_bedrock_bundle_name }}
      changed_when: true
  always:
    - name: Remove the BedrockOnLinux bundle temporary directory
      ansible.builtin.file:
        path: "{{ games_bedrock_tmp.path }}"
        state: absent
      when: games_bedrock_tmp.path is defined

# Launch the game directly rather than the launcher GUI the flatpak's own entry
# opens: focus an existing window, else `login` then `play`. Both still need the
# one-time GUI setup and sign-in, which BOL reports for itself.
- name: Install the direct-launch Minecraft (Bedrock) script and desktop entry
  block:
    - name: Create the user bin directory
      ansible.builtin.file:
        path: "{{ games_user_home }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Copy the Minecraft (Bedrock) launch script
      ansible.builtin.copy:
        src: minecraft-bedrock-launch.sh
        dest: "{{ games_user_home }}/.local/bin/minecraft-bedrock-launch.sh"
        mode: "0755"

    - name: Create the user applications directory
      ansible.builtin.file:
        path: "{{ games_user_home }}/.local/share/applications"
        state: directory
        mode: "0755"

    - name: Install the Minecraft (Bedrock) desktop entry
      ansible.builtin.template:
        src: minecraft-bedrock.desktop.j2
        dest: "{{ games_user_home }}/.local/share/applications/minecraft-bedrock.desktop"
        mode: "0644"

# BOL's gpu_safety check fail-closes under X11, the freedesktop runtime shipping no
# xrandr. Vendoring the host binary into a read-only grant on PATH keeps every check
# active, unlike BOL_ALLOW_UNSAFE_GPU or a --filesystem=host-os grant. No-op on
# Wayland, and xrandr links only against runtime libraries.
- name: Check for the host xrandr
  ansible.builtin.stat:
    path: /usr/bin/xrandr
  register: games_bedrock_xrandr

- name: Let BedrockOnLinux's graphics safety check reach a vendored xrandr
  when: games_bedrock_xrandr.stat.exists
  vars:
    games_bedrock_xrandr_dir: "{{ games_user_home }}/.local/share/bol-xrandr"
  block:
    - name: Create the vendored-xrandr directory
      ansible.builtin.file:
        path: "{{ games_bedrock_xrandr_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the host xrandr into the sandbox-readable directory
      ansible.builtin.copy:
        src: /usr/bin/xrandr
        dest: "{{ games_bedrock_xrandr_dir }}/xrandr"
        remote_src: true
        mode: "0755"

    # Reset first so the override converges to exactly this set. `flatpak override`
    # reports nothing, so diff `--show` either side of it.
    - name: Grant the vendored xrandr to the sandbox and put it on PATH
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          app=io.github.wyze3306.BedrockOnLinux
          dir={{ games_bedrock_xrandr_dir | quote }}
          before="$(flatpak override --user --show "$app")"
          flatpak override --user --reset "$app"
          flatpak override --user \
            --filesystem="${dir}:ro" \
            --env=PATH="/app/bin:/usr/bin:${dir}" \
            "$app"
          after="$(flatpak override --user --show "$app")"
          [ "$before" = "$after" ] || echo CHANGED
      register: games_bedrock_override
      changed_when: "'CHANGED' in games_bedrock_override.stdout"
