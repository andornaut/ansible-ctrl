---
# The desktop role installs flatpak too, but package installs stay scoped to their
# own role so games.yml runs on a host the desktop role never touched.
- name: Install flatpak package
  ansible.builtin.apt:
    name: flatpak
    state: present
    install_recommends: false
  become: true

- name: Install and configure flatpak applications for the target user
  become: true
  become_user: "{{ games_user }}"
  block:
    # Per-user installations have their own remotes, so games_user needs its own.
    - name: Add flathub repository
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: user

    - name: Install flatpak applications
      community.general.flatpak:
        name: "{{ games_flatpak_apps }}"
        method: user

    - name: Install flatpak Vulkan layer extensions
      community.general.flatpak:
        name: "{{ games_flatpak_extensions }}"
        method: user

    # `flatpak override` reports nothing, so diff `--show` either side of it.
    - name: Apply flatpak overrides
      ansible.builtin.shell:
        cmd: |
          before="$(flatpak override --user --show {{ item }})"
          flatpak override --user {{ grants | map('quote') | join(' ') }} {{ item }}
          after="$(flatpak override --user --show {{ item }})"
          [ "${before}" = "${after}" ] || echo CHANGED
        executable: /bin/bash
      vars:
        # Blanket grants plus this app's own; either may be absent.
        grants: >-
          {{ (games_flatpak_overrides['default'] | default([]))
             + (games_flatpak_overrides[item] | default([])) }}
      loop: "{{ games_flatpak_apps }}"
      register: games_flatpak_override
      changed_when: "'CHANGED' in games_flatpak_override.stdout"
