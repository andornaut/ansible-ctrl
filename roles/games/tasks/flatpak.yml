---
# The desktop role installs flatpak too, but package installs stay scoped to their
# own role so games.yml runs on a host the desktop role never touched.
- name: Install flatpak package
  ansible.builtin.apt:
    name: flatpak
    state: present
    install_recommends: false
  become: true

- name: Install and configure flatpak applications for the target user
  become: true
  become_user: "{{ games_user }}"
  block:
    # Per-user installations have their own remotes, so games_user needs its own.
    - name: Add flathub repository
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: user

    - name: Install flatpak applications
      community.general.flatpak:
        name: "{{ games_flatpak_apps }}"
        method: user

    # Sandboxed games cannot see the host binaries. Pinned to the runtime branch, flathub
    # publishing these on several at once.
    - name: Install flatpak Vulkan layer extensions
      community.general.flatpak:
        name:
          - org.freedesktop.Platform.VulkanLayer.MangoHud//{{ games_flatpak_runtime_branch }}
          - org.freedesktop.Platform.VulkanLayer.gamescope//{{ games_flatpak_runtime_branch }}
        method: user

    # Lutris is left to the block below: its override carries a PATH read from its manifest.
    - name: Apply flatpak overrides
      ansible.builtin.include_tasks: flatpak_override.yml
      vars:
        games_flatpak_override_app: "{{ item }}"
        # Blanket grants plus this app's own; either may be absent.
        games_flatpak_override_args: >-
          {{ (games_flatpak_overrides['default'] | default([]))
             + (games_flatpak_overrides[item] | default([])) }}
      loop: "{{ games_flatpak_apps | reject('eq', games_lutris_app_id) | list }}"

    # Lutris resolves the bare `gamescope` it inserts against its sandbox PATH, so the wrapper
    # directory goes first on it, ahead of the extension's `bin`. The manifest's PATH is read
    # rather than restated so the override tracks it, which is why this application's whole
    # override is written here and not in the loop. Under the lutris tag too, that tag's
    # launcher depending on it: the block's tag joins the import's. Guarded on the
    # application being installed, which under the lutris tag alone nothing above ensures.
    - name: Converge the Lutris override
      tags: lutris
      block:
        - name: List the flatpak applications installed for {{ games_user }}
          ansible.builtin.command:
            argv: [flatpak, list, --user, --app, --columns=application]
          register: games_flatpak_installed
          changed_when: false
          check_mode: false

        - name: Warn when Lutris is not installed
          ansible.builtin.debug:
            msg: >-
              WARNING: {{ games_lutris_app_id }} is not installed for {{ games_user }}, so its
              override was not written. It comes from this role's flatpak tag: make games --
              --tags flatpak
          when: games_lutris_app_id not in games_flatpak_installed.stdout_lines

        - name: Read the Lutris manifest
          ansible.builtin.command:
            argv: [flatpak, info, --user, -m, "{{ games_lutris_app_id }}"]
          register: games_lutris_manifest
          changed_when: false
          check_mode: false
          when: games_lutris_app_id in games_flatpak_installed.stdout_lines

        - name: Grant the gamescope helper directory to the Lutris sandbox, first on PATH
          ansible.builtin.include_tasks: flatpak_override.yml
          vars:
            games_flatpak_override_app: "{{ games_lutris_app_id }}"
            games_flatpak_override_args: >-
              {{ (games_flatpak_overrides['default'] | default([]))
                 + (games_flatpak_overrides[games_lutris_app_id] | default([]))
                 + (['--filesystem=' ~ games_gamescope_helper_dir ~ ':ro',
                     '--env=PATH=' ~ games_gamescope_helper_dir ~ ':' ~ games_lutris_manifest_path,
                     '--env=XKB_DEFAULT_OPTIONS=' ~ games_gamescope_xkb_options]
                    if games_gamescope_enabled | bool else []) }}
            # /app/bin:/usr/bin is the runtime's default, for a manifest that sets none.
            games_lutris_manifest_path: >-
              {{ games_lutris_manifest.stdout | regex_findall('(?m)^PATH=(.*)$')
                 | first | default('/app/bin:/usr/bin', true) }}
          when: games_lutris_app_id in games_flatpak_installed.stdout_lines

    - name: Uninstall the flatpak applications this host has turned off
      community.general.flatpak:
        name: "{{ games_flatpak_removed_apps }}"
        method: user
        state: absent
      when: games_flatpak_removed_apps | length > 0

    # An override is a file of its own and outlives the application it names.
    - name: Remove the permission overrides of the uninstalled applications
      ansible.builtin.file:
        path: "{{ games_user_home }}/.local/share/flatpak/overrides/{{ item }}"
        state: absent
      loop: "{{ games_flatpak_removed_apps }}"

    # A flag turned off leaves nothing behind, the application's own settings and state
    # included. Nothing else writes here, flatpak giving each application its own tree.
    - name: Remove the data directories of the uninstalled applications
      ansible.builtin.file:
        path: "{{ games_user_home }}/.var/app/{{ item }}"
        state: absent
      loop: "{{ games_flatpak_removed_apps }}"

    # Most of what an uninstalled application cost on disk is its runtime. --unused takes only
    # what nothing installed still needs and spares what is pinned, which is every runtime
    # installed by name: the Vulkan layer extensions above are in `flatpak pin --user` for that
    # reason. LC_ALL pins the locale, the report below being matched as text.
    - name: Remove the flatpak runtimes nothing installed still needs
      ansible.builtin.command:
        argv:
          [flatpak, uninstall, --user, --unused, --assumeyes, --noninteractive]
      environment:
        LC_ALL: C
      register: games_flatpak_unused
      changed_when: "'Nothing unused' not in games_flatpak_unused.stdout"
