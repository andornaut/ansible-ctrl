---
# The Vulkan layer extensions, converged after every launcher install: an update can move a
# launcher to a runtime on another branch, and a sandbox mounts only the extension of the
# branch its runtime names. So this runs after flatpak.yml and bedrock.yml, under their tags
# and the lutris tag, whose wrapper execs the gamescope extension by path. Runs as games_user.
- name: Read the Vulkan layer branches the launchers mount
  ansible.builtin.include_tasks: flatpak_vulkan_branches.yml

# The flatpak module matches on ID alone, so with one branch installed it reports every other
# as present: the refs are compared by branch here and installed by the command.
- name: List the user flatpak refs
  ansible.builtin.command:
    argv: [flatpak, list, --user, --columns=ref]
  register: games_flatpak_refs
  changed_when: false
  check_mode: false

- name: Install the Vulkan layer extensions on each branch the launchers mount
  ansible.builtin.command:
    argv:
      [
        flatpak,
        install,
        --user,
        --assumeyes,
        --noninteractive,
        flathub,
        "{{ item }}",
      ]
  loop: >-
    {{ ['org.freedesktop.Platform.VulkanLayer.MangoHud', 'org.freedesktop.Platform.VulkanLayer.gamescope']
       | product(games_flatpak_vulkan_branches) | map('join', '//') | list }}
  when: >-
    games_flatpak_refs.stdout_lines
    | select('match', '^' ~ (item.split('//')[0] | regex_escape) ~ '/[^/]+/'
                      ~ (item.split('//')[1] | regex_escape) ~ '$')
    | list | length == 0
  changed_when: true

# Installed by name, so pinned, so never unused by flatpak.yml's --unused. The uninstall keeps
# the pin, which is removed beside it: a pin outlives its ref.
- name: Uninstall the Vulkan layer extensions of the branches nothing mounts
  vars:
    games_flatpak_vulkan_stale: >-
      {{ games_flatpak_refs.stdout_lines
         | select('match', '^org[.]freedesktop[.]Platform[.]VulkanLayer[.](MangoHud|gamescope)/')
         | reject('regex', '/(' ~ (games_flatpak_vulkan_branches | map('regex_escape') | join('|')) ~ ')$')
         | list }}
  block:
    - name: Uninstall the Vulkan layer extensions of the branches nothing mounts
      ansible.builtin.command:
        argv:
          [
            flatpak,
            uninstall,
            --user,
            --assumeyes,
            --noninteractive,
            "{{ item }}",
          ]
      loop: "{{ games_flatpak_vulkan_stale }}"
      changed_when: true

    - name: Unpin the uninstalled Vulkan layer extensions
      ansible.builtin.command:
        argv: [flatpak, pin, --user, --remove, "runtime/{{ item }}"]
      loop: "{{ games_flatpak_vulkan_stale }}"
      changed_when: true
