---
# Sets games_flatpak_vulkan_branches: the org.freedesktop.Platform.VulkanLayer branches the
# installed launchers in games_flatpak_vulkan_apps mount, one per distinct runtime. A sandbox
# mounts the extension of the branch its runtime's extension point names and no other, and the
# launchers' runtimes move independently, so the branch is read from each rather than pinned
# once. Runs as games_user, whose installation lists the applications; a runtime is looked up
# in every installation, a user application taking its runtime from the system one as readily.
- name: List the flatpak applications and their runtimes installed for {{ games_user }}
  ansible.builtin.command:
    argv: [flatpak, list, --user, --app, "--columns=application,runtime"]
  register: games_flatpak_vulkan_installed
  changed_when: false
  check_mode: false

- name: Read the Vulkan layer extension point of each launcher's runtime
  ansible.builtin.command:
    argv: [flatpak, info, -m, "{{ item }}"]
  loop: >-
    {{ games_flatpak_vulkan_installed.stdout_lines | map('split', '\t')
       | selectattr('0', 'in', games_flatpak_vulkan_apps)
       | map('last') | unique | sort | list }}
  register: games_flatpak_vulkan_runtimes
  changed_when: false
  check_mode: false

# `[^\[]*?` keeps the match inside the section: the next `[` is the next section header.
- name: Collect the Vulkan layer branches
  ansible.builtin.set_fact:
    games_flatpak_vulkan_branches: >-
      {{ games_flatpak_vulkan_runtimes.results | map(attribute='stdout')
         | map('regex_search',
               '(?s)\[Extension org\.freedesktop\.Platform\.VulkanLayer\][^\[]*?version\s*=\s*([0-9.]+)',
               '\1')
         | reject('none') | map('first') | unique | sort | list }}

# An empty list would pass every per-branch check below it and mark every installed branch
# as unmounted, so it is refused here, where the cause is named.
- name: Require a launcher whose runtime names a Vulkan layer branch
  ansible.builtin.assert:
    that: games_flatpak_vulkan_branches | length > 0
    fail_msg: >-
      None of {{ games_flatpak_vulkan_apps | join(', ') }} is installed for {{ games_user }}
      with a runtime that names a Vulkan layer branch. They come from this role's flatpak
      and bedrock tags: make games -- --tags flatpak,bedrock
    success_msg: "Vulkan layer branches: {{ games_flatpak_vulkan_branches | join(', ') }}"
