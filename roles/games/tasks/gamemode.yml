---
# apt.yml installs the daemon. This owns two things: the one setting in /etc/gamemode.ini,
# and membership of the `gamemode` group, which is what the daemon's root helpers are
# granted to. The desktop role's idle backstop is what covers the rest, a game engine
# holding an inhibitor of its own being outside anything this can turn off.
- name: Install the GameMode configuration
  ansible.builtin.template:
    src: gamemode.ini.j2
    dest: /etc/gamemode.ini
    owner: root
    group: root
    mode: "0644"
  become: true

# The package ships the polkit rule that grants its helpers to the `gamemode` group and puts
# nobody in it. polkitd resolves the group by name at each check, so no re-login is needed.
- name: Create the gamemode group
  ansible.builtin.group:
    name: gamemode
    system: true
  become: true

# The user module would create a misspelt name as a new account rather than fail on it.
# Keyless: a keyed lookup replaces getent_passwd with that one entry, and games_user_home
# reads its entry from the same fact.
- name: Read the account database
  ansible.builtin.getent:
    database: passwd
  become: false

- name: Require the GameMode accounts to exist
  ansible.builtin.assert:
    that: games_gamemode_missing | length == 0
    fail_msg: "games_gamemode_users names accounts that do not exist: {{ games_gamemode_missing | join(', ') }}"
    quiet: true
  vars:
    games_gamemode_missing: "{{ games_gamemode_users | reject('in', ansible_facts['getent_passwd']) | list }}"
  become: false

- name: Add the GameMode accounts to the gamemode group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: gamemode
    append: true
  loop: "{{ games_gamemode_users }}"
  become: true

# CLEANUP (added 2026-09-12): a polkit rule this role wrote in place of the membership above.
# Delete once every host in the games group has converged.
- name: Remove the polkit rule this role no longer writes
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/50-ansible-role-games-gamemode.rules
    state: absent
  become: true
