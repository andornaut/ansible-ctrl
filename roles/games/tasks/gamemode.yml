---
# apt.yml installs the daemon; this is the one setting of its own the role owns. The
# desktop role's idle backstop is what covers the rest, a game engine holding an inhibitor
# of its own being outside anything this can turn off.
- name: Install the GameMode configuration
  ansible.builtin.template:
    src: gamemode.ini.j2
    dest: /etc/gamemode.ini
    owner: root
    group: root
    mode: "0644"
  become: true

# The shipped policy answers "no" to every GameMode helper for every account, so without this
# the daemon enters Game Mode and none of its system-wide settings (governor, core pinning,
# split-lock mitigation, GPU clocks) land. polkitd watches rules.d, so nothing reloads.
- name: Grant GameMode's helpers to {{ games_user }}
  ansible.builtin.template:
    src: gamemode.rules.j2
    dest: /etc/polkit-1/rules.d/50-ansible-role-games-gamemode.rules
    owner: root
    group: root
    mode: "0644"
  become: true
