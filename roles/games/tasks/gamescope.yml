---
# CLEANUP (added 2026-09-24): the host gamescope this role installed, from the archive on
# Ubuntu >= 26.04 and built from source into /usr/local below that, subproject libraries and
# headers included. The launchers run the Vulkan layer extension's gamescope instead. Delete
# once every host in the games group has converged; the build dependencies stay installed.
- name: Remove the archive gamescope
  ansible.builtin.apt:
    name: gamescope
    state: absent
  become: true

- name: Remove the gamescope built into /usr/local
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/gamescope
    - /usr/local/bin/gamescope-type
    - /usr/local/bin/gamescopectl
    - /usr/local/bin/gamescopereaper
    - /usr/local/bin/gamescopestream
    - /usr/local/share/gamescope
    - /usr/local/share/vulkan/implicit_layer.d/VkLayer_FROG_gamescope_wsi.x86_64.json
    - /usr/local/lib/x86_64-linux-gnu/libVkLayer_FROG_gamescope_wsi_x86_64.so
    - /usr/local/lib/x86_64-linux-gnu/libwlroots-0.18.a
    - /usr/local/lib/x86_64-linux-gnu/libliftoff.a
    - /usr/local/lib/x86_64-linux-gnu/pkgconfig/wlroots-0.18.pc
    - /usr/local/lib/x86_64-linux-gnu/pkgconfig/libliftoff.pc
    - /usr/local/lib/x86_64-linux-gnu/pkgconfig/vkroots.pc
    - /usr/local/lib/libopenvr_api.a
    - /usr/local/include/wlroots-0.18
    - /usr/local/include/libliftoff.h
    - /usr/local/include/vkroots.h
    - /usr/local/lib/gamescope-deps
  become: true
