---
# Point Lutris's default install directory at games_lutris_dir. Stored as system.game_path
# in system.yml, which lives in config/lutris if that exists, else data/lutris. Only
# game_path is enforced, and the file is safe to create when absent, unlike Heroic's
# config.json. The flatpak already has `home` access.
- name: Check for the deprecated Lutris config directory
  ansible.builtin.stat:
    path: "{{ games_lutris_config_dir }}"
  register: games_lutris_config_dir_stat
  changed_when: false

- name: Check for the Lutris data directory
  ansible.builtin.stat:
    path: "{{ games_lutris_data_dir }}"
  register: games_lutris_data_dir_stat
  changed_when: false

# Empty when neither exists, i.e. Lutris has never run here; the tasks below skip.
- name: Resolve the active Lutris config directory
  ansible.builtin.set_fact:
    games_lutris_active_dir: >-
      {{ games_lutris_config_dir if games_lutris_config_dir_stat.stat.exists
         else (games_lutris_data_dir if games_lutris_data_dir_stat.stat.exists else '') }}

- name: Warn when Lutris has never run
  ansible.builtin.debug:
    msg: >-
      WARNING: neither {{ games_lutris_config_dir }} nor {{ games_lutris_data_dir }}
      exists (Lutris has not run on this host), so its default install path was not
      set. Launch Lutris once, then re-run.
  when: games_lutris_active_dir | length == 0

- name: Enforce the Lutris default install path
  when: games_lutris_active_dir | length > 0
  vars:
    games_lutris_config_file: "{{ games_lutris_active_dir }}/system.yml"
  block:
    - name: Read Lutris system.yml
      ansible.builtin.slurp:
        src: "{{ games_lutris_config_file }}"
      register: games_lutris_config_raw
      failed_when: false
      changed_when: false

    - name: Write system.yml with the enforced default install path
      vars:
        games_lutris_config: >-
          {{ (games_lutris_config_raw.content | b64decode | from_yaml) or {}
             if games_lutris_config_raw.content is defined else {} }}
        # default({}, true): a present-but-empty `system:` key is None, which the
        # combine below cannot take.
        games_lutris_system: "{{ games_lutris_config.system | default({}, true) }}"
        games_lutris_desired:
          game_path: "{{ games_lutris_dir }}"
        # Merged once, for the change test and the content alike.
        games_lutris_merged: "{{ games_lutris_system | combine(games_lutris_desired) }}"
      # system.yml is machine-written, so re-serialising it whole loses nothing.
      when: games_lutris_merged != games_lutris_system
      ansible.builtin.copy:
        dest: "{{ games_lutris_config_file }}"
        content: "{{ games_lutris_config | combine({'system': games_lutris_merged}) | to_nice_yaml }}"
        mode: "0644"

# Why the teardown is a host binary rather than a Lutris hook: README.md.
- name: Install the Lutris game launcher
  ansible.builtin.copy:
    src: lutris-launch-game.py
    dest: "{{ games_lutris_launcher_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  # main.yml imports this file under become_user, which a task inherits.
  become_user: root

# World of Warcraft as its own Lutris game, so `lutris:rungame/<slug>` launches it without the
# client's window. Not a Lutris entry the client created: it shares Battle.net's prefix and
# derives its configuration from Battle.net's on every run, so the client's own settings for
# Battle.net are the ones to edit. The entry is Battle.net's executable with an argument that
# makes the client launch the game, which is why a Battle.net session must already be logged in.
#
# Lutris keeps a game's configuration in config/lutris/games if that directory exists and in
# data/lutris/games otherwise, which is the fallback games_lutris_active_dir mirrors. pga.db is
# not subject to it: that one is always in data/lutris.
- name: Read Battle.net's Lutris configuration
  ansible.builtin.slurp:
    src: "{{ games_lutris_active_dir }}/games/{{ games_lutris_wow_source_slug }}.yml"
  register: games_lutris_wow_source_raw
  failed_when: false
  changed_when: false
  when: games_lutris_active_dir | length > 0

# The prefix the entry shares, read out of Lutris rather than assumed: Battle.net was installed
# where the default install path pointed at the time, which is not always where it points now,
# and both the probe below and the teardown the desktop entry asks for must name the real one.
# The derived path stands in where that file is not there, which is a Battle.net whose
# configuration Lutris keeps under a configpath that is not its slug.
- name: Resolve Battle.net's wine prefix
  ansible.builtin.set_fact:
    games_lutris_wow_prefix: >-
      {{ games_lutris_wow_source_game.prefix | default(games_lutris_wow_prefix_derived, true) }}
  vars:
    games_lutris_wow_source_config: >-
      {{ (games_lutris_wow_source_raw.content | b64decode | from_yaml) or {}
         if games_lutris_wow_source_raw.content is defined else {} }}
    games_lutris_wow_source_game: "{{ games_lutris_wow_source_config.game | default({}, true) }}"

- name: Check for a World of Warcraft install in the Battle.net prefix
  ansible.builtin.stat:
    path: "{{ games_lutris_wow_prefix }}/drive_c/Program Files (x86)/World of Warcraft/_retail_/Wow.exe"
  register: games_lutris_wow
  changed_when: false

# Named rather than skipped quietly: the block below is the whole of what the tag does for this
# game, and a prefix read off the wrong install looks exactly like a game that is not there.
- name: Warn when the Battle.net prefix holds no World of Warcraft
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ games_lutris_wow_prefix }} holds no
      drive_c/Program Files (x86)/World of Warcraft/_retail_/Wow.exe, so the game was not
      registered with Lutris. Install it through Battle.net, or check that this is the prefix
      Battle.net actually uses, then re-run.
  when: games_lutris_active_dir | length > 0 and not games_lutris_wow.stat.exists

- name: Register World of Warcraft as its own Lutris game
  when: games_lutris_active_dir | length > 0 and games_lutris_wow.stat.exists
  vars:
    games_lutris_wow_icon_dir: "{{ games_user_home }}/.local/share/icons/hicolor/128x128/apps"
  block:
    # Inside the sandbox, which carries the PyYAML Lutris itself reads its configuration with.
    - name: Derive the World of Warcraft entry from Battle.net's
      ansible.builtin.command:
        argv:
          - flatpak
          - run
          - --command=python3
          - "{{ games_lutris_app_id }}"
          # On stdin rather than ansible.builtin.script, which runs what it transfers
          # directly; this has to go through flatpak.
          - "-"
        stdin: "{{ lookup('ansible.builtin.file', 'lutris-register-game.py') }}"
      environment:
        LUTRIS_REGISTER_CONFIG: >-
          {{ {'config_dir': games_lutris_active_dir,
              'data_dir': games_lutris_data_dir,
              'source_slug': games_lutris_wow_source_slug,
              'slug': games_lutris_wow_slug,
              'name': 'World of Warcraft',
              'game': {'args': '--exec="launch WoW"'}} | to_json }}
      register: games_lutris_wow_register
      changed_when: games_lutris_wow_register.stdout | length > 0

    - name: Create the user applications directory
      ansible.builtin.file:
        path: "{{ games_user_home }}/.local/share/applications"
        state: directory
        mode: "0755"

    # Before the icon, which is the one task here that reaches the network: the entry is what
    # launches the game, and a host that cannot fetch box art still gets that.
    - name: Install the World of Warcraft desktop entry
      ansible.builtin.template:
        src: world-of-warcraft.desktop.j2
        dest: "{{ games_user_home }}/.local/share/applications/{{ games_lutris_wow_slug }}.desktop"
        mode: "0644"

    - name: Create the user icon theme directory
      ansible.builtin.file:
        path: "{{ games_lutris_wow_icon_dir }}"
        state: directory
        mode: "0755"

    # The icon Lutris would fetch for the slug, at the size and name it uses, placed where
    # the host's launcher looks rather than in the sandbox's own data directory. Fetched
    # once: get_url leaves an existing destination alone.
    #
    # Not fatal. lutris.net is the only thing the tag needs off this host, and the entry it
    # decorates is already installed; a failure leaves the launcher's generic icon.
    - name: Install the World of Warcraft icon
      ansible.builtin.get_url:
        url: "https://lutris.net/games/icon/{{ games_lutris_wow_slug }}.png"
        dest: "{{ games_lutris_wow_icon_dir }}/lutris_{{ games_lutris_wow_slug }}.png"
        mode: "0644"
      register: games_lutris_wow_icon
      failed_when: false
      notify: Mark the user hicolor icon cache stale

    # get_url reports the destination on every outcome that wrote or kept one, so its absence
    # is the download having failed.
    - name: Warn when the World of Warcraft icon could not be fetched
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ games_lutris_wow_icon.msg | default('the icon could not be fetched') }}.
          The desktop entry is installed and shows a generic icon until a re-run fetches it.
      when: games_lutris_wow_icon.dest is not defined
