---
- name: Validate games_user
  ansible.builtin.assert:
    that:
      - games_user != "root"
    fail_msg: >-
      games_user resolved to "root", which would write user-scoped state to /root.
      Set primary_user in the inventory (or games_user in host_vars) to the target
      account. If ansible was run as root and a stale fact cache is to blame, clear
      .ansible/fact_cache/.
    success_msg: 'games_user "{{ games_user }}" is valid'
  tags: always

# Site data, so no default: host_vars must set it. Asserted here because the first
# use is a flatpak override argument, whose error names neither role nor fix.
- name: Validate games_retroarch_library_dir
  ansible.builtin.assert:
    that:
      - games_retroarch_library_dir is defined
      - games_retroarch_library_dir | length > 0
    fail_msg: >-
      games_retroarch_library_dir is not set: it is where this host mounts the ROM library,
      which is site data with no default. Set it in host_vars/.
    success_msg: 'games_retroarch_library_dir "{{ games_retroarch_library_dir | default("") }}" is set'
  tags: always

# games_user_home and every path built from it index this.
- name: Look up games_user home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ games_user }}"
  tags: always

- name: Import apt tasks
  ansible.builtin.import_tasks: apt.yml
  tags: apt

# After apt.yml, which installs the daemon this configures.
- name: Configure GameMode
  ansible.builtin.import_tasks: gamemode.yml
  tags: gamemode

- name: Import flatpak tasks
  ansible.builtin.import_tasks: flatpak.yml
  tags: flatpak

# After flatpak.yml, whose flathub remote resolves the runtime.
- name: Install BedrockOnLinux
  ansible.builtin.import_tasks: bedrock.yml
  become: true
  become_user: "{{ games_user }}"
  tags: bedrock

- name: Configure Heroic Games Launcher
  ansible.builtin.import_tasks: heroic.yml
  become: true
  become_user: "{{ games_user }}"
  tags: heroic

- name: Configure Lutris
  ansible.builtin.import_tasks: lutris.yml
  become: true
  become_user: "{{ games_user }}"
  tags: lutris

- name: Configure RetroArch
  ansible.builtin.import_tasks: retroarch.yml
  become: true
  become_user: "{{ games_user }}"
  tags: retroarch

# No become: retroid.yml installs to the controller and takes root there.
- name: Install the Retroid handheld sync command
  ansible.builtin.import_tasks: retroid.yml
  when: games_install_retroid_sync | bool
  tags: retroid
