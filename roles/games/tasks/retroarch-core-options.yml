---
# Included once per core by retroarch.yml.
#
# Required vars:
#   games_retroarch_core (dict): {key: <buildbot core name>, value: {<option>: <value>}}
#
# The .opt file is named for the core's runtime name, resolved through
# games_retroarch_core_library_names. lineinfile rather than a template because RetroArch
# writes every option a core exposes here, not just non-defaults.
- name: Enforce the core options for {{ games_retroarch_core.key }}
  ansible.builtin.lineinfile:
    path: "{{ games_retroarch_core_config_dir }}/{{ library_name }}/{{ library_name }}.opt"
    regexp: "^{{ item.key }} = "
    line: '{{ item.key }} = "{{ item.value }}"'
    create: true
    mode: "0644"
  loop: "{{ games_retroarch_core.value | dict2items | sort(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    library_name: "{{ games_retroarch_core_library_names[games_retroarch_core.key] }}"
