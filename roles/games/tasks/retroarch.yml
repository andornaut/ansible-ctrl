---
# RetroArch is a flatpak, so cores, BIOS, settings, overrides and playlists all live
# under its per-user tree. The shared thumbnail cache is the one exception; the
# library is otherwise only read.

# config_save_on_exit means RetroArch undoes anything converged while it runs, so it
# must be closed. First, being the one precondition the operator can fix on the spot.
# --exact matches the process name: -f would match the ansible-playbook running this.
- name: Check whether RetroArch is running
  ansible.builtin.command:
    argv:
      - pgrep
      - --exact
      - --euid
      - "{{ games_user }}"
      - retroarch
  register: games_retroarch_pgrep
  changed_when: false
  # pgrep exits 1 when nothing matches, which is the case this asks for.
  failed_when: false
  # The assert below reads rc, which a skipped probe never sets.
  check_mode: false

- name: Validate that RetroArch is not running
  ansible.builtin.assert:
    that:
      - games_retroarch_pgrep.rc != 0
    fail_msg: >-
      RetroArch is running as {{ games_user }}. It rewrites retroarch.cfg and its core options when
      it exits (config_save_on_exit), so everything this role converges would be undone the moment
      you close it. Close RetroArch and run again.
    success_msg: RetroArch is not running

# The udev input driver reads /dev/input/event* directly and the distro rules ACL
# only the joysticks, so without this the menu pointer and lightgun binds are dead.
# It grants the seat's session read access to raw keystrokes; see the README.
# become_user: root, main.yml importing this file as games_user.
- name: Grant the desktop session read access to the mouse and keyboard
  ansible.builtin.copy:
    src: 70-ansible-role-games-retroarch-input.rules
    dest: /etc/udev/rules.d/70-ansible-role-games-retroarch-input.rules
    mode: "0644"
  become: true
  become_user: root
  notify:
    - Reload the udev rules
    - Apply the udev rules to the input devices

# An unmounted library is an empty directory, which the tasks below would sync and
# generate nothing from while reporting success.
- name: Check that the ROM library is mounted
  ansible.builtin.stat:
    path: "{{ games_retroarch_bios_dir }}"
  register: games_retroarch_bios_stat

- name: Validate the ROM library
  ansible.builtin.assert:
    that:
      - games_retroarch_bios_stat.stat.isdir | default(false)
    fail_msg: >-
      {{ games_retroarch_bios_dir }} is not a directory: the ROM library at
      {{ games_retroarch_library_dir }} is missing or its mount is down. Nothing was
      changed.
    success_msg: "ROM library found at {{ games_retroarch_library_dir }}"

# Part of the library, like _BIOS: the role points RetroArch at it and never creates
# it, so a missing cache means the library is not set up.
- name: Check the shared thumbnail cache
  ansible.builtin.stat:
    path: "{{ games_retroarch_thumbnails_dir }}"
  register: games_retroarch_thumbnails_stat

# Derived from the mount's writability rather than from naming a host, this being a
# public repo. A fact, not a var: as a var it would default to false before the stat
# above, silently stopping the writable host from filling the cache.
- name: Record whether this host can write the shared thumbnail cache
  ansible.builtin.set_fact:
    games_retroarch_thumbnails_writable: >-
      {{ games_retroarch_thumbnails_stat.stat.writeable | default(false) | bool }}

# RetroArch cannot create it, the flatpak grant making the library read-only around
# it, so every thumbnail download would fail to save with no error. Checked on every
# host, since all of them read the cache.
- name: Validate the shared thumbnail cache
  ansible.builtin.assert:
    that:
      - games_retroarch_thumbnails_stat.stat.isdir | default(false)
    fail_msg: >-
      {{ games_retroarch_thumbnails_dir }} is not a directory. It is the shared box art cache, and
      the library owns it the way it owns _BIOS: the role points RetroArch at it and never creates
      it. Create it in the library, group it with the library, and set the setgid bit (2755).
    success_msg: >-
      Shared thumbnail cache found at {{ games_retroarch_thumbnails_dir }}
      ({{ games_retroarch_thumbnails_writable | ternary('writable: this host fills it',
      'read-only: this host reads it') }})

# Bindings are physical device indices, so a wrong pad is a different button, not a
# near-miss. First of the host-data asserts, because games_retroarch_settings folds
# the pad's bindings in and an unknown pad would fail there with less to go on.
- name: Validate games_retroarch_controller
  ansible.builtin.assert:
    that:
      - games_retroarch_controller | length > 0
      - games_retroarch_controller in games_retroarch_controllers
    fail_msg: >-
      games_retroarch_controller is "{{ games_retroarch_controller | default('') }}", which is not
      one of {{ games_retroarch_controllers.keys() | list }}. It names the gamepad this host has,
      whose physical button and axis indices the rewind bindings are built from. Set it in
      host_vars/, and add the pad to games_retroarch_controllers if it is not there yet.
    success_msg: 'games_retroarch_controller "{{ games_retroarch_controller }}" is known'

# RetroArch derives the audio resampling ratio from this, so a wrong value mistimes
# every core, heard as drift rather than seen as tearing. | float, not | length: the
# value is naturally unquoted, and | float also yields 0.0 for anything non-numeric.
- name: Validate the display refresh rate
  ansible.builtin.assert:
    that:
      - games_retroarch_video_refresh_rate | float > 0
    fail_msg: >-
      games_retroarch_video_refresh_rate is "{{ games_retroarch_video_refresh_rate | default('') }}",
      which is not a refresh rate. It is this host's panel refresh rate, which the role has no way to
      know, and RetroArch's 60.0 default mistimes every core on a panel that is not 60Hz. Set it in
      host_vars/ to the panel's actual mode (RetroArch's own "Estimate Screen Refresh Rate" reports
      it).
    success_msg: 'games_retroarch_video_refresh_rate "{{ games_retroarch_video_refresh_rate }}" is set'

# vsync, a swap interval above 1, BFI and vrr_runloop_enable are four ways to sync
# video to audio, and stacking them paces worse than any one. The symptom is audio
# drift with nothing visibly wrong, so fail rather than converge. Only a host
# overriding one via games_retroarch_extra_settings can trip it, and the last
# condition rejects the same conflict reached per-core.
#
# Coerced before comparing, YAML delivering both "1" and 1. No default(): all three
# are pinned, and combine() can override a key but never remove one.
- name: Validate the VRR sync preconditions
  ansible.builtin.assert:
    that:
      - games_retroarch_settings.video_vsync | bool
      - games_retroarch_settings.video_swap_interval | string in ["0", "1"]
      - games_retroarch_settings.video_black_frame_insertion | string == "0"
      - games_retroarch_core_overrides.values() | map("list") | flatten
        | intersect(["video_vsync", "video_swap_interval", "video_black_frame_insertion"])
        | length == 0
    fail_msg: >-
      This host sets vrr_runloop_enable, but one of its preconditions is overridden: video_vsync on,
      video_swap_interval 1 (or 0 for auto) and video_black_frame_insertion 0 all have to hold in
      the global config, and no per-core override may set any of the three at all. The failed
      assertion above names the one that does not. Drop the override (from
      games_retroarch_extra_settings or games_retroarch_core_overrides), or turn vrr_runloop_enable
      off and sync that way instead.
    success_msg: vrr_runloop_enable is set and its preconditions hold
  when: games_retroarch_settings.vrr_runloop_enable | default("false") | bool

- name: Create the directories this role writes to
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ games_retroarch_config_dir }}"
    - "{{ games_retroarch_cache_dir }}"
    - "{{ games_retroarch_core_archives_dir }}"
    - "{{ games_retroarch_cores_dir }}"
    - "{{ games_retroarch_playlists_dir }}"
    - "{{ games_retroarch_system_dir }}"

# Before fetching: feeds both the prune below and the install of a core missing even
# though its archive did not move.
- name: Find the installed libretro cores
  ansible.builtin.find:
    paths: "{{ games_retroarch_cores_dir }}"
    patterns: "*_libretro.so"
  register: games_retroarch_installed_cores

# The buildbot ships nightlies only, so there is nothing to pin and every run fetches
# the current build, which also repairs a core the flatpak runtime stopped loading.
# get_url rather than unarchive's own download: the buildbot always answers 200, so
# the bytes come over either way, but get_url reports changed only when they differ.
- name: Download the libretro cores
  ansible.builtin.get_url:
    url: "{{ games_retroarch_buildbot_url }}/{{ item }}_libretro.so.zip"
    dest: "{{ games_retroarch_core_archives_dir }}/{{ item }}_libretro.so.zip"
    force: true
    mode: "0644"
  loop: "{{ games_retroarch_cores }}"
  register: games_retroarch_core_archives

# Only when the archive moved or the core is missing, which covers a hand-deleted
# core and a first run; unconditional, it would rewrite and report every core.
- name: Install the libretro cores
  ansible.builtin.unarchive:
    src: "{{ item.dest }}"
    dest: "{{ games_retroarch_cores_dir }}"
    remote_src: true
  loop: "{{ games_retroarch_core_archives.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.changed or item.item not in games_retroarch_installed_core_names

# The directory is owned, not just added to: a core no system runs would linger in
# the Load Core list. Removing one costs only the next fetch.
- name: Remove libretro cores that no system is associated with
  ansible.builtin.file:
    path: "{{ games_retroarch_cores_dir }}/{{ item }}_libretro.so"
    state: absent
  loop: "{{ games_retroarch_dropped_cores }}"

# The role's own directory, so nothing else would ever clean it.
- name: Remove the archives of the libretro cores that were dropped
  ansible.builtin.file:
    path: "{{ games_retroarch_core_archives_dir }}/{{ item }}_libretro.so.zip"
    state: absent
  loop: "{{ games_retroarch_dropped_cores }}"

# rsync, not copy: copy checksums every file, reading the whole set back across the
# network mount. No --delete: cores keep their own state here, and it is not in the
# library.
- name: Copy the BIOS set into the RetroArch system directory
  ansible.builtin.command:
    argv:
      - rsync
      - --recursive
      - --times
      - --itemize-changes
      - --chmod=D755,F644
      - "{{ games_retroarch_bios_dir }}/"
      - "{{ games_retroarch_system_dir }}/"
  register: games_retroarch_bios_sync
  changed_when: games_retroarch_bios_sync.stdout | length > 0

# Per key rather than a templated retroarch.cfg, which holds thousands of keys the
# role has no opinion on: this leaves in-app changes alone and still snaps the
# managed keys back. create: true for a host where RetroArch never started.
- name: Enforce the RetroArch settings
  ansible.builtin.lineinfile:
    path: "{{ games_retroarch_config_dir }}/retroarch.cfg"
    regexp: '^{{ item.key }} = '
    line: '{{ item.key }} = "{{ item.value }}"'
    create: true
    mode: "0644"
  loop: "{{ games_retroarch_settings | dict2items | sort(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}"

# A core's override and options live under config/<library_name>/, where library_name
# is what the built core reports at runtime: a third name matching neither the
# buildbot name this role keys by nor the .info corename, and a property of the
# build, so one written here would land where RetroArch never looks. Ask each core.
#
# Inside the sandbox, where RetroArch loads them too, a core sometimes needing a
# library only the runtime carries. This is the load check as well: a core that will
# not load after the refetch above is a broken build.
- name: Ask the installed cores what they are
  ansible.builtin.command:
    argv:
      - flatpak
      - run
      - --command=python3
      - "{{ games_retroarch_app_id }}"
      # On stdin rather than ansible.builtin.script, which runs what it transfers
      # directly; this has to go through flatpak. sys.argv[1:] is unaffected.
      - "-"
      - "{{ games_retroarch_cores_dir }}"
    stdin: "{{ lookup('ansible.builtin.file', 'retroarch-probe-cores.py') }}"
  register: games_retroarch_core_probe
  changed_when: false
  # Read-only, and needed under --check: everything below resolves its configuration
  # directory from the answer, and a skipped probe hands them an empty one.
  check_mode: false

# Against the systems table, not the cores that answered: an override for a core no
# system runs is a dead entry either way.
- name: Validate the per-core configuration keys
  ansible.builtin.assert:
    that:
      - games_retroarch_configured_cores | difference(games_retroarch_cores) | length == 0
    fail_msg: >-
      {{ games_retroarch_configured_cores | difference(games_retroarch_cores) }} is configured in
      games_retroarch_core_overrides or games_retroarch_core_options but is not a core any system in
      games_retroarch_systems runs, so nothing would ever load it. Both dicts are keyed by the
      buildbot core name, as games_retroarch_systems is. This host runs {{ games_retroarch_cores }}.
    success_msg: Every configured core is one a system runs

# One directory per core, holding both its .cfg override and its .opt options, which
# are configured independently: hence the union.
- name: Create the per-core configuration directories
  ansible.builtin.file:
    path: "{{ games_retroarch_core_config_dir }}/{{ games_retroarch_core_library_names[item] }}"
    state: directory
    mode: "0755"
  loop: "{{ games_retroarch_configured_cores | sort }}"

# Owned outright, unlike retroarch.cfg: an override holds only the keys that differ
# from the global config.
- name: Write the per-core overrides
  ansible.builtin.template:
    src: retroarch-core-override.cfg.j2
    dest: "{{ games_retroarch_core_config_dir }}/{{ library_name }}/{{ library_name }}.cfg"
    mode: "0644"
  loop: "{{ games_retroarch_core_overrides | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    library_name: "{{ games_retroarch_core_library_names[item.key] }}"
    games_retroarch_core_override: "{{ item.value }}"

# A dropped core, or one whose build renamed itself, would otherwise keep its last
# override forever. `contains` matches this role's ansible_managed header only, so an
# in-app override is left alone, and needs read_whole_file: find otherwise anchors it
# at line start and matches nothing.
- name: Find the core overrides this role has written
  ansible.builtin.find:
    paths: "{{ games_retroarch_core_config_dir }}"
    patterns: "*.cfg"
    recurse: true
    contains: Ansible managed
    read_whole_file: true
  register: games_retroarch_written_overrides

- name: Remove the core overrides of cores that are no longer overridden
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ games_retroarch_written_overrides.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: >-
    item.path | basename | regex_replace('\.cfg$', '')
    not in games_retroarch_core_overrides.keys() | map('extract', games_retroarch_core_library_names) | list

# A dict of dicts (core -> option -> value), so a loop over a loop, which one task
# cannot express. subelements() flattens dicts of lists, not dicts of dicts.
- name: Enforce the RetroArch core options
  ansible.builtin.include_tasks: retroarch-core-options.yml
  loop: "{{ games_retroarch_core_options | dict2items }}"
  loop_control:
    loop_var: games_retroarch_core
    label: "{{ games_retroarch_core.key }}"

# Pruning an override or dropping a core leaves its directory empty. Only empty ones
# go: one RetroArch still keeps state in is not the role's to remove. Last, after the
# overrides and options are written, or it would delete the directory of a core with
# options but no override. GNU find, because ansible.builtin.find cannot test
# emptiness: nlink is 2 for an empty directory and one holding only files alike.
- name: Remove the per-core configuration directories that are now empty
  ansible.builtin.command:
    argv:
      - find
      - "{{ games_retroarch_core_config_dir }}"
      - -mindepth
      - "1"
      - -maxdepth
      - "1"
      - -type
      - d
      - -empty
      - -print
      - -delete
  register: games_retroarch_empty_core_dirs
  changed_when: games_retroarch_empty_core_dirs.stdout | length > 0

# ansible.builtin.script below transfers only the generator, so the map it reads has
# to be copied over first, into RetroArch's config tree with everything else it reads.
- name: Copy the arcade romset name map for the playlist generator
  ansible.builtin.copy:
    src: fbneo-arcade-names.json
    dest: "{{ games_retroarch_arcade_names_dest }}"
    mode: "0644"

# script, not copy + command: it transfers, runs and cleans up, so the role needs no
# temp directory, and the config goes in the environment for the same reason. One
# line per playlist rewritten, so stdout is the change report; skips go to stderr.
- name: Generate the RetroArch playlists
  ansible.builtin.script:
    cmd: retroarch-generate-playlists.py
  environment:
    RETROARCH_GENERATOR_CONFIG: "{{ games_retroarch_generator_config | to_json }}"
  register: games_retroarch_playlists
  changed_when: games_retroarch_playlists.stdout | length > 0

# Ansible does not print stderr for a successful task, and a skipped system (no
# directory in the library, or nothing matching an extension) is worth surfacing.
- name: Report the systems the playlist generator skipped
  ansible.builtin.debug:
    msg: "{{ games_retroarch_playlists.stderr_lines }}"
  when: games_retroarch_playlists.stderr | length > 0

# After the playlists it reads, so a game gets box art in the run that adds it.
# RetroArch's own downloader is a poor fallback: it queries by filename, and library
# and repository disagree on where a leading article goes. Only on the host whose
# mount is writable; the rest read the shared cache. One line per thumbnail written
# on stdout; games left without box art go to stderr.
- name: Fetch the missing RetroArch thumbnails
  ansible.builtin.script:
    cmd: retroarch-fetch-thumbnails.py
  environment:
    RETROARCH_THUMBNAILS_CONFIG: "{{ games_retroarch_thumbnails_config | to_json }}"
  register: games_retroarch_thumbnails
  changed_when: games_retroarch_thumbnails.stdout | length > 0
  when: games_retroarch_thumbnails_writable | bool

# Surfaced from stderr, which ansible does not print for a successful task: the list
# asks a human to rename the game the No-Intro way or supply the art. The script
# fails the play only when the repository was unreachable.
- name: Report the games with no box art
  ansible.builtin.debug:
    msg: "{{ games_retroarch_thumbnails.stderr_lines }}"
  when:
    - games_retroarch_thumbnails_writable | bool
    - games_retroarch_thumbnails.stderr | length > 0
