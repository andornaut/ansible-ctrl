---
# The handheld is a USB peripheral of the controller, not an inventory host, so the
# command is installed on the controller rather than on the host being converged.

# One file on the controller, so two hosts with the flag set would overwrite each
# other every run. run_once would not catch it: it tests the play's first host only.
- name: Assert only one host installs syncretroid
  ansible.builtin.assert:
    that:
      - installers | length == 1
    fail_msg: >-
      games_install_retroid_sync is on for {{ installers | join(", ") }}. It installs a single
      command on the controller, so exactly one host may enable it.
    success_msg: syncretroid is installed from one host
  vars:
    installers: >-
      {{ ansible_play_hosts | map('extract', hostvars)
         | selectattr('games_install_retroid_sync', 'defined')
         | selectattr('games_install_retroid_sync')
         | map(attribute='inventory_hostname') | list }}

- name: Validate the retroid sync inputs
  ansible.builtin.assert:
    that:
      - games_retroid_library_dir | length > 0
      - games_retroid_serial | length > 0
    fail_msg: >-
      games_install_retroid_sync is on, so games_retroid_library_dir (where the controller mounts
      the ROM library) and games_retroid_serial (from `adb devices`) must both be set in
      host_vars/. Both are site data with no default.
    success_msg: syncretroid inputs are set

# A wrapper, not a copy: the script runs from the role directory and reads the vars and
# profile beside it, so edits to any apply without re-running this. It bakes in the library
# path, adb serial and checkout location, which is why the command takes no arguments.
- name: Install syncretroid on the controller
  ansible.builtin.template:
    src: syncretroid.j2
    dest: /usr/local/bin/syncretroid
    mode: "0755"
    validate: sh -n %s
  become: true
  delegate_to: localhost
