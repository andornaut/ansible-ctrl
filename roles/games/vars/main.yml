---
# Not operator knobs. Role vars outrank host_vars, so the derived values below cannot
# desync from defaults/main.yml and the canonical data cannot be overridden per host.

# The optional applications, each keyed to the flag it answers to. The IDs sit here rather than
# in host_vars, so a host names a decision and the role keeps the list.
games_flatpak_optional:
  org.DolphinEmu.dolphin-emu: "{{ games_install_dolphin | bool }}"
  net.davidotek.pupgui2: "{{ games_install_protonup_qt | bool }}"

# Every application flatpak.yml installs: the common set, plus the optional ones turned on.
games_flatpak_apps: >-
  {{ games_flatpak_common
     + (games_flatpak_optional | dict2items | selectattr('value')
        | map(attribute='key') | list) }}

# The optional applications this host has turned off, which flatpak.yml uninstalls. A flag is
# two-way because an install list removes nothing by no longer naming an application.
games_flatpak_removed_apps: >-
  {{ games_flatpak_optional | dict2items | rejectattr('value')
     | map(attribute='key') | list }}

# From the getent in tasks/main.yml. The home builds absolute paths; the uid locates
# /run/user/<uid> for Heroic's token-refresh timer.
games_user_home: "{{ ansible_facts['getent_passwd'][games_user][4] }}"
games_user_uid: "{{ ansible_facts['getent_passwd'][games_user][1] }}"

# tasks/heroic.yml holds the install and wine-prefix paths in config.json to
# games_heroic_dir and the flatpak grant.
games_heroic_app_id: com.heroicgameslauncher.hgl
games_heroic_config_file: "{{ games_user_home }}/.var/app/{{ games_heroic_app_id }}/config/heroic/config.json"

# Lutris prefers config/lutris and falls back to data/lutris, which a fresh flatpak
# install has; tasks/lutris.yml mirrors that to find system.yml.
games_lutris_app_id: net.lutris.Lutris
games_lutris_config_dir: "{{ games_user_home }}/.var/app/{{ games_lutris_app_id }}/config/lutris"
games_lutris_data_dir: "{{ games_user_home }}/.var/app/{{ games_lutris_app_id }}/data/lutris"

# The launcher the World of Warcraft desktop entry runs in place of `flatpak run`, so a prefix an
# earlier session left running is torn down first. Lutris's own entries do not go through it.
# See files/lutris-launch-game.py.
games_lutris_launcher_path: /usr/local/bin/lutris-launch-game

# World of Warcraft, registered by tasks/lutris.yml as its own Lutris game where Battle.net's
# prefix holds it. The slug is lutris.net's, which is where the icon comes from.
games_lutris_wow_slug: world-of-warcraft
games_lutris_wow_source_slug: battlenet

# Where Lutris puts Battle.net's prefix when its default install path is the one enforced above.
# A guess, and not the authority: tasks/lutris.yml prefers the prefix Battle.net's own Lutris
# configuration names and falls back to this, the client being free to install anywhere.
games_lutris_wow_prefix_derived: "{{ games_lutris_dir }}/{{ games_lutris_wow_source_slug }}"

# The per-user tree holding cores, BIOS, playlists, saves, states and retroarch.cfg.
# Only the thumbnail cache lives outside it.
games_retroarch_app_id: org.libretro.RetroArch
games_retroarch_config_dir: "{{ games_user_home }}/.var/app/{{ games_retroarch_app_id }}/config/retroarch"

# Named once because the tasks, the playlist generator and the *_directory keys of
# games_retroarch_required_settings all have to point at the same place.
games_retroarch_cache_dir: "{{ games_retroarch_config_dir }}/cache"
games_retroarch_core_config_dir: "{{ games_retroarch_config_dir }}/config"
games_retroarch_cores_dir: "{{ games_retroarch_config_dir }}/cores"
games_retroarch_playlists_dir: "{{ games_retroarch_config_dir }}/playlists"
games_retroarch_system_dir: "{{ games_retroarch_config_dir }}/system"

# The role's working state, not RetroArch's. Kept rather than fetched to a temp dir,
# so get_url can compare against the installed build and report a real change.
games_retroarch_core_archives_dir: "{{ games_user_home }}/.cache/libretro-cores"

# Core metadata (<core>_libretro.info): display_name and supported_extensions for the
# playlist generator. Where a --user flatpak exposes the sandbox's copy on the host.
games_retroarch_info_dir: >-
  {{ games_user_home }}/.local/share/flatpak/app/{{ games_retroarch_app_id
  }}/current/active/files/share/libretro/info

# The buildbot names directories after the kernel architecture, not the Debian one.
games_retroarch_arch: "{{ ansible_facts['architecture'] }}"

# The cores the systems table calls for, and the list the prune keeps. Sorted, so the
# install loop reports in a stable order.
games_retroarch_cores: "{{ games_retroarch_systems.values() | map(attribute='core') | unique | sort }}"

# The directories to create under config/, once resolved through
# games_retroarch_core_library_names.
games_retroarch_configured_cores: >-
  {{ (games_retroarch_core_overrides.keys() | list + games_retroarch_core_options.keys() | list)
     | unique | sort }}

# What is on disk, and of that what no system runs. From the find in
# tasks/retroarch.yml, which runs before anything is fetched.
games_retroarch_installed_core_names: >-
  {{ games_retroarch_installed_cores.files | map(attribute='path') | map('basename')
     | map('regex_replace', '_libretro\.so$', '') | list }}
games_retroarch_dropped_cores: "{{ games_retroarch_installed_core_names | difference(games_retroarch_cores) }}"

# files/retroarch-probe-cores.py output: buildbot name -> {library_name,
# valid_extensions, block_extract}. Properties of the build, absent from the .info, so
# hosts on different nightlies differ. Undefined until tasks/retroarch.yml has run.
games_retroarch_cores_probed: "{{ games_retroarch_core_probe.stdout | from_json }}"

# What the tasks writing config/<library_name>/ need.
games_retroarch_core_library_names: >-
  {{ dict(games_retroarch_cores_probed.keys()
          | zip(games_retroarch_cores_probed.values() | map(attribute='library_name'))) }}

# The enforced retroarch.cfg keys, in ascending specificity: the role's set, this host's
# hardware, what its mount allows, then per-host additions. Refresh rate and pad are
# separate variables because the role asserts both. Only the host with a writable mount
# fills the thumbnail cache; on-demand is on by default, so the rest would retry an
# unsaveable download on every scroll.
games_retroarch_settings: >-
  {{ games_retroarch_required_settings
     | combine({"video_refresh_rate": games_retroarch_video_refresh_rate})
     | combine(games_retroarch_controllers[games_retroarch_controller])
     | combine({"network_on_demand_thumbnails":
                games_retroarch_thumbnails_writable | bool | ternary('true', 'false')})
     | combine(games_retroarch_extra_settings) }}

# Where tasks/retroarch.yml copies files/fbneo-arcade-names.json, ansible.builtin.script
# transferring only the generator itself.
games_retroarch_arcade_names_dest: "{{ games_retroarch_config_dir }}/fbneo-arcade-names.json"

# Input to files/retroarch-generate-playlists.py, in the environment because it carries
# the whole systems table. Handed what the cores reported inside the sandbox: a core
# needing a runtime library will not load on the host.
games_retroarch_generator_config:
  library_dir: "{{ games_retroarch_library_dir }}"
  playlist_dir: "{{ games_retroarch_playlists_dir }}"
  cores_dir: "{{ games_retroarch_cores_dir }}"
  info_dir: "{{ games_retroarch_info_dir }}"
  cores: "{{ games_retroarch_cores_probed }}"
  systems: "{{ games_retroarch_systems }}"
  # Romset -> full title, so arcade playlists show real names.
  arcade_names_path: "{{ games_retroarch_arcade_names_dest }}"
  arcade_name_cores: "{{ games_retroarch_arcade_name_cores }}"

# ---------------------------------------------------------------------------------------------
# Canonical RetroArch data: systems table, enforced retroarch.cfg keys, per-core overrides
# and options. Not overridable per host, files/retroid/syncretroid.py reading this file
# directly and resolving no inventory. Diverge through defaults/.
# ---------------------------------------------------------------------------------------------

# ROM library subdirectory -> the core that runs it and the launchable extensions. Cores
# are the x64 column of
# https://github.com/andornaut/til/blob/main/docs/retro-games.md#cores.
#
# Multi-disc games need no extension: the discs sit in a dot-prefixed directory the
# generator skips and the .m3u beside it is the entry. 3DO and GameCube excepted, where the
# generator points at disc 1 under the directory's name.
#
# Optional "game_cores" maps a playlist label to the core one title needs -- a core, not the
# settings in games_retroarch_core_overrides below.
games_retroarch_systems:
  # FinalBurn Neo's non-Neo-Geo romsets, in one directory: an arcade set spans
  # manufacturers, so there is no "Manufacturer - System Name" to name it after. The one
  # case where displayed and art names differ -- the repository publishes only "FBNeo -
  # Arcade Games", so dropping thumbnail_db 404s the art.
  Arcade:
    core: fbneo
    extensions: [zip]
    thumbnail_db: FBNeo - Arcade Games
  Atari - 2600:
    core: stella
    extensions: [zip]
  Atari - 7800:
    core: prosystem
    extensions: [a78]
  Atari - Jaguar:
    core: virtualjaguar
    extensions: [rom]
  Atari - Lynx:
    core: mednafen_lynx
    extensions: [lnx, lyx]
  # Beetle PCE, not Fast: Fast is deliberately low-accuracy and has no SuperGrafx.
  NEC - PC Engine - TurboGrafx 16:
    core: mednafen_pce
    extensions: [zip]
  NEC - PC Engine CD - TurboGrafx-CD:
    core: mednafen_pce
    extensions: [chd, m3u]
  Nintendo - Game Boy:
    core: gambatte
    extensions: [zip]
  Nintendo - Game Boy Advance:
    core: mgba
    extensions: [zip]
  Nintendo - Game Boy Color:
    core: gambatte
    extensions: [zip]
  # No zip, unlike the other cartridge systems: Dolphin sets block_extract, so
  # RetroArch hands it the archive unopened and it segfaults.
  Nintendo - GameCube:
    core: dolphin
    # .rvz only: an .iso is converted on intake, and an unconverted one should stay
    # out of the playlist rather than be carried at twice the size.
    extensions: [rvz]
  Nintendo - Nintendo 64:
    core: mupen64plus_next
    extensions: [zip]
  Nintendo - Nintendo DS:
    core: melondsds
    extensions: [nds]
  Nintendo - Nintendo Entertainment System:
    core: mesen
    extensions: [zip]
  # snes9x, not bsnes: the handheld sharing this library cannot afford bsnes and every
  # device runs the same core. Costs timing edge cases, keeps rewind and MSU-1.
  Nintendo - Super Nintendo Entertainment System:
    core: snes9x
    extensions: [zip]
  # Retro8 reimplements the PICO-8 runtime, so no paid binary is needed. Cartridges are
  # PNGs with the game steganographed in, hence the compound suffix, matched whole so the
  # label keeps no ".p8" tail. Bare "png" would catch any cover art dropped here.
  Pico-8:
    core: retro8
    extensions: [p8.png]
  Sega - 32X:
    core: picodrive
    extensions: [zip]
  Sega - Dreamcast:
    core: flycast
    extensions: [chd, m3u]
  Sega - Game Gear:
    core: genesis_plus_gx
    extensions: [zip]
  Sega - Master System - Mark III:
    core: genesis_plus_gx
    extensions: [zip]
  Sega - Mega Drive - Genesis:
    core: genesis_plus_gx
    extensions: [zip]
  Sega - Mega-CD - Sega CD:
    core: genesis_plus_gx
    extensions: [chd, m3u]
    game_cores:
      # Needs the 32X, which genesis_plus_gx does not emulate and picodrive does.
      # Catalogued as Sega CD, so it stays here and its art resolves here; the 32X
      # thumbnail repository has no Night Trap.
      Night Trap (USA) (Sega CD 32X) (RE-1): picodrive
  Sega - Saturn:
    core: mednafen_saturn
    extensions: [chd, m3u]
  # Romsets are .zip named by short arcade ID (mslug.zip). fbneo sets block_extract and
  # opens the archive itself, allowed because it lists .zip among its extensions. BIOS:
  # neogeo.zip, in the set's fbneo/ subdir.
  SNK - Neo Geo:
    core: fbneo
    extensions: [zip]
  # No m3u, unlike the other disc systems: all single-disc, and neocd does not list m3u,
  # so the generator would reject it. Needs the Neo Geo CD BIOS, absent from the cartridge
  # fbneo set; see the README.
  SNK - Neo Geo CD:
    core: neocd
    extensions: [chd]
  # Beetle NeoPop drives mono and Color alike, and the library carries only Color.
  SNK - Neo Geo Pocket Color:
    core: mednafen_ngp
    extensions: [zip]
  Sony - PlayStation:
    core: mednafen_psx_hw
    extensions: [chd, m3u]
  Sony - PlayStation 2:
    core: pcsx2
    extensions: [chd, m3u]
  # No m3u: ppsspp sets need_fullpath, so it receives the .m3u path itself and its loader
  # knows only elf|iso|cso|prx|pbp|chd. Adding it would pass the generator's check and fail
  # at launch. Multi-disc is one root image per disc; a disc-swap UMD title is skipped.
  Sony - PlayStation Portable:
    core: ppsspp
    # .chd, about three-quarters the size of the .iso it is made from.
    extensions: [chd]
  The 3DO Company - 3DO:
    core: opera
    extensions: [chd]

# Cores whose romsets are named by short MAME id; the generator labels these from
# files/fbneo-arcade-names.json instead of the filename. Regenerate the map with
# files/gen-fbneo-arcade-names.py.
games_retroarch_arcade_name_cores: [fbneo]

# The retroarch.cfg keys this role owns; every other key is left alone, so in-app
# changes persist. games_retroarch_extra_settings is merged over this.
games_retroarch_required_settings:
  # Per the til notes' driver table, less two: input udev rather than "x", which needs an
  # X11 context and these hosts run both sessions (hence the uaccess rule in
  # tasks/retroarch.yml), and audio pipewire rather than the pipewire-pulse shim.
  audio_driver: pipewire
  camera_driver: video4linux2
  input_driver: udev
  location_driver: "null"
  menu_driver: ozone
  microphone_driver: pipewire
  midi_driver: alsa
  record_driver: ffmpeg
  video_driver: glcore

  # A separate driver from the rest of input. udev pairs with the steam-devices rules
  # and RetroArch's autoconfig profiles, which is what binds a pad on plug-in.
  input_joypad_driver: udev
  input_autodetect_enable: "true"
  input_max_users: "8"

  # Silence the "not configured in port N" toast. A keyboard trips it every launch and
  # works anyway, through the built-in keyboard driver. Success toasts stay on.
  notification_show_autoconfig_fails: "false"

  # Lets a core pick its own driver, which the overrides below rely on. glcore stays the
  # global: vulkan would move PPSSPP and Dolphin onto their Vulkan backends, where their
  # libretro bugs live. slang shaders work on both.
  driver_switch_enable: "true"

  # RetroArch defaults to a window, where the compositor owns frame pacing. Borderless
  # rather than an exclusive mode switch, Wayland having no exclusive fullscreen.
  video_fullscreen: "true"
  video_windowed_fullscreen: "true"

  # A no-op for the hardware-rendered cores; for the software ones it buys speed by
  # breaking frame pacing and audio sync. Already the default, pinned so it stays.
  video_threaded: "false"

  # Keeps core options per core, where games_retroarch_core_options writes them. The
  # default, but flipping it moves the whole scheme to one shared file, silently.
  global_core_options: "false"

  # The built-in viewer claims every .png ahead of the core the playlist asks for,
  # which for a PICO-8 cartridge shows the label instead of running the game.
  builtin_imageviewer_enable: "false"

  # Local, except the thumbnail cache: the rest is written on every launch and the library
  # is read-only on the hosts mounting it. The cache directory stops cores littering content
  # directories with temp files on a crash.
  cache_directory: "{{ games_retroarch_cache_dir }}"
  playlist_directory: "{{ games_retroarch_playlists_dir }}"
  savefile_directory: "{{ games_retroarch_config_dir }}/saves"
  savestate_directory: "{{ games_retroarch_config_dir }}/states"
  system_directory: "{{ games_retroarch_system_dir }}"
  thumbnails_directory: "{{ games_retroarch_thumbnails_dir }}"
  # Where the in-app browser opens, so content with no playlist entry is reachable.
  rgui_browser_directory: "{{ games_retroarch_library_dir }}"

  # Refuse a core with missing firmware rather than boot a black screen. Off by
  # default, and this library leans on the BIOS set tasks/retroarch.yml copies in.
  check_firmware_before_loading: "true"

  # The keyboard bindings, which are the same on every host and never taken away; the
  # gamepad ones come from games_retroarch_controllers.
  rewind_enable: "true"
  input_rewind: "r"
  input_hold_fast_forward: "l"

  # The default 20MB is sized for a handheld, and the buffer is what decides how far
  # back you can go: it holds deltas, so a core with a big state fills it fast.
  rewind_buffer_size: "268435456"
  rewind_granularity: "1"

  # Each save takes the next slot, keeping the last 100, so a misfire clobbers
  # nothing. RetroArch defaults to a single overwriting slot.
  savestate_auto_index: "true"
  savestate_max_keep: "100"

  # Hides the 1-3 frames of lag the original hardware had, and the cheaper half of a
  # mutually exclusive pair: run-ahead re-runs every frame, this only on controller input.
  #
  # Off globally, on per core, unlike rewind: RetroArch allows it only where the .info
  # declares savestate_features = "deterministic". The qualifying cores:
  #
  #   grep -l 'savestate_features = "deterministic"' {{ games_retroarch_info_dir }}/*.info
  #
  # More than one frame is free until it exceeds a game's own internal lag, past which the
  # picture jitters.
  preemptive_frames_enable: "false"
  run_ahead_enabled: "false"
  run_ahead_frames: "1"

  # Double rather than triple buffering: one less frame queued, and these GPUs will
  # not miss a deadline on 2D consoles. Raise back to 3 if pacing hiccups.
  video_max_swapchain_images: "2"

  # The three preconditions of vrr_runloop_enable, which a VRR host turns on in host_vars.
  # Each already defaults to what VRR sync needs; pinned because they sit one click from the
  # VRR toggle and a conflict shows up as audio drift with nothing visibly wrong.
  # games_retroarch_extra_settings wins over this dict, so tasks/retroarch.yml asserts the
  # combination, allowing BFI instead on a fixed-refresh panel.
  video_vsync: "true"
  video_swap_interval: "1"
  video_black_frame_insertion: "0"

  # Keyboard: player 1, then hotkeys.
  input_player1_up: up
  input_player1_down: down
  input_player1_left: left
  input_player1_right: right
  input_player1_a: x
  input_player1_b: z
  input_player1_x: s
  input_player1_y: a
  input_player1_l: q
  input_player1_r: w
  input_player1_start: enter
  input_player1_select: rshift
  input_exit_emulator: escape
  input_fps_toggle: f3
  input_load_state: f4
  input_menu_toggle: f1
  input_pause_toggle: p
  input_reset: h
  input_save_state: f2
  input_screenshot: f8
  input_state_slot_decrease: f6
  input_state_slot_increase: f7
  input_toggle_fullscreen: f

  # Player 1 on the first pad, left stick as d-pad, menu on held Start (combo 4), so a
  # controller-only session never needs a keyboard.
  input_player1_joypad_index: "0"
  input_player1_analog_dpad_mode: "1"
  input_menu_toggle_gamepad_combo: "4"

  # Player 1 on the first mouse, lightgun on its buttons: left trigger, right
  # offscreen shot, as the lightgun games in this library expect.
  input_player1_mouse_index: "0"
  input_player1_gun_trigger_mbtn: "1"
  input_player1_gun_offscreen_shot_mbtn: "2"

  # Off by default: ozone hovers and clicks on the same events the lightgun binds read.
  # The pointer is raw evdev deltas, so the desktop cursor moves along under it, harmless
  # fullscreen. Needs the uaccess rule above.
  menu_mouse_enable: "true"

  # Trim the top-row tabs to what is wired up here; 0 hides the contentless cores.
  content_show_explore: "false"
  content_show_images: "false"
  content_show_netplay: "false"
  content_show_video: "false"
  content_show_contentless_cores: "0"

  # The boxart panel beside the playlist, off by default.
  menu_left_thumbnails: "1"

  # Stop at the ends of a list rather than wrapping around, which is the default.
  menu_navigation_wraparound_enable: "false"

  # Playlists are regenerated every run, so an in-app rename would not survive.
  playlist_entry_rename: "false"

# Per-core overrides, keyed by buildbot core name. RetroArch keeps the file under
# config/<library_name>/, which only the built core knows, so tasks/retroarch.yml resolves
# the directory per host.
#
# Every key is an exception to a global (README.md): rewind off where RetroArch would refuse
# it anyway, right-stick axes unbound where the stick is a camera and looking right would
# run the game at 3x, preemptive frames on for the deterministic cores, vulkan where
# wanted.
games_retroarch_core_overrides:
  # The libretro docs put "all games" on OpenGL at "graphical glitches and rendering
  # issues of varying severity"; Vulkan is the stable one, and the core's renderer follows
  # the frontend driver. Right stick is the camera.
  mednafen_psx_hw:
    input_hold_fast_forward_axis: "nul"
    input_rewind_axis: "nul"
    video_driver: vulkan
  # The C-stick, likewise. "basic" savestates, so no rewind; fast-forward is on
  # L3/R3 and the keyboard.
  dolphin:
    input_hold_fast_forward_axis: "nul"
    input_rewind_axis: "nul"
    rewind_enable: "false"
  # One stick on the pad, so the right stick stays bound. Renderer only.
  flycast:
    video_driver: vulkan
  # The one core that takes L3/R3 back, its games using the stick clicks. "basic"
  # savestates, so the keyboard is the only fast-forward.
  pcsx2:
    input_hold_fast_forward_axis: "nul"
    input_hold_fast_forward_btn: "nul"
    input_rewind_axis: "nul"
    input_rewind_btn: "nul"
    rewind_enable: "false"

  # Every core declaring "deterministic" savestates, less Beetle PSX HW and Beetle
  # Saturn, where re-running a frame per input change costs real framerate.
  fbneo:
    preemptive_frames_enable: "true"
  mednafen_pce:
    preemptive_frames_enable: "true"
  gambatte:
    preemptive_frames_enable: "true"
  genesis_plus_gx:
    preemptive_frames_enable: "true"
  mesen:
    preemptive_frames_enable: "true"
  mgba:
    preemptive_frames_enable: "true"
  picodrive:
    preemptive_frames_enable: "true"
  snes9x:
    preemptive_frames_enable: "true"
  stella:
    preemptive_frames_enable: "true"

  # ParaLLEl-RDP, selected in games_retroarch_core_options, is Vulkan-only, and the core
  # requests a Vulkan context only when rdp-plugin is "parallel", so the two go together.
  # An override rather than driver_switch_enable, which crashes this core mid-session
  # (mupen64plus-libretro-nx#370).
  mupen64plus_next:
    video_driver: vulkan
  # No savestates, so no rewind. No analog stick either, so the pad bindings stay.
  virtualjaguar:
    rewind_enable: "false"

# The core's own settings, not RetroArch's, so a different file from
# games_retroarch_core_overrides: config/<library_name>/<library_name>.opt, with
# global_core_options false. Only the keys named here are enforced; the README gives the
# command that lists the available ones.
games_retroarch_core_options:
  # The default FM synthesis is MAME's, fast and approximate; Nuked is cycle-accurate.
  # ym2612 is the Mega Drive's chip, ym2413 the Master System's FM add-on.
  genesis_plus_gx:
    genesis_plus_gx_ym2612: "nuked (ym2612)"
    genesis_plus_gx_ym2413_core: nuked

  # Low-level emulations of the N64's graphics hardware, where the default GLideN64
  # reimplements and guesses; ParaLLEl gets the framebuffer effects right. Vulkan-only,
  # hence the video_driver override.
  mupen64plus_next:
    mupen64plus-rdp-plugin: parallel
    mupen64plus-rsp-plugin: parallel

# The org.freedesktop.Platform version every game runtime here accepts. Verify a bump with
# `flatpak remote-info flathub com.valvesoftware.Steam | grep Runtime`. The flatpak module
# matches on application ID only, so an extension on an older branch needs a manual
# uninstall.
games_flatpak_runtime_branch: "25.08"

# Copied into RetroArch's system directory rather than pointed at in place: cores
# treat that directory as writable scratch space, so it has to be local.
games_retroarch_bios_dir: "{{ games_retroarch_library_dir }}/_BIOS/retroarch-system-folder"

# Box art, the one thing RetroArch writes that every host can share (README.md). The role
# points RetroArch at it and checks only that it exists. Nothing else belongs here: the rest
# is written on every launch and the library is read-only on most hosts.
games_retroarch_thumbnails_dir: "{{ games_retroarch_library_dir }}/_Thumbnails"

# Rewind and fast-forward on the pad, per model: right stick up and down, free on almost
# every console here, L3/R3 as the dual-analog fallback. Not a Hotkey-Enable combo, which
# gates every hotkey and would need Select held too. See README.md.
games_retroarch_controllers:
  # Microsoft_X-Box_Series_XS_pad.cfg, shared with the Xbox One and 360 pads. The
  # Xbox One BT profile differs at axis 3, 8BitDo's Ultimate at buttons 13/14.
  xbox-series-x:
    input_rewind_axis: "-4"
    input_hold_fast_forward_axis: "+4"
    input_rewind_btn: "9"
    input_hold_fast_forward_btn: "10"

# `flatpak override --user` arguments per application ID. "default" applies to every
# app in games_flatpak_apps, with the per-application key merged on top.
games_flatpak_overrides:
  default:
    - --env=XCURSOR_THEME={{ games_cursor_theme }}
  com.heroicgameslauncher.hgl:
    # The game install and wine-prefix location. Without it Heroic cannot stat
    # installed games and reports them unavailable.
    - "--filesystem={{ games_heroic_dir }}"
  com.valvesoftware.Steam:
    # The PipeWire socket, for microphone input.
    - --filesystem=xdg-run/pipewire-0
    # Close quits rather than hiding in the tray. Steam exposes no setting for this on
    # Linux (steam-for-linux#3083, #4843), and some clients ignore it (#5307).
    - --env=STEAM_FRAME_FORCE_CLOSE=1
  org.DolphinEmu.dolphin-emu:
    # dolphin-tool writes the converted .rvz beside its source, and the flatpak's
    # blanket host:ro grant cannot. This opens that one directory and no more.
    - "--filesystem={{ games_retroarch_library_dir }}/Nintendo - GameCube"
  org.libretro.RetroArch:
    # A no-op against the flatpak's blanket `host` grant, and insurance if upstream
    # ever narrows it.
    - "--filesystem={{ games_retroarch_library_dir }}:ro"
    # The longer path wins over the read-only grant above, opening the one directory
    # RetroArch writes to. Effective only where the mount itself is writable.
    - "--filesystem={{ games_retroarch_thumbnails_dir }}"

# games_retroarch_library_dir has no default: the mount point is site data and this repo
# is public. Set it in host_vars/; tasks/main.yml asserts it. Read-only is enough for
# every host but the one keeping the thumbnails current.
