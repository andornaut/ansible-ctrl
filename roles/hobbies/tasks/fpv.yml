---
# Pinned in defaults/main.yml rather than resolved from the releases API: recent
# releases are PWA-only and ship no Linux portable build.
- name: Install Betaflight Configurator
  tags: betaflight
  block:
    # The zip's top-level directory has a space in it, so each release goes in a
    # version-stamped directory exposed as /opt/betaflight/current.
    - name: Set Betaflight Configurator install path facts
      ansible.builtin.set_fact:
        hobbies_betaflight_release_dir: "/opt/betaflight/{{ hobbies_betaflight_version }}"
        hobbies_betaflight_app_dir: "/opt/betaflight/{{ hobbies_betaflight_version }}/Betaflight Configurator"

    - name: Create Betaflight release directory
      ansible.builtin.file:
        path: "{{ hobbies_betaflight_release_dir }}"
        state: directory
        mode: "0755"
      become: true

    # creates is evaluated before the download, so an installed release skips it.
    - name: Download and extract Betaflight Configurator
      ansible.builtin.unarchive:
        src:
          "https://github.com/betaflight/betaflight-configurator/releases/download/\
          {{ hobbies_betaflight_version }}/\
          betaflight-configurator_{{ hobbies_betaflight_version }}_linux64-portable.zip"
        dest: "{{ hobbies_betaflight_release_dir }}"
        remote_src: true
        creates: "{{ hobbies_betaflight_app_dir }}"
        # Named, not left to the archive: extraction keeps the uid and gid the
        # archive records, which lands on whichever local account holds that id.
        owner: root
        group: root
      become: true
      register: hobbies_betaflight_unarchive

    # The zip ships files 0600/0700, unreadable by the launching user. Capital X
    # grants execute only where already set. Not a handler: the symlink below needs
    # this done now, and handlers flush at play end.
    - name: Set Betaflight Configurator permissions # noqa: no-handler
      ansible.builtin.file:
        path: "{{ hobbies_betaflight_app_dir }}"
        state: directory
        mode: u=rwX,go=rX
        recurse: true
      become: true
      when: hobbies_betaflight_unarchive is changed

    - name: Symlink stable Betaflight path to the installed version
      ansible.builtin.file:
        src: "{{ hobbies_betaflight_app_dir }}"
        dest: /opt/betaflight/current
        state: link
        force: true
      become: true

    # A wrapper, not a symlink: the app needs its bundled libraries on
    # LD_LIBRARY_PATH and its own directory as the working directory.
    - name: Install Betaflight Configurator launcher wrapper onto PATH
      ansible.builtin.copy:
        dest: /usr/local/bin/betaflight-configurator
        mode: "0755"
        follow: false
        content: |
          #!/bin/bash
          cd /opt/betaflight/current
          LD_LIBRARY_PATH=/opt/betaflight/current/lib exec ./betaflight-configurator "$@"
      become: true

    - name: Install Betaflight Configurator desktop file
      ansible.builtin.copy:
        dest: /usr/share/applications/betaflight-configurator.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Betaflight Configurator
          Comment=Crossplatform configuration tool for the Betaflight flight control system
          Exec=/usr/local/bin/betaflight-configurator
          Icon=/opt/betaflight/current/icon/bf_icon_128.png
          Terminal=false
          Type=Application
          Categories=Utility
      become: true

- name: Download and install ExpressLRS Configurator
  tags: expresslrs
  block:
    - name: Get latest ExpressLRS Configurator release
      ansible.builtin.include_tasks: get_latest_release.yml
      vars:
        release_repo: ExpressLRS/ExpressLRS-Configurator
        release_fact: hobbies_expresslrs_release

    - name: Set ExpressLRS Configurator download URL fact
      ansible.builtin.set_fact:
        hobbies_expresslrs_download_url: >-
          {{ hobbies_expresslrs_release.assets
          | selectattr('name', 'search', '_' ~ hobbies_arch ~ '[.]deb$')
          | map(attribute='browser_download_url') | first }}

    - name: Install ExpressLRS Configurator
      ansible.builtin.apt:
        deb: "{{ hobbies_expresslrs_download_url }}"
      become: true
