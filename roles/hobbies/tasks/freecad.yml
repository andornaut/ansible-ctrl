---
# Parametric CAD, used here to model 3D-printed and machined parts around PCBs. Bundles
# OpenCascade, so `freecadcmd` also runs headless scripts that read and write STEP.
#
# Ubuntu 24.04 ships no freecad package: it was dropped from noble and returned in later
# releases, and OpenCascade went with it. The maintainers' stable PPA is the only apt source
# covering noble; it carries the 0.21 series rather than 1.x.
- name: Install FreeCAD
  tags: freecad
  become: true
  block:
    - name: Add the FreeCAD stable apt repository
      ansible.builtin.apt_repository:
        repo: ppa:freecad-maintainers/freecad-stable
        update_cache: true

    # freecad-python3 carries the Python bindings, which the GUI package does not require.
    - name: Install FreeCAD packages
      ansible.builtin.apt:
        name:
          - freecad
          - freecad-python3
        state: latest
        install_recommends: false
        update_cache: true
