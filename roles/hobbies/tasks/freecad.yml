---
# noble ships no freecad package, so the maintainers' stable PPA is the only apt
# source there; it carries the 0.21 series rather than 1.x.
- name: Install FreeCAD
  tags: freecad
  become: true
  block:
    - name: Add the FreeCAD stable apt repository
      ansible.builtin.apt_repository:
        repo: ppa:freecad-maintainers/freecad-stable
        mode: "0644"
        update_cache: true
      # Launchpad's API times out often enough to fail a run on its own.
      register: hobbies_freecad_ppa
      retries: 3
      delay: 10
      until: hobbies_freecad_ppa is succeeded

    # freecad-python3 carries the bindings the GUI package does not require.
    - name: Install FreeCAD packages
      ansible.builtin.apt:
        name:
          - freecad
          - freecad-python3
        state: latest
        install_recommends: false
        update_cache: true
