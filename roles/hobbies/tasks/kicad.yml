---
- name: Install KiCad
  tags: kicad
  become: true
  block:
    - name: Add the KiCad releases apt repository
      ansible.builtin.apt_repository:
        repo: "ppa:kicad/kicad-{{ hobbies_kicad_version }}-releases"
        mode: "0644"
        update_cache: true
      # Launchpad's API times out often enough to fail a run on its own.
      register: hobbies_kicad_ppa
      retries: 3
      delay: 10
      until: hobbies_kicad_ppa is succeeded

    - name: Install KiCad package
      ansible.builtin.apt:
        name:
          - kicad
          - kicad-footprints
        state: latest
        install_recommends: false
        update_cache: true

# JLCPCB catalog / LCSC part lookup. It lands in the user's KiCad profile, so the block
# names that account: inheriting the connection's would clone as root wherever the run
# is invoked as root, leaving a tree the user cannot update. Pinned to the latest
# release tag, which update: true advances on re-run.
- name: Install kicad-jlcpcb-tools plugin
  tags: kicad
  become: true
  become_user: "{{ hobbies_user }}"
  block:
    - name: Get latest kicad-jlcpcb-tools release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: Bouni/kicad-jlcpcb-tools
        release_fact: hobbies_jlcpcb_release

    - name: Clone kicad-jlcpcb-tools plugin at the latest release tag
      ansible.builtin.git:
        repo: https://github.com/Bouni/kicad-jlcpcb-tools.git
        dest: "{{ hobbies_user_home }}/.local/share/kicad/{{ hobbies_kicad_version }}/scripting/plugins/kicad-jlcpcb-tools"
        version: "{{ hobbies_jlcpcb_release.tag_name }}"
        update: true
      register: hobbies_kicad_jlcpcb_tools_clone
      retries: 3
      delay: 5
      until: hobbies_kicad_jlcpcb_tools_clone is succeeded

# PCB panelizer. KiCad 10 support is git-master only, so far from PyPI; the venv
# isolates that pin, and --system-site-packages exposes KiCad's own pcbnew, a C
# extension from the apt package.
- name: Install KiKit panelizer into a dedicated venv
  tags: kicad
  become: true
  block:
    - name: Install python3-venv
      ansible.builtin.apt:
        name: python3-venv
        state: present

    - name: Install KiKit and pcbnewTransition into /opt/kikit
      # state: latest tracks master HEAD; use plain 'kikit' once upstream ships a
      # KiCad 10 PyPI release. --ignore-installed keeps the venv from borrowing any
      # system site-package but pcbnew.
      ansible.builtin.pip:
        name:
          - git+https://github.com/yaqwsx/pcbnewTransition.git
          - git+https://github.com/yaqwsx/KiKit.git
        state: latest
        extra_args: --ignore-installed
        virtualenv: /opt/kikit
        virtualenv_command: python3 -m venv
        virtualenv_site_packages: true
      register: hobbies_kikit_install
      retries: 3
      delay: 5
      until: hobbies_kikit_install is succeeded

    # pip writes the console scripts 0755 and every module through the run's umask, so a
    # umask that closes `other` leaves a CLI that starts and then cannot import itself.
    # Capital X grants execute only where pip already set it.
    - name: Let every account read the KiKit venv
      ansible.builtin.file:
        path: /opt/kikit
        state: directory
        recurse: true
        mode: u=rwX,go=rX

# A self-contained jpackage app-image with a bundled JRE, so no system Java.
- name: Install Freerouting
  tags: freerouting
  block:
    - name: Get latest Freerouting release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: freerouting/freerouting
        release_fact: hobbies_freerouting_release

    # A substring match, to avoid regex-escape differences across Jinja.
    - name: Set Freerouting download URLs fact
      ansible.builtin.set_fact:
        hobbies_freerouting_download_urls: >-
          {{ hobbies_freerouting_release.assets
          | selectattr('name', 'search', hobbies_freerouting_platform)
          | map(attribute='browser_download_url') | list }}

    - name: Require a Freerouting build for this architecture
      ansible.builtin.assert:
        that: hobbies_freerouting_download_urls | length > 0
        fail_msg: >-
          Freerouting {{ hobbies_freerouting_release.tag_name }} publishes no
          {{ hobbies_freerouting_platform }} build for {{ ansible_facts['architecture'] }}.
        quiet: true

    - name: Set Freerouting download URL fact
      ansible.builtin.set_fact:
        hobbies_freerouting_download_url: "{{ hobbies_freerouting_download_urls | first }}"

    - name: Set Freerouting install directory fact
      ansible.builtin.set_fact:
        hobbies_freerouting_dir: "{{ hobbies_freerouting_download_url | basename | regex_replace('\\.zip$', '') }}"

    - name: Create Freerouting directory
      ansible.builtin.file:
        path: /opt/freerouting
        state: directory
        mode: "0755"
      become: true

    - name: Download and extract Freerouting
      ansible.builtin.unarchive:
        src: "{{ hobbies_freerouting_download_url }}"
        dest: /opt/freerouting
        remote_src: true
        creates: "/opt/freerouting/{{ hobbies_freerouting_dir }}"
        # Named, not left to the archive: extraction puts the recorded mode through the
        # run's umask, and one that closes `other` leaves a launcher run by a user that
        # cannot read what it launches. Capital X grants execute only where the archive
        # already had it. Ownership is named for the same reason: extraction keeps the
        # uid and gid the archive records.
        mode: u=rwX,go=rX
        owner: root
        group: root
      register: hobbies_freerouting_download
      retries: 3
      delay: 5
      until: hobbies_freerouting_download is succeeded
      become: true

    - name: Symlink stable Freerouting path to the installed version
      ansible.builtin.file:
        src: "/opt/freerouting/{{ hobbies_freerouting_dir }}"
        dest: /opt/freerouting/current
        state: link
        force: true
      become: true

    # A wrapper, not a symlink, to default -da, opting out of upstream's analytics.
    # Routing arguments still pass through.
    - name: Install freerouting launcher wrapper onto PATH
      ansible.builtin.copy:
        dest: /usr/local/bin/freerouting
        mode: "0755"
        follow: false
        content: |
          #!/bin/bash
          exec /opt/freerouting/current/bin/freerouting -da "$@"
      become: true

    - name: Create the local applications directory
      ansible.builtin.file:
        path: /usr/local/share/applications
        state: directory
        mode: "0755"
      become: true

    # /usr/local/share, not /usr/share: the latter is dpkg's, and XDG_DATA_DIRS reads both.
    - name: Install Freerouting desktop file
      ansible.builtin.copy:
        dest: /usr/local/share/applications/freerouting.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Freerouting
          Comment=Advanced PCB autorouter
          Exec=/opt/freerouting/current/bin/freerouting -da
          Icon=/opt/freerouting/current/lib/freerouting.png
          Terminal=false
          Type=Application
          Categories=Electronics
      become: true

    # CLEANUP (added 2026-09-25): the entry this role wrote under /usr/share, which no package
    # owns. Remove once every hobbies host has converged.
    - name: Remove the Freerouting desktop file from /usr/share
      ansible.builtin.file:
        path: /usr/share/applications/freerouting.desktop
        state: absent
      become: true
