---
- name: Validate hobbies_user
  ansible.builtin.assert:
    that:
      - hobbies_user != "root"
    fail_msg: >-
      hobbies_user resolved to "root", which would write user-scoped state to /root.
      Set primary_user in the inventory (or hobbies_user in host_vars) to the target account.
    success_msg: 'hobbies_user "{{ hobbies_user }}" is valid'
  tags: always

- name: Resolve home directory for {{ hobbies_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ hobbies_user }}"
  tags: always

# ecryptfs keeps its configuration beside the home rather than inside it, so this answers whether
# the home is encrypted whether or not it is mounted now. Derived from the resolved home, never a
# fixed /home: ecryptfs-setup-private writes to $(dirname $HOME)/.ecryptfs/$USER.
- name: Check for an encrypted home for {{ hobbies_user }}
  ansible.builtin.stat:
    path: "{{ hobbies_user_home | dirname }}/.ecryptfs/{{ hobbies_user }}"
  register: hobbies_user_home_ecryptfs
  changed_when: false
  become: true
  tags: always

# getent answers with the home's path whether or not anything is mounted there, so a run against
# a locked home writes the user-scoped installs onto the mountpoint, where the next login hides
# them. `| default([])` fails closed: without the mounts fact an encrypted home counts as unmounted.
- name: Require an encrypted home to be mounted for {{ hobbies_user }}
  ansible.builtin.assert:
    that: hobbies_user_home in (ansible_facts['mounts'] | default([]) | map(attribute='mount'))
    fail_msg: >-
      {{ hobbies_user }}'s home is encrypted and {{ hobbies_user_home }} is not mounted, so
      this host is at its login screen or the home was never unlocked. Log in as
      {{ hobbies_user }}, or run ecryptfs-mount-private there, and re-run. If that account
      has no encrypted home any more, remove the stale
      {{ hobbies_user_home | dirname }}/.ecryptfs/{{ hobbies_user }}, which is what this reads.
    quiet: true
  when: hobbies_user_home_ecryptfs.stat.exists
  tags: always

- name: Import FPV tasks
  ansible.builtin.import_tasks: fpv.yml
  tags: fpv

- name: Import FreeCAD tasks
  ansible.builtin.import_tasks: freecad.yml
  tags: freecad

- name: Import KiCad tasks
  ansible.builtin.import_tasks: kicad.yml
  tags: kicad

- name: Import OrcaSlicer tasks
  ansible.builtin.import_tasks: orcaslicer.yml
  tags: orcaslicer

# Last: the overrides cover entries the tasks above install. A host with no desktop has no
# launcher to read them.
- name: Configure the desktop entry overrides
  ansible.builtin.import_tasks: app_entries.yml
  when: desktop_environment is defined
  tags: app-entries
