---
# Derived from defaults/main.yml, not operator knobs. Role vars outrank host_vars, so
# a host cannot desync one from its source.

# The Debian name, from the kernel's; selects the ExpressLRS release asset.
hobbies_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# Freerouting's names rather than Debian's, so hobbies_arch does not serve here: x86_64 to
# x64. The kernel is unmapped where upstream publishes no Linux build, which kicad.yml
# asserts.
hobbies_freerouting_platform: >-
  linux-{{ {'x86_64': 'x64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

# From the getent in tasks/main.yml.
hobbies_user_home: "{{ ansible_facts['getent_passwd'][hobbies_user][4] }}"

# Desktop entry overrides (tasks/app_entries.yml). The marker names an override as this
# role's, so its prune step leaves the other roles' copies alone; the source directories
# are the data path a launcher falls back to, in order, minus the user's own directory,
# which is where the override is written.
hobbies_app_entry_marker: "# Ansible managed override (hobbies)"
hobbies_app_entry_source_dirs:
  - "{{ hobbies_user_home }}/.local/share/flatpak/exports/share"
  - /var/lib/flatpak/exports/share
  - /usr/local/share
  - /usr/share
