---
homeautomation_docker_log_max_file: "10"
homeautomation_docker_log_max_size: "10m"
homeautomation_docker_network_name: homeautomation_default
homeautomation_install_avahi: false
homeautomation_install_esphome: false
homeautomation_install_frigate: false
homeautomation_install_govee2mqtt: false
homeautomation_install_llm: false
homeautomation_install_matterjs: false
homeautomation_install_legacy_pythonmatterserver: false
homeautomation_install_memryx: false
homeautomation_install_voice: false
homeautomation_ipv6_enabled: true

# Avahi
homeautomation_avahi_interfaces: ""

# ESPHome
homeautomation_esphome_docker_image: ghcr.io/esphome/esphome:stable
homeautomation_esphome_required_volumes:
  config: /var/docker-volumes/homeautomation/esphome/config
  # The entrypoint uses /cache as the PlatformIO core dir when it is mounted,
  # and it doubles as $HOME so PlatformIO's appstate.json has somewhere to go.
  # Kept out of /config because that directory is version controlled.
  cache: /var/docker-volumes/homeautomation/esphome/cache
# The dashboard is host-networked and unauthenticated out of the box, which is
# firmware-flash access to every ESP device and read access to the wifi and OTA
# passwords in secrets.yaml, from anywhere on the LAN. Setting both enables its
# login; leaving either empty leaves it open. The password is a secret, so
# host_vars references a secret_* name rather than holding a value.
#
# Only the API is gated, so the page itself still answers 200 either way. Check
# with /devices, which answers 401 once these are set.
homeautomation_esphome_username: ""
homeautomation_esphome_password: ""
# Both empty is refused rather than served: the role installs the dashboard on
# purpose, so an empty pair is a host that has not been given credentials yet,
# not a host that wants none. Set this true to run it open deliberately.
homeautomation_esphome_allow_unauthenticated: false
# The image's default user is root, but the dashboard only reads and writes
# these two directories, so it is run as this uid:gid.
#
# The one service still on the operator's uid rather than a dedicated account
# above 10000: its config directory is a git checkout the operator writes and
# the dashboard writes too, so splitting the uids needs a shared group first.
#
# Resolved from the account rather than assumed to be 1000: the directories task
# recurses ownership over that git checkout, so a wrong uid hands the operator's
# tree to an unrelated account and the 0600 below then locks them out of it.
homeautomation_esphome_user: "{{ primary_user }}"
homeautomation_esphome_uid: "{{ homeautomation_esphome_passwd[1] }}"
homeautomation_esphome_gid: "{{ homeautomation_esphome_passwd[2] }}"

# Frigate
# The address the unauthenticated UI is published on. Frigate serves the same
# application on two ports: the authenticated one below, and this one with no
# login at all, so on 0.0.0.0 it hands the whole camera system to anyone on the
# LAN. Loopback keeps it for host-local tooling without that. Nothing consumes
# it over the network: the reverse proxy uses the authenticated port over
# loopback, and Home Assistant reaches that port on the container's own bridge
# address, which no published port is involved in.
#
# Only this one is narrowed. The WebRTC port carries media straight from the
# browser and has to stay reachable.
homeautomation_frigate_bind_http_unauthenticated: "127.0.0.1"
homeautomation_frigate_devices: []
# https://github.com/blakeblackshear/frigate/pkgs/container/frigate
homeautomation_frigate_docker_image: "ghcr.io/blakeblackshear/frigate:stable-rocm"
homeautomation_frigate_env:
  LIBVA_DRIVER_NAME: ""
homeautomation_frigate_extra_volumes: []
homeautomation_frigate_memory: "8g"
# When unset, swap is disabled; when 0, this setting is ignored.
# homeautomation_frigate_memory_swap:
homeautomation_frigate_required_volumes:
  config: /var/docker-volumes/homeautomation/frigate/config
  media: /var/docker-volumes/homeautomation/frigate/media
homeautomation_frigate_port_http_authenticated: 8971
homeautomation_frigate_port_http_unauthenticated: 5000
homeautomation_frigate_port_rtsp: 8554
homeautomation_frigate_port_webrtc: 8555
homeautomation_frigate_shm_size: "128mb"
homeautomation_frigate_tmpfs_size_mb: 128

# ha-mcp
homeautomation_hamcp_docker_image: ghcr.io/homeassistant-ai/ha-mcp:latest
homeautomation_hamcp_env: {}
# host.docker.internal (mapped to host-gateway in docker_hamcp.yml) lets this
# bridge-networked container reach the host-networked Home Assistant.
homeautomation_hamcp_homeassistant_url: "http://host.docker.internal:8123"
# Home Assistant long-lived access token (Profile > Security).
homeautomation_hamcp_token: ""
# The image's own mcpuser is uid 999, which is a system account on the host
# (systemd-coredump on Ubuntu), so the container is given this uid:gid instead.
# It bind-mounts nothing, so the account owns no paths; the point is that the
# process does not carry an unrelated system account's identity.
homeautomation_hamcp_uid: "10008"
homeautomation_hamcp_gid: "10008"
homeautomation_install_hamcp: false

# Govee2mqtt
homeautomation_govee2mqtt_env: {}
homeautomation_govee2mqtt_docker_image: ghcr.io/wez/govee2mqtt:latest
# The image's own user is govee:govee (1000:1000), which is the operator's uid
# on the host, so the container is given this uid:gid instead.
homeautomation_govee2mqtt_uid: "10002"
homeautomation_govee2mqtt_gid: "10002"
homeautomation_govee2mqtt_required_volumes:
  data: /var/docker-volumes/homeautomation/govee2mqtt/data

# Home Assistant
homeautomation_homeassistant_devices: []
homeautomation_homeassistant_docker_image: "homeassistant/home-assistant:stable"
homeautomation_homeassistant_extra_volumes: []
# Patch aioruckus HEAD->GET for ruckus_unleashed on aiohttp 3.14+ (see
# tasks/patch_aioruckus_head.yml). Enable on hosts using the Ruckus integration.
homeautomation_homeassistant_patch_aioruckus_head: false
# Host-side port. Home Assistant runs with network_mode: host, so no port
# mapping is needed; this is used by the container healthcheck.
homeautomation_homeassistant_port: 8123
homeautomation_homeassistant_required_volumes:
  config: /var/docker-volumes/homeautomation/homeassistant/config
  dbus: /run/dbus
  localtime: /etc/localtime
  udev: /run/udev

# llama.cpp
homeautomation_llamacpp_devices: []
homeautomation_llamacpp_docker_image: ghcr.io/ggml-org/llama.cpp:server-vulkan
# Router mode spawns a child server per model with no --ctx-size, so each would
# default to 4096. These are inherited by the children: raise the per-request
# context to 128k (native for both models below, no YaRN) and pin one slot so
# the context is not divided across parallel slots. See README.
homeautomation_llamacpp_env:
  LLAMA_ARG_CTX_SIZE: "131072"
  LLAMA_ARG_N_PARALLEL: "1"
homeautomation_llamacpp_models:
  - https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf
  - https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q8_0.gguf
homeautomation_llamacpp_required_volumes:
  models: /var/docker-volumes/homeautomation/llamacpp/models
  # $HOME for the container, holding the Mesa/RADV shader caches. A dir of its
  # own so the models stay mounted read-only.
  cache: /var/docker-volumes/homeautomation/llamacpp/cache
# The image's default user is root, but GPU access comes from the render and
# video groups rather than the uid, so it is run as this uid:gid.
homeautomation_llamacpp_uid: "10003"
homeautomation_llamacpp_gid: "10003"

# Matter.js
homeautomation_matterjs_docker_image: ghcr.io/matter-js/matterjs-server:stable
# The image's own user is 1000:1000, which is the operator's uid on the host,
# so the container is given this uid:gid instead. Its data directory holds the
# Matter fabric credentials.
homeautomation_matterjs_uid: "10004"
homeautomation_matterjs_gid: "10004"
homeautomation_matterjs_required_volumes:
  data: /var/docker-volumes/homeautomation/matterjs/data

# Python Matter Server (legacy)
homeautomation_pythonmatterserver_docker_image: ghcr.io/home-assistant-libs/python-matter-server:stable
homeautomation_pythonmatterserver_required_volumes:
  data: /var/docker-volumes/homeautomation/pythonmatterserver/data

# MemryX
# List available versions with `sudo apt update && apt-cache madison memx-drivers`
homeautomation_memryx_version: "2.1"

# microWakeWord
homeautomation_microwakeword_docker_image: rhasspy/wyoming-microwakeword

# Mosquitto
# The address the broker is published on. mosquitto.conf enables anonymous
# access, so on 0.0.0.0 any host on the LAN can publish to the topics Home
# Assistant acts on. Loopback covers the clients there are: the containers on
# the shared bridge reach the broker by its container address without the
# published port at all, and the host-networked ones connect over loopback.
# Override per host only if a device outside this host has to publish.
homeautomation_mosquitto_bind: "127.0.0.1"
homeautomation_mosquitto_docker_image: eclipse-mosquitto
homeautomation_mosquitto_host: localhost
homeautomation_mosquitto_port: 1883
# The image's own mosquitto user, which owns the directories it ships and is
# what its entrypoint drops to. Not a service account from service_account.yml:
# the uid is baked into the image, so the host account follows it rather than
# the other way round.
homeautomation_mosquitto_uid: "1883"
homeautomation_mosquitto_gid: "1883"
homeautomation_mosquitto_required_volumes:
  config: /var/docker-volumes/homeautomation/mosquitto/config
  data: /var/docker-volumes/homeautomation/mosquitto/data
  log: /var/docker-volumes/homeautomation/mosquitto/log

# OpenThread Border Router (OTBR)
homeautomation_otbr_backbone_if: eth0
homeautomation_otbr_device: ""
homeautomation_otbr_docker_image: ghcr.io/ownbee/hass-otbr-docker
homeautomation_otbr_required_volumes:
  data: /var/docker-volumes/homeautomation/otbr/data
homeautomation_otbr_rest_port: 8081
homeautomation_otbr_web_port: 8080

# openWakeWord
homeautomation_openwakeword_docker_image: rhasspy/wyoming-openwakeword
homeautomation_openwakeword_required_volumes:
  data: /var/docker-volumes/homeautomation/openwakeword/data

# OpenWebUI
homeautomation_openwebui_docker_image: ghcr.io/open-webui/open-webui:main
homeautomation_openwebui_env: {}
homeautomation_openwebui_required_volumes:
  data: /var/docker-volumes/homeautomation/openwebui/data
# The image declares USER 0:0, but the server only reads and writes its data
# dir, so it is run as this uid:gid and the dir is chowned to match.
homeautomation_openwebui_uid: "10005"
homeautomation_openwebui_gid: "10005"

# Piper
homeautomation_piper_command: "--data-dir /data --voice en_US-amy-medium"
homeautomation_piper_docker_image: rhasspy/wyoming-piper
homeautomation_piper_required_volumes:
  data: /var/docker-volumes/homeautomation/piper/data
homeautomation_piper_port: 10200
# The image's default user is root, but the server only reads and writes its
# data dir, so it is run as this uid:gid and the dir is chowned to match.
homeautomation_piper_uid: "10006"
homeautomation_piper_gid: "10006"

# Whisper
homeautomation_whisper_command: "--data-dir /data --language en --model tiny-int8"
homeautomation_whisper_docker_image: rhasspy/wyoming-whisper
homeautomation_whisper_required_volumes:
  data: /var/docker-volumes/homeautomation/whisper/data
homeautomation_whisper_port: 10300
# The image's default user is root, but the server only reads and writes its
# data dir (the HuggingFace model cache), so it is run as this uid:gid and the
# dir is chowned to match.
homeautomation_whisper_uid: "10007"
homeautomation_whisper_gid: "10007"
