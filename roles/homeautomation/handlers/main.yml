---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart Avahi service
  ansible.builtin.systemd_service:
    name: avahi-daemon
    daemon_reload: true
    state: restarted
    enabled: true
  become: true

# Each restart is skipped when its container does not exist: force_handlers runs it after a
# failure that came before the container was created, and restarting a missing container
# tries to create one with no image.
- name: Look up the homeassistant container
  listen: Restart homeassistant
  # The account that created the container, as every other container task uses.
  become: true
  community.docker.docker_container_info:
    name: homeassistant
  register: homeautomation_homeassistant_container_info

- name: Restart the homeassistant container
  listen: Restart homeassistant
  become: true
  community.docker.docker_container:
    name: homeassistant
    restart: true
  when: homeautomation_homeassistant_container_info.exists

- name: Look up the mosquitto container
  listen: Restart mosquitto
  # The account that created the container, as every other container task uses.
  become: true
  community.docker.docker_container_info:
    name: mosquitto
  register: homeautomation_mosquitto_container_info

- name: Restart the mosquitto container
  listen: Restart mosquitto
  become: true
  community.docker.docker_container:
    name: mosquitto
    restart: true
  when: homeautomation_mosquitto_container_info.exists

- name: Look up the llamacpp container
  listen: Restart llamacpp
  # The account that created the container, as every other container task uses.
  become: true
  community.docker.docker_container_info:
    name: llamacpp
  register: homeautomation_llamacpp_container_info

- name: Restart the llamacpp container
  listen: Restart llamacpp
  become: true
  community.docker.docker_container:
    name: llamacpp
    restart: true
  when: homeautomation_llamacpp_container_info.exists

# Reload, not restart: ExecReload replaces the table in one transaction, where a restart
# deletes it first. Skipped under --check, where the unit may not exist yet.
- name: Reload the OTBR firewall
  ansible.builtin.systemd_service:
    name: "{{ homeautomation_otbr_firewall_unit }}"
    state: reloaded
    daemon_reload: true
  become: true
  when: not ansible_check_mode

- name: Restart docker-etc-hosts
  ansible.builtin.systemd_service:
    name: docker-etc-hosts.service
    state: restarted
  become: true

- name: Restart mxa-manager
  ansible.builtin.systemd_service:
    name: mxa-manager
    state: restarted
  become: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  become: true
  changed_when: true

- name: Load docker-ble-policy
  ansible.builtin.command: apparmor_parser -r -W /etc/apparmor.d/docker-ble-policy
  become: true
  changed_when: true

- name: Update /etc/hosts
  # https://github.com/andornaut/docker_etc_hosts
  ansible.builtin.command: /usr/local/bin/docker_etc_hosts
  become: true
  changed_when: true
