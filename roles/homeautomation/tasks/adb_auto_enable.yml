---
- name: Install adb-auto-enable
  tags: adb_auto_enable
  become: true
  become_user: "{{ homeautomation_adb_auto_enable_user }}"
  block:
    - name: Validate homeautomation_adb_auto_enable_user
      ansible.builtin.assert:
        that:
          - homeautomation_adb_auto_enable_user != "root"
        fail_msg: >-
          homeautomation_adb_auto_enable_user resolved to "root", which would download under
          /root and offer root's adb key to the sets. Set primary_user in the inventory
          (or homeautomation_adb_auto_enable_user in host_vars) to the target account.
        quiet: true

    - name: Read the passwd database
      ansible.builtin.getent:
        database: passwd

    - name: Install adb
      ansible.builtin.apt:
        name:
          - adb
        state: latest
        install_recommends: false
        update_cache: true
      become: true
      become_user: root

    # The release list, not /releases/latest, for the reason
    # install_github_release_component.yml gives: a project can ship a newer stable release
    # without moving that pointer, and following it would silently downgrade the install.
    - name: Get releases of adb-auto-enable
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ homeautomation_adb_auto_enable_repository }}/releases"
        return_content: true
      register: homeautomation_adb_auto_enable_releases
      retries: 3
      delay: 5
      # Retry network errors and 5xx only; 4xx is deterministic.
      until: >-
        homeautomation_adb_auto_enable_releases.status == 200 or
        (homeautomation_adb_auto_enable_releases.status >= 400 and homeautomation_adb_auto_enable_releases.status < 500)

    - name: Set the release fact for adb-auto-enable
      ansible.builtin.set_fact:
        homeautomation_adb_auto_enable_release: >-
          {{ homeautomation_adb_auto_enable_releases.json
          | selectattr('prerelease', 'equalto', false)
          | selectattr('draft', 'equalto', false)
          | list | first }}

    - name: Check that the newest release of adb-auto-enable publishes one APK
      ansible.builtin.assert:
        that:
          - >-
            homeautomation_adb_auto_enable_release.assets
            | selectattr('name', 'search', '\.apk$') | list | length == 1
        fail_msg: >-
          {{ homeautomation_adb_auto_enable_version }} publishes no single APK asset, so
          there is nothing to install from it:
          {{ homeautomation_adb_auto_enable_release.assets | map(attribute='name') | list }}.
        quiet: true

    - name: Create the adb-auto-enable download directory
      ansible.builtin.file:
        path: "{{ homeautomation_adb_auto_enable_dir }}"
        state: directory
        mode: "0755"

    # Under the version it carries, which is both the name to install by hand and what
    # keeps a release the sets have already been given from being fetched again.
    - name: Download adb-auto-enable {{ homeautomation_adb_auto_enable_version }}
      ansible.builtin.get_url:
        url: "{{ homeautomation_adb_auto_enable_url }}"
        dest: "{{ homeautomation_adb_auto_enable_apk }}"
        mode: "0644"
      register: homeautomation_adb_auto_enable_download
      retries: 3
      delay: 5
      until: homeautomation_adb_auto_enable_download is succeeded

    - name: Install adb-auto-enable on each set
      ansible.builtin.include_tasks: adb_auto_enable_host.yml
      loop: "{{ homeautomation_adb_auto_enable_hosts }}"
      loop_control:
        loop_var: homeautomation_adb_auto_enable_host
