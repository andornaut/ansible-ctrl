---
- name: Install adb-auto-enable
  tags: adb_auto_enable
  become: true
  become_user: "{{ homeautomation_adb_auto_enable_user }}"
  block:
    - name: Validate homeautomation_adb_auto_enable_user
      ansible.builtin.assert:
        that:
          - homeautomation_adb_auto_enable_user != "root"
        fail_msg: >-
          homeautomation_adb_auto_enable_user resolved to "root", which would reach the
          sets with root's adb key rather than the one they have authorized, so none of
          them would answer. Set primary_user in the inventory (or
          homeautomation_adb_auto_enable_user in host_vars) to the target account.
        quiet: true

    - name: Install adb
      ansible.builtin.apt:
        name:
          - adb
        state: latest
        install_recommends: false
        update_cache: true
      become: true
      become_user: root

    # A stable release can ship without moving the /releases/latest pointer, and following
    # it would silently downgrade the install.
    - name: Get the latest stable release of adb-auto-enable
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: "{{ homeautomation_adb_auto_enable_repository }}"
        release_fact: homeautomation_adb_auto_enable_release
        release_stable: true

    - name: Check that the newest release of adb-auto-enable publishes one APK
      ansible.builtin.assert:
        that:
          - >-
            homeautomation_adb_auto_enable_release.assets
            | selectattr('name', 'search', '\.apk$') | list | length == 1
        fail_msg: >-
          {{ homeautomation_adb_auto_enable_version }} publishes no single APK asset, so
          there is nothing to install from it:
          {{ homeautomation_adb_auto_enable_release.assets | map(attribute='name') | list }}.
        quiet: true

    - name: Install adb-auto-enable on each set
      ansible.builtin.include_tasks: adb_auto_enable_host.yml
      loop: "{{ homeautomation_adb_auto_enable_hosts }}"
      loop_control:
        loop_var: homeautomation_adb_auto_enable_host

    - name: Check that every set took the release
      ansible.builtin.assert:
        that:
          - homeautomation_adb_auto_enable_refused | default([]) | length == 0
        fail_msg: >-
          adb-auto-enable could not be installed on
          {{ homeautomation_adb_auto_enable_refused | default([]) | join('; ') }}.
          INSTALL_FAILED_UPDATE_INCOMPATIBLE means the set carries a build signed with
          another key, a locally built one among them, which has to be uninstalled first,
          and that deletes the app's adb key and the pairing made to it. See the role
          README.
        quiet: true
