---
# One Android TV. Included per set from adb_auto_enable.yml, which declares the account
# every task here runs as and holds the vars they read.
#
# Required vars:
#   homeautomation_adb_auto_enable_host (str): the set, as adb addresses it
#
# Every adb call is wrapped in `timeout`, and none of them is given the task keyword of
# that name: a task that times out fails whatever failed_when says, while a wrapped one
# returns 124 and can be skipped like any other unreachable set.
#
# The probes below carry `check_mode: false`. They write nothing to the set, and a skipped
# command module registers rc 0 with an empty stdout, which reads as an adb that answered and
# a package at no version: under --check that enters the install block, where tempfile has no
# check mode of its own and leaves the path get_url templates undefined.

# A set that is off, or on with wireless debugging not yet turned back on, answers
# nothing here and is left alone: there is no adb to install through, and the copy it
# already carries arms itself on its next boot.
- name: Check for a listening adb on {{ homeautomation_adb_auto_enable_host }}
  ansible.builtin.wait_for:
    host: "{{ homeautomation_adb_auto_enable_host }}"
    port: "{{ homeautomation_adb_auto_enable_port }}"
    timeout: 3
  register: homeautomation_adb_auto_enable_probe
  ignore_errors: true

- name: Connect adb to {{ homeautomation_adb_auto_enable_host }}
  ansible.builtin.command:
    cmd: >-
      timeout 10 adb connect
      {{ homeautomation_adb_auto_enable_host }}:{{ homeautomation_adb_auto_enable_port }}
  changed_when: false
  failed_when: false
  check_mode: false
  when: homeautomation_adb_auto_enable_probe is succeeded

# A set in standby accepts the connection above and services nothing behind it, so the
# port being open says only that it is on the network. This is what says adbd will answer,
# and every task below turns on it.
- name: Check that adb answers on {{ homeautomation_adb_auto_enable_host }}
  ansible.builtin.command:
    cmd: >-
      timeout 20 adb -s {{ homeautomation_adb_auto_enable_host }}:{{ homeautomation_adb_auto_enable_port }}
      shell true
  register: homeautomation_adb_auto_enable_alive
  changed_when: false
  failed_when: false
  check_mode: false
  when: homeautomation_adb_auto_enable_probe is succeeded

- name: Read the version installed on {{ homeautomation_adb_auto_enable_host }}
  ansible.builtin.command:
    cmd: >-
      timeout 30 adb -s {{ homeautomation_adb_auto_enable_host }}:{{ homeautomation_adb_auto_enable_port }}
      shell dumpsys package {{ homeautomation_adb_auto_enable_package }}
  register: homeautomation_adb_auto_enable_dumpsys
  changed_when: false
  # A set that answered above and has since left the network reports `device offline`, and
  # one that stalls returns 124. Neither is this run's failure to have.
  failed_when: false
  check_mode: false
  when: homeautomation_adb_auto_enable_alive.rc | default(1) == 0

- name: Install the release missing from {{ homeautomation_adb_auto_enable_host }}
  when:
    - homeautomation_adb_auto_enable_dumpsys.rc | default(1) == 0
    - homeautomation_adb_auto_enable_installed_version
      != homeautomation_adb_auto_enable_version_name
  block:
    # check_mode: false, the module having none of its own: a --check run reaching here
    # needs the directory to exist for get_url below to template a dest. The always: removes
    # it under --check for the same reason.
    - name: Create a temporary directory for the adb-auto-enable release
      ansible.builtin.tempfile:
        state: directory
        suffix: adb-auto-enable
      register: homeautomation_adb_auto_enable_tmp
      check_mode: false

    - name: Download adb-auto-enable {{ homeautomation_adb_auto_enable_version }}
      ansible.builtin.get_url:
        url: "{{ homeautomation_adb_auto_enable_url }}"
        dest: "{{ homeautomation_adb_auto_enable_tmp.path }}/{{ homeautomation_adb_auto_enable_url | basename }}"
        mode: "0644"
      register: homeautomation_adb_auto_enable_download
      retries: 3
      delay: 5
      until: homeautomation_adb_auto_enable_download is succeeded

    - name: Install adb-auto-enable on {{ homeautomation_adb_auto_enable_host }}
      ansible.builtin.command:
        cmd: >-
          timeout 180 adb -s {{ homeautomation_adb_auto_enable_host }}:{{ homeautomation_adb_auto_enable_port }}
          install -r {{ homeautomation_adb_auto_enable_download.dest }}
      register: homeautomation_adb_auto_enable_install
      changed_when: homeautomation_adb_auto_enable_install.rc == 0
      failed_when: false

    # Collected rather than asserted here, so the sets after this one are still reached.
    # adb_auto_enable.yml fails the run on the list once every set has been offered it.
    - name: Note the install refused by {{ homeautomation_adb_auto_enable_host }}
      ansible.builtin.set_fact:
        homeautomation_adb_auto_enable_refused: >-
          {{ (homeautomation_adb_auto_enable_refused | default([]))
             + [homeautomation_adb_auto_enable_host ~ ' (' ~ refusal ~ ')'] }}
      vars:
        refusal: >-
          {{ (homeautomation_adb_auto_enable_install.stdout | trim ~ ' '
             ~ homeautomation_adb_auto_enable_install.stderr | trim) | trim }}
      when: homeautomation_adb_auto_enable_install.rc != 0

    # A freshly installed app sits in the stopped state, and a stopped app is sent no
    # broadcasts, so nothing would start it at the next boot either.
    - name: Start adb-auto-enable on {{ homeautomation_adb_auto_enable_host }}
      ansible.builtin.command:
        cmd: >-
          timeout 30 adb -s {{ homeautomation_adb_auto_enable_host }}:{{ homeautomation_adb_auto_enable_port }}
          shell am start -n {{ homeautomation_adb_auto_enable_package }}/.MainActivity
      changed_when: true
      when: homeautomation_adb_auto_enable_install.rc == 0

    # Nothing here can pair it: the code is shown on the set's own screen.
    - name: Report the pairing still needed on {{ homeautomation_adb_auto_enable_host }}
      ansible.builtin.debug:
        msg: >-
          adb-auto-enable is newly installed on
          {{ homeautomation_adb_auto_enable_host }} and unpaired, so it cannot move adbd
          onto {{ homeautomation_adb_auto_enable_port }} at the next boot. Pair it with a
          code read off the set. See the role README.
      when:
        - homeautomation_adb_auto_enable_install.rc == 0
        - homeautomation_adb_auto_enable_installed_version | length == 0
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ homeautomation_adb_auto_enable_tmp.path }}"
        state: absent
      when: homeautomation_adb_auto_enable_tmp.path is defined
      check_mode: false

# It holds no permission a manifest can ask for, and the app needs it to turn wireless
# debugging on. A reinstall preserves the grant, so this is for a set that has just taken a
# first install, or one whose grant was taken away since.
- name: Grant WRITE_SECURE_SETTINGS on {{ homeautomation_adb_auto_enable_host }}
  ansible.builtin.command:
    cmd: >-
      timeout 30 adb -s {{ homeautomation_adb_auto_enable_host }}:{{ homeautomation_adb_auto_enable_port }}
      shell pm grant {{ homeautomation_adb_auto_enable_package }}
      android.permission.WRITE_SECURE_SETTINGS
  changed_when: true
  when:
    - homeautomation_adb_auto_enable_dumpsys.rc | default(1) == 0
    - homeautomation_adb_auto_enable_install.rc | default(0) == 0
    - >-
      homeautomation_adb_auto_enable_install is changed
      or 'WRITE_SECURE_SETTINGS: granted=true'
      not in homeautomation_adb_auto_enable_dumpsys.stdout
