---
# The dashboard enables its login only when it gets both, and the auth gate below would
# read a half pair as "this host wants no login".
- name: Assert that the ESPHome dashboard credentials are a complete pair
  ansible.builtin.assert:
    that:
      - (homeautomation_esphome_username | length > 0) ==
        (homeautomation_esphome_password | length > 0)
    fail_msg: >-
      One of the ESPHome username/password is set and the other is empty, which
      would start the dashboard unauthenticated.

# The check above passes on two empties, which is a host that has not been given
# credentials yet rather than one that asked for none.
- name: Assert that the ESPHome dashboard has a login
  ansible.builtin.assert:
    that:
      - homeautomation_esphome_username | length > 0
      - homeautomation_esphome_password | length > 0
    fail_msg: >-
      ESPHome has no username or password, so the dashboard starts unauthenticated
      on the LAN: firmware flash on every ESP device, and secrets.yaml readable.
      Set homeautomation_esphome_username and point the password at an injected
      credential in host_vars, or set homeautomation_esphome_allow_unauthenticated
      to run it open on purpose.
  when: not homeautomation_esphome_allow_unauthenticated | bool

- name: Create the ESPHome service account
  ansible.builtin.include_tasks: service_account.yml
  vars:
    service_account_name: esphome
    service_account_uid: "{{ homeautomation_esphome_uid }}"
    service_account_paths:
      - "{{ homeautomation_esphome_required_volumes.config }}"
      - "{{ homeautomation_esphome_required_volumes.cache }}"
    # secrets.yaml holds the wifi and OTA passwords.
    service_account_mode: "0700"

# The dashboard pings devices to track whether they are online, and an unprivileged ICMP
# datagram socket is the only way a non-root uid can: cap_add fills the permitted set but
# not the ambient one, so NET_RAW never becomes effective. Such a socket only sends echo
# requests and reads the replies. On the host, the container being host-networked.
- name: Allow the ESPHome group to open unprivileged ICMP sockets
  ansible.posix.sysctl:
    name: net.ipv4.ping_group_range
    value: "{{ homeautomation_esphome_gid }} {{ homeautomation_esphome_gid }}"
    sysctl_file: /etc/sysctl.d/60-esphome-ping.conf
    sysctl_set: true
    reload: true
  become: true

- name: Remove ESPHome container if it exists
  ansible.builtin.include_tasks: remove_docker_containers.yml
  vars:
    container_names:
      - esphome

- name: Start ESPHome Docker container
  become: true
  vars:
    esphome_base_volumes:
      - "{{ homeautomation_esphome_required_volumes.config }}:/config"
      - "{{ homeautomation_esphome_required_volumes.cache }}:/cache"
    esphome_volumes: "{{ homeautomation_common_volumes + esphome_base_volumes }}"

    esphome_base_environment:
      ESPHOME_DASHBOARD_USE_PING: "true"
      # PlatformIO derives its core dir from $HOME, and the image's /root is
      # neither writable by the uid nor kept across a recreate.
      HOME: /cache
    # ESPHOME_-prefixed: the older USERNAME and PASSWORD are silently ignored, leaving the
    # dashboard open. The equivalent flags are deprecated and would put the password in the
    # host's process list.
    esphome_auth_environment:
      ESPHOME_USERNAME: "{{ homeautomation_esphome_username }}"
      ESPHOME_PASSWORD: "{{ homeautomation_esphome_password }}"
    esphome_environment: >-
      {{ esphome_base_environment | combine(esphome_auth_environment
         if homeautomation_esphome_auth_configured | bool else {}) }}

  community.docker.docker_compose_v2:
    project_name: homeautomation-esphome
    pull: always
    remove_orphans: true
    definition:
      networks: "{{ homeautomation_external_network }}"
      services:
        esphome:
          # http://esphome.internal:6052
          container_name: esphome
          environment: "{{ esphome_environment }}"
          image: "{{ homeautomation_esphome_docker_image }}"
          cap_drop: "{{ homeautomation_unprivileged_cap_drop }}"
          logging: "{{ homeautomation_default_logging }}"
          # mDNS device discovery: the multicast does not cross the bridge.
          network_mode: host
          restart: unless-stopped
          security_opt: "{{ homeautomation_no_new_privileges }}"
          user: "{{ homeautomation_esphome_uid }}:{{ homeautomation_esphome_gid }}"
          volumes: "{{ esphome_volumes }}"
  notify: Update /etc/hosts
  # The environment holds the dashboard password. Conditional, because hiding this
  # task's output costs the only diagnostic a pull or startup failure has.
  no_log: "{{ homeautomation_esphome_auth_configured | bool }}"

# secrets.yaml holds the wifi and OTA passwords, and each device YAML that device's API
# encryption key. Defence in depth behind the 0700 directory above, reasserted every run,
# the dashboard writing a file per device as they are adopted.
- name: Find the ESPHome configuration files
  ansible.builtin.find:
    paths: "{{ homeautomation_esphome_required_volumes.config }}"
    patterns:
      - "*.yaml"
      - "*.yml"
    file_type: file
  register: homeautomation_esphome_config_files
  become: true

- name: Restrict the ESPHome configuration files to their owner
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ homeautomation_esphome_config_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
