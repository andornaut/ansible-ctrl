---
- name: Resolve Home Assistant device paths
  ansible.builtin.import_tasks: resolve_device.yml
  vars:
    device_paths: "{{ homeautomation_homeassistant_devices }}"
    resolved_var_name: homeautomation_homeassistant_devices_resolved

- name: Create the Govee2MQTT service account
  ansible.builtin.include_tasks: service_account.yml
  vars:
    service_account_name: govee2mqtt
    service_account_uid: "{{ homeautomation_govee2mqtt_uid }}"
    service_account_paths:
      - "{{ homeautomation_govee2mqtt_required_volumes.data }}"
    # iot.key and iot.cert are the device credentials for Govee's LAN API, so
    # nothing outside the service reads this directory.
    service_account_mode: "0700"
  when: homeautomation_install_govee2mqtt

- name: Remove Home Assistant, Govee2MQTT, and Mosquitto containers if they exist
  ansible.builtin.include_tasks: remove_docker_containers.yml
  vars:
    container_names:
      - govee2mqtt
      - homeassistant
      - mosquitto

- name: Start Home Assistant, Govee2MQTT, and Mosquitto Docker containers
  vars:
    homeassistant_base_volumes:
      - /etc/hosts:/etc/hosts:ro
      - "{{ homeautomation_homeassistant_required_volumes.config }}:/config"
      - "{{ homeautomation_homeassistant_required_volumes.dbus }}:/run/dbus:ro"
      - "{{ homeautomation_homeassistant_required_volumes.udev }}:/run/udev:ro"
    homeassistant_volumes: >-
      {{ homeautomation_common_volumes + homeassistant_base_volumes + homeautomation_homeassistant_extra_volumes }}

    mosquitto_base_volumes:
      - "{{ homeautomation_mosquitto_required_volumes.config }}:/mosquitto/config:ro"
      - "{{ homeautomation_mosquitto_required_volumes.data }}:/mosquitto/data"
      - "{{ homeautomation_mosquitto_required_volumes.log }}:/mosquitto/log"
    mosquitto_volumes: "{{ homeautomation_common_volumes + mosquitto_base_volumes }}"

    govee2mqtt_base_volumes:
      - "{{ homeautomation_govee2mqtt_required_volumes.data }}:/data"
    govee2mqtt_volumes: "{{ homeautomation_common_volumes + govee2mqtt_base_volumes }}"

    govee2mqtt_base_environment:
      GOVEE_MQTT_HOST: "{{ homeautomation_mosquitto_host }}"
      GOVEE_MQTT_PORT: "{{ homeautomation_mosquitto_port }}"
      GOVEE_TEMPERATURE_SCALE: C
      RUST_LOG_STYLE: always
      TZ: "{{ homeautomation_tz }}"
    govee2mqtt_environment: >-
      {{ govee2mqtt_base_environment | combine(homeautomation_govee2mqtt_env | default({})) }}

    govee2mqtt_service:
      govee2mqtt:
        # http://localhost:8056
        container_name: govee2mqtt
        hostname: govee2mqtt-{{ ansible_facts['hostname'] }}
        image: "{{ homeautomation_govee2mqtt_docker_image }}"
        cap_drop: "{{ homeautomation_unprivileged_cap_drop }}"
        depends_on:
          # Broker must be ready; HA need only have started (govee reads state
          # over MQTT, so gating on HA's health just delays govee needlessly).
          homeassistant:
            condition: service_started
          mosquitto:
            condition: service_healthy
        environment: "{{ govee2mqtt_environment }}"
        logging: "{{ homeautomation_default_logging }}"
        # Host networking required for UDP broadcast-based Govee LAN device discovery
        network_mode: host
        restart: unless-stopped
        security_opt: "{{ homeautomation_no_new_privileges }}"
        # Overrides the image's own govee:govee, which is 1000:1000 and so the
        # operator's uid on the host.
        user: "{{ homeautomation_govee2mqtt_uid }}:{{ homeautomation_govee2mqtt_gid }}"
        volumes: "{{ govee2mqtt_volumes }}"

    required_services:
      homeassistant:
        # http://localhost:8123
        container_name: homeassistant
        image: "{{ homeautomation_homeassistant_docker_image }}"
        cap_add:
          - NET_ADMIN
          - NET_RAW
        depends_on:
          mosquitto:
            condition: service_healthy
        devices: "{{ homeautomation_homeassistant_devices_resolved }}"
        # Gates govee2mqtt via depends_on. A healthcheck does not restart an
        # unhealthy container (no autoheal watcher runs here); it only reports.
        healthcheck:
          test: ["CMD", "curl", "-sf", "http://localhost:{{ homeautomation_homeassistant_port }}/manifest.json"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 120s
        logging: "{{ homeautomation_default_logging }}"
        # Host networking required for mDNS discovery (Google Cast, Bluetooth)
        # and direct LAN access, which the bridge cannot provide.
        network_mode: host
        restart: unless-stopped
        security_opt: >-
          {{ homeautomation_no_new_privileges + ["apparmor=docker-ble-policy"] }}
        volumes: "{{ homeassistant_volumes }}"

      mosquitto:
        # http://mosquitto.internal:1883
        container_name: mosquitto
        image: "{{ homeautomation_mosquitto_docker_image }}"
        # Anonymous access is on, so no credentials. 1883 is the in-container
        # listener (mosquitto.conf), not the published host port.
        healthcheck:
          test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "healthcheck", "-m", "ping"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 30s
        cap_drop: "{{ homeautomation_unprivileged_cap_drop }}"
        logging: "{{ homeautomation_default_logging }}"
        ports:
          - "{{ homeautomation_mosquitto_bind }}:{{ homeautomation_mosquitto_port }}:1883"
        restart: unless-stopped
        security_opt: "{{ homeautomation_no_new_privileges }}"
        # The image's entrypoint su-execs to this uid anyway, and the config,
        # data and log directories it ships are owned by it. Naming it here
        # means the container never has a root phase at all, and the volumes
        # below stay readable by the broker.
        user: "{{ homeautomation_mosquitto_uid }}:{{ homeautomation_mosquitto_gid }}"
        volumes: "{{ mosquitto_volumes }}"

  community.docker.docker_compose_v2:
    project_name: homeautomation
    pull: always
    remove_orphans: true
    definition:
      networks:
        default:
          driver: bridge
          enable_ipv6: "{{ homeautomation_ipv6_enabled }}"
          driver_opts:
            com.docker.network.bridge.name: br-ha
      services: >-
        {{
          required_services | combine(govee2mqtt_service if homeautomation_install_govee2mqtt else {})
        }}
  notify: Update /etc/hosts
  # Govee2MQTT's environment contains the Govee account password and API key. Conditional
  # rather than always on: this task pulls images and starts the stack, so hiding its output
  # costs the only diagnostic a pull or startup failure has, and the secret is only in the
  # definition when govee2mqtt is installed.
  no_log: "{{ homeautomation_install_govee2mqtt }}"

# Home Assistant runs as root, and its Bluetooth, dbus and udev access is why:
# the dbus socket admits only root by default. So it keeps its uid, and these
# files are closed to everything else instead.
#
# The directory rather than the files under it, for the same reason .storage is
# closed below: zigbee.db holds the Zigbee network key and home-assistant_v2.db
# holds every recorded state, both are rewritten constantly with Home
# Assistant's own umask, and a per-file mode would drift back. Nothing else
# mounts this directory, so closing it costs no other service anything.
- name: Restrict the Home Assistant configuration directory to root
  ansible.builtin.file:
    path: "{{ homeautomation_homeassistant_required_volumes.config }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

# Reasserted after the container starts, every run, because Home Assistant
# creates these itself and which ones exist changes with the integrations
# configured and with the image.
- name: Find the Home Assistant credential files
  ansible.builtin.find:
    paths: "{{ homeautomation_homeassistant_required_volumes.config }}"
    patterns:
      - secrets.yaml
      - "*.key"
      - "*.pem"
    file_type: file
    hidden: true
  register: homeautomation_homeassistant_secret_files
  become: true

- name: Restrict the Home Assistant credential files to root
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ homeautomation_homeassistant_secret_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Check for the Home Assistant storage directory
  ansible.builtin.stat:
    path: "{{ homeautomation_homeassistant_required_volumes.config }}/.storage"
  register: homeautomation_homeassistant_storage
  become: true

# The directory rather than the files in it: Home Assistant rewrites .storage
# on its own schedule with its own umask, so per-file modes drift back and a
# closed directory does not. core.config_entries holds an access token for
# every configured integration, in plaintext JSON.
- name: Restrict the Home Assistant storage directory to root
  ansible.builtin.file:
    path: "{{ homeautomation_homeassistant_required_volumes.config }}/.storage"
    state: directory
    mode: "0700"
  become: true
  when: homeautomation_homeassistant_storage.stat.exists
