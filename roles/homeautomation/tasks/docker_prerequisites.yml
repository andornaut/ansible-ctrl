---
# First, because every container tag imports this file: community.docker reports
# a missing daemon as a connection error against the socket, which reads as a
# broken install rather than an absent one.
# become: true, matching the container tasks, so the probe reports on the
# account that will run them rather than on whoever ansible connects as.
- name: Require Docker
  become: true
  block:
    - name: Probe for Docker
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: Docker
            probe: docker version
            hint: >-
              It comes from the docker role, which homeautomation.yml applies
              only once its commented-out entry is uncommented for a host's
              first run.
          # Three packages, not one: the docker role purges Ubuntu's docker.io
          # and installs the engine, the compose plugin and the SDK separately,
          # so each of the three can be absent while the others work.
          - name: The Docker Compose plugin
            probe: docker compose version
            hint: "It is the docker-compose-plugin package, which the docker role installs."
          - name: The Docker SDK for Python
            probe: >-
              {{ ansible_facts['discovered_interpreter_python'] | default('python3') }}
              -c 'import docker'
            hint: "It is the python3-docker package, which the docker role installs."

# Both databases: the container definitions below read group ids from group,
# and service_account.yml checks a uid against passwd before creating it. This
# file is imported under every container tag, so both are always present.
- name: Read the passwd and group databases
  ansible.builtin.getent:
    database: "{{ item }}"
  loop:
    - group
    - passwd

# The getent facts above are read once, so an account service_account.yml
# creates is invisible to the next caller's check and two services configured
# with the same uid would silently come to share their files. Compared here,
# before any of them exist.
- name: Check that the service account uids are distinct
  ansible.builtin.assert:
    that:
      # Compared as strings: the defaults are quoted, but a host_vars override
      # written unquoted is an int, and unique would treat 10006 and "10006" as
      # two values, passing the collision this exists to catch.
      - service_account_uids | map('string') | length
        == service_account_uids | map('string') | unique | length
    fail_msg: >-
      Two services are configured with the same uid, so they would share their
      files: {{ homeautomation_service_account_uids }}.
    quiet: true
  vars:
    service_account_uids: "{{ homeautomation_service_account_uids.values() | list }}"

- name: Read system timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: homeautomation_system_timezone
  changed_when: false
  tags:
    - frigate
    - homeassistant

- name: Install docker_etc_hosts script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/andornaut/docker_etc_hosts/main/docker_etc_hosts
    dest: /usr/local/bin/docker_etc_hosts
    mode: "0755"
  become: true

- name: Install docker-etc-hosts systemd service
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/andornaut/docker_etc_hosts/main/docker-etc-hosts.service
    dest: /etc/systemd/system/docker-etc-hosts.service
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Enable and start docker-etc-hosts service
  ansible.builtin.systemd_service:
    name: docker-etc-hosts.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
