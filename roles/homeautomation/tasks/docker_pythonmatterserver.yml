---
# Root-owned because the server runs as root for dbus and Bluetooth, and closed
# because the directory holds the Matter fabric credentials: the keys that make
# this controller the one the commissioned devices trust. The directory rather
# than the files, which the server rewrites with its own umask.
- name: Create Python Matter Server data directory
  ansible.builtin.file:
    path: "{{ homeautomation_pythonmatterserver_required_volumes.data }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Remove Python Matter Server container if it exists
  ansible.builtin.include_tasks: remove_docker_containers.yml
  vars:
    container_names:
      - pythonmatterserver

- name: Start Python Matter Server Docker container
  vars:
    pms_base_volumes:
      - /run/dbus:/run/dbus:ro
      - "{{ homeautomation_pythonmatterserver_required_volumes.data }}:/data"
    pms_volumes: "{{ homeautomation_common_volumes + pms_base_volumes }}"

  community.docker.docker_compose_v2:
    project_name: homeautomation-pythonmatterserver
    pull: always
    remove_orphans: true
    definition:
      services:
        pythonmatterserver:
          # http://pythonmatterserver.internal:5580
          container_name: pythonmatterserver
          hostname: pythonmatterserver-{{ ansible_facts['hostname'] }}
          image: "{{ homeautomation_pythonmatterserver_docker_image }}"
          cap_add:
            - NET_ADMIN
            - NET_RAW
          logging: "{{ homeautomation_default_logging }}"
          # Host networking is required to see the _matter._tcp mDNS OTBR
          # advertises on the LAN; those multicasts don't cross the bridge, so a
          # bridged server never resolves Thread nodes and all Matter devices
          # show unavailable.
          network_mode: host
          restart: unless-stopped
          # apparmor=unconfined for Bluetooth via dbus.
          security_opt: >-
            {{ homeautomation_no_new_privileges + ["apparmor=unconfined"] }}
          volumes: "{{ pms_volumes }}"
  notify: Update /etc/hosts
