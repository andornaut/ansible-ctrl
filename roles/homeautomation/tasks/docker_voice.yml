---
- name: Create the Piper service account
  ansible.builtin.include_tasks: service_account.yml
  vars:
    service_account_name: piper
    service_account_uid: "{{ homeautomation_piper_uid }}"
    service_account_paths:
      - "{{ homeautomation_piper_required_volumes.data }}"
    # Downloaded voice models; nothing outside the service reads them.
    service_account_mode: "0700"

- name: Create the Whisper service account
  ansible.builtin.include_tasks: service_account.yml
  vars:
    service_account_name: whisper
    service_account_uid: "{{ homeautomation_whisper_uid }}"
    service_account_paths:
      - "{{ homeautomation_whisper_required_volumes.data }}"
    service_account_mode: "0700"

- name: Remove Piper and Whisper containers if they exist
  ansible.builtin.include_tasks: remove_docker_containers.yml
  vars:
    container_names:
      - piper
      - whisper

- name: Start Voice Docker containers
  become: true
  vars:
    # microwakeword_volumes: "{{ homeautomation_common_volumes }}"
    #
    # openwakeword_base_volumes:
    #   - "{{ homeautomation_openwakeword_required_volumes.data }}:/custom"
    # openwakeword_volumes: "{{ homeautomation_common_volumes + openwakeword_base_volumes }}"

    piper_base_volumes:
      - "{{ homeautomation_piper_required_volumes.data }}:/data"
    piper_volumes: "{{ homeautomation_common_volumes + piper_base_volumes }}"

    whisper_base_volumes:
      - "{{ homeautomation_whisper_required_volumes.data }}:/data"
    whisper_volumes: "{{ homeautomation_common_volumes + whisper_base_volumes }}"

  community.docker.docker_compose_v2:
    project_name: homeautomation-voice
    pull: always
    remove_orphans: true
    definition:
      networks: "{{ homeautomation_external_network }}"
      services:
        # Voice Preview (hardware) uses microWakeWord, not openWakeWord
        # openwakeword:
        #   http://openwakeword.internal:11434
        #   container_name: openwakeword
        #   image: "{{ homeautomation_openwakeword_docker_image }}"
        #   command: --custom-model-dir /custom --preload-model 'ok_nabu'
        #   logging: "{{ homeautomation_default_logging }}"
        #   restart: unless-stopped
        #   volumes: "{{ openwakeword_volumes }}"

        # Used by Voice Preview (hardware)
        # microwakeword:
        #   http://microwakeword.internal:11434
        #   container_name: microwakeword
        #   image: "{{ homeautomation_microwakeword_docker_image }}"
        #   logging: "{{ homeautomation_default_logging }}"
        #   restart: unless-stopped
        #   volumes: "{{ microwakeword_volumes }}"

        piper:
          # http://piper.internal:10200
          container_name: piper
          image: "{{ homeautomation_piper_docker_image }}"
          cap_drop: "{{ homeautomation_unprivileged_cap_drop }}"
          command: "{{ homeautomation_piper_command }}"
          logging: "{{ homeautomation_default_logging }}"
          ports:
            - "{{ homeautomation_piper_port }}:10200"
          restart: unless-stopped
          security_opt: "{{ homeautomation_no_new_privileges }}"
          user: "{{ homeautomation_piper_uid }}:{{ homeautomation_piper_gid }}"
          volumes: "{{ piper_volumes }}"

        whisper:
          # http://whisper.internal:10300
          container_name: whisper
          image: "{{ homeautomation_whisper_docker_image }}"
          cap_drop: "{{ homeautomation_unprivileged_cap_drop }}"
          command: "{{ homeautomation_whisper_command }}"
          # huggingface_hub caches the tokenizer under $HOME, not --data-dir, and
          # the uid has no passwd entry, so $HOME would be / and unwritable.
          environment:
            HOME: /data
          logging: "{{ homeautomation_default_logging }}"
          ports:
            - "{{ homeautomation_whisper_port }}:10300"
          restart: unless-stopped
          security_opt: "{{ homeautomation_no_new_privileges }}"
          user: "{{ homeautomation_whisper_uid }}:{{ homeautomation_whisper_gid }}"
          volumes: "{{ whisper_volumes }}"
  notify: Update /etc/hosts
