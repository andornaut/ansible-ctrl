---
# configuration.yaml is mostly per-host, so ansible takes the frontend key
# through an include rather than templating the whole file. www.yml installs
# card-mod.js, but a module is only loaded if extra_module_url names it: a host
# that has the file and not the setting renders every card_mod block as though
# it were absent, and reports no error.
# Home Assistant writes configuration.yaml on its first start, which docker_homeassistant.yml
# performs after this file runs.
- name: Check for configuration.yaml
  ansible.builtin.stat:
    path: "{{ homeautomation_homeassistant_required_volumes.config }}/configuration.yaml"
  register: homeautomation_configuration_yaml_stat
  become: true

- name: Report the deferred frontend configuration
  ansible.builtin.debug:
    msg: >-
      configuration.yaml does not exist yet, so the frontend integration is not configured.
      Once Home Assistant has started and written it, replace its frontend: block with
      "frontend: !include frontend.yaml"; the next run then installs frontend.yaml.
  when: not homeautomation_configuration_yaml_stat.stat.exists

- name: Configure the frontend integration
  become: true
  when: homeautomation_configuration_yaml_stat.stat.exists
  block:
    - name: Install frontend.yaml
      ansible.builtin.template:
        src: frontend.yaml.j2
        dest: "{{ homeautomation_homeassistant_required_volumes.config }}/frontend.yaml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart homeassistant

    - name: Read configuration.yaml
      ansible.builtin.slurp:
        path: "{{ homeautomation_homeassistant_required_volumes.config }}/configuration.yaml"
      register: homeautomation_configuration_yaml

    # configuration.yaml is hand-maintained, so a host that never got the include
    # would leave the frontend key unmanaged and silently unchanged.
    - name: Assert that configuration.yaml includes frontend.yaml
      ansible.builtin.assert:
        that:
          - "'frontend: !include frontend.yaml' in (homeautomation_configuration_yaml.content | b64decode)"
        fail_msg: >-
          configuration.yaml does not include frontend.yaml, so extra_module_url is
          unmanaged and card-mod will not load. Replace its frontend: block with
          "frontend: !include frontend.yaml" and re-run.
        quiet: true
