---
# Install a subpath of a GitHub project's latest stable release archive.
#
# Required vars:
#   github_component_name (str): display name, used in task names
#   github_component_repo (str): "owner/repo"
#   github_component_src  (str): path inside the extracted archive
#
# Optional vars:
#   github_component_dest (str): destination directory, defaulting to Home
#     Assistant's custom_components/
#
# Skipped when the installed manifest.json names the latest tag. The archive is repository
# source, so a project leaving a placeholder version there, or bumping it after tagging, is
# reinstalled every run; so is a bare-file component, which has no manifest.
- name: Install the latest GitHub release of {{ github_component_name }}
  vars:
    github_component_dest_dir: >-
      {{ github_component_dest
      | default(homeautomation_homeassistant_required_volumes.config + '/custom_components/') }}
  block:
    # A component tracked here has shipped a newer stable release without moving the
    # /releases/latest pointer, and following it would silently downgrade the install.
    - name: Get the latest stable release of {{ github_component_name }}
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: "{{ github_component_repo }}"
        release_fact: homeautomation_github_component_release
        release_stable: true

    - name: Set version fact for {{ github_component_name }}
      ansible.builtin.set_fact:
        homeautomation_github_component_version: "{{ homeautomation_github_component_release.tag_name }}"

    # A missing or unreadable manifest fails here, leaving the version below empty,
    # which reinstalls.
    - name: Read the installed manifest of {{ github_component_name }}
      ansible.builtin.slurp:
        src: "{{ github_component_dest_dir }}/{{ github_component_src | basename }}/manifest.json"
      register: homeautomation_github_component_manifest
      failed_when: false
      become: true

    - name: Set installed version fact for {{ github_component_name }}
      ansible.builtin.set_fact:
        homeautomation_github_component_installed: >-
          {{ (homeautomation_github_component_manifest.content | b64decode | from_json).version | default('')
          if homeautomation_github_component_manifest.content is defined else '' }}

    - name: Update the installed files of {{ github_component_name }}
      # Tags carry a leading v that the manifest version does not.
      when: >-
        homeautomation_github_component_installed
        != homeautomation_github_component_version | regex_replace('^v', '')
      # The temporary directory is scratch, so only the install reports a change.
      block:
        - name: Create a temporary directory for {{ github_component_name }}
          become: true
          ansible.builtin.tempfile:
            state: directory
          register: homeautomation_github_component_tmp
          changed_when: false
          check_mode: false

        # GitHub closes some connections without a response, and one failed fetch aborts
        # every component after it. Retried unconditionally: the module raises the same
        # failure for a transient close as for a deterministic one, so the two cannot be
        # told apart the way the release listing's status code tells them apart above.
        - name: Download and unarchive {{ github_component_name }}
          become: true
          ansible.builtin.unarchive:
            src: >-
              https://github.com/{{ github_component_repo }}/archive/refs/tags/{{
              homeautomation_github_component_version }}.tar.gz
            dest: "{{ homeautomation_github_component_tmp.path }}"
            remote_src: true
            extra_opts:
              - --strip-components
              - 1
          register: homeautomation_github_component_unarchive
          retries: 3
          delay: 5
          until: homeautomation_github_component_unarchive is succeeded
          changed_when: false

        # Skipped under --check, where the unarchive above honours check mode and writes
        # nothing, so the tree these copy from is not there and the task fails rather
        # than reporting. Without this a --check run of the role stops at the first
        # component whose version does not match, which is every component whose project
        # ships a placeholder version.
        - name: Check whether the source is a directory for {{ github_component_name }}
          when: not ansible_check_mode
          ansible.builtin.stat:
            path: "{{ homeautomation_github_component_tmp.path }}/{{ github_component_src }}"
          register: homeautomation_github_component_src_stat
          become: true

        # A directory is mirrored, so a module an upstream release dropped leaves too. The
        # __pycache__ Home Assistant writes is protected: deleting it would report a change and
        # restart Home Assistant on every run that reinstalls a component.
        # --omit-dir-times: the staging tree is new each run and would otherwise report a
        # change every time.
        - name: Install files for {{ github_component_name }}
          when: not ansible_check_mode
          vars:
            homeautomation_github_component_is_dir: >-
              {{ homeautomation_github_component_src_stat.stat.isdir | default(false) }}
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '--recursive', '--links', '--times', '--omit-dir-times',
                  '--chmod=D0755,F0644', '--itemize-changes', '--filter=P __pycache__/']
                 + (['--delete',
                     homeautomation_github_component_tmp.path ~ '/' ~ github_component_src ~ '/',
                     github_component_dest_dir ~ '/' ~ (github_component_src | basename) ~ '/']
                    if homeautomation_github_component_is_dir | bool else
                    [homeautomation_github_component_tmp.path ~ '/' ~ github_component_src,
                     github_component_dest_dir ~ '/'])
              }}
          register: homeautomation_github_component_sync
          changed_when: homeautomation_github_component_sync.stdout != ""
          become: true
          # Home Assistant loads an integration only at startup. A card under www/ is fetched by
          # the browser on the next page load, and needs no restart.
          notify: >-
            {{ ['Restart homeassistant']
            if github_component_dest_dir is search('/custom_components/?$') else [] }}
      always:
        - name: Remove the temporary directory for {{ github_component_name }}
          ansible.builtin.file:
            path: "{{ homeautomation_github_component_tmp.path }}"
            state: absent
          when: homeautomation_github_component_tmp.path is defined
          become: true
          changed_when: false
          # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
          check_mode: false
