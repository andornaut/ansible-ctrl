---
- name: Validate mDNS configuration
  tags:
    - avahi
    - docker
    - matter
  block:
    - name: Check for mDNS service conflicts
      ansible.builtin.assert:
        that:
          - not (homeautomation_install_avahi | bool and (homeautomation_install_matterjs | bool or homeautomation_install_legacy_pythonmatterserver | bool))
          - not (homeautomation_install_matterjs | bool and homeautomation_install_legacy_pythonmatterserver | bool)
        fail_msg: >-
          Cannot enable Avahi alongside Matter/Thread (both run a host mDNS
          responder, which conflict), nor both Matter servers at once.
        success_msg: "mDNS configuration validated"

    - name: Show the mDNS provisioning plan
      ansible.builtin.debug:
        msg: |
          {% if homeautomation_install_matterjs | bool or homeautomation_install_legacy_pythonmatterserver | bool %}
          Provisioning Matter/Thread (OTBR host mDNS), so Avahi will be disabled
          {% elif homeautomation_install_avahi | bool %}
          Provisioning Avahi, so Matter/Thread (OTBR) will not be provisioned
          {% endif %}
      when: homeautomation_install_matterjs | bool or homeautomation_install_legacy_pythonmatterserver | bool or homeautomation_install_avahi | bool

    # Ubuntu Server ships no avahi-daemon, and systemd_service fails on a unit it
    # cannot find whenever enabled is set. Stat both branches: the mask below has to
    # be lifted again when the flag is turned back on.
    - name: Check for the host Avahi units
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/{{ item }}"
      register: homeautomation_avahi_units
      become: true
      loop:
        - avahi-daemon.socket
        - avahi-daemon.service

    # Before avahi.yml: a masked unit cannot be started, so the package's postinst and
    # the Restart Avahi handler both fail against one left masked by an earlier run.
    - name: Unmask host Avahi units when needed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        masked: false
      become: true
      loop: "{{ homeautomation_avahi_units.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - homeautomation_install_avahi | bool
        - item.stat.exists | default(false)

    - name: Import Avahi tasks
      ansible.builtin.import_tasks: avahi.yml
      when: homeautomation_install_avahi | bool

    # Masked, not just disabled: cups-browsed declares Wants=avahi-daemon.service and
    # the units carry a D-Bus activation file, either of which starts a disabled unit.
    # Only a mask refuses both.
    - name: Disable and mask host Avahi daemon when not needed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
        enabled: false
        masked: true
      become: true
      # The socket first: it can spawn the service.
      loop: "{{ homeautomation_avahi_units.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not homeautomation_install_avahi | bool
        - item.stat.exists | default(false)

# Tagged with docker and homeassistant as well: the Home Assistant container starts under the
# AppArmor profile this loads, and docker refuses one the kernel does not have.
- name: Import Bluetooth tasks
  ansible.builtin.import_tasks: bluetooth.yml
  tags: [bluetooth, docker, homeassistant]

- name: Import MemryX tasks
  ansible.builtin.import_tasks: memryx.yml
  tags: memryx
  when: homeautomation_install_memryx | bool

- name: Import OTBR tasks
  ansible.builtin.import_tasks: otbr.yml
  tags: otbr
  when: homeautomation_install_matterjs | bool or homeautomation_install_legacy_pythonmatterserver | bool

- name: Install customizations
  tags: customizations
  block:
    - name: Import custom components tasks
      ansible.builtin.import_tasks: custom_components.yml
    - name: Import themes tasks
      ansible.builtin.import_tasks: themes.yml
    - name: Import www tasks
      ansible.builtin.import_tasks: www.yml
    # After www.yml, so the modules it names are on disk before HA restarts.
    - name: Import frontend tasks
      ansible.builtin.import_tasks: frontend.yml

- name: Configure Docker containers
  tags: docker
  block:
    - name: Import Docker prerequisites tasks
      ansible.builtin.import_tasks: docker_prerequisites.yml
      tags:
        - esphome
        - frigate
        - hamcp
        - homeassistant
        - llm
        - matter
        - mosquitto
        - voice

    # Before the imports below, so a removed component releases its name, ports
    # and devices first.
    - name: Remove the components this host does not install
      ansible.builtin.import_tasks: teardown.yml
      tags: teardown

    # After the prerequisites, which read the passwd database, and before Home
    # Assistant, where the broker container is defined.
    - name: Import Mosquitto tasks
      ansible.builtin.import_tasks: mosquitto.yml
      tags:
        - homeassistant
        - mosquitto

    # First: it creates the shared bridge network.
    - name: Import Home Assistant Docker tasks
      ansible.builtin.import_tasks: docker_homeassistant.yml
      tags: homeassistant

    - name: Work around aioruckus HEAD/aiohttp 3.14 incompatibility
      ansible.builtin.import_tasks: patch_aioruckus_head.yml
      tags: homeassistant
      when: homeautomation_homeassistant_patch_aioruckus_head | bool

    # Before docker_frigate, which may depend on llama.cpp.
    - name: Import LLM Docker tasks
      ansible.builtin.import_tasks: docker_llm.yml
      tags: llm
      when: homeautomation_install_llm | bool

    # Before the matter server containers.
    - name: Import OTBR Docker tasks
      ansible.builtin.import_tasks: docker_otbr.yml
      tags: matter
      when: homeautomation_install_matterjs | bool or homeautomation_install_legacy_pythonmatterserver | bool

    - name: Import Matter.js Docker tasks
      ansible.builtin.import_tasks: docker_matterjs.yml
      tags: matter
      when: homeautomation_install_matterjs | bool

    - name: Import Python Matter Server Docker tasks
      ansible.builtin.import_tasks: docker_pythonmatterserver.yml
      tags: matter
      when: homeautomation_install_legacy_pythonmatterserver | bool

    # The rest are unordered.
    - name: Import ESPHome Docker tasks
      ansible.builtin.import_tasks: docker_esphome.yml
      tags: esphome
      when: homeautomation_install_esphome | bool

    - name: Import Frigate Docker tasks
      ansible.builtin.import_tasks: docker_frigate.yml
      tags: frigate
      when: homeautomation_install_frigate | bool

    - name: Import ha-mcp Docker tasks
      ansible.builtin.import_tasks: docker_hamcp.yml
      tags: hamcp
      when: homeautomation_install_hamcp | bool

    - name: Import Voice Docker tasks
      ansible.builtin.import_tasks: docker_voice.yml
      tags: voice
      when: homeautomation_install_voice | bool

- name: Import router kernel address space sampler tasks
  ansible.builtin.import_tasks: router_kva_sample.yml
  tags: router-kva-sample

# Last: it reaches hosts of its own, and one that cannot take the install must not stop
# this host from being configured.
- name: Import adb-auto-enable tasks
  ansible.builtin.import_tasks: adb_auto_enable.yml
  when: homeautomation_install_adb_auto_enable | bool
