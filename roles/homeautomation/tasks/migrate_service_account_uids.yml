---
# CLEANUP (added 2026-08-08): the uids were handed out in the order services
# were added, so the numbers read in no order at all. They were reassigned once
# to run alphabetically, which moves six of them, and this is what moves a host
# already carrying the old numbering.
#
# One time only. Numbering is append-only from here, so nothing should need
# renumbering again and this file goes away rather than becoming a fixture.
#
# The files move with the accounts, here rather than in each service's own
# service_account.yml: that call only runs for a service whose install flag is
# set, and a cleared flag removes neither the account nor its volumes, so a
# service that is off would be left holding a number that now belongs to another
# one. The files are found by the number they carry rather than by a list of
# paths, because which paths a service account owns is a property of the image:
# llama.cpp's models directory stays root-owned and is deliberately not among
# them, and a list here would not know that.
#
# Delete once every host in the homeautomation group has run this.

- name: Find the service accounts that are not on their allocated uid
  ansible.builtin.set_fact:
    homeautomation_uid_migrations: >-
      {{ homeautomation_uid_migrations | default([]) + [item] }}
  loop: "{{ homeautomation_service_account_uids | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.key in ansible_facts['getent_passwd']
    - ansible_facts['getent_passwd'][item.key][1] != item.value | string

- name: Renumber the service accounts
  when: homeautomation_uid_migrations | default([]) | length > 0
  become: true
  block:
    # Stopped first. Between the renumber and a service's own chown its files
    # are owned by a number that now belongs to a different service, and nothing
    # should be executing as either account while that is true. The play removes
    # and recreates these containers further down regardless.
    #
    # Which of them exist is asked separately, because docker_container with
    # state: stopped and no image errors on a container that is absent, and the
    # ignored error that hides would also hide a stop that failed. The stop has
    # to succeed: usermod refuses to renumber an account a running process
    # belongs to, and a skipped stop fails the rotation below with the groups
    # already moved.
    - name: Find which of the services being renumbered have a container
      community.docker.docker_container_info:
        name: "{{ item.key }}"
      loop: "{{ homeautomation_uid_migrations }}"
      loop_control:
        label: "{{ item.key }}"
      register: homeautomation_uid_migration_containers

    - name: Stop the containers of the services being renumbered
      community.docker.docker_container:
        name: "{{ item.item.key }}"
        state: stopped
      loop: "{{ homeautomation_uid_migration_containers.results | selectattr('exists') }}"
      loop_control:
        label: "{{ item.item.key }}"

    # Parked on a spare range before being moved, because the new assignment is
    # a rotation: every target number is held by another account until that one
    # moves, so no ordering of direct moves avoids a collision. 11001 up is
    # outside both the range these are allocated from and the range adduser
    # hands out.
    #
    # The group leads in each pair: usermod resolves the name to whatever gid
    # the group holds at that moment, so moving the group second would leave the
    # account pointing at the old number.
    - name: Park the groups on a temporary gid
      ansible.builtin.group:
        name: "{{ item.key }}"
        gid: "{{ 11001 + index }}"
      loop: "{{ homeautomation_uid_migrations }}"
      loop_control:
        label: "{{ item.key }}"
        index_var: index

    - name: Park the accounts on a temporary uid
      ansible.builtin.user:
        name: "{{ item.key }}"
        uid: "{{ 11001 + index }}"
        group: "{{ item.key }}"
      loop: "{{ homeautomation_uid_migrations }}"
      loop_control:
        label: "{{ item.key }}"
        index_var: index

    - name: Move the groups to their allocated gid
      ansible.builtin.group:
        name: "{{ item.key }}"
        gid: "{{ item.value }}"
      loop: "{{ homeautomation_uid_migrations }}"
      loop_control:
        label: "{{ item.key }} -> {{ item.value }}"

    - name: Move the accounts to their allocated uid
      ansible.builtin.user:
        name: "{{ item.key }}"
        uid: "{{ item.value }}"
        group: "{{ item.key }}"
      loop: "{{ homeautomation_uid_migrations }}"
      loop_control:
        label: "{{ item.key }} -> {{ item.value }}"

    # One traversal, with a branch per account, and straight onto the allocated
    # numbers. The accounts need a parked range because each is renamed
    # separately and a target is held until its holder moves; find reads each
    # file's ownership once, on its single visit, so a branch matches on what the
    # file carried before any of them ran. A pass per account would need the
    # parked range for the same reason the accounts do, and would sweep this tree
    # a dozen times to get it: most of what is under here is the Frigate
    # recording archive, which no account being renumbered owns.
    #
    # -exec ... + always evaluates true, so -o stops at the first branch a file
    # matches. Numbers rather than names, because a name resolves to whatever the
    # account holds at that moment and that is what has just moved. Either number
    # matches: an account owns its files exclusively and its gid equals its uid,
    # so nothing here carries one without the other, and what a service does not
    # own -- the root-owned models directory llama.cpp mounts read-only -- carries
    # neither and is left alone.
    - name: Move the files to their allocated uid
      ansible.builtin.command:
        argv: "{{ homeautomation_uid_file_argv | from_json }}"
      vars:
        homeautomation_uid_file_argv: >-
          {%- set argv = ['find', '/var/docker-volumes/homeautomation'] -%}
          {%- for migration in homeautomation_uid_migrations -%}
          {%- set was = ansible_facts['getent_passwd'][migration.key] -%}
          {%- if not loop.first -%}{%- set _ = argv.append('-o') -%}{%- endif -%}
          {%- set _ = argv.extend([
              '(', '-uid', was[1], '-o', '-gid', was[2], ')', '-print',
              '-exec', 'chown', migration.value ~ ':' ~ migration.value, '{}', '+'
            ]) -%}
          {%- endfor -%}
          {{ argv | to_json }}
      register: homeautomation_uid_files
      changed_when: homeautomation_uid_files.stdout | length > 0

    # The facts were read before any of this, and service_account.yml checks a
    # uid against them before creating an account. Left stale, every one of those
    # checks would compare against the numbering this just replaced.
    - name: Re-read the passwd and group databases after renumbering
      ansible.builtin.getent:
        database: "{{ item }}"
      loop:
        - group
        - passwd
      when: not ansible_check_mode

    # A check run moves nothing, so the databases still hold the old numbering
    # and re-reading them would hand every later uid check a collision the real
    # run resolves. The move is applied to the facts instead, so --check reports
    # what the run would do rather than failing on an unconverged host. Cacheable
    # because the checks read ansible_facts, which a plain set_fact does not
    # reach. Fields: passwd is [password, uid, gid, ...], group [password, gid, ...].
    # Unprefixed because these overwrite the getent facts rather than declaring
    # anything of the role's, hence the noqa.
    - name: Apply the renumbering to the facts under check mode # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        getent_passwd: >-
          {{ ansible_facts['getent_passwd'] | combine({item.key:
             ansible_facts['getent_passwd'][item.key][:1]
             + [item.value | string, item.value | string]
             + ansible_facts['getent_passwd'][item.key][3:]}) }}
        getent_group: >-
          {{ ansible_facts['getent_group'] | combine({item.key:
             ansible_facts['getent_group'][item.key][:1] + [item.value | string]
             + ansible_facts['getent_group'][item.key][2:]}) }}
        cacheable: true
      loop: "{{ homeautomation_uid_migrations }}"
      loop_control:
        label: "{{ item.key }} -> {{ item.value }}"
      when: ansible_check_mode
