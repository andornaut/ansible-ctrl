---
# The image's entrypoint chowns /mosquitto/data only when it starts as uid 0, and
# the container names a user. Docker would otherwise create the bind-mount sources
# root-owned, which the broker cannot write its database or log into.
- name: Create the Mosquitto service account
  ansible.builtin.include_tasks: service_account.yml
  vars:
    service_account_name: mosquitto
    service_account_uid: "{{ homeautomation_mosquitto_uid }}"
    # The image's own uid, not one allocated from this role's range.
    service_account_uid_from_image: true
    service_account_paths:
      - "{{ homeautomation_mosquitto_required_volumes.data }}"
      - "{{ homeautomation_mosquitto_required_volumes.log }}"
    service_account_mode: "0700"

# Not owned by the broker, which only reads it: this role is the only writer, and
# group-readable gives the broker the traversal it needs and nothing wider.
- name: Create the Mosquitto configuration directory
  ansible.builtin.file:
    path: "{{ homeautomation_mosquitto_required_volumes.config }}"
    state: directory
    owner: root
    group: mosquitto
    mode: "0750"
  become: true

- name: Copy mosquitto.conf
  ansible.builtin.copy:
    src: mosquitto/mosquitto.conf
    dest: "{{ homeautomation_mosquitto_required_volumes.config }}/"
    owner: root
    group: mosquitto
    mode: "0640"
  become: true
