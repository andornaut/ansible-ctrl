---
# The image's entrypoint chowns /mosquitto/data only when it starts as uid 0,
# and the container names a user, so it never does. Nothing else would create
# these either: Docker makes a missing bind-mount source root-owned, and the
# broker cannot write its persistence database or its log into that. So they
# are created here, before the container starts.
- name: Create the Mosquitto service account
  ansible.builtin.include_tasks: service_account.yml
  vars:
    service_account_name: mosquitto
    service_account_uid: "{{ homeautomation_mosquitto_uid }}"
    # 1883 is below the range the other service accounts come from because it
    # is the image's own uid, not one allocated here.
    service_account_uid_from_image: true
    service_account_paths:
      - "{{ homeautomation_mosquitto_required_volumes.data }}"
      - "{{ homeautomation_mosquitto_required_volumes.log }}"
    service_account_mode: "0700"

# Not owned by the broker, which only reads it: the config is mounted read-only
# and this role is its only writer. Group-readable rather than world-readable so
# the traversal the broker needs is the only access anything else gets.
- name: Create the Mosquitto configuration directory
  ansible.builtin.file:
    path: "{{ homeautomation_mosquitto_required_volumes.config }}"
    state: directory
    owner: root
    group: mosquitto
    mode: "0750"
  become: true

- name: Copy mosquitto.conf
  ansible.builtin.copy:
    src: mosquitto/mosquitto.conf
    dest: "{{ homeautomation_mosquitto_required_volumes.config }}/"
    owner: root
    group: mosquitto
    mode: "0640"
  become: true
