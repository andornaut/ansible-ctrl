---
# aioruckus sends HTTP HEAD during login, the controller answers with a body, and aiohttp
# 3.14+ rejects that as a fatal parse error. GET returns the same status, headers and
# Location. Reapplied every run, Home Assistant reinstalling aioruckus on each recreate.
# Remove once fixed: https://github.com/ms264556/aioruckus/issues/14
- name: Wait for aioruckus to be installed in the Home Assistant container
  become: true
  community.docker.docker_container_exec:
    container: homeassistant
    argv:
      - python3
      - -c
      - "import aioruckus, inspect, os; print(os.path.join(os.path.dirname(inspect.getfile(aioruckus)), 'ajaxsession.py'))"
  register: homeautomation_aioruckus
  changed_when: false
  # Skipped under --check rather than run: the patch below cannot be applied there anyway,
  # docker_container_exec supporting no check mode, and on a host whose container this run
  # would only have reported creating, the wait would spend its full thirty attempts first.
  when: not ansible_check_mode
  # Exhausting the retries marks the task failed whatever failed_when says, so the wait is
  # left to fail the play: a host that never installs aioruckus cannot be patched.
  retries: 30
  delay: 10
  # default(1): the module returns rc only when the exec ran. A container that is missing,
  # paused or still starting fails with a message and no rc, which is the case this wait
  # exists for, and reading the attribute directly raises instead of retrying.
  until: homeautomation_aioruckus.rc | default(1) == 0

- name: Patch aioruckus to use GET instead of HEAD
  become: true
  community.docker.docker_container_exec:
    container: homeassistant
    argv:
      - sh
      - -c
      - >-
        f='{{ homeautomation_aioruckus.stdout | trim }}';
        grep -q 'self.websession.head(' "$f" || exit 0;
        sed -i 's/self\.websession\.head(/self.websession.get(/g' "$f" &&
        echo patched
  register: homeautomation_aioruckus_patch
  changed_when: "'patched' in homeautomation_aioruckus_patch.stdout"
  when: homeautomation_aioruckus.rc | default(1) == 0
  notify: Restart homeassistant
