---
# Frigate 0.18.0 restarts a stale record process on every watchdog pass, about once a second,
# with no backoff and no grace period, so the new ffmpeg never lives long enough to write a
# segment and every restart reopens the camera's stream. The patched module paces those
# restarts by ffmpeg.retry_interval and grants the enable-time grace period after each one.
# It replaces the whole module, so it is mounted only over the release it was cut from.
# WORKAROUND: https://github.com/blakeblackshear/frigate/pull/24072 (remove once released)
- name: Pull the Frigate image
  community.docker.docker_image_pull:
    name: "{{ homeautomation_frigate_docker_image }}"
  become: true

- name: Read the Frigate image's version
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --pull=never
      - --entrypoint
      - cat
      - "{{ homeautomation_frigate_docker_image }}"
      - /opt/frigate/frigate/version.py
  register: homeautomation_frigate_version_py
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Install the patched Frigate record watchdog
  ansible.builtin.copy:
    src: "frigate/ffmpeg-{{ homeautomation_frigate_record_watchdog_patch_version }}.py"
    dest: "{{ homeautomation_frigate_record_watchdog_patch_path }}"
    owner: root
    group: root
    mode: "0644"
  when: homeautomation_frigate_record_watchdog_patched | bool
  become: true

- name: Report that the Frigate record watchdog patch no longer applies
  ansible.builtin.debug:
    msg: >-
      The Frigate image is not {{ homeautomation_frigate_record_watchdog_patch_version }}, so the
      record watchdog patch is not mounted. Once a release carries
      https://github.com/blakeblackshear/frigate/pull/24072, delete
      tasks/patch_frigate_record_watchdog.yml and files/frigate/.
  when: not homeautomation_frigate_record_watchdog_patched | bool
  become: false
