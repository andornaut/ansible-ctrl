---
# Records a pfSense router's remaining kernel virtual address space in Home Assistant. Here
# rather than in the router role: it runs on the Home Assistant host, borrows a token from
# the ha-mcp container this role installs, and writes an entity. The router is the data
# source and nothing more.
#
# Off unless a host asks for it. Home Assistant owns the threshold, so what is alert-worthy
# changes in an automation rather than here.
- name: Sample the router's kernel address space
  when: homeautomation_install_router_kva_sample | bool
  block:
    - name: Assert the router kernel address space sampler is configured
      ansible.builtin.assert:
        that:
          - homeautomation_router_kva_sample_host | length > 0
          - homeautomation_router_kva_sample_entity_id | length > 0
          - homeautomation_router_kva_sample_user != "root"
        fail_msg: >-
          homeautomation_install_router_kva_sample needs
          homeautomation_router_kva_sample_host and
          homeautomation_router_kva_sample_entity_id set in host_vars, and a
          homeautomation_router_kva_sample_user that is not root.
        quiet: true
      become: false

    - name: Install router-kva-sample
      ansible.builtin.copy:
        src: router-kva-sample
        dest: /usr/local/bin/router-kva-sample
        mode: "0755"
      become: true

    # As the primary user rather than root: the key that reaches the router and the docker
    # group that reads the token are that account's, and root's ssh configuration on this
    # host is hand-maintained rather than provisioned here.
    - name: Periodically run router-kva-sample
      ansible.builtin.cron:
        name: router-kva-sample
        cron_file: /etc/cron.d/ansible-role-homeautomation
        user: "{{ homeautomation_router_kva_sample_user }}"
        minute: "{{ homeautomation_router_kva_sample_minute }}"
        job: >-
          /usr/local/bin/router-kva-sample
          {{ homeautomation_router_kva_sample_host | quote }}
          {{ homeautomation_router_kva_sample_entity_id | quote }}
          {{ homeautomation_router_kva_sample_container | quote }}
      become: true
