---
# Create the host account one container runs as, and take ownership of the
# paths it bind-mounts. Callers set service_account_name (the container's own
# name, so a stray file on the host says which service wrote it),
# service_account_uid, service_account_paths and service_account_mode.
#
# Its own uid for every container that does not run as root. A container given
# the operator's uid holds the operator's identity on every bind mount it
# writes, and one given a system account's uid inherits whatever that account
# exists for. Both were true here before this file: seven services ran as uid
# 1000, and ha-mcp still runs as the uid systemd-coredump owns.
#
# Above 10000 to stay clear of the range adduser allocates human accounts from
# and of the system range a package might claim later. The gid always equals
# the uid, so a service's files never land in a group another account can be
# joined to.
#
# A caller whose uid is baked into its image cannot honour that and sets
# service_account_uid_from_image instead. The account is still created, so the
# uid is claimed on the host rather than left free for adduser to hand out, and
# a stray file reports a name rather than a bare number.
#
# Called by each docker_*.yml rather than from one central place: what a
# container writes, and where, changes with the image, so the task that knows
# the image is the one that has to keep up with it.

- name: Validate the service account for {{ service_account_name }}
  ansible.builtin.assert:
    that:
      - service_account_name | length > 0
      - service_account_uid | int > 10000 or service_account_uid_from_image | default(false)
      # Free, or already ours from an earlier run. Anything else means this
      # host gave the uid away before the role asked for it, and chowning to it
      # would hand the service's files to an unrelated account.
      - service_account_uid_owner in ["", service_account_name]
    fail_msg: >-
      uid {{ service_account_uid }} for {{ service_account_name }} must be above
      10000, or declared service_account_uid_from_image, and free
      {{ ", but it belongs to " ~ service_account_uid_owner
         if service_account_uid_owner else "" }}.
    quiet: true
  vars:
    service_account_uid_owner: >-
      {{ ansible_facts['getent_passwd'] | dict2items
         | selectattr('value.1', 'equalto', service_account_uid | string)
         | map(attribute='key') | list | first | default('') }}

- name: Create the group for {{ service_account_name }}
  ansible.builtin.group:
    name: "{{ service_account_name }}"
    gid: "{{ service_account_uid }}"
  become: true

# No home and no shell: nothing logs in as these, they only own files.
- name: Create the service account for {{ service_account_name }}
  ansible.builtin.user:
    name: "{{ service_account_name }}"
    uid: "{{ service_account_uid }}"
    group: "{{ service_account_name }}"
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  become: true

- name: Own the bind-mounted directories of {{ service_account_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_account_name }}"
    group: "{{ service_account_name }}"
    mode: "{{ service_account_mode }}"
  loop: "{{ service_account_paths }}"
  become: true

# CLEANUP (added 2026-08-07): repairs the contents of directories filled under
# the old scheme, when these services ran as uid 1000 and everything they wrote
# was born owned by the operator. The task above fixes the directory itself; on
# a host provisioned from now on the files inside it are created correctly and
# this has nothing to do. Delete once every host in the homeautomation group
# has run this role.
#
# Owner and group only. The files inside these directories carry modes their
# service chose, and reasserting one mode across all of them would be a guess
# about an image's internals that changes with the image.
- name: Migrate files from the previous owner of {{ service_account_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_account_name }}"
    group: "{{ service_account_name }}"
    recurse: true
  loop: "{{ service_account_paths }}"
  become: true
