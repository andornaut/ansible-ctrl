---
# Create the host account one container runs as, and own the paths it bind-mounts.
# Included by each docker_*.yml, which is what knows the image.
#
# Required vars:
#   service_account_name (str): the container's own name, so a stray file on the
#     host says which service wrote it
#   service_account_uid (str), service_account_paths (list), service_account_mode (str)
#
# Optional vars:
#   service_account_uid_from_image (bool): the uid is baked into the image. The
#     account is still created, so the uid is claimed rather than left for adduser
#     and a stray file reports a name rather than a number.
#
# A uid of its own for every non-root container: the operator's uid would put the
# operator's identity on every bind mount, and a system account's would inherit
# whatever that account exists for. Above 10000, clear of both the adduser range
# and the system range. The gid always equals the uid, so a service's files never
# land in a group another account can join.

- name: Validate the service account for {{ service_account_name }}
  ansible.builtin.assert:
    that:
      - service_account_name | length > 0
      - service_account_uid | int > 10000 or service_account_uid_from_image | default(false)
      # Free, or already ours: chowning to a uid this host gave away would hand
      # the service's files to an unrelated account.
      - service_account_uid_owner in ["", service_account_name]
      # Checked here, or groupadd fails on the same number with a raw error.
      - service_account_gid_owner in ["", service_account_name]
    fail_msg: >-
      uid {{ service_account_uid }} for {{ service_account_name }} must be above
      10000, or declared service_account_uid_from_image, and free
      {{ ", but the uid belongs to " ~ service_account_uid_owner
         if service_account_uid_owner else "" }}
      {{ ", but the gid belongs to group " ~ service_account_gid_owner
         if service_account_gid_owner else "" }}.
    quiet: true
  vars:
    service_account_uid_owner: >-
      {{ ansible_facts['getent_passwd'] | dict2items
         | selectattr('value.1', 'equalto', service_account_uid | string)
         | map(attribute='key') | list | first | default('') }}
    service_account_gid_owner: >-
      {{ ansible_facts['getent_group'] | dict2items
         | selectattr('value.1', 'equalto', service_account_uid | string)
         | map(attribute='key') | list | first | default('') }}

- name: Create the group for {{ service_account_name }}
  ansible.builtin.group:
    name: "{{ service_account_name }}"
    gid: "{{ service_account_uid }}"
  become: true

# No home and no shell: nothing logs in as these, they only own files.
- name: Create the service account for {{ service_account_name }}
  ansible.builtin.user:
    name: "{{ service_account_name }}"
    uid: "{{ service_account_uid }}"
    group: "{{ service_account_name }}"
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  become: true

- name: Own the bind-mounted directories of {{ service_account_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_account_name }}"
    group: "{{ service_account_name }}"
    mode: "{{ service_account_mode }}"
  loop: "{{ service_account_paths }}"
  become: true
