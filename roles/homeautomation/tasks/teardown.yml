---
# Clearing an install flag only stops the role configuring a component, so this
# removes what homeautomation_teardown lists for it. Never the volumes: a flag
# cleared by accident would take the only copy of a service's data with it.

- name: Remove the containers of components that are not installed
  become: true
  community.docker.docker_container:
    name: "{{ item.1 }}"
    state: absent
  loop: "{{ homeautomation_teardown | rejectattr('install') | subelements('containers') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Remove the host files of components that are not installed
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: absent
  loop: >-
    {{ homeautomation_teardown | rejectattr('install')
       | subelements('files', skip_missing=true) }}
  loop_control:
    label: "{{ item.1 }}"
  become: true
  notify: Reload sysctl

# CLEANUP (added 2026-08-22): delete once every host running this role has converged.
# The service accounts are given /nonexistent as a home so that they have none. An earlier
# uid allocation left a real directory there, owned by one of those accounts under a gid
# that allocation has since reassigned, so a home meant not to exist does.
#
# Removed only when empty. Anything inside was written by an account that was meant to have
# nowhere to write, which is a finding to read rather than something to delete unseen.
- name: Remove the placeholder home an earlier uid allocation left behind
  become: true
  block:
    - name: Look for the placeholder home
      ansible.builtin.stat:
        path: /nonexistent
      register: homeautomation_placeholder_home

    - name: List what it holds
      ansible.builtin.find:
        paths: /nonexistent
        file_type: any
        hidden: true
      register: homeautomation_placeholder_contents
      when: homeautomation_placeholder_home.stat.isdir | default(false)

    - name: Require it to be empty before removing it
      ansible.builtin.assert:
        that: homeautomation_placeholder_contents.files | length == 0
        fail_msg: >-
          /nonexistent holds {{ homeautomation_placeholder_contents.files | length }}
          entries, so an account meant to have no home has been writing to one. Read them,
          then remove the directory by hand.
        quiet: true
      when: homeautomation_placeholder_contents.files is defined

    - name: Remove it
      ansible.builtin.file:
        path: /nonexistent
        state: absent
      when:
        - homeautomation_placeholder_home.stat.isdir | default(false)
        - homeautomation_placeholder_contents.files | default([]) | length == 0

# CLEANUP (added 2026-08-22): delete once the host running home automation has
# converged. A timer here used to reclaim adb on the Android TVs and re-arm the
# app that enables wireless debugging at boot. The app now repairs its own boot
# receiver, so nothing on this side has a job, and these are what it left behind.
- name: Remove the TV adb keepalive this role no longer installs
  block:
    - name: Check for the TV adb keepalive timer unit
      ansible.builtin.stat:
        path: /etc/systemd/system/homeautomation-tv-adb.timer
      register: homeautomation_tv_adb_unit
      become: true

    # Before the unit files go, or systemd has nothing left to stop it by.
    - name: Stop and disable the TV adb keepalive timer
      ansible.builtin.systemd_service:
        name: homeautomation-tv-adb.timer
        state: stopped
        enabled: false
      become: true
      when: homeautomation_tv_adb_unit.stat.exists

    - name: Remove the TV adb keepalive files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/homeautomation-tv-adb.timer
        - /etc/systemd/system/homeautomation-tv-adb.service
        - /usr/local/bin/tv-adb-keepalive
        - /var/lib/homeautomation/tv-adb
      become: true
      notify: Reload systemd
