---
# Clearing an install flag only stops the role configuring a component, so this
# removes what homeautomation_teardown lists for it. Never the volumes: a flag
# cleared by accident would take the only copy of a service's data with it.

- name: Remove the containers of components that are not installed
  become: true
  community.docker.docker_container:
    name: "{{ item.1 }}"
    state: absent
  loop: "{{ homeautomation_teardown | rejectattr('install') | subelements('containers') }}"
  loop_control:
    label: "{{ item.1 }}"

# homeautomation_teardown names only the instances still listed. One dropped from
# homeautomation_hamcp_instances is found by its command and by the compose project
# docker_hamcp.yml gives each instance, homeautomation-<name>, so an ha-mcp container another
# project runs is left alone. Each holds an admin token and serves MCP unauthenticated.
- name: List the compose-managed containers
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: com.docker.compose.project
    # For the labels, which the default summary leaves out.
    verbose_output: true
  register: homeautomation_teardown_host_info
  become: true

- name: Remove the ha-mcp containers of instances no longer listed
  community.docker.docker_container:
    name: "{{ homeautomation_teardown_hamcp_name }}"
    state: absent
  vars:
    homeautomation_teardown_hamcp_name: "{{ item.Names[0] | regex_replace('^/', '') }}"
  loop: >-
    {{ homeautomation_teardown_host_info.containers
       | selectattr('Command', 'search', 'ha-mcp-web')
       | list }}
  loop_control:
    label: "{{ homeautomation_teardown_hamcp_name }}"
  when:
    - item.Labels['com.docker.compose.project'] == 'homeautomation-' ~ homeautomation_teardown_hamcp_name
    - >-
      homeautomation_teardown_hamcp_name not in
      (homeautomation_hamcp_instances | map(attribute='name') | list
       if homeautomation_install_hamcp | bool else [])
  become: true

- name: Remove the host files of components that are not installed
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: absent
  loop: >-
    {{ homeautomation_teardown | rejectattr('install')
       | subelements('files', skip_missing=true) }}
  loop_control:
    label: "{{ item.1 }}"
  become: true
  notify: Reload sysctl

# Removing ESPHome's drop-in does not reset the live value: sysctl --system only applies
# the files that remain. "1 0" is the kernel default, which no group can satisfy. Only
# ESPHome's own range is reset, so a value another drop-in sets is left alone.
- name: Restore the kernel default ping_group_range without ESPHome
  when: not homeautomation_install_esphome | bool
  block:
    - name: Read the live ping_group_range
      ansible.builtin.slurp:
        src: /proc/sys/net/ipv4/ping_group_range
      register: homeautomation_ping_group_range_result
      become: false

    - name: Reset ping_group_range to the kernel default
      ansible.builtin.command:
        argv: [sysctl, -w, "net.ipv4.ping_group_range=1 0"]
      become: true
      changed_when: true
      when: >-
        (homeautomation_ping_group_range_result.content | b64decode).split()
        == [homeautomation_esphome_gid | string] * 2
