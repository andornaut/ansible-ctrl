---
# Derived from defaults/main.yml, not operator knobs. Role vars outrank host_vars, so
# a host cannot desync one from its source.

# From the getent in tasks/adb_auto_enable.yml.
homeautomation_adb_auto_enable_user_home: "{{ ansible_facts['getent_passwd'][homeautomation_adb_auto_enable_user][4] }}"

homeautomation_adb_auto_enable_dir: "{{ homeautomation_adb_auto_enable_user_home }}/.cache/adb-auto-enable"
homeautomation_adb_auto_enable_apk: >-
  {{ homeautomation_adb_auto_enable_dir }}/adb-auto-enable-{{
  homeautomation_adb_auto_enable_version_name }}.apk
homeautomation_adb_auto_enable_package: com.tpn.adbautoenable

# What the app moves adbd onto, which is where Home Assistant's androidtv integration
# looks. The port adbd picks for itself at boot is ephemeral and known only to the set.
homeautomation_adb_auto_enable_port: 5555

# The three below come from the release fact set in tasks/adb_auto_enable.yml.
homeautomation_adb_auto_enable_version: "{{ homeautomation_adb_auto_enable_release.tag_name }}"

# The tag carries a leading v that the APK's versionName does not, and a set reports that
# versionName back through dumpsys, which is how it is compared against the release.
homeautomation_adb_auto_enable_version_name: >-
  {{ homeautomation_adb_auto_enable_version | regex_replace('^v', '') }}

homeautomation_adb_auto_enable_url: >-
  {{ (homeautomation_adb_auto_enable_release.assets
  | selectattr('name', 'search', '\.apk$') | list | first).browser_download_url }}

homeautomation_common_volumes:
  - "{{ homeautomation_homeassistant_required_volumes.localtime }}:/etc/localtime:ro"

homeautomation_default_logging:
  driver: "json-file"
  options:
    max-size: "{{ homeautomation_docker_log_max_size }}"
    max-file: "{{ homeautomation_docker_log_max_file }}"

homeautomation_external_network:
  default:
    external: true
    name: "{{ homeautomation_docker_network_name }}"

# For the non-root containers, whose processes cannot use Docker's default capability set
# anyway: cap_add fills the permitted set but not the ambient one. Free now, and matters
# if something gains uid 0 later. Not applied to the containers that keep uid 0, several
# of which need those caps.
homeautomation_unprivileged_cap_drop:
  - ALL

# Every container, root or not: blocks the setuid transition that would make a permitted
# capability effective. Nothing here loses by it, all dropping privileges with setuid()
# rather than by exec'ing a setuid binary.
homeautomation_no_new_privileges:
  - no-new-privileges:true

# Every uid a container here runs as. Each account owns its files exclusively, which holds
# only if no two share a uid; docker_prerequisites.yml asserts that before any are
# created.
#
# Append-only: a new service takes the next free number, whatever its name sorts as. A uid
# is an identity on disk, so moving one drags every file it owns. mosquitto is the
# exception at 1883, baked into its image.
#
# ha-mcp is merged in rather than listed, its accounts coming one per entry in
# homeautomation_hamcp_instances.
homeautomation_service_account_uids: >-
  {{ homeautomation_service_account_uids_fixed
     | combine(homeautomation_hamcp_service_account_uids) }}

homeautomation_service_account_uids_fixed:
  esphome: "{{ homeautomation_esphome_uid }}"
  govee2mqtt: "{{ homeautomation_govee2mqtt_uid }}"
  llamacpp: "{{ homeautomation_llamacpp_uid }}"
  matterjs: "{{ homeautomation_matterjs_uid }}"
  mosquitto: "{{ homeautomation_mosquitto_uid }}"
  openwebui: "{{ homeautomation_openwebui_uid }}"
  piper: "{{ homeautomation_piper_uid }}"
  whisper: "{{ homeautomation_whisper_uid }}"

homeautomation_hamcp_service_account_uids: >-
  {{ dict(homeautomation_hamcp_instances | map(attribute='name')
          | zip(homeautomation_hamcp_instances | map(attribute='uid'))) }}

homeautomation_tz: "{{ homeautomation_system_timezone.stdout.strip() }}"

# Both, the dashboard reading them as a pair and enabling nothing when either is
# empty. Named for what it reports rather than for a preference.
homeautomation_esphome_auth_configured: >-
  {{ (homeautomation_esphome_username | length > 0)
     and (homeautomation_esphome_password | length > 0) }}

# What each optional component leaves on the host, so clearing its flag removes it. Never
# volumes: they hold the only copy of a service's data.
#
# Absent on purpose: home assistant and mosquitto, which have no flag; avahi, a host daemon
# rather than a container; and memryx, whose DKMS driver and apt sources are not the
# reverse of a compose definition.
homeautomation_teardown:
  - install: "{{ homeautomation_install_esphome }}"
    containers: [esphome]
    # Scoped to the ESPHome gid, so it narrows the host's range rather than
    # widening it, and outlives the container.
    files: [/etc/sysctl.d/60-esphome-ping.conf]
  - install: "{{ homeautomation_install_frigate }}"
    containers: [frigate]
  - install: "{{ homeautomation_install_govee2mqtt }}"
    containers: [govee2mqtt]
  # Names come from the instance list, plus the default one, for a host whose
  # instances were cleared along with the flag.
  - install: "{{ homeautomation_install_hamcp }}"
    containers: >-
      {{ (['hamcp'] + (homeautomation_hamcp_instances | map(attribute='name') | list)) | unique }}
  - install: "{{ homeautomation_install_llm }}"
    containers: [llamacpp, openwebui]
  - install: "{{ homeautomation_install_matterjs }}"
    containers: [matterjs]
  - install: "{{ homeautomation_install_legacy_pythonmatterserver }}"
    containers: [pythonmatterserver]
  - install: "{{ homeautomation_install_voice }}"
    containers: [openwakeword, microwakeword, piper, whisper]
  # Serves either matter stack, so it goes only when both do.
  - install: "{{ homeautomation_install_matterjs or homeautomation_install_legacy_pythonmatterserver }}"
    containers: [otbr]
