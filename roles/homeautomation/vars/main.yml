---
# Values derived from defaults/main.yml, not operator knobs. They live here rather than
# in defaults/ so that role vars outrank host_vars and a host cannot desync a derived
# value from the variable it is derived from.

homeautomation_common_volumes:
  - "{{ homeautomation_homeassistant_required_volumes.localtime }}:/etc/localtime:ro"

homeautomation_default_logging:
  driver: "json-file"
  options:
    max-size: "{{ homeautomation_docker_log_max_size }}"
    max-file: "{{ homeautomation_docker_log_max_file }}"

homeautomation_external_network:
  default:
    external: true
    name: "{{ homeautomation_docker_network_name }}"

# For the containers that run as a non-root uid. Docker grants every container
# a default capability set; a non-root process cannot use it, because cap_add
# fills the permitted set but not the ambient set. Dropping it costs nothing
# now and matters when something later gains uid 0 inside the container.
#
# Not applied to the containers that keep uid 0. Several of them need
# capabilities from that default set, and for them the caps do work.
homeautomation_unprivileged_cap_drop:
  - ALL

# Applied to every container, root or not, which is why it is not named for the
# unprivileged ones: it blocks the setuid transition that would make a
# capability effective, so it is what actually stops a compromised process from
# reaching the caps sitting in its permitted set. Nothing here loses by it,
# because a process that drops privileges does so with setuid() rather than by
# exec'ing a setuid binary, and only the latter is blocked.
homeautomation_no_new_privileges:
  - no-new-privileges:true

# Every uid a container in this role runs as. Each service account owns its
# files exclusively, which only holds if no two services share a uid, and
# docker_prerequisites.yml asserts that before any of them are created.
#
# Append-only: a new service takes the next number free in this list, whatever
# its name sorts as. These happen to run alphabetically from 10001 because they
# were reassigned once to put them in some order, not because the order is a
# rule to keep. A uid is an account's identity on disk, so a number that moves
# drags every file it owns behind it, and that is worth doing once and not
# again. mosquitto is the exception at 1883, which its image bakes in.
homeautomation_service_account_uids:
  esphome: "{{ homeautomation_esphome_uid }}"
  govee2mqtt: "{{ homeautomation_govee2mqtt_uid }}"
  hamcp: "{{ homeautomation_hamcp_uid }}"
  llamacpp: "{{ homeautomation_llamacpp_uid }}"
  matterjs: "{{ homeautomation_matterjs_uid }}"
  mosquitto: "{{ homeautomation_mosquitto_uid }}"
  openwebui: "{{ homeautomation_openwebui_uid }}"
  piper: "{{ homeautomation_piper_uid }}"
  whisper: "{{ homeautomation_whisper_uid }}"

homeautomation_tz: "{{ homeautomation_system_timezone.stdout.strip() }}"

# Both, because the dashboard reads USERNAME and PASSWORD as a pair and enables
# nothing when either is empty. Named for what it probes rather than
# install-something, because it is not an operator preference so much as a
# report of whether the host supplied the credentials.
homeautomation_esphome_auth_configured: >-
  {{ (homeautomation_esphome_username | length > 0)
     and (homeautomation_esphome_password | length > 0) }}

# What each optional component leaves on the host, so that clearing its install
# flag removes it rather than leaving it running. Volumes are deliberately not
# listed: they hold the only copy of a service's data, and an install flag
# cleared by accident would otherwise destroy it.
#
# Absent from this table on purpose: home assistant and mosquitto, which have no
# install flag and are always configured; avahi, a host daemon the play stops
# rather than a container; and memryx, which installs a DKMS driver and apt
# sources whose removal is not the reverse of writing a compose definition.
homeautomation_teardown:
  - install: "{{ homeautomation_install_esphome }}"
    containers: [esphome]
    # Set for the ESPHome gid alone, so it narrows the host's range rather than
    # widening it, and outlives the container it was written for.
    files: [/etc/sysctl.d/60-esphome-ping.conf]
  - install: "{{ homeautomation_install_frigate }}"
    containers: [frigate]
  - install: "{{ homeautomation_install_govee2mqtt }}"
    containers: [govee2mqtt]
  - install: "{{ homeautomation_install_hamcp }}"
    containers: [hamcp]
  - install: "{{ homeautomation_install_llm }}"
    containers: [llamacpp, openwebui]
  - install: "{{ homeautomation_install_matterjs }}"
    containers: [matterjs]
  - install: "{{ homeautomation_install_legacy_pythonmatterserver }}"
    containers: [pythonmatterserver]
  - install: "{{ homeautomation_install_voice }}"
    containers: [openwakeword, microwakeword, piper, whisper]
  # The border router serves either matter stack, so it goes only when both do.
  - install: "{{ homeautomation_install_matterjs or homeautomation_install_legacy_pythonmatterserver }}"
    containers: [otbr]
