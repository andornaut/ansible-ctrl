# Included at http level, so it covers every site.
server_tokens off;

# The Connection header for WebSocket locations. Defined here, once: a map is valid only at
# http level, and a second definition of the variable fails the config test.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Default HTTP server - catch unmatched domains
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    log_not_found off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Default HTTPS server - catch unmatched domains
server {
    # Specify "reuseport" for only the first vhost
    listen 443 quic reuseport default_server;
    listen 443 ssl default_server;
    listen [::]:443 quic reuseport default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    access_log off;
    error_log /dev/null;
    log_not_found off;

    # Use self-signed certificate for unmatched domains
    include /etc/nginx/conf.d/partial/selfsigned_certificate;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
