---
# Listed ahead of the reload, and handlers run in the order they are listed: a config nginx
# rejects fails here, leaving the running container on the config it already loaded. A
# throwaway container, so the live tree is tested whether or not the nginx container is running.
- name: Validate nginx configuration
  ansible.builtin.command:
    argv: "{{ letsencrypt_nginx_config_test_argv }}"
  vars:
    letsencrypt_nginx_config_test_dir: "{{ letsencrypt_nginx_docker_required_volumes.config }}"
  changed_when: false
  become: true
  listen: Reload nginx

# Reloads the config and certificates in place: open connections finish on the old workers,
# where a restart drops every WebSocket and stream. Signalled from inside the container, since
# `docker kill`, whatever the signal, marks it manually stopped, and unless-stopped then leaves it
# down after the next dockerd restart or reboot.
- name: Reload nginx container
  community.docker.docker_container_exec:
    container: nginx
    argv: [nginx, -s, reload]
  changed_when: true
  become: true
  listen: Reload nginx
