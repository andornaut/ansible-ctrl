---
# state is derived from the flag rather than gated with `when`, so clearing the flag removes
# the job from a host that used to run it.
- name: Configure the certificate renewal cron job
  ansible.builtin.cron:
    name: Let's Encrypt certificate renewal
    cron_file: ansible-role-letsencrypt_nginx
    user: root
    hour: "{{ letsencrypt_nginx_renewal_cron_hour }}"
    minute: "{{ letsencrypt_nginx_renewal_cron_minute }}"
    # Wrapped in sops exec-env, because credentials reach a play through the environment: a bare
    # ansible-playbook leaves every lookup('env', ...) empty, and an empty one is not an error, so
    # the run would reach the DNS challenge before failing rather than refusing to start. The
    # wildcard certificates need dns-01, which needs the Cloudflare token, so this is not a job
    # that can do without credentials.
    #
    # sops rather than make, which is the operator's entry point: make adds --ask-become-pass when
    # a run reaches the controller, and cron has no terminal to answer it on. Root's own ~ is
    # /root, so the key is named explicitly rather than left to sops to find.
    #
    # The sops file and the age key are outside the homes, but the checkout this runs from is not:
    # cron has no session, so if the operator is logged out an encrypted home is not mounted and
    # the directory does not exist. The preflight below is what turns that from silence into mail.
    #
    # It writes to stderr OUTSIDE the log redirect on purpose. Everything inside the redirect goes
    # to a file nobody reads, which is how a job like this fails for months; anything cron sees on
    # stderr it mails instead. The run's own failure is reported the same way, as one line pointing
    # at the log rather than the whole play.
    #
    # Checked rather than assumed, one message per cause: "certificates were not renewed" with no
    # reason is a message that gets ignored twice and then filtered.
    job: >-
      { [ -d {{ letsencrypt_nginx_renewal_cron_directory }} ] ||
      { echo "letsencrypt renewal SKIPPED: {{ letsencrypt_nginx_renewal_cron_directory }} does not
      exist. If it is inside an encrypted home, it is only mounted while its owner is logged in.
      Certificates were NOT renewed." >&2; exit 1; }; }
      &&
      { [ -r {{ letsencrypt_nginx_renewal_cron_sops_file }} ] ||
      { echo "letsencrypt renewal SKIPPED: cannot read
      {{ letsencrypt_nginx_renewal_cron_sops_file }}. Certificates were NOT renewed." >&2;
      exit 1; }; }
      &&
      { [ -r {{ letsencrypt_nginx_renewal_cron_age_key_file }} ] ||
      { echo "letsencrypt renewal SKIPPED: cannot read
      {{ letsencrypt_nginx_renewal_cron_age_key_file }}. Certificates were NOT renewed." >&2;
      exit 1; }; }
      &&
      { { cd {{ letsencrypt_nginx_renewal_cron_directory }} &&
      SOPS_AGE_KEY_FILE={{ letsencrypt_nginx_renewal_cron_age_key_file }}
      sops exec-env {{ letsencrypt_nginx_renewal_cron_sops_file }}
      'ansible-playbook webservers.yml --tags letsencrypt'; }
      >> {{ letsencrypt_nginx_renewal_cron_log }} 2>&1 ||
      { echo "letsencrypt renewal FAILED; see
      {{ letsencrypt_nginx_renewal_cron_log }}" >&2; exit 1; }; }
    state: "{{ letsencrypt_nginx_install_renewal_cron | ternary('present', 'absent') }}"
  become: true

# The redirect above creates this with root's umask, which leaves it world-readable, and it holds
# the full output of every renewal run. The credentials in it are no_log, nothing else is. Created
# here so the mode is in place before the first run rather than after it. The timestamps are
# preserved so that a run that changes nothing reports nothing.
- name: Restrict the certificate renewal log
  ansible.builtin.file:
    path: "{{ letsencrypt_nginx_renewal_cron_log }}"
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  become: true
  when: letsencrypt_nginx_install_renewal_cron
