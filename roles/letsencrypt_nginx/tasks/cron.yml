---
# The store and age key are in the operator's home and this job runs as root, so
# resolve the paths: root's own ~ is /root.
- name: Read the operator's passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ letsencrypt_nginx_operator }}"

- name: Resolve the operator's home
  ansible.builtin.set_fact:
    letsencrypt_nginx_operator_home: >-
      {{ ansible_facts['getent_passwd'][letsencrypt_nginx_operator][4] }}

# cron refuses a command longer than 998 characters and ignores the whole file, so the
# preflight lives in a script and the job only names it.
- name: Install the certificate renewal script
  ansible.builtin.template:
    src: letsencrypt-nginx-renew.j2
    dest: /usr/local/sbin/letsencrypt-nginx-renew
    owner: root
    group: root
    mode: "0755"
  become: true
  when: letsencrypt_nginx_install_renewal_cron | bool

# Derived from the flag rather than gated on it, so clearing the flag removes the job.
- name: Configure the certificate renewal cron job
  ansible.builtin.cron:
    name: Let's Encrypt certificate renewal
    cron_file: /etc/cron.d/ansible-role-letsencrypt_nginx
    user: root
    hour: "{{ letsencrypt_nginx_renewal_cron_hour }}"
    minute: "{{ letsencrypt_nginx_renewal_cron_minute }}"
    job: /usr/local/sbin/letsencrypt-nginx-renew
    state: "{{ letsencrypt_nginx_install_renewal_cron | bool | ternary('present', 'absent') }}"
  become: true

# The script's redirect creates this at whatever root's umask allows, which is a mode
# no playbook decides, and it holds the full output of every renewal run. Named here
# so root:adm 0640 is in place before the first run, whatever that umask is;
# timestamps preserved so an unchanged run reports nothing.
- name: Restrict the certificate renewal log
  ansible.builtin.file:
    path: "{{ letsencrypt_nginx_renewal_cron_log }}"
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  become: true
  when: letsencrypt_nginx_install_renewal_cron | bool
