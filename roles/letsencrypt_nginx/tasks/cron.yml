---
# The store and age key are in the operator's home and this job runs as root, so
# resolve the paths: root's own ~ is /root.
- name: Read the operator's passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ letsencrypt_nginx_operator }}"

- name: Resolve the operator's home
  ansible.builtin.set_fact:
    letsencrypt_nginx_operator_home: >-
      {{ ansible_facts['getent_passwd'][letsencrypt_nginx_operator][4] }}

# Derived from the flag rather than gated on it, so clearing the flag removes the job.
- name: Configure the certificate renewal cron job
  ansible.builtin.cron:
    name: Let's Encrypt certificate renewal
    cron_file: ansible-role-letsencrypt_nginx
    user: root
    hour: "{{ letsencrypt_nginx_renewal_cron_hour }}"
    minute: "{{ letsencrypt_nginx_renewal_cron_minute }}"
    # sops exec-env, credentials reaching a play through the environment and the wildcard
    # certificates needing dns-01. Not `make`, whose requirements stamp would run
    # ansible-galaxy as root into the operator's home. Both keys are named explicitly,
    # root's own ~ being /root.
    #
    # The checkout, store and key are all in that home, unmounted while the operator is
    # logged out. The preflight turns that into mail by writing to stderr outside the log
    # redirect; one message per cause, since "certificates were not renewed" alone gets
    # ignored and then filtered.
    job: >-
      { [ -d {{ letsencrypt_nginx_renewal_cron_directory }} ] ||
      { echo "letsencrypt renewal SKIPPED: {{ letsencrypt_nginx_renewal_cron_directory }} does not
      exist. If it is inside an encrypted home, it is only mounted while its owner is logged in.
      Certificates were NOT renewed." >&2; exit 1; }; }
      &&
      { [ -r {{ letsencrypt_nginx_renewal_cron_sops_file }} ] ||
      { echo "letsencrypt renewal SKIPPED: cannot read
      {{ letsencrypt_nginx_renewal_cron_sops_file }}. Certificates were NOT renewed." >&2;
      exit 1; }; }
      &&
      { [ -r {{ letsencrypt_nginx_renewal_cron_age_key_file }} ] ||
      { echo "letsencrypt renewal SKIPPED: cannot read
      {{ letsencrypt_nginx_renewal_cron_age_key_file }}. Certificates were NOT renewed." >&2;
      exit 1; }; }
      &&
      { [ -r {{ letsencrypt_nginx_renewal_cron_ssh_key_file }} ] ||
      { echo "letsencrypt renewal SKIPPED: cannot read
      {{ letsencrypt_nginx_renewal_cron_ssh_key_file }}, so the run has no identity the
      web servers accept. Certificates were NOT renewed." >&2;
      exit 1; }; }
      &&
      { { cd {{ letsencrypt_nginx_renewal_cron_directory }} &&
      SOPS_AGE_KEY_FILE={{ letsencrypt_nginx_renewal_cron_age_key_file }}
      ANSIBLE_PRIVATE_KEY_FILE={{ letsencrypt_nginx_renewal_cron_ssh_key_file }}
      sops exec-env {{ letsencrypt_nginx_renewal_cron_sops_file }}
      'ansible-playbook webservers.yml --tags letsencrypt'; }
      >> {{ letsencrypt_nginx_renewal_cron_log }} 2>&1 ||
      { echo "letsencrypt renewal FAILED; see
      {{ letsencrypt_nginx_renewal_cron_log }}" >&2; exit 1; }; }
    state: "{{ letsencrypt_nginx_install_renewal_cron | ternary('present', 'absent') }}"
  become: true

# The redirect above would create this world-readable under root's umask, and it
# holds the full output of every renewal run. Created here so the mode is in place
# before the first run; timestamps preserved so an unchanged run reports nothing.
- name: Restrict the certificate renewal log
  ansible.builtin.file:
    path: "{{ letsencrypt_nginx_renewal_cron_log }}"
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  become: true
  when: letsencrypt_nginx_install_renewal_cron
