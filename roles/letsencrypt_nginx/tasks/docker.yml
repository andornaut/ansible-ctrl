---
- name: Require the Docker tooling
  ansible.builtin.import_tasks: require_docker.yml

- name: Create Docker volume directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    # The parent too, which nothing else creates or checks the mode of.
    - "{{ letsencrypt_nginx_docker_required_volumes.config | dirname }}"
    - "{{ letsencrypt_nginx_docker_required_volumes.config }}"
    - "{{ letsencrypt_nginx_docker_required_volumes.www }}"
  become: true

- name: Start Nginx Docker container
  vars:
    required_volumes:
      - "{{ letsencrypt_nginx_docker_required_volumes.config }}:/etc/nginx/conf.d:ro"
      - "{{ letsencrypt_nginx_docker_required_volumes.localtime }}:/etc/localtime:ro"
      - "{{ letsencrypt_nginx_docker_required_volumes.www }}:/var/www:ro"
      - /var/cache/nginx
      - /var/run
  community.docker.docker_compose_v2:
    project_name: letsencrypt_nginx
    pull: always
    remove_orphans: true
    definition:
      services:
        nginx:
          container_name: nginx
          image: "{{ letsencrypt_nginx_docker_image }}"
          # The master reads the config and binds 80/443 as root, then drops to
          # the worker uid: NET_BIND_SERVICE for the ports, SETUID/SETGID for the
          # drop, CHOWN for the log and cache paths handed over.
          cap_drop:
            - ALL
          cap_add:
            - CHOWN
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
          logging:
            driver: "json-file"
            options:
              max-size: "{{ letsencrypt_nginx_docker_log_max_size }}"
              max-file: "{{ letsencrypt_nginx_docker_log_max_file }}"
          network_mode: host
          restart: unless-stopped
          # Safe: the master drops privileges with setuid(), not by exec'ing a
          # setuid binary, which is all this blocks.
          security_opt:
            - no-new-privileges:true
          volumes: "{{ required_volumes + letsencrypt_nginx_docker_extra_volumes }}"
  become: true
