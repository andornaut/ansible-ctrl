---
# community.docker reports a missing daemon as a connection error against the
# socket, which reads as a broken install rather than an absent one.
# become: true, matching the container task below, so the probe reports on the
# account that will run it rather than on whoever ansible connects as.
- name: Require Docker
  become: true
  block:
    - name: Probe for Docker
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: Docker
            probe: docker version
            hint: >-
              It comes from the docker role, which webservers.yml applies only
              once its commented-out entry is uncommented for a host's first
              run.
          # Three packages, not one: the docker role purges Ubuntu's docker.io
          # and installs the engine, the compose plugin and the SDK separately,
          # so each of the three can be absent while the others work.
          # docker_compose_v2 below needs the plugin; the restart handler's
          # docker_container needs the SDK.
          - name: The Docker Compose plugin
            probe: docker compose version
            hint: "It is the docker-compose-plugin package, which the docker role installs."
          - name: The Docker SDK for Python
            probe: >-
              {{ ansible_facts['discovered_interpreter_python'] | default('python3') }}
              -c 'import docker'
            hint: "It is the python3-docker package, which the docker role installs."

- name: Create Docker volume directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    # The parent as well: nothing created it, so it was left with whatever mode
    # the first mkdir gave it, and a stray setuid bit on it went unnoticed.
    - "{{ letsencrypt_nginx_docker_required_volumes.config | dirname }}"
    - "{{ letsencrypt_nginx_docker_required_volumes.config }}"
    - "{{ letsencrypt_nginx_docker_required_volumes.www }}"
  become: true

- name: Start Nginx Docker container
  vars:
    required_volumes:
      - "{{ letsencrypt_nginx_docker_required_volumes.config }}:/etc/nginx/conf.d:ro"
      - "{{ letsencrypt_nginx_docker_required_volumes.localtime }}:/etc/localtime:ro"
      - "{{ letsencrypt_nginx_docker_required_volumes.www }}:/var/www:ro"
      - /var/cache/nginx
      - /var/run
  community.docker.docker_compose_v2:
    project_name: letsencrypt_nginx
    pull: always
    remove_orphans: true
    definition:
      services:
        nginx:
          container_name: nginx
          image: "{{ letsencrypt_nginx_docker_image }}"
          # The master stays root to read the config and bind 80 and 443, then
          # drops to the worker uid, so only the four capabilities that takes
          # are kept: NET_BIND_SERVICE for the ports, SETUID and SETGID for the
          # drop, CHOWN for the log and cache paths it hands to the worker.
          cap_drop:
            - ALL
          cap_add:
            - CHOWN
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
          network_mode: host
          restart: unless-stopped
          # The master drops privileges with setuid() rather than by exec'ing a
          # setuid binary, and only the latter is what this blocks.
          security_opt:
            - no-new-privileges:true
          volumes: "{{ required_volumes + letsencrypt_nginx_docker_extra_volumes }}"
  become: true
