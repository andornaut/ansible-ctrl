---
# community.docker reports a missing daemon as a socket connection error, which
# reads as a broken install rather than an absent one. become: true to match the
# container task, so the probe answers for the account that runs it.
- name: Require Docker
  become: true
  block:
    - name: Probe for Docker
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: Docker
            probe: docker version
            hint: >-
              It comes from the docker role, which webservers.yml applies only
              once its commented-out entry is uncommented for a host's first
              run.
          # Three separate packages, any of which can be absent alone:
          # docker_compose_v2 needs the plugin, the restart handler needs the SDK.
          - name: The Docker Compose plugin
            probe: docker compose version
            hint: "It is the docker-compose-plugin package, which the docker role installs."
          - name: The Docker SDK for Python
            probe: >-
              {{ ansible_facts['discovered_interpreter_python'] | default('python3') }}
              -c 'import docker'
            hint: "It is the python3-docker package, which the docker role installs."

- name: Create Docker volume directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    # The parent too, which nothing else creates or checks the mode of.
    - "{{ letsencrypt_nginx_docker_required_volumes.config | dirname }}"
    - "{{ letsencrypt_nginx_docker_required_volumes.config }}"
    - "{{ letsencrypt_nginx_docker_required_volumes.www }}"
  become: true

- name: Start Nginx Docker container
  vars:
    required_volumes:
      - "{{ letsencrypt_nginx_docker_required_volumes.config }}:/etc/nginx/conf.d:ro"
      - "{{ letsencrypt_nginx_docker_required_volumes.localtime }}:/etc/localtime:ro"
      - "{{ letsencrypt_nginx_docker_required_volumes.www }}:/var/www:ro"
      - /var/cache/nginx
      - /var/run
  community.docker.docker_compose_v2:
    project_name: letsencrypt_nginx
    pull: always
    remove_orphans: true
    definition:
      services:
        nginx:
          container_name: nginx
          image: "{{ letsencrypt_nginx_docker_image }}"
          # The master reads the config and binds 80/443 as root, then drops to
          # the worker uid: NET_BIND_SERVICE for the ports, SETUID/SETGID for the
          # drop, CHOWN for the log and cache paths handed over.
          cap_drop:
            - ALL
          cap_add:
            - CHOWN
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
          logging:
            driver: "json-file"
            options:
              max-size: "{{ letsencrypt_nginx_docker_log_max_size }}"
              max-file: "{{ letsencrypt_nginx_docker_log_max_file }}"
          network_mode: host
          restart: unless-stopped
          # Safe: the master drops privileges with setuid(), not by exec'ing a
          # setuid binary, which is all this blocks.
          security_opt:
            - no-new-privileges:true
          volumes: "{{ required_volumes + letsencrypt_nginx_docker_extra_volumes }}"
  become: true
