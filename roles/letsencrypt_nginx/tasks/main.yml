---
- name: Require an ACME account email
  ansible.builtin.assert:
    that: letsencrypt_nginx_account_email | default('') | length > 0
    fail_msg: Set letsencrypt_nginx_account_email in host_vars. Every certificate order names it.
    quiet: true
  become: false
  tags:
    - letsencrypt
    - nginx

# Computed without looping over the sites, whose Cloudflare API tokens a loop item would print.
- name: Require every HTTP-01 common name to be a site's domain
  ansible.builtin.assert:
    that: letsencrypt_nginx_unserved_http_common_names | length == 0
    fail_msg: >-
      An HTTP-01 token is served only from the web root of the site whose domain is the name.
      {% for name in letsencrypt_nginx_unserved_http_common_names %}Certificate {{ name }} is
      validated by HTTP-01, but no site in letsencrypt_nginx_websites has domain {{ name }}, so its
      token would be written to a web root no server block serves.
      {% if name.startswith('*.') %}A wildcard cannot be validated by HTTP-01 at all: set
      cloudflare_api_token and cloudflare_api_zone for DNS-01.
      {% else %}Add a site with that domain, change csr_common_name, or set cloudflare_api_token
      for DNS-01. {% endif %}{% endfor %}
    quiet: true
  vars:
    letsencrypt_nginx_unserved_http_common_names: >-
      {{ lookup('ansible.builtin.template', 'unserved_http_common_names.j2') | from_json }}
  become: false
  tags:
    - letsencrypt
    - nginx

# Computed without looping over the sites, whose Cloudflare API tokens a loop item would print.
- name: Require every site location to be well formed
  ansible.builtin.assert:
    that: letsencrypt_nginx_invalid_locations | length == 0
    fail_msg: "{{ letsencrypt_nginx_invalid_locations | join('; ') }}"
    quiet: true
  vars:
    letsencrypt_nginx_invalid_locations: >-
      {{ lookup('ansible.builtin.template', 'invalid_locations.j2') | from_json }}
  become: false
  tags:
    - letsencrypt
    - nginx

- name: Set up packages, web roots, and basic authentication
  tags:
    - letsencrypt
    - nginx
  block:
    - name: Install required packages
      ansible.builtin.import_tasks: apt.yml

    - name: Set up web root directories
      ansible.builtin.import_tasks: www.yml
      tags: www

    - name: Configure basic authentication
      ansible.builtin.import_tasks: basicauth.yml

- name: Set up Let's Encrypt certificates
  tags: letsencrypt
  block:
    - name: Configure SSL certificates
      ansible.builtin.import_tasks: ssl.yml

    - name: Generate initial Nginx configuration
      ansible.builtin.import_tasks: configuration.yml

    - name: Start Nginx for Let's Encrypt validation
      ansible.builtin.import_tasks: docker.yml
      tags: docker

    # An http-01 challenge is answered by the site's own server block, so a vhost written
    # above has to be loaded before the challenge runs, not at the end of the play.
    - name: Load the new Nginx configuration before the challenges
      ansible.builtin.meta: flush_handlers

    - name: Obtain Let's Encrypt certificates
      ansible.builtin.import_tasks: letsencrypt.yml

- name: Update Nginx configuration with new certificates
  ansible.builtin.import_tasks: configuration.yml
  notify: Restart nginx
  tags:
    - configuration
    - letsencrypt
    - nginx

# Tagged letsencrypt so the nightly renewal run reconciles its own cron job.
- name: Configure certificate renewal
  ansible.builtin.import_tasks: cron.yml
  tags:
    - cron
    - letsencrypt
