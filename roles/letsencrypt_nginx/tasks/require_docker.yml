---
# Imported by configuration.yml and docker.yml. community.docker reports a missing
# daemon as a socket connection error, which reads as a broken install rather than an
# absent one. become: true to match the container tasks and the configuration test, so
# the probe answers for the account that runs them.
- name: Require Docker
  become: true
  block:
    - name: Probe for Docker
      ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
      vars:
        require_tools:
          - name: Docker
            probe: docker version
            hint: "It comes from the docker role: make docker -- --limit <host>."
          # Three separate packages, any of which can be absent alone:
          # docker_compose_v2 needs the plugin, the restart handler needs the SDK.
          - name: The Docker Compose plugin
            probe: docker compose version
            hint: "It is the docker-compose-plugin package, which the docker role installs."
          - name: The Docker SDK for Python
            probe: >-
              {{ ansible_facts['discovered_interpreter_python'] | default('python3') }}
              -c 'import docker'
            hint: "It is the python3-docker package, which the docker role installs."
