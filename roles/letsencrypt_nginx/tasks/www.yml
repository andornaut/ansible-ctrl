---
- name: Set up website directories
  become: true
  block:
    - name: Create www directories
      ansible.builtin.file:
        path: "{{ letsencrypt_nginx_docker_required_volumes.www }}/{{ item.domain }}"
        state: directory
        mode: u=rwX,g=rX,o=rX # Directories: 755, Files: 644
        owner: root
        group: root
      loop: "{{ letsencrypt_nginx_websites }}"
      # Loop items hold a Cloudflare API token and basicauth credentials.
      no_log: true

    - name: Clone Git repositories
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ letsencrypt_nginx_docker_required_volumes.www }}/{{ item.domain }}"
        version: "{{ item.version | default('HEAD') }}"
        update: true
        depth: 1
      loop: "{{ letsencrypt_nginx_websites }}"
      register: letsencrypt_nginx_git_clone
      retries: 3
      delay: 5
      until: letsencrypt_nginx_git_clone is succeeded
      when: item.repo is defined
      # Loop items hold a Cloudflare API token and basicauth credentials.
      no_log: true

    # CLEANUP (added 2026-10-17): HTTP-01 tokens were written into each site's web root. Remove
    # once no web root on a webservers host has a .well-known/acme-challenge directory.
    - name: Remove the challenge directories from the site web roots
      ansible.builtin.file:
        path: "{{ letsencrypt_nginx_docker_required_volumes.www }}/{{ item.domain }}/.well-known/acme-challenge"
        state: absent
      loop: "{{ letsencrypt_nginx_websites }}"
      # Loop items hold a Cloudflare API token and basicauth credentials.
      no_log: true

    # CLEANUP (added 2026-10-17): the .well-known directories the task above empties. Remove with it.
    - name: Remove the emptied .well-known directories
      ansible.builtin.command:
        argv:
          - find
          - "{{ letsencrypt_nginx_docker_required_volumes.www }}/{{ item.domain }}"
          - -maxdepth
          - "1"
          - -name
          - .well-known
          - -type
          - d
          - -empty
          - -print
          - -delete
      loop: "{{ letsencrypt_nginx_websites }}"
      register: letsencrypt_nginx_emptied_well_known
      changed_when: letsencrypt_nginx_emptied_well_known.stdout | length > 0
      # Loop items hold a Cloudflare API token and basicauth credentials.
      no_log: true
