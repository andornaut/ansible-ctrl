---
msmtp_host: smtp.gmail.com
msmtp_port: 587
# Required per host.
# msmtp_domain:
# msmtp_user:
#
# msmtp_password is not among them. It is a credential, named in faramir.env and injected
# as a variable of that name, one value for the fleet. Setting it here or in host_vars
# writes a credential into a file that holds none, and the injected value wins anyway.
msmtp_send_all_email_to: admin@{{ msmtp_domain }}
msmtp_relay_config_path: /etc/msmtprc-relay
# msmtpd accepts unauthenticated mail, so it must only ever listen on loopback.
msmtp_relay_interface: 127.0.0.1
# Unprivileged, so msmtpd needs no CAP_NET_BIND_SERVICE.
msmtp_relay_port: 8025
