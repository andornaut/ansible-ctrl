---
# The next task purges the host's MTA, so fail here rather than leave it with none.
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - msmtp_domain is defined
      - msmtp_user is defined
      - msmtp_password is defined
      # msmtpd accepts unauthenticated mail, so the relay must stay on loopback.
      - msmtp_relay_interface in ['127.0.0.1', '::1']
      # The override clears CAP_NET_BIND_SERVICE, so a privileged port fails to bind.
      - msmtp_relay_port | int >= 1024
      - msmtp_relay_port | int <= 65535
    fail_msg: >-
      Set msmtp_domain and msmtp_user in host_vars (gitignored), keep
      msmtp_relay_interface on loopback, and use an unprivileged
      msmtp_relay_port. msmtp_password is not set there: it is injected,
      so an undefined one means the run carried no credentials.
    quiet: true

- name: Uninstall MTAs
  ansible.builtin.apt:
    name:
      - exim4
      - postfix
      - sendmail
    state: absent
    install_recommends: false
  become: true

# msmtp-mta provides /usr/sbin/sendmail, which mail(1) invokes. present, not latest:
# this role runs on `all`, and latest would partial-upgrade the fleet.
- name: Install system packages
  ansible.builtin.apt:
    name:
      - msmtp
      - msmtp-mta
      - mailutils
    install_recommends: false
    state: present
    update_cache: true
  become: true

# An enforced msmtp profile denies msmtpd's read of /etc/msmtprc-relay and mail
# bounces; it reads this local include when enforced and ignores it otherwise.
# blockinfile, not copy: the file is the operator's.
- name: Allow the relay config in the msmtp AppArmor profile
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/local/usr.bin.msmtp
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: ansible-role-msmtp"
    block: |
      {{ msmtp_relay_config_path }} r,
  become: true

# The profile is disabled by default via this symlink; reloading only matters when enforced.
- name: Check whether the msmtp AppArmor profile is disabled
  ansible.builtin.stat:
    path: /etc/apparmor.d/disable/usr.bin.msmtp
  register: msmtp_apparmor_disabled
  become: true

# Unconditional: gating on the include changing would let an interrupted run leave
# an enforced profile denying those reads.
- name: Reload AppArmor so the relay rule is live before msmtpd restarts
  ansible.builtin.systemd_service:
    name: apparmor
    state: reloaded
  when: not msmtp_apparmor_disabled.stat.exists
  become: true

# The postinst symlinks the disable without unloading a resident profile, which
# keeps denying the relay-config read. Both name spellings, removal being by name.
- name: Unload a stale msmtp AppArmor profile left enforcing while disabled on disk
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      changed=
      for name in msmtp /usr/bin/msmtp; do
        if grep -qE "^${name} \(" /sys/kernel/security/apparmor/profiles; then
          printf '%s' "${name}" > /sys/kernel/security/apparmor/.remove
          changed=1
        fi
      done
      [ -n "${changed}" ] && echo changed || true
  register: msmtp_apparmor_unload
  changed_when: "'changed' in msmtp_apparmor_unload.stdout"
  when: msmtp_apparmor_disabled.stat.exists
  become: true

# msmtp rejects a -C config holding secrets unless it is owned by the caller and
# unreadable by group and other; the override runs msmtpd as "msmtp".
- name: Copy msmtp relay config file
  ansible.builtin.template:
    src: msmtprc-relay
    dest: "{{ msmtp_relay_config_path }}"
    owner: msmtp
    group: msmtp
    mode: "0600"
  become: true
  no_log: true

- name: Create msmtpd systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/msmtpd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy msmtpd systemd override
  ansible.builtin.template:
    src: msmtpd-override.conf
    dest: /etc/systemd/system/msmtpd.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true

# Before /etc/msmtprc below points clients at msmtpd, or mail sent in between relays
# back into it. An ordering constraint, so not a handler; the restart is cheap.
- name: Restart msmtpd before pointing clients at it
  ansible.builtin.systemd_service:
    name: msmtpd
    daemon_reload: true
    enabled: true
    state: restarted
  become: true

# Before /etc/msmtprc, which references it.
- name: Copy /etc/aliases
  ansible.builtin.template:
    src: aliases
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Copy /etc/mailname
  ansible.builtin.template:
    src: mailname
    dest: /etc/mailname
    owner: root
    group: root
    mode: "0644"
  become: true

# World-readable and credential-free: cron invokes sendmail as the crontab owner and
# Ubuntu's msmtp is not setgid, so unprivileged senders must read it.
- name: Copy msmtp config file
  ansible.builtin.template:
    src: msmtprc
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: "0644"
  become: true
