[Service]
# The shipped unit's DynamicUser=true has a transient uid that can never own a file, and
# msmtp refuses a -C config with secrets unless the caller owns it. msmtp-mta ships the
# account this pins to.
DynamicUser=false
User=msmtp
Group=msmtp

# msmtp_relay_port is unprivileged, so the shipped CAP_NET_BIND_SERVICE is dead weight,
# and the ambient set would be inherited by the piped /usr/bin/msmtp.
AmbientCapabilities=
CapabilityBoundingSet=

# DynamicUser=true implied these three; restored now it is off. strict makes the filesystem
# read-only to the daemon, so a compromised msmtpd cannot rewrite the relay config it owns.
# It declares no writable paths, which holds only because ExecStart logs to syslog. A log
# file would fail EROFS and, with Restart=always, crash-loop: add ReadWritePaths=.
ProtectSystem=strict
RestrictSUIDSGID=true
RemoveIPC=true

# The credential-bearing config, not /etc/msmtprc, which would relay back into msmtpd. "%%F"
# renders as literal "%F", which msmtpd replaces with the envelope from address. Interface
# and port are literal: an operator's /etc/default/msmtpd would otherwise override them and
# desync the daemon from /etc/msmtprc.
ExecStart=
ExecStart=/usr/bin/msmtpd --interface={{ msmtp_relay_interface }} --port={{ msmtp_relay_port }} --log=syslog --command="/usr/bin/msmtp -C {{ msmtp_relay_config_path }} -f %%F --"
