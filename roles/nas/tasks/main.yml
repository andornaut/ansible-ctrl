---
# nas_user must not derive from whoever ansible connects as, which is root
# under cron.
- name: Validate nas_user
  ansible.builtin.assert:
    that:
      - nas_user != "root"
    fail_msg: >-
      nas_user resolved to "root", which would write user-scoped state to /root.
      Set primary_user in the inventory (or nas_user in host_vars) to the target
      account.
    success_msg: 'nas_user "{{ nas_user }}" is valid'
  tags: always

- name: Resolve home directory for {{ nas_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ nas_user }}"
  tags: always

# Ahead of the crypttab and fstab lines, which name both: an empty device list writes a
# mount of nothing, and a missing key file leaves every device locked at boot.
- name: Require the RAID devices and the LUKS key file
  tags: always
  block:
    - name: Look for the LUKS key file
      ansible.builtin.stat:
        path: "{{ nas_key_file }}"
      register: nas_key_file_stat
      become: true

    - name: Require the RAID devices and the LUKS key file
      ansible.builtin.assert:
        that:
          - nas_raid_devices | length > 0
          - nas_key_file_stat.stat.exists
        fail_msg: >-
          Set nas_raid_devices to the LUKS devices of the array, and create the key file at
          {{ nas_key_file }} (nas_key_file) as the role README's Setup describes.
        quiet: true

- name: Install system dependencies
  block:
    - name: Install system packages
      ansible.builtin.apt:
        name:
          - btrfsmaintenance
          - libblockdev-mdraid3
        state: latest
        install_recommends: false
        update_cache: true
      become: true

- name: Configure RAID storage
  become: true
  block:
    - name: Create RAID mount directory
      ansible.builtin.file:
        path: "{{ nas_raid_mount_directory }}"
        owner: root
        group: "{{ nas_raid_group }}"
        state: directory
        mode: "0755"

    - name: Update crypttab for the RAID devices
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        line: "nas{{ index }} {{ item }} {{ nas_key_file }} luks,noauto"
        regexp: "^nas{{ index }}\\s"
      loop: "{{ nas_raid_devices }}"
      loop_control:
        index_var: index
      notify: Reload systemd

    - name: Update fstab for the RAID devices # noqa: yaml[line-length]
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: >-
          /dev/mapper/nas0 {{ nas_raid_mount_directory }} {{ nas_raid_fs_type }}
          {{ nas_raid_fs_defaults }},{% for i in range(nas_raid_devices | length) %}{% if
          nas_raid_fs_type == 'btrfs' %}device=/dev/mapper/nas{{ i }},{% endif
          %}x-systemd.after=blockdev@dev-mapper-nas{{ i }}.target,x-systemd.requires=dev-mapper-nas{{
          i }}.device,x-systemd.requires-mounts-for=/dev/mapper/nas{{ i }}{% if i < (nas_raid_devices
          | length - 1) %},{% endif %}{% endfor %},x-systemd.device-timeout=20s
          0 0
        regexp: "^/dev/mapper/nas0"
      notify: Reload systemd

- name: Configure backup storage
  become: true
  when: nas_backup_devices is defined and (nas_backup_devices | length) > 0
  tags: backupnas
  block:
    - name: Create backup mount directories
      ansible.builtin.file:
        path: "{{ nas_backup_mount_directory }}{{ '' if index == 0 else index + 1 }}"
        owner: root
        group: root
        state: directory
        mode: "0755"
      loop: "{{ nas_backup_devices }}"
      loop_control:
        index_var: index

    - name: Update crypttab for the backup devices
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        line: >-
          {{ nas_backup_device_name }}{{ '' if index == 0 else index + 1 }}
          {{ item }} {{ nas_key_file }} luks,noauto
        regexp: "^{{ nas_backup_device_name }}{{ '' if index == 0 else index + 1 }}\\s"
      loop: "{{ nas_backup_devices }}"
      loop_control:
        index_var: index
      notify: Reload systemd

    - name: Update fstab for the backup devices # noqa: yaml[line-length]
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: >-
          /dev/mapper/{{ nas_backup_device_name }}{{ '' if index == 0 else index + 1 }}
          {{ nas_backup_mount_directory }}{{ '' if index == 0 else index + 1 }}
          {{ nas_backup_fs_type }}
          {{ nas_backup_fs_defaults }},x-systemd.after=blockdev@dev-mapper-{{
          nas_backup_device_name }}{{ '' if index == 0 else index + 1
          }}.target,x-systemd.requires=dev-mapper-{{ nas_backup_device_name }}{{
          '' if index == 0 else index + 1 }}.device,x-systemd.requires-mounts-for=/dev/mapper/{{
          nas_backup_device_name }}{{ '' if index == 0 else index + 1
          }},x-systemd.device-timeout=20s
          0 0
        regexp: "^/dev/mapper/{{ nas_backup_device_name }}{{ '' if index == 0 else index + 1 }}\\s"
      loop: "{{ nas_backup_devices }}"
      loop_control:
        index_var: index
      notify: Reload systemd

    - name: Install backupnas script
      ansible.builtin.template:
        src: backupnas
        dest: /usr/local/bin/
        mode: "0755"

# Monthly, and away from rsnapshot's runs on the 1st. On raid1 a scrub repairs a bad block
# from the other copy, which only works while the other copy is still good.
- name: Configure the monthly scrub of the RAID array
  become: true
  when:
    - nas_raid_fs_type == 'btrfs'
    - nas_raid_devices | length > 0
  tags: scrub
  block:
    - name: Install nas-scrub script
      ansible.builtin.template:
        src: nas-scrub
        dest: /usr/local/sbin/nas-scrub
        owner: root
        group: root
        mode: "0755"

    - name: Configure the nas-scrub cron job
      ansible.builtin.cron:
        name: nas-scrub
        cron_file: /etc/cron.d/ansible-role-nas
        user: root
        day: "{{ nas_scrub_day }}"
        hour: "{{ nas_scrub_hour }}"
        minute: "{{ nas_scrub_minute }}"
        job: /usr/local/sbin/nas-scrub

- name: Configure security and systemd
  become: true
  block:
    - name: Secure key_file ownership
      ansible.builtin.file:
        path: "{{ nas_key_file }}"
        owner: root
        group: root
        mode: "0400"

    - name: Install nas-mount.service
      ansible.builtin.template:
        src: nas-mount.service
        dest: /etc/systemd/system/
        mode: "0644"
      notify:
        - Reload systemd
        - Disable nas-mount.service
        - Enable nas-mount.service
