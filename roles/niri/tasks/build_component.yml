---
# Unpack a source tarball into a temporary directory, run the supplied configure/build/
# install commands from its root, and clean up. Fetching the release and resolving the
# tarball URL belong at the call site.
#
# Required vars:
#   build_component_name (str): display name, e.g. "wayland-protocols"
#   build_component_src_url (str): source tarball URL with a single top-level directory
#   build_component_configure_cmd (str)
#   build_component_build_cmd (str): may interpolate $(...), so it runs in a shell
#   build_component_install_cmd (str): runs as root
#
# Optional vars:
#   build_component_tag (str): the release tag the tarball is, e.g. "v0.11.0"
#   build_component_probe (list): argv printing the installed version, e.g.
#     [pkg-config, --modversion, hyprutils] for a library or [/usr/local/bin/hypridle, --version]
#     for a program. The build is skipped when its output holds build_component_tag, a leading
#     v stripped, as a whole word. Without a probe the component builds on every run.
#
# Callers must wrap the include in a tagged block (see hypr.yml).

# The installed artifact is asked rather than a stamp file, so a build removed or replaced by
# hand is rebuilt. A missing program or .pc file prints nothing, which matches no version.
- name: Probe the installed version of {{ build_component_name }}
  ansible.builtin.command:
    argv: "{{ build_component_probe }}"
  environment:
    PKG_CONFIG_PATH: "{{ niri_pkg_config_path }}"
  register: niri_build_component_installed
  when: build_component_probe | default([]) | length > 0
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

# Staged and built as niri_user, not root and not the connecting account: only the install
# needs root, and a root-owned 0700 staging directory is one the build cannot chdir into.
# The install and the cleanup name root for themselves.
#
# gcc-14 for the hypr stack's C++, named to the build rather than made the host's default,
# which would also change the compiler DKMS builds kernel modules with.
- name: Build and install {{ build_component_name }}
  when: >-
    build_component_probe | default([]) | length == 0
    or build_component_tag | default('') | length == 0
    or niri_build_component_installed.stdout | default('') is not search(
         '(^|[^\\w.])v?' ~ (build_component_tag | regex_replace('^v', '') | regex_escape) ~ '([^\\w.]|$)')
  become: true
  become_user: "{{ niri_user }}"
  environment:
    CC: gcc-14
    CXX: g++-14
  block:
    - name: Create a temporary directory for {{ build_component_name }}
      ansible.builtin.tempfile:
        state: directory
      register: niri_build_component_tmp
      check_mode: false

    - name: Download and unarchive {{ build_component_name }}
      ansible.builtin.unarchive:
        src: "{{ build_component_src_url }}"
        dest: "{{ niri_build_component_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1
      register: niri_build_component_download
      retries: 3
      delay: 5
      until: niri_build_component_download is succeeded

    - name: Configure {{ build_component_name }}
      ansible.builtin.command:
        cmd: "{{ build_component_configure_cmd }}"
        chdir: "{{ niri_build_component_tmp.path }}"
      changed_when: true

    - name: Build {{ build_component_name }} # noqa: command-instead-of-shell
      ansible.builtin.shell:
        cmd: "{{ build_component_build_cmd }}"
        chdir: "{{ niri_build_component_tmp.path }}"
      changed_when: true

    - name: Install {{ build_component_name }}
      ansible.builtin.command:
        cmd: "{{ build_component_install_cmd }}"
        chdir: "{{ niri_build_component_tmp.path }}"
      changed_when: true
      become: true
      become_user: root

    # The next component may link against a library this one just installed.
    - name: Update dynamic linker cache after {{ build_component_name }}
      ansible.builtin.command: ldconfig
      changed_when: false
      become: true
      become_user: root
  always:
    # The install writes into the build tree as root (install_manifest.txt), leaving files
    # niri_user cannot unlink.
    - name: Remove the temporary directory for {{ build_component_name }}
      ansible.builtin.file:
        path: "{{ niri_build_component_tmp.path }}"
        state: absent
      when: niri_build_component_tmp.path is defined
      become: true
      become_user: root
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false
