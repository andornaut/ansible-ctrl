---
# Build one github.com/hyprwm/{name} component from its latest stable release, with the
# scaffold in build_component.yml. Post-install steps belong at the call site.
#
# Required vars:
#   hypr_component_name (str): repository name under github.com/hyprwm/, e.g. "hyprlock"
#
# Optional vars:
#   hypr_component_build_target (str): passed to `cmake --build --target`. Omit for default.
#   hypr_component_build_become (bool): build as root, default false.
#
# Callers must wrap the include in a tagged block (see hypr.yml).
- name: Get latest release of {{ hypr_component_name }}
  ansible.builtin.include_tasks: get_latest_release.yml
  vars:
    release_repo: "hyprwm/{{ hypr_component_name }}"
    release_fact: niri_hypr_component_release

- name: Build and install {{ hypr_component_name }}
  ansible.builtin.include_tasks: build_component.yml
  vars:
    build_component_name: "{{ hypr_component_name }}"
    build_component_src_url:
      "https://github.com/hyprwm/{{ hypr_component_name }}/archive/refs/tags/\
      {{ niri_hypr_component_release.name }}.tar.gz"
    build_component_configure_cmd: >-
      cmake
      --no-warn-unused-cli
      -DCMAKE_BUILD_TYPE:STRING=Release
      -DCMAKE_PREFIX_PATH:PATH=/usr/local
      -DCMAKE_INSTALL_PREFIX:PATH=/usr/local
      -DCMAKE_INSTALL_LIBDIR:PATH=lib/x86_64-linux-gnu
      -S .
      -B build
    build_component_build_cmd: >-
      cmake --build build --config Release
      -j $(nproc 2>/dev/null || getconf _NPROCESSORS_CONF)
      {{ '--target ' ~ hypr_component_build_target
         if hypr_component_build_target | default('') else '' }}
    build_component_install_cmd: cmake --install build
    build_component_build_become: "{{ hypr_component_build_become | default(false) }}"
