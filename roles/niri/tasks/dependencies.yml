---
- name: Install system dependencies
  tags: [packages]
  block:
    - name: Install system packages
      ansible.builtin.apt:
        name:
          - clang
          - gcc-14
          - g++-14
          # - libdbus-1-dev  # A newer version is installed in hypr.yml
          - libdisplay-info-dev
          - libegl1-mesa-dev
          - libgbm-dev
          - libinput-dev
          - libpango1.0-dev
          - libpipewire-0.3-dev
          - libseat-dev
          - libsystemd-dev
          - libudev-dev
          - libwayland-dev
          - libxcb-cursor-dev
          - libxkbcommon-dev
          - wayland-scanner++
          - xdg-desktop-portal
          - xdg-desktop-portal-gnome
          - xdg-desktop-portal-gtk
          - xwayland
          - xwayland-run

          # wayland dependencies
          - doxygen
          - graphviz
          # wayland-scanner validates protocols against their DTD.
          - libxml2-dev
          - xmlto
          - xsltproc

          # hypr dependencies
          - libmagic-dev
          - libpugixml-dev
          # Conflicts with the libsdbus built from source below; keep it out.
          # - libsdbus-c++-dev
          - libspng-dev
        state: latest
        install_recommends: false
        update_cache: true
      become: true

    # CLEANUP (added 2026-09-24): the host-wide gcc and g++ alternatives this role pointed
    # at version 14. Removing the last alternative also removes /usr/bin/gcc, so the packages
    # are reinstalled to restore their own link. Delete once every niri host has converged.
    - name: Remove the gcc-14 alternatives
      community.general.alternatives:
        name: "{{ item }}"
        path: "/usr/bin/{{ item }}-14"
        state: absent
      loop:
        - gcc
        - g++
      register: niri_gcc_alternatives
      become: true

    - name: Reinstall gcc and g++ to restore /usr/bin/gcc and /usr/bin/g++ # noqa: command-instead-of-module no-handler
      ansible.builtin.command: apt-get install --reinstall --yes gcc g++
      changed_when: true
      when: niri_gcc_alternatives is changed
      become: true

- name: Build and install libsdbus
  tags: [libsdbus]
  block:
    - name: Get latest libsdbus release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: Kistler-Group/sdbus-cpp
        release_fact: niri_libsdbus_release

    # The prefix is pinned so hypridle finds libsdbus:
    # https://github.com/hyprwm/hypridle/issues/109#issuecomment-2678603712
    - name: Build and install libsdbus
      ansible.builtin.include_tasks: build_component.yml
      vars:
        build_component_name: libsdbus
        build_component_src_url:
          "https://github.com/Kistler-Group/sdbus-cpp/archive/refs/tags/\
          {{ niri_libsdbus_release.tag_name }}.tar.gz"
        build_component_configure_cmd: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=/usr/local
        build_component_build_cmd: cmake --build build
        build_component_install_cmd: cmake --build build --target install

- name: Build and install Wayland (for wayland-scanner)
  tags: [wayland]
  block:
    - name: Get latest Wayland release
      ansible.builtin.include_tasks: get_latest_gitlab_release.yml
      vars:
        gitlab_release_project: 121
        gitlab_release_src_url_fact: niri_wayland_scanner_src_url

    - name: Build and install Wayland
      ansible.builtin.include_tasks: build_meson_component.yml
      vars:
        meson_component_name: Wayland
        meson_component_src_url: "{{ niri_wayland_scanner_src_url }}"
        # Only the libraries and the scanner are wanted. The docs need mdbook from 1.26 on,
        # which no archive this role supports packages.
        meson_component_options: -Ddocumentation=false

- name: Build and install wayland-protocols
  tags: [wayland]
  block:
    - name: Get latest wayland-protocols release
      ansible.builtin.include_tasks: get_latest_gitlab_release.yml
      vars:
        gitlab_release_project: 2891
        gitlab_release_src_url_fact: niri_wayland_protocols_src_url

    - name: Build and install wayland-protocols
      ansible.builtin.include_tasks: build_meson_component.yml
      vars:
        meson_component_name: wayland-protocols
        meson_component_src_url: "{{ niri_wayland_protocols_src_url }}"

# CMake since 0.7, like the rest of hyprwm.
- name: Build and install hyprland-protocols
  tags: [hypr]
  block:
    - name: Build and install hyprland-protocols
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprland-protocols
