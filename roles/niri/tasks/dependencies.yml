---
- name: Install system dependencies
  tags: [packages]
  block:
    - name: Install system packages
      ansible.builtin.apt:
        name:
          - clang
          - gcc-14
          - g++-14
          # - libdbus-1-dev  # A newer version is installed in hypr.yml
          - libdisplay-info-dev
          - libegl1-mesa-dev
          - libgbm-dev
          - libinput-dev
          - libpango1.0-dev
          - libpipewire-0.3-dev
          - libseat-dev
          - libsystemd-dev
          - libudev-dev
          - libwayland-dev
          - libxcb-cursor-dev
          - libxkbcommon-dev
          - ninja-build
          - wayland-scanner++
          - xdg-desktop-portal
          - xdg-desktop-portal-gnome
          - xdg-desktop-portal-gtk
          - xwayland
          - xwayland-run

          # wayland dependencies
          - doxygen
          - graphviz
          # wayland-scanner validates protocols against their DTD.
          - libxml2-dev
          - xmlto
          - xsltproc

          # hypr dependencies
          - libcairo2-dev
          - libdrm-dev
          - libjpeg-dev
          - libmagic-dev
          - libpam0g-dev
          - libpixman-1-dev
          - libpng-dev
          - libpugixml-dev
          - librsvg2-dev
          - libwebp-dev
          # Conflicts with the libsdbus built from source below; keep it out.
          # - libsdbus-c++-dev
          - libspng-dev
        state: latest
        install_recommends: false
        update_cache: true
      become: true

    # noble's "meson" is 1.3; it ships meson-1.5 as well, which later releases do not. The
    # two conflict, so this matches the desktop role's choice.
    - name: Install meson
      ansible.builtin.apt:
        name: "{{ 'meson' if ansible_facts['distribution_version'] is version('25.04', '>=') else 'meson-1.5' }}"
        state: latest
        install_recommends: false
      become: true

    # CLEANUP (added 2026-09-24): the host-wide gcc and g++ alternatives this role pointed
    # at version 14. Removing the last alternative also removes /usr/bin/gcc, so the packages
    # are reinstalled whenever either link is missing, which retries a failed reinstall.
    # Delete once every niri host has converged.
    - name: Remove the gcc-14 alternatives
      community.general.alternatives:
        name: "{{ item }}"
        path: "/usr/bin/{{ item }}-14"
        state: absent
      loop:
        - gcc
        - g++
      become: true

    - name: Check for /usr/bin/gcc and /usr/bin/g++
      ansible.builtin.stat:
        path: "/usr/bin/{{ item }}"
        follow: false
      loop:
        - gcc
        - g++
      register: niri_gcc_links
      become: false

    - name: Reinstall gcc and g++ to restore /usr/bin/gcc and /usr/bin/g++ # noqa: command-instead-of-module
      ansible.builtin.command: apt-get -o DPkg::Lock::Timeout=300 install --reinstall --yes gcc g++
      changed_when: true
      when: niri_gcc_links.results | rejectattr('stat.exists') | list | length > 0
      become: true

- name: Build and install libsdbus
  tags: [libsdbus]
  block:
    - name: Get latest libsdbus release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: Kistler-Group/sdbus-cpp
        release_fact: niri_libsdbus_release

    # The prefix is pinned so hypridle finds libsdbus:
    # https://github.com/hyprwm/hypridle/issues/109#issuecomment-2678603712
    - name: Build and install libsdbus
      ansible.builtin.include_tasks: build_component.yml
      vars:
        build_component_name: libsdbus
        build_component_src_url:
          "https://github.com/Kistler-Group/sdbus-cpp/archive/refs/tags/\
          {{ niri_libsdbus_release.tag_name }}.tar.gz"
        build_component_tag: "{{ niri_libsdbus_release.tag_name }}"
        build_component_probe: [pkg-config, --modversion, sdbus-c++]
        build_component_configure_cmd: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=/usr/local
        build_component_build_cmd: cmake --build build
        build_component_install_cmd: cmake --build build --target install

# The scanner alone: wayland-protocols needs a newer one than the archive's. Everything here
# links against the archive's libwayland.
- name: Build and install wayland-scanner
  tags: [wayland]
  block:
    - name: Get latest Wayland release
      ansible.builtin.include_tasks: get_latest_gitlab_release.yml
      vars:
        gitlab_release_project: 121
        gitlab_release_src_url_fact: niri_wayland_scanner_src_url
        gitlab_release_tag_fact: niri_wayland_scanner_tag

    - name: Build and install wayland-scanner
      ansible.builtin.include_tasks: build_meson_component.yml
      vars:
        meson_component_name: wayland-scanner
        meson_component_src_url: "{{ niri_wayland_scanner_src_url }}"
        meson_component_tag: "{{ niri_wayland_scanner_tag }}"
        meson_component_probe: [pkg-config, --modversion, wayland-scanner]
        # A /usr/local libwayland would shadow the archive's for every program on the host.
        # The tests require the libraries, and the docs need mdbook from 1.26 on, which no
        # archive this role supports packages.
        meson_component_options: -Dlibraries=false -Dtests=false -Ddocumentation=false

    # CLEANUP (added 2026-09-25): the libwayland libraries, headers and .pc files a full
    # Wayland build left in /usr/local, where they shadow the archive's for every program on
    # the host. The scanner's own files stay. Delete once every niri host has converged.
    - name: Find the /usr/local libwayland libraries
      ansible.builtin.find:
        paths: "/usr/local/lib/{{ niri_multiarch }}"
        patterns:
          - libwayland-client.so*
          - libwayland-cursor.so*
          - libwayland-egl.so*
          - libwayland-server.so*
        file_type: any
      register: niri_wayland_libraries
      become: true

    - name: Remove the /usr/local libwayland libraries, headers and .pc files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ niri_wayland_libraries.files | map(attribute='path') | list + niri_wayland_library_files }}"
      vars:
        niri_wayland_library_files:
          - /usr/local/include/wayland-client-core.h
          - /usr/local/include/wayland-client-protocol.h
          - /usr/local/include/wayland-client.h
          - /usr/local/include/wayland-cursor.h
          - /usr/local/include/wayland-egl-backend.h
          - /usr/local/include/wayland-egl-core.h
          - /usr/local/include/wayland-egl.h
          - /usr/local/include/wayland-server-core.h
          - /usr/local/include/wayland-server-protocol.h
          - /usr/local/include/wayland-server.h
          - /usr/local/include/wayland-util.h
          - /usr/local/include/wayland-version.h
          - /usr/local/lib/{{ niri_multiarch }}/pkgconfig/wayland-client.pc
          - /usr/local/lib/{{ niri_multiarch }}/pkgconfig/wayland-cursor.pc
          - /usr/local/lib/{{ niri_multiarch }}/pkgconfig/wayland-egl-backend.pc
          - /usr/local/lib/{{ niri_multiarch }}/pkgconfig/wayland-egl.pc
          - /usr/local/lib/{{ niri_multiarch }}/pkgconfig/wayland-server.pc
      become: true

    # Unconditional: a run interrupted between the removal and this would otherwise leave the
    # cache naming the removed libraries, with nothing left to remove to trigger it again.
    - name: Update dynamic linker cache after removing the /usr/local libwayland
      ansible.builtin.command: ldconfig
      changed_when: false
      become: true

- name: Build and install wayland-protocols
  tags: [wayland]
  block:
    - name: Get latest wayland-protocols release
      ansible.builtin.include_tasks: get_latest_gitlab_release.yml
      vars:
        gitlab_release_project: 2891
        gitlab_release_src_url_fact: niri_wayland_protocols_src_url
        gitlab_release_tag_fact: niri_wayland_protocols_tag

    - name: Build and install wayland-protocols
      ansible.builtin.include_tasks: build_meson_component.yml
      vars:
        meson_component_name: wayland-protocols
        meson_component_src_url: "{{ niri_wayland_protocols_src_url }}"
        meson_component_tag: "{{ niri_wayland_protocols_tag }}"
        meson_component_probe: [pkg-config, --modversion, wayland-protocols]

# CMake since 0.7, like the rest of hyprwm.
- name: Build and install hyprland-protocols
  tags: [hypr]
  block:
    - name: Build and install hyprland-protocols
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprland-protocols
        hypr_component_probe: [pkg-config, --modversion, hyprland-protocols]
