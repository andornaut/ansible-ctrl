---
# Store the .tar.gz source URL of a gitlab.freedesktop.org project's latest release
# as a fact. GitLab returns releases newest first and has no draft or prerelease
# flags, so the first entry is it.
#
# Required vars:
#   gitlab_release_project (int): numeric project ID, e.g. 121 for wayland
#   gitlab_release_src_url_fact (str): variable name to set with the source tarball URL
- name: Get releases of GitLab project {{ gitlab_release_project }}
  ansible.builtin.uri:
    url: "https://gitlab.freedesktop.org/api/v4/projects/{{ gitlab_release_project }}/releases"
    return_content: true
  register: niri_gitlab_release_response
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx (rate limit, missing project) is deterministic.
  until: >-
    niri_gitlab_release_response.status == 200 or
    (niri_gitlab_release_response.status >= 400 and niri_gitlab_release_response.status < 500)

- name: Set fact to source tarball URL for {{ gitlab_release_src_url_fact }}
  ansible.builtin.set_fact:
    "{{ gitlab_release_src_url_fact }}": >-
      {{ niri_gitlab_release_response.json[0].assets.sources
      | selectattr('format', 'equalto', 'tar.gz')
      | map(attribute='url') | first }}
