---
# Fetch owner/repo's latest release into a fact, from GitHub or a Forgejo forge
# (Codeberg) serving the same JSON shape.
# Copied per role because roles share no task files; keep the copies in sync.
#
# /releases/latest follows the project's "latest" pointer rather than sorting tags,
# so it never picks up a rolling build but does lag a stable release published
# without moving the pointer. See
# homeautomation/tasks/install_github_release_component.yml, which filters instead.
#
# Required vars:
#   release_repo (str): "owner/repo"
#   release_fact (str): variable name to set with the release object
#
# Optional vars:
#   release_api_base (str): default "https://api.github.com/repos"; Codeberg is
#     "https://codeberg.org/api/v1/repos"
- name: Get the latest release of {{ release_repo }}
  ansible.builtin.uri:
    url: "{{ release_api_base | default('https://api.github.com/repos') }}/{{ release_repo }}/releases/latest"
    return_content: true
  register: niri_release_response
  retries: 3
  delay: 5
  # Retry network errors and 5xx only; 4xx (rate limit, missing repo) is deterministic.
  until: >-
    niri_release_response.status == 200 or
    (niri_release_response.status >= 400 and niri_release_response.status < 500)

- name: Set fact to the latest release for {{ release_fact }}
  ansible.builtin.set_fact:
    "{{ release_fact }}": "{{ niri_release_response.json }}"
