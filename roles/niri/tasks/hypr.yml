---
# Hyprland ecosystem tools, each built by build_hypr_component.yml. Ordered: hyprutils,
# hyprlang, hyprgraphics and hyprwayland-scanner are build dependencies of hypridle,
# hyprlock and hyprpaper. Each include is wrapped in a tagged block, a tag on a dynamic
# include filtering out what it includes rather than propagating in.

- name: Install hyprutils
  tags: [hyprutils]
  block:
    - name: Build and install hyprutils
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprutils
        hypr_component_build_target: all
        hypr_component_probe: [pkg-config, --modversion, hyprutils]

- name: Install hyprlang
  tags: [hyprlang]
  block:
    - name: Build and install hyprlang
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprlang
        hypr_component_build_target: hyprlang
        hypr_component_probe: [pkg-config, --modversion, hyprlang]

- name: Install hyprgraphics
  tags: [hyprgraphics]
  block:
    - name: Build and install hyprgraphics
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprgraphics
        hypr_component_build_target: all
        hypr_component_probe: [pkg-config, --modversion, hyprgraphics]

- name: Install hyprwayland-scanner
  tags: [hyprwayland-scanner]
  block:
    # Takes cmake's default target.
    - name: Build and install hyprwayland-scanner
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprwayland-scanner
        hypr_component_probe: [pkg-config, --modversion, hyprwayland-scanner]

- name: Install hypridle
  tags: [hypridle]
  block:
    - name: Build and install hypridle
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hypridle
        hypr_component_build_target: hypridle
        hypr_component_probe: [/usr/local/bin/hypridle, --version]

    - name: Enable and start hypridle.service
      ansible.builtin.include_tasks: enable_user_unit.yml
      vars:
        niri_enable_unit: hypridle.service

- name: Install hyprlock
  tags: [hyprlock]
  block:
    - name: Build and install hyprlock
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprlock
        hypr_component_build_target: hyprlock
        hypr_component_probe: [/usr/local/bin/hyprlock, --version]

- name: Install hyprpaper
  tags: [hyprpaper]
  block:
    # No probe: this release has no version flag and installs no .pc file, so it builds on
    # every run.
    - name: Build and install hyprpaper
      ansible.builtin.include_tasks: build_hypr_component.yml
      vars:
        hypr_component_name: hyprpaper
        hypr_component_build_target: hyprpaper

    - name: Enable and start hyprpaper.service
      ansible.builtin.include_tasks: enable_user_unit.yml
      vars:
        niri_enable_unit: hyprpaper.service
