---
# The staging directory, the build and the per-user state all run as the account whose
# cargo toolchain builds them. become_user propagates into the block, so the tasks
# writing system paths name root back: a bare become: true would inherit this user.
- name: Install niri
  tags: [niri]
  become: true
  become_user: "{{ niri_user }}"
  block:
    # Before the download, so a host without a toolchain fails early. Probed as the
    # account that will build, cargo being per-user.
    - name: Require the Rust toolchain
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: cargo
            probe: cargo --version
            hint: "It comes from the dev role: make dev -- --tags rust"

    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: niri_tmp

    - name: Get latest niri release
      ansible.builtin.include_tasks: get_latest_release.yml
      vars:
        release_repo: YaLTeR/niri
        release_fact: niri_release

    - name: Set niri version fact
      ansible.builtin.set_fact:
        niri_version: "{{ niri_release.name }}"

    - name: Download and unarchive niri
      ansible.builtin.unarchive:
        src: https://github.com/YaLTeR/niri/archive/refs/tags/{{ niri_version }}.tar.gz
        dest: "{{ niri_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1

    - name: Build niri
      ansible.builtin.command:
        cmd: cargo build --release
        chdir: "{{ niri_tmp.path }}"
      changed_when: true

    - name: Set executable permissions for niri binaries
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ niri_tmp.path }}/resources/niri-session"
        - "{{ niri_tmp.path }}/target/release/niri"

    - name: Fix path to niri in niri.service
      community.general.ini_file:
        no_extra_spaces: true
        option: ExecStart
        path: "{{ niri_tmp.path }}/resources/niri.service"
        section: Service
        value: /usr/local/bin/niri --session
        mode: "0644"

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /usr/local/share/wayland-sessions
        - /usr/local/share/xdg-desktop-portal
        - /usr/local/lib/systemd/user
      become: true
      become_user: root

    - name: Copy niri files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0644"
      loop:
        - src: "{{ niri_tmp.path }}/target/release/niri"
          dest: /usr/local/bin/
        - src: "{{ niri_tmp.path }}/resources/niri.desktop"
          dest: /usr/local/share/wayland-sessions/
        - src: "{{ niri_tmp.path }}/resources/niri-session"
          dest: /usr/local/bin/
        - src: "{{ niri_tmp.path }}/resources/niri-portals.conf"
          dest: /usr/local/share/xdg-desktop-portal/
        - src: "{{ niri_tmp.path }}/resources/niri.service"
          dest: /usr/local/lib/systemd/user/
        - src: "{{ niri_tmp.path }}/resources/niri-shutdown.target"
          dest: /usr/local/lib/systemd/user/
      become: true
      become_user: root

    - name: Configure electron flags for Wayland
      ansible.builtin.lineinfile:
        path: "{{ niri_user_home }}/.config/electron-flags.conf"
        line: "--ozone-platform-hint=auto"
        create: true
        mode: "0644"

    - name: Enable niri.service
      ansible.builtin.systemd_service:
        name: niri.service
        daemon_reload: true
        enabled: true
        scope: user
        state: started
      when: ansible_service_mgr == 'systemd'
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ niri_user_uid }}"
  always:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ niri_tmp.path }}"
        state: absent
      when: niri_tmp.path is defined
      become: true
      become_user: root
