---
# Fail with a named remediation when a tool this role uses is missing.
#
# Roles here declare no dependencies, so a tool another role installs is an
# unstated prerequisite. Without this, the first task to use it fails with
# whatever the missing binary prints, which never names the run that installs
# it. Each probe carries that command.
#
# Copied into each role that needs it rather than shared, because roles share no
# task files. Keep the copies in sync by hand.
#
# Required vars:
#   require_tools (list of dicts): each with
#     name (str):  the tool, as the failure message should call it
#     probe (str): shell command, exits 0 when the tool is usable
#     hint (str):  what installs it, e.g. "make dev -- --tags rust"
#
# Optional vars:
#   require_tools_become (bool): probe as root, default false.
#
# Callers must wrap the include in a tagged block, or include it from a file
# imported under one: a tag on an include_tasks filters out what it includes.

# Probe in the same become context as the tasks being guarded. A per-account
# toolchain is present for one user and absent for another, so a probe run as
# somebody else answers a question nobody asked.
#
# shell, not command: `command -v` is a builtin with no binary behind it, and a
# probe may be a pipeline.
#
# check_mode: false so the assert below has an rc to read. A skipped probe fails
# on an undefined variable instead of reporting what is missing.
- name: Probe for the tools this role needs
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "{{ item.probe }}"
  register: niri_required_tools
  become: "{{ require_tools_become | default(false) | bool }}"
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ require_tools }}"
  loop_control:
    label: "{{ item.name }}"

# stderr is quoted, not just the exit code: a shim that is installed but has no
# toolchain, and a daemon that is installed but not running, both fail here and
# neither is what "not installed" would send somebody to fix.
- name: Require the tools this role needs
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      {{ item.item.name }} is not usable{{ (': ' ~ item.stderr) if item.stderr else '' }}.
      {{ item.item.hint }}
    quiet: true
  loop: "{{ niri_required_tools.results }}"
  loop_control:
    label: "{{ item.item.name }}"
