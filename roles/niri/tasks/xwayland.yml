---
# Built by the account whose cargo toolchain builds it, the staging directory included.
# become_user propagates into the block, so the tasks writing system paths name root
# back: a bare become: true would inherit this user.
- name: Install xwayland-satellite
  tags: [xwayland]
  become: true
  become_user: "{{ niri_user }}"
  block:
    # Probed as the account that will build, cargo being per-user.
    - name: Require the Rust toolchain
      ansible.builtin.include_tasks: require_tools.yml
      vars:
        require_tools:
          - name: cargo
            probe: cargo --version
            hint: "It comes from the dev role: make dev -- --tags rust"

    - name: Create a temporary directory for xwayland-satellite
      ansible.builtin.tempfile:
        state: directory
      register: niri_xwayland_tmp

    - name: Get latest xwayland-satellite release
      ansible.builtin.include_tasks: get_latest_release.yml
      vars:
        release_repo: Supreeeme/xwayland-satellite
        release_fact: niri_xwayland_release

    - name: Set xwayland-satellite version fact
      ansible.builtin.set_fact:
        niri_xwayland_version: "{{ niri_xwayland_release.tag_name }}"

    - name: Download and unarchive xwayland-satellite
      ansible.builtin.unarchive:
        src: "https://github.com/Supreeeme/xwayland-satellite/archive/refs/tags/\
          {{ niri_xwayland_version }}.tar.gz"
        dest: "{{ niri_xwayland_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1

    - name: Build xwayland-satellite
      ansible.builtin.command:
        cmd: cargo build --release -F systemd
        chdir: "{{ niri_xwayland_tmp.path }}"
      changed_when: true

    - name: Configure xwayland-satellite.service
      community.general.ini_file:
        no_extra_spaces: true
        path: "{{ niri_xwayland_tmp.path }}/resources/xwayland-satellite.service"
        section: Service
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: "0644"
      loop:
        - option: ExecStart
          value: /usr/local/bin/xwayland-satellite
        - option: Environment
          value: DISPLAY=:0

    # The binary is under /usr/local, so its unit belongs here.
    - name: Create the local systemd user unit directory
      ansible.builtin.file:
        path: /usr/local/lib/systemd/user
        state: directory
        mode: "0755"
      become: true
      become_user: root

    - name: Copy xwayland-satellite files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0644"
      loop:
        - src: "{{ niri_xwayland_tmp.path }}/resources/xwayland-satellite.service"
          dest: /usr/local/lib/systemd/user/
        - src: "{{ niri_xwayland_tmp.path }}/target/release/xwayland-satellite"
          dest: /usr/local/bin/
      become: true
      become_user: root

    - name: Enable xwayland-satellite.service
      ansible.builtin.systemd_service:
        name: xwayland-satellite.service
        daemon_reload: true
        enabled: true
        scope: user
        state: started
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ niri_user_uid }}"
  always:
    - name: Remove the temporary directory for xwayland-satellite
      ansible.builtin.file:
        path: "{{ niri_xwayland_tmp.path }}"
        state: absent
      when: niri_xwayland_tmp.path is defined
      become: true
      become_user: root
