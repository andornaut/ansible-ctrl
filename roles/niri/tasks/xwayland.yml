---
# Built by the account whose cargo toolchain builds it, the staging directory included.
# become_user propagates into the block, so the tasks writing system paths name root
# back: a bare become: true would inherit this user.
- name: Install xwayland-satellite
  tags: [xwayland]
  become: true
  become_user: "{{ niri_user }}"
  block:
    # Probed as the account that will build, cargo being per-user.
    - name: Require the Rust toolchain
      ansible.builtin.include_tasks: ../../base/tasks/require_tools.yml
      vars:
        require_tools:
          - name: cargo
            probe: cargo --version
            hint: "It comes from the dev role: make dev -- --limit {{ inventory_hostname }} --tags rust"

    - name: Create a temporary directory for xwayland-satellite
      ansible.builtin.tempfile:
        state: directory
      register: niri_xwayland_tmp
      check_mode: false

    - name: Get latest xwayland-satellite release
      ansible.builtin.include_tasks: ../../base/tasks/get_latest_release.yml
      vars:
        release_repo: Supreeeme/xwayland-satellite
        release_fact: niri_xwayland_release

    - name: Set xwayland-satellite version fact
      ansible.builtin.set_fact:
        niri_xwayland_version: "{{ niri_xwayland_release.tag_name }}"

    - name: Download and unarchive xwayland-satellite
      ansible.builtin.unarchive:
        src:
          "https://github.com/Supreeeme/xwayland-satellite/archive/refs/tags/\
          {{ niri_xwayland_version }}.tar.gz"
        dest: "{{ niri_xwayland_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components
          - 1
      register: niri_xwayland_download
      retries: 3
      delay: 5
      until: niri_xwayland_download is succeeded

    # The remaps keep the random build directory out of the binary, so an unchanged
    # release installs byte-identical and the copy below reports no change.
    - name: Build xwayland-satellite
      ansible.builtin.command:
        cmd: cargo build --release
        chdir: "{{ niri_xwayland_tmp.path }}"
      environment:
        RUSTFLAGS: >-
          --remap-path-prefix={{ niri_xwayland_tmp.path }}=/build
          --remap-path-prefix={{ niri_user_home }}/.cargo=/cargo
      changed_when: true

    # niri starts it from $PATH when an X11 client first connects, and sets DISPLAY for the
    # session, so it has no unit of its own.
    - name: Copy xwayland-satellite
      # --check skips the build, so there is no output to install from.
      when: not ansible_check_mode
      ansible.builtin.copy:
        src: "{{ niri_xwayland_tmp.path }}/target/release/xwayland-satellite"
        dest: /usr/local/bin/
        remote_src: true
        mode: "0755"
      become: true
      become_user: root
  always:
    - name: Remove the temporary directory for xwayland-satellite
      ansible.builtin.file:
        path: "{{ niri_xwayland_tmp.path }}"
        state: absent
      when: niri_xwayland_tmp.path is defined
      become: true
      become_user: root
      # check_mode: false with the tempfile above, or every --check leaks its directory into /tmp.
      check_mode: false

# CLEANUP (added 2026-09-24): the xwayland-satellite user unit this role installed and
# enabled, which binds the display niri already holds for its own xwayland-satellite. Files
# only: a running instance keeps its session until logout. Delete once every niri host has
# converged.
- name: Remove the xwayland-satellite user unit
  tags: [xwayland]
  block:
    - name: Find the xwayland-satellite.service enable links
      ansible.builtin.find:
        paths: "{{ niri_user_home }}/.config/systemd/user"
        patterns: xwayland-satellite.service
        file_type: link
        recurse: true
      register: niri_xwayland_unit_links
      become: true
      become_user: "{{ niri_user }}"

    - name: Remove the xwayland-satellite.service enable links
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ niri_xwayland_unit_links.files }}"
      loop_control:
        label: "{{ item.path }}"
      become: true
      become_user: "{{ niri_user }}"

    - name: Remove xwayland-satellite.service
      ansible.builtin.file:
        path: /usr/local/lib/systemd/user/xwayland-satellite.service
        state: absent
      become: true
