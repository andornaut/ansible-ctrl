---
# The controller half of this role, applied by router.yml's second play. Records a pfSense
# router's remaining kernel virtual address space in Home Assistant. Off unless a host asks
# for it: it needs ssh to the router and a Home Assistant instance to push to, which only a
# site's controller has. Home Assistant owns the threshold, so what is alert-worthy changes
# in an automation rather than here.
- name: Sample the router's kernel address space
  when: router_install_kva_sample | bool
  block:
    - name: Assert the router kernel address space sampler is configured
      ansible.builtin.assert:
        that:
          - router_kva_sample_host | length > 0
          - router_kva_sample_entity_id | length > 0
          - router_kva_sample_user != "root"
        fail_msg: >-
          router_install_kva_sample needs router_kva_sample_host and
          router_kva_sample_entity_id set in host_vars, and a router_kva_sample_user
          that is not root.
        quiet: true
      become: false

    - name: Install router-kva-sample
      ansible.builtin.copy:
        src: router-kva-sample
        dest: /usr/local/bin/router-kva-sample
        mode: "0755"
      become: true

    # As the primary user rather than root: the key that reaches the router and the docker
    # group that reads the token are that account's, and root's ssh configuration on the
    # controller is hand-maintained rather than provisioned here.
    - name: Periodically run router-kva-sample
      ansible.builtin.cron:
        name: router-kva-sample
        cron_file: /etc/cron.d/ansible-role-router
        user: "{{ router_kva_sample_user }}"
        minute: "{{ router_kva_sample_minute }}"
        job: >-
          /usr/local/bin/router-kva-sample {{ router_kva_sample_host | quote }}
          {{ router_kva_sample_entity_id | quote }}
          {{ router_kva_sample_container | quote }}
      become: true

# CLEANUP (added 2026-09-07): the entry this one replaced, written by the base role before
# the sampler moved into this one. Both files are read, so a controller that has not run
# this play samples twice an hour. Delete once every site controller has converged.
- name: Remove the base role's router-kva-sample cron entry
  ansible.builtin.cron:
    name: router-kva-sample
    cron_file: /etc/cron.d/ansible-role-base
    user: "{{ router_kva_sample_user }}"
    state: absent
  become: true
