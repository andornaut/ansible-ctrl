---
rsnapshot_directory: /var/backups/rsnapshot/
rsnapshot_hosts: []
rsnapshot_preexec_script: /usr/local/bin/rsnapshot-preexec
# Checked before the lowest configured interval. Empty omits cmd_preexec.
rsnapshot_required_mountpoints: []
rsnapshot_retention:
  hourly:
  daily: 7
  weekly: 4
  monthly: 12
# Keyed to match rsnapshot_retention. Longer intervals run first; see the README.
rsnapshot_schedule:
  hourly:
    minute: "0"
  daily:
    minute: "55"
    hour: "0"
  weekly:
    minute: "50"
    hour: "0"
    weekday: "1"
  monthly:
    minute: "45"
    hour: "0"
    day: "1"
