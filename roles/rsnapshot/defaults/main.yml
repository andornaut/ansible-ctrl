---
rsnapshot_directory: /var/backups/rsnapshot/
rsnapshot_hosts: []
rsnapshot_preexec_script: /usr/local/bin/rsnapshot-preexec
# Mountpoints checked before the lowest configured interval, the only one rsnapshot runs
# cmd_preexec for and the only one that reads sources at all, the higher intervals rotating
# what is already stored. An unmounted source reads as an empty directory, so without this
# the run replaces the newest snapshot with nothing. Empty omits cmd_preexec.
rsnapshot_required_mountpoints: []
rsnapshot_retention:
  hourly:
  daily: 7
  weekly: 4
  monthly: 12
# One cron job per retention interval, keyed to match rsnapshot_retention. Each longer
# interval runs a few minutes before the next shorter one, rsnapshot's recommended order: only
# the lowest configured interval syncs, and the rotations above it take seconds, so they finish
# before that sync takes the lockfile instead of finding it held and exiting unrotated. They sit
# just before the hour, farthest from the previous hourly sync's start. weekday 1 is Monday and
# day 1 is the first of the month.
rsnapshot_schedule:
  hourly:
    minute: "0"
  daily:
    minute: "55"
    hour: "0"
  weekly:
    minute: "50"
    hour: "0"
    weekday: "1"
  monthly:
    minute: "45"
    hour: "0"
    day: "1"
