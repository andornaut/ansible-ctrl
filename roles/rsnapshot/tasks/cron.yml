---
# state rather than when: a null retention value drops that interval's retain line from the
# config, and a cron entry left in place would run an interval rsnapshot no longer defines.
- name: Configure the rsnapshot backup cron jobs
  ansible.builtin.cron:
    name: "rsnapshot {{ item.key }}"
    cron_file: ansible-role-rsnapshot
    user: root
    minute: "{{ item.value.minute }}"
    hour: "{{ item.value.hour | default(omit) }}"
    day: "{{ item.value.day | default(omit) }}"
    weekday: "{{ item.value.weekday | default(omit) }}"
    job: "/usr/bin/rsnapshot {{ item.key }}"
    state: "{{ 'present' if rsnapshot_retention[item.key] | default(none) is not none else 'absent' }}"
  loop: "{{ rsnapshot_schedule | dict2items }}"
  become: true
