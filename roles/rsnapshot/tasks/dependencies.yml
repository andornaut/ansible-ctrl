---
- name: Install rsnapshot and cron packages
  ansible.builtin.apt:
    name:
      - cron
      - rsnapshot
    state: latest
    install_recommends: false
    update_cache: true
  become: true

- name: Download MySQL and PostgreSQL backup scripts
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: /usr/local/bin/
    owner: root
    group: root
    mode: "0755"
  loop:
    - https://raw.githubusercontent.com/andornaut/backup-mysql/main/backupmysql
    - https://raw.githubusercontent.com/andornaut/backup-docker-postgresql/main/backupdockerpostgresql
  become: true
