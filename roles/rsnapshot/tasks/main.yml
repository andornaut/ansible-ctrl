---
- name: Require a host to back up
  ansible.builtin.assert:
    that: rsnapshot_hosts | length > 0
    fail_msg: >-
      rsnapshot_hosts is empty, so there is nothing to back up. Set it in this host's host_vars;
      the role README shows an entry.
    quiet: true

# hostvars yields an undefined marker for a host outside the inventory, which the template's
# primary_user fallback would render as a login to the wrong account.
- name: Require each backed-up host to name an inventory host and something to back up
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.host is defined and item.host in hostvars
      - (item.directories | default([]) | length > 0) or (item.scripts | default([]) | length > 0)
    fail_msg: >-
      Each rsnapshot_hosts entry names `name`, `host` as a host in the inventory, and at least
      one of `directories` or `scripts`. This one is {{ item }}.
    quiet: true
  loop: "{{ rsnapshot_hosts }}"
  loop_control:
    label: "{{ item.name | default('an entry naming no name') }}"

# The preexec script passes these to the router's shell unquoted, so they are held to their
# literal forms.
- name: Require each woken host to name a remote host, an inventory router, a MAC and a broadcast address
  ansible.builtin.assert:
    that:
      - item.host != inventory_hostname
      - item.wake.router | default('') in hostvars
      - item.wake.mac | default('') is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
      - item.wake.broadcast | default('') is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: >-
      The wake of {{ item.name }} needs `router` as a host in the inventory, `mac` as six
      colon-separated hex pairs and `broadcast` as an IPv4 address, and cannot wake the host
      running rsnapshot.
    quiet: true
  loop: "{{ rsnapshot_wake_hosts }}"
  loop_control:
    label: "{{ item.name }}"

# Absolute and without a trailing slash, since the template matches points against it by
# prefix. A mountpoint is either blocking or non-blocking: one in both lists would still abort
# the whole run while it is unmounted.
- name: Require each non-blocking mountpoint to be an absolute path that is not also blocking
  ansible.builtin.assert:
    that:
      - item is match('/')
      - item is not match('.+/$')
      - item not in rsnapshot_required_mountpoints | map('regex_replace', '(.)/+$', '\1')
    fail_msg: >-
      {{ item }} in rsnapshot_nonblocking_mountpoints must be absolute and have no trailing
      slash. A mountpoint is either blocking or non-blocking, so it must not also be in
      rsnapshot_required_mountpoints.
    quiet: true
  loop: "{{ rsnapshot_nonblocking_mountpoints }}"

- name: Install dependencies
  ansible.builtin.import_tasks: dependencies.yml

- name: Configure rsnapshot
  ansible.builtin.import_tasks: rsnapshot.yml

- name: Configure backup schedules in cron
  ansible.builtin.import_tasks: cron.yml
