---
# Ahead of creating the root: under an unmounted filesystem that task would create it on the
# filesystem beneath the mountpoint, and the next cron run would find it and write there
# despite no_create_root. `| default([])` fails closed.
- name: Require every required mountpoint to be mounted
  ansible.builtin.assert:
    that: rsnapshot_mountpoints_missing | length == 0
    fail_msg: >-
      These rsnapshot_required_mountpoints are not mounted: {{ rsnapshot_mountpoints_missing | join(', ') }}
    quiet: true
  vars:
    rsnapshot_mountpoints_missing: >-
      {{ rsnapshot_required_mountpoints | map('regex_replace', '(.)/+$', '\1')
         | reject('in', ansible_facts['mounts'] | default([]) | map(attribute='mount') | list) | list }}

- name: Create the rsnapshot backup directory
  ansible.builtin.file:
    path: "{{ rsnapshot_directory }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Install the rsnapshot preexec script
  ansible.builtin.template:
    src: rsnapshot-preexec.j2
    dest: "{{ rsnapshot_preexec_script }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: rsnapshot_required_mountpoints | length > 0

# A point naming the play host is read off the local filesystem, as the template decides.
- name: Stat the local backup sources
  ansible.builtin.stat:
    path: "{{ item }}"
  register: rsnapshot_local_sources
  loop: >-
    {%- set paths = [] -%}
    {%- for host in rsnapshot_hosts if host.host == inventory_hostname -%}
    {%- for directory in host.directories | default((), true) -%}
    {%- set _ = paths.append(directory.path if directory is mapping else directory) -%}
    {%- endfor -%}
    {%- endfor -%}
    {{ paths }}
  become: true

- name: Require every local backup source to exist
  ansible.builtin.assert:
    that: rsnapshot_local_sources_missing | length == 0
    fail_msg: >-
      These local backup sources do not exist: {{ rsnapshot_local_sources_missing | join(', ') }}
    quiet: true
  vars:
    rsnapshot_local_sources_missing: >-
      {{ rsnapshot_local_sources.results | rejectattr('stat.exists') | map(attribute='item') | list }}

- name: Copy rsnapshot configuration file
  ansible.builtin.template:
    src: rsnapshot.conf.j2
    dest: /etc/rsnapshot.conf
    mode: "0644"
    validate: rsnapshot -c %s configtest
  become: true

# Below the template task: rsnapshot refuses to run at all when cmd_preexec names a script
# that is not there, so the config stops naming it before the script goes.
- name: Remove the rsnapshot preexec script
  ansible.builtin.file:
    path: "{{ rsnapshot_preexec_script }}"
    state: absent
  become: true
  when: rsnapshot_required_mountpoints | length == 0
