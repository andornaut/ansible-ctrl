# Matches ai-maintainer, keylight and splinter-keyboard, the other repositories
# linted with ruff here. The sources were written wider than ruff's 88-column
# default, and reflowing them buys nothing.
line-length = 120

# Home Assistant runs a python_script inside a sandbox that injects these and
# rejects the file if it imports anything at all, so there is no spelling of
# them ruff can resolve. Named rather than turning F821 off for the file, which
# would forgive a genuine typo in the same breath.
builtins = ["data", "hass", "logger"]
