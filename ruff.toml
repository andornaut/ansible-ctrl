# Matches ai-maintainer, keylight and splinter-keyboard, the other repositories
# linted with ruff here. The sources were written wider than ruff's 88-column
# default, and reflowing them buys nothing.
line-length = 120

[lint.per-file-ignores]
# Home Assistant runs a python_script inside a sandbox that injects `data`,
# `hass` and `logger` rather than importing them, and rejects the file if it
# imports anything at all, so there is no spelling of these that ruff can
# resolve.
"roles/homeautomation/files/homeassistant/python_scripts/*.py" = ["F821"]
