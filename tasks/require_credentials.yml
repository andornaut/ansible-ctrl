---
# Imported into pre_tasks, because a task that fails mid-run leaves earlier tasks applied,
# which for a container means it is removed and not recreated.
#
# Optional var:
#   secrets_required_vars (list): the variables this play reads that host_vars maps to
#     credentials. Each one the host sets is rendered whole, so a credential it names that
#     was not injected (a degraded ref, a name missing from faramir.env) fails here, naming it.
- name: Require the credentials this play reads
  ansible.builtin.assert:
    that: secrets_injected | int > 0
    fail_msg: >-
      No credential was injected, so every one this play reads
      is undefined. Run it through `make`, which re-enters under sops, or
      through the broker with `faramir run --env-file faramir.env`, which
      both read the same list of names. Through either, check that faramir.env
      names keys the store holds. For a run that reaches no credential, pass
      secrets_required=false.
    quiet: true
  become: false
  when: secrets_required | default(true) | bool
  tags: always

# The render is the check: to_json templates the whole value, so a credential it names that
# is undefined fails the task naming that variable. The comparison itself always holds.
- name: Require the credentials each of this play's variables names
  ansible.builtin.assert:
    that: hostvars[inventory_hostname][item] | to_json | length > 0
    quiet: true
  loop: "{{ secrets_required_vars | default([]) | select('in', hostvars[inventory_hostname]) | list }}"
  become: false
  when: secrets_required | default(true) | bool
  tags: always
