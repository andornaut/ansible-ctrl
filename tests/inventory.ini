# CI-only inventory for `ansible-playbook --syntax-check`.
# The real inventory (`hosts`) and `host_vars/` are gitignored, so this exists only to give
# the lint workflow a resolvable member for every group the playbooks target. Never used to
# run a playbook against a real host.
#
# Two hosts, because the Ubuntu-only plays are written `all:!routers` and one host in that
# group would leave them with none.
ci-dummy ansible_connection=local desktop_environment=bspwm
ci-router ansible_connection=local

[desktop]
ci-dummy

[dev]
ci-dummy

[faramir]
ci-dummy

[games]
ci-dummy

[hobbies]
ci-dummy

[homeautomation]
ci-dummy

[nas]
ci-dummy

[routers]
ci-router

[rsnapshot]
ci-dummy

[torrent]
ci-dummy

[webservers]
ci-dummy
