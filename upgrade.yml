---
- name: Upgrade all packages
  # Every Ubuntu host. The routers have no apt and no flatpak; pfSense updates itself.
  hosts: all:!routers
  tasks:
    - name: Apt autoremove, clean, and dist-upgrade
      ansible.builtin.apt:
        autoremove: true
        clean: true
        purge: true
        update_cache: true
        upgrade: dist
      become: true
      register: apt_result

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Upgrade flatpak system packages
      # LC_ALL=C pins the "Nothing to do." string changed_when greps for.
      ansible.builtin.command: flatpak --noninteractive --system upgrade
      environment:
        LC_ALL: C
      become: true
      register: flatpak_system_result
      changed_when: "'Nothing to do.' not in flatpak_system_result.stdout"
      when: "'flatpak' in ansible_facts.packages"

    # The account is named rather than inherited from the connection: --user acts on
    # whoever runs it, so a run invoked as root upgrades root's installation, finds
    # nothing and reports no change while the applications stay behind.
    #
    # desktop_user, not primary_user: the roles that install a user-scope flatpak all
    # target it, and a host whose desktop belongs to a second account sets it in
    # host_vars. Undefined off a desktop host, where the fallback is the only account.
    - name: Upgrade flatpak user packages
      ansible.builtin.command: flatpak --noninteractive --user upgrade
      environment:
        LC_ALL: C
      become: true
      become_user: "{{ desktop_user | default(primary_user) }}"
      register: flatpak_user_result
      changed_when: "'Nothing to do.' not in flatpak_user_result.stdout"
      when: "'flatpak' in ansible_facts.packages"

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: upgrade_reboot_required

    - name: Report upgrade summary
      vars:
        fp_sys: "{{ 'skipped' if flatpak_system_result.skipped | default(false) else ('changed' if flatpak_system_result.changed else 'no change') }}"
        fp_usr: "{{ 'skipped' if flatpak_user_result.skipped | default(false) else ('changed' if flatpak_user_result.changed else 'no change') }}"
      ansible.builtin.debug:
        msg:
          - "apt: {{ 'changed' if apt_result.changed else 'no change' }}"
          - "flatpak system: {{ fp_sys }}"
          - "flatpak user: {{ fp_usr }}"
          - "reboot required: {{ upgrade_reboot_required.stat.exists }}"
