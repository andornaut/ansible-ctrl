---
- name: Apply letsencrypt_nginx role
  hosts: webservers
  # A failure after a vhost or certificate changed would drop the nginx restart, and the next
  # run, finding both unchanged, would notify nothing.
  force_handlers: true
  # Also guards the renewal cron, which re-runs this playbook under sops exec-env.
  pre_tasks:
    - name: Require the credentials this play reads
      ansible.builtin.import_tasks: tasks/require_credentials.yml
      vars:
        secrets_required_vars: [letsencrypt_nginx_websites]
  roles:
    - letsencrypt_nginx
  tags:
    - nginx
    - letsencrypt
